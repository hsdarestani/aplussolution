services:
  staging_db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-aplussolution_staging}
      POSTGRES_USER: ${POSTGRES_USER:-aplussolution_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - staging_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-aplussolution_staging} -d ${POSTGRES_DB:-aplussolution_staging}"]
      interval: 5s
      timeout: 5s
      retries: 20

  staging_redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - staging_redis_data:/data

  staging_backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: sh /app/entrypoint-staging.sh
    volumes:
      - staging_media_data:/app/media
      - staging_static_data:/app/staticfiles
    depends_on:
      staging_db:
        condition: service_healthy
      staging_redis:
        condition: service_started

  staging_celery:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    command: celery -A config worker -l info
    volumes:
      - staging_media_data:/app/media
    depends_on:
      - staging_backend
      - staging_redis

  staging_frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${API_URL:-https://staging.app.aplus-solution.de/api}
    restart: unless-stopped

  staging_edge:
    image: caddy:2-alpine
    restart: unless-stopped
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - staging_media_data:/srv/media:ro
      - staging_static_data:/srv/static:ro
    depends_on:
      - staging_frontend
      - staging_backend
    networks:
      default: {}
      production_edge:
        aliases:
          - aplus_staging_edge

networks:
  production_edge:
    external: true
    name: ${EDGE_NETWORK:-aplussolution_default}

volumes:
  staging_postgres_data:
  staging_redis_data:
  staging_media_data:
  staging_static_data:
