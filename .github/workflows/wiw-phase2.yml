name: WIW Phase 2 history reconciliation (retired)

# WIW -> A+ cutover is complete. Keep this workflow as a visible tombstone so
# old deployment automation cannot silently reintroduce WIW reconciliation.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    steps:
      - name: WIW synchronization is retired
        run: |
          echo "WIW -> A+ synchronization has been retired."
          echo "Existing imported data remains in A+ and no reconciliation is executed."
