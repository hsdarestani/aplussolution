name: Diagnose production workforce

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-production-workforce.yml'

permissions:
  contents: read
  issues: write

concurrency:
  group: diagnose-production-workforce
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Ensure SSH tooling
        shell: bash
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq sshpass
          fi

      - name: Read safe aggregate workforce status
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          timeout 180s env SSHPASS="$PASS" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=2 \
            root@"$HOST" 'bash -s' <<'REMOTE' | tee /tmp/workforce-audit.txt
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from django.db.models import Q, Min, Max, Count
          from django.db.models.functions import TruncMonth
          from django.utils import timezone
          from datetime import timedelta
          from core.models import TimeEntry, WorkerProfile
          from core.attendance_views import _operational_time_entries as attendance_operational
          from core.live_operations import _operational_time_entries as control_operational

          closed_unapproved = TimeEntry.objects.filter(approved=False, clock_out__isnull=False)
          open_rows = TimeEntry.objects.filter(clock_out__isnull=True)
          long_open = open_rows.filter(clock_in__lte=timezone.now() - timedelta(hours=12))
          synthetic = Q(worker__user__email__iendswith='@sync.invalid')
          wiw_id = Q(wiw_time_id__isnull=False) & ~Q(wiw_time_id='')
          wiw_sync = Q(wiw_synced_at__isnull=False)
          linked_worker = Q(worker__wiw_user_id__isnull=False) & ~Q(worker__wiw_user_id='')
          linked_shift = Q(shift__wiw_shift_id__isnull=False) & ~Q(shift__wiw_shift_id='')

          def count(label, qs):
              print(f'{label}={qs.count()}')

          def bounds(label, qs):
              row = qs.aggregate(oldest=Min('clock_in'), newest=Max('clock_in'))
              print(f"{label}_oldest=" + (row['oldest'].date().isoformat() if row['oldest'] else 'none'))
              print(f"{label}_newest=" + (row['newest'].date().isoformat() if row['newest'] else 'none'))

          def months(label, qs):
              rows = qs.annotate(month=TruncMonth('clock_in')).values('month').annotate(n=Count('id')).order_by('month')
              print(label + '=' + ','.join(f"{r['month'].date().isoformat()}:{r['n']}" for r in rows if r['month']))

          count('time_entries_total', TimeEntry.objects.all())
          count('workers_active_operational', WorkerProfile.objects.filter(active=True, user__is_active=True).exclude(user__email__iendswith='@sync.invalid'))
          count('workers_synthetic_migration', WorkerProfile.objects.filter(user__email__iendswith='@sync.invalid'))
          count('unapproved_closed_total', closed_unapproved)
          count('unapproved_closed_wiw_id', closed_unapproved.filter(wiw_id))
          count('unapproved_closed_wiw_synced', closed_unapproved.filter(wiw_sync))
          count('unapproved_closed_synthetic_worker', closed_unapproved.filter(synthetic))
          count('unapproved_closed_null_wiw_id_real_worker', closed_unapproved.filter(wiw_time_id__isnull=True).exclude(synthetic))
          count('unapproved_closed_null_wiw_id_linked_worker', closed_unapproved.filter(wiw_time_id__isnull=True).filter(linked_worker).exclude(synthetic))
          count('unapproved_closed_null_wiw_id_linked_shift', closed_unapproved.filter(wiw_time_id__isnull=True).filter(linked_shift).exclude(synthetic))
          count('attendance_operational_unapproved', attendance_operational().filter(approved=False, clock_out__isnull=False))
          count('control_operational_unapproved', control_operational().filter(approved=False, clock_out__isnull=False))
          count('open_total', open_rows)
          count('open_over_12h_total', long_open)
          count('open_over_12h_wiw_id', long_open.filter(wiw_id))
          count('open_over_12h_synthetic_worker', long_open.filter(synthetic))
          count('attendance_operational_open_over_12h', attendance_operational().filter(clock_out__isnull=True, clock_in__lte=timezone.now() - timedelta(hours=12)))

          all_closed = TimeEntry.objects.filter(clock_out__isnull=False)
          imported_closed = all_closed.filter(wiw_id)
          synthetic_closed = all_closed.filter(synthetic)
          manager_visible = all_closed.exclude(worker__user__email__iendswith='@sync.invalid')
          count('history_all_closed', all_closed)
          count('history_imported_wiw_closed', imported_closed)
          count('history_synthetic_closed', synthetic_closed)
          count('history_manager_visible_closed', manager_visible)
          bounds('history_all_closed', all_closed)
          bounds('history_imported_wiw_closed', imported_closed)
          bounds('history_synthetic_closed', synthetic_closed)
          bounds('history_manager_visible_closed', manager_visible)
          months('history_all_months', all_closed)
          months('history_manager_visible_months', manager_visible)
          PY
          REMOTE

      - name: Publish safe aggregate diagnostic
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/workforce-audit.txt', 'utf8').trim();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 85,
              state: 'closed',
              title: 'Production workforce data audit',
              body: [
                'Automated safe aggregate production workforce diagnostic.',
                '',
                '```text', output, '```',
                '',
                'No employee names, emails, row IDs, credentials, tokens, or row-level personal data are included.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n')
            });
