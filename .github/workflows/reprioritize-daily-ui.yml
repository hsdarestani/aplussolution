name: Apply daily-operations UI priority

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/reprioritize-daily-ui.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Reprioritize A+ daily operations UI
        run: python .github/scripts/reprioritize_daily_ui.py
      - name: Validate patch
        run: git diff --check
      - name: Commit UI priority update
        run: |
          if git diff --quiet; then
            echo "UI priority already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/Operations.tsx
          git commit -m "Prioritize daily workforce operations in UI"
          git push origin main
