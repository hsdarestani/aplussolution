name: Assign Shaha Spenerhaus housekeeping shifts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-assign-shaha-spenerhaus-september.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-assign-shaha-spenerhaus-september
  cancel-in-progress: false

jobs:
  assign:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Assign production shifts through standard API flow
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python - <<'PY'
          import os
          from datetime import datetime
          from zoneinfo import ZoneInfo

          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django
          django.setup()

          from django.db.models import Q
          from rest_framework.test import APIRequestFactory, force_authenticate

          from core.models import ClientCompany, Location, Notification, Position, Shift, User, WorkerProfile
          from core.notification_settings import push_rule_payload
          from core.push_models import PushDevice
          from core.push_notifications import push_provider_configured
          from core.shift_slots import ShiftSlot
          from core.shift_views import StaffingShiftViewSet

          BERLIN = ZoneInfo('Europe/Berlin')
          EMPLOYEE_NUMBER = 'MA-0061'
          DATES = {
              11: (8, 0, 13, 30),
              12: (8, 0, 13, 0),
              14: (8, 0, 13, 0),
              18: (8, 0, 13, 0),
              19: (8, 0, 13, 0),
              21: (8, 0, 13, 0),
              22: (8, 0, 13, 0),
              23: (8, 0, 13, 0),
              24: (8, 0, 13, 0),
              26: (8, 0, 13, 0),
              27: (8, 0, 13, 0),
          }

          worker = WorkerProfile.objects.select_related('user').get(employee_number=EMPLOYEE_NUMBER, active=True, user__is_active=True)
          hotel = ClientCompany.objects.filter(name__iexact='Hotel Spenerhaus', active=True).first()
          if not hotel:
              matches = list(ClientCompany.objects.filter(name__icontains='Spenerhaus', active=True)[:2])
              hotel = matches[0] if len(matches) == 1 else None
          if not hotel:
              raise RuntimeError('Hotel Spenerhaus customer not found uniquely.')

          location = Location.objects.filter(client=hotel, name__icontains='Spenerhaus', active=True).first()
          if not location:
              matches = list(Location.objects.filter(client=hotel, active=True)[:2])
              location = matches[0] if len(matches) == 1 else None
          if not location:
              raise RuntimeError('Hotel Spenerhaus location not found uniquely.')

          position = Position.objects.filter(name__iexact='Housekeeping', active=True).first() or Position.objects.filter(name__iexact='Houskeeping', active=True).first()
          if not position:
              raise RuntimeError('Housekeeping position not found.')

          admin = User.objects.filter(is_active=True, is_superuser=True).order_by('date_joined').first()
          if not admin:
              admin = User.objects.filter(is_active=True, role__in=['admin', 'manager']).order_by('date_joined').first()
          if not admin:
              raise RuntimeError('No active admin/manager account available for standard API operation.')

          if not push_provider_configured():
              raise RuntimeError('Native push provider is not configured; refusing to create assignments without push delivery.')
          assignment_rule = push_rule_payload('shift_assignment')
          if not assignment_rule.get('enabled'):
              raise RuntimeError('shift_assignment native push rule is disabled; refusing to create assignments without push delivery.')
          active_devices = PushDevice.objects.filter(user=worker.user, active=True).count()
          if active_devices < 1:
              raise RuntimeError('Shaha has no active registered push device; refusing to create assignments before native push can be delivered.')

          factory = APIRequestFactory()
          create_view = StaffingShiftViewSet.as_view({'post': 'create'})
          assign_view = StaffingShiftViewSet.as_view({'post': 'assign'})

          def response_or_raise(response, label):
              if response.status_code >= 400:
                  raise RuntimeError(f'{label} failed with HTTP {response.status_code}: {response.data}')
              return response

          created_count = 0
          assigned_count = 0
          already_count = 0
          touched = []

          for day, (sh, sm, eh, em) in DATES.items():
              starts_at = datetime(2026, 9, day, sh, sm, tzinfo=BERLIN)
              ends_at = datetime(2026, 9, day, eh, em, tzinfo=BERLIN)

              matching = Shift.objects.filter(
                  client=hotel,
                  location=location,
                  position=position,
                  starts_at=starts_at,
                  ends_at=ends_at,
              ).exclude(status=Shift.Status.CANCELLED).distinct()

              already = matching.filter(
                  Q(worker=worker) | Q(slots__worker=worker, slots__status=ShiftSlot.Status.CLAIMED)
              ).distinct().first()
              if already:
                  already_count += 1
                  touched.append((day, already, False))
                  continue

              target = matching.filter(
                  Q(is_open=True) | Q(slots__worker__isnull=True, slots__status=ShiftSlot.Status.OPEN)
              ).distinct().order_by('created_at').first()

              if not target:
                  payload = {
                      'client': str(hotel.id),
                      'location': str(location.id),
                      'position': str(position.id),
                      'starts_at': starts_at.isoformat(),
                      'ends_at': ends_at.isoformat(),
                      'status': Shift.Status.DRAFT,
                      'notes': '',
                      'required_count': 1,
                      'confirmation_required': False,
                      'schedule_groups': ['housekeeping'],
                  }
                  request = factory.post('/api/shifts/', payload, format='json')
                  force_authenticate(request, user=admin)
                  response = response_or_raise(create_view(request), f'create {day:02d}.09')
                  target = Shift.objects.get(pk=response.data['id'])
                  created_count += 1

              request = factory.post(
                  f'/api/shifts/{target.id}/assign/',
                  {'workers': [str(worker.id)], 'publish_remaining': False},
                  format='json',
              )
              force_authenticate(request, user=admin)
              response_or_raise(assign_view(request, pk=str(target.id)), f'assign {day:02d}.09')
              target.refresh_from_db()
              assigned_count += 1
              touched.append((day, target, True))

          notification_ids = []
          for day, shift, changed in touched:
              slot = ShiftSlot.objects.filter(
                  shift=shift,
                  worker=worker,
                  status=ShiftSlot.Status.CLAIMED,
              ).first()
              if not slot:
                  raise RuntimeError(f'Assignment verification failed for {day:02d}.09: claimed slot missing.')
              if changed:
                  kind = f'shift-admin-assigned-{slot.id}'
                  notification = Notification.objects.filter(user=worker.user, kind=kind).first()
                  if not notification:
                      raise RuntimeError(f'Notification verification failed for {day:02d}.09.')
                  notification_ids.append(str(notification.id))

          print(
              'SHAHA_SPENERHAUS_ASSIGNMENTS_OK '
              f'employee={EMPLOYEE_NUMBER} active_push_devices={active_devices} '
              f'created={created_count} assigned={assigned_count} already={already_count} '
              f'notifications={len(notification_ids)} dates=' + ','.join(f'{day:02d}.09' for day, _, _ in touched)
          )
          PY

          sleep 8
          docker compose exec -T backend python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django
          django.setup()

          from core.models import Notification, WorkerProfile
          from core.push_models import PushDelivery

          worker = WorkerProfile.objects.select_related('user').get(employee_number='MA-0061')
          notifications = Notification.objects.filter(
              user=worker.user,
              kind__startswith='shift-admin-assigned-',
              created_at__date__gte='2026-09-11',
          ).order_by('-created_at')[:20]
          ids = [n.id for n in notifications]
          deliveries = PushDelivery.objects.filter(notification_id__in=ids)
          sent = deliveries.filter(sent_at__isnull=False).count()
          failed = deliveries.exclude(last_error='').count()
          print(f'SHAHA_PUSH_DELIVERY_STATUS recent_assignment_notifications={len(ids)} delivery_rows={deliveries.count()} sent={sent} failed={failed}')
          PY
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
