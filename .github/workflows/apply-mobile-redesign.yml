name: Apply mobile-first redesign

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/mobile-first-app-shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply deterministic mobile redesign
        run: python .ops/apply_mobile_redesign.py
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build responsive frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://solution.smarbiz.sbs/api
        run: npm run build
      - name: Commit validated permanent redesign
        run: |
          rm -f .ops/apply_mobile_redesign.py .github/workflows/apply-mobile-redesign.yml
          rmdir .ops 2>/dev/null || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/src/theme.css frontend/src/operations.css .ops .github/workflows/apply-mobile-redesign.yml
          git commit -m 'Redesign frontend as a mobile-first app shell'
          git push origin HEAD:${{ github.head_ref }}
