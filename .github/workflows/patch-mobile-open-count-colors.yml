name: Patch mobile OpenShift count and colors

on:
  push:
    paths:
      - '.github/workflows/patch-mobile-open-count-colors.yml'

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply focused mobile schedule fixes
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              file = Path(path)
              text = file.read_text()
              actual = text.count(old)
              assert actual == count, f'{path}: expected {count} occurrence(s), found {actual}'
              file.write_text(text.replace(old, new, count))

          # 1) Dashboard badge must match exactly what the local Dienstplan opens.
          replace(
              'backend/core/wiw_dashboard.py',
              """    snapshot = _local_snapshot(now)\n    # WIW is intentionally read-only. Native A+ OpenShifts therefore never\n    # appear in the live WIW result and must be added without double-counting\n    # imported WIW shifts that also exist locally.\n    native_open_shifts = _local_open_shift_count(now, native_only=True)\n    live_error = ''\n""",
              """    snapshot = _local_snapshot(now)\n    # This badge navigates to the local Dienstplan, so it must count exactly\n    # the local OpenShift cards that are actually visible after tapping it.\n    local_open_shifts = int(snapshot.get('open_shifts_available') or 0)\n    live_error = ''\n""",
          )
          replace(
              'backend/core/wiw_dashboard.py',
              """            if 'open_shifts_available' in live:\n                live['open_shifts_available'] = int(live.get('open_shifts_available') or 0) + native_open_shifts\n            snapshot.update(live)\n""",
              """            # Keep WIW request counters live, but never replace the local\n            # OpenShift badge with remote WIW shifts that this screen cannot show.\n            live.pop('open_shifts_available', None)\n            snapshot.update(live)\n            snapshot['open_shifts_available'] = local_open_shifts\n""",
          )
          replace(
              'backend/tests/test_wiw_dashboard_counts.py',
              'def test_mobile_dashboard_adds_native_open_shifts_to_live_wiw_count(monkeypatch, auth_admin, company, location, position):',
              'def test_mobile_dashboard_open_shift_badge_matches_local_schedule(monkeypatch, auth_admin, company, location, position):',
          )
          replace(
              'backend/tests/test_wiw_dashboard_counts.py',
              "    assert response.data['open_shifts_available'] == 18\n",
              "    assert response.data['open_shifts_available'] == 1\n",
          )

          # 2) Persist an optional per-shift manual hue. Null means automatic customer color.
          replace(
              'backend/core/models.py',
              """    confirmation_required = models.BooleanField(default=False)\n    schedule_groups = models.JSONField(default=list, blank=True)\n    published_at = models.DateTimeField(blank=True, null=True)\n""",
              """    confirmation_required = models.BooleanField(default=False)\n    schedule_groups = models.JSONField(default=list, blank=True)\n    color_hue = models.PositiveSmallIntegerField(\n        blank=True, null=True, validators=[MinValueValidator(0), MaxValueValidator(359)]\n    )\n    published_at = models.DateTimeField(blank=True, null=True)\n""",
          )
          migration = Path('backend/core/migrations/0017_shift_color_hue.py')
          assert not migration.exists(), '0017_shift_color_hue.py already exists'
          migration.write_text("""from django.core.validators import MaxValueValidator, MinValueValidator\nfrom django.db import migrations, models\n\n\nclass Migration(migrations.Migration):\n    dependencies = [\n        ('core', '0016_shift_release_request'),\n    ]\n\n    operations = [\n        migrations.AddField(\n            model_name='shift',\n            name='color_hue',\n            field=models.PositiveSmallIntegerField(\n                blank=True,\n                null=True,\n                validators=[MinValueValidator(0), MaxValueValidator(359)],\n            ),\n        ),\n    ]\n""")
          replace(
              'backend/core/shift_api.py',
              """            'required_count', 'confirmation_required', 'schedule_groups', 'open_count', 'filled_count',\n""",
              """            'required_count', 'confirmation_required', 'schedule_groups', 'color_hue', 'open_count', 'filled_count',\n""",
          )
          replace(
              'backend/core/shift_slot_actions.py',
              """        'client', 'location', 'position', 'starts_at', 'ends_at', 'notes',\n        'confirmation_required', 'schedule_groups', 'status',\n""",
              """        'client', 'location', 'position', 'starts_at', 'ends_at', 'notes',\n        'confirmation_required', 'schedule_groups', 'color_hue', 'status',\n""",
          )
          replace(
              'backend/core/shift_slot_actions.py',
              """            confirmation_required=shift.confirmation_required,\n            schedule_groups=shift.schedule_groups,\n            published_at=shift.published_at,\n""",
              """            confirmation_required=shift.confirmation_required,\n            schedule_groups=shift.schedule_groups,\n            color_hue=shift.color_hue,\n            published_at=shift.published_at,\n""",
          )

          # 3) Web keeps its current customer-color algorithm, but honors a mobile manual override.
          replace(
              'frontend/src/ScheduleV2.tsx',
              """  const clientStyle=(item:any)=>({'--sv2-client-hue':String(clientHueMap.get(clientKey(item))??215)} as React.CSSProperties);\n""",
              """  const clientStyle=(item:any)=>({'--sv2-client-hue':String(item?.color_hue ?? clientHueMap.get(clientKey(item)) ?? 215)} as React.CSSProperties);\n""",
          )

          # 4) The old enhancer hard-coded A+ Navy. Native mobile color handling now owns this row.
          replace(
              'frontend/src/WiwShiftFormUxEnhancer.tsx',
              """  const row = rows.find((item) => text(item).includes('Standardfarbe'));\n  if (!row) return;\n  row.classList.add('wiw-standard-color-row');\n""",
              """  const row = rows.find((item) => text(item).includes('Standardfarbe'));\n  if (!row || row.dataset.colorManaged === 'true') return;\n  row.classList.add('wiw-standard-color-row');\n""",
          )

          # 5) Mobile: same automatic per-customer hue as web + persisted manual override picker.
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """type Choice = { value: string; label: string };\ntype EditingCard = { shiftId: string; slotId: string; parentCount: number; workerName?: string; isOpen: boolean };\n""",
              """type Choice = { value: string; label: string };\ntype ColorChoice = { value: string; label: string; hue: number | null };\ntype EditingCard = { shiftId: string; slotId: string; parentCount: number; workerName?: string; isOpen: boolean };\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """  schedule_groups: string[];\n  notes: string;\n  apply_all: boolean;\n""",
              """  schedule_groups: string[];\n  color_hue: number | null;\n  notes: string;\n  apply_all: boolean;\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """const SCHEDULE_GROUPS: Choice[] = [\n  { value: 'service', label: 'Service' },\n  { value: 'front_office', label: 'Front Office' },\n  { value: 'housekeeping', label: 'Housekeeping' },\n];\n""",
              """const SCHEDULE_GROUPS: Choice[] = [\n  { value: 'service', label: 'Service' },\n  { value: 'front_office', label: 'Front Office' },\n  { value: 'housekeeping', label: 'Housekeeping' },\n];\nconst COLOR_CHOICES: ColorChoice[] = [\n  { value: 'auto', label: 'Kundenfarbe · automatisch', hue: null },\n  { value: 'navy', label: 'Navy', hue: 205 },\n  { value: 'blue', label: 'Blau', hue: 220 },\n  { value: 'teal', label: 'Türkis', hue: 180 },\n  { value: 'green', label: 'Grün', hue: 120 },\n  { value: 'yellow', label: 'Gelb', hue: 48 },\n  { value: 'orange', label: 'Orange', hue: 28 },\n  { value: 'red', label: 'Rot', hue: 0 },\n  { value: 'pink', label: 'Pink', hue: 330 },\n  { value: 'violet', label: 'Violett', hue: 275 },\n];\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """const normalize = (value: string) => String(value || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');\n\nfunction keyDate(key: string) {\n""",
              """const normalize = (value: string) => String(value || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]/g, '');\nconst clientKey = (item: any) => String(item?.client || item?.client_name || 'ohne-kunde');\n\nfunction keyDate(key: string) {\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """function Row({ icon, label, value, muted, green, onClick, trailing }: { icon: string; label: string; value?: string; muted?: boolean; green?: boolean; onClick?: () => void; trailing?: React.ReactNode }) {\n  const Component: any = onClick ? 'button' : 'div';\n  return (\n    <Component type={onClick ? 'button' : undefined} className={`wiw-form-row ${muted ? 'muted' : ''} ${green ? 'green' : ''}`} onClick={onClick}>\n""",
              """function Row({ icon, label, value, muted, green, onClick, trailing, colorManaged }: { icon: string; label: string; value?: string; muted?: boolean; green?: boolean; onClick?: () => void; trailing?: React.ReactNode; colorManaged?: boolean }) {\n  const Component: any = onClick ? 'button' : 'div';\n  return (\n    <Component type={onClick ? 'button' : undefined} data-color-managed={colorManaged ? 'true' : undefined} className={`wiw-form-row ${muted ? 'muted' : ''} ${green ? 'green' : ''}`} onClick={onClick}>\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """function MultiChoiceSheet({ title, choices, selected, limit, onChange, onClose }: { title: string; choices: Choice[]; selected: string[]; limit?: number; onChange: (values: string[]) => void; onClose: () => void }) {\n""",
              """function ColorSheet({ selected, autoHue, onSelect, onClose }: { selected: number | null; autoHue: number; onSelect: (hue: number | null) => void; onClose: () => void }) {\n  return (\n    <div className=\"wiw-sheet-backdrop\" onMouseDown={(event) => { if (event.target === event.currentTarget) onClose(); }}>\n      <section className=\"wiw-choice-sheet wiw-color-sheet\">\n        <header><b>Standardfarbe</b><button type=\"button\" onClick={onClose}>Fertig</button></header>\n        <div>{COLOR_CHOICES.map((choice) => {\n          const active = choice.hue === selected;\n          const hue = choice.hue ?? autoHue;\n          return <button type=\"button\" key={choice.value} className={active ? 'selected' : ''} onClick={() => onSelect(choice.hue)}>\n            <span className=\"wiw-color-choice\"><i style={{ '--wiw-color-hue': String(hue) } as React.CSSProperties} /><span>{choice.label}</span></span>\n            {active ? <IonIcon icon={checkmarkOutline} /> : null}\n          </button>;\n        })}</div>\n      </section>\n    </div>\n  );\n}\n\nfunction MultiChoiceSheet({ title, choices, selected, limit, onChange, onClose }: { title: string; choices: Choice[]; selected: string[]; limit?: number; onChange: (values: string[]) => void; onClose: () => void }) {\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """  const [sheet, setSheet] = useState<'client' | 'position' | 'location' | 'workers' | 'groups' | ''>('');\n""",
              """  const [sheet, setSheet] = useState<'client' | 'position' | 'location' | 'workers' | 'groups' | 'color' | ''>('');\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """  const cards = useMemo<CardRow[]>(() => rows.flatMap((shift: any) => activeSlots(shift).map((slot: any) => ({\n    key: `${shift.id}:${slot.id}`,\n    shift,\n    slot,\n    worker: slot.worker || undefined,\n    isOpen: Boolean(slot.is_open || (slot.status === 'open' && !slot.worker)),\n  }))), [rows]);\n  const visibleCards = useMemo(() => cards.filter((card) => {\n""",
              """  const cards = useMemo<CardRow[]>(() => rows.flatMap((shift: any) => activeSlots(shift).map((slot: any) => ({\n    key: `${shift.id}:${slot.id}`,\n    shift,\n    slot,\n    worker: slot.worker || undefined,\n    isOpen: Boolean(slot.is_open || (slot.status === 'open' && !slot.worker)),\n  }))), [rows]);\n  const clientHueMap = useMemo(() => {\n    const keys = Array.from(new Set(rows.map(clientKey))).sort();\n    return new Map(keys.map((key, index) => [key, (18 + index * 137.508) % 360]));\n  }, [rows]);\n  const effectiveHue = (shift: any) => shift?.color_hue == null ? (clientHueMap.get(clientKey(shift)) ?? 215) : Number(shift.color_hue);\n  const formAutoHue = clientHueMap.get(form.client || 'ohne-kunde') ?? 215;\n  const visibleCards = useMemo(() => cards.filter((card) => {\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """    if (tab === 'open') {\n      if (!card.isOpen) return false;\n      if (card.shift.ends_at && new Date(card.shift.ends_at).getTime() < Date.now()) return false;\n""",
              """    if (tab === 'open') {\n      if (!card.isOpen) return false;\n      if (!['published', 'confirmed'].includes(String(card.shift.status || ''))) return false;\n      if (card.shift.ends_at && new Date(card.shift.ends_at).getTime() < Date.now()) return false;\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """      schedule_groups: Array.isArray(card.shift.schedule_groups) ? card.shift.schedule_groups : [],\n      notes: card.shift.notes || '',\n      apply_all: false,\n""",
              """      schedule_groups: Array.isArray(card.shift.schedule_groups) ? card.shift.schedule_groups : [],\n      color_hue: card.shift.color_hue == null ? null : Number(card.shift.color_hue),\n      notes: card.shift.notes || '',\n      apply_all: false,\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """        confirmation_required: form.confirmation_required,\n        schedule_groups: form.schedule_groups,\n        required_count: 1,\n""",
              """        confirmation_required: form.confirmation_required,\n        schedule_groups: form.schedule_groups,\n        color_hue: form.color_hue,\n        required_count: 1,\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """        confirmation_required: form.confirmation_required,\n        schedule_groups: form.schedule_groups,\n      };\n""",
              """        confirmation_required: form.confirmation_required,\n        schedule_groups: form.schedule_groups,\n        color_hue: form.color_hue,\n      };\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """            {dayCards.map((card) => <button type=\"button\" className=\"wiw-shift-card\" key={card.key} onClick={() => openEdit(card)}>\n""",
              """            {dayCards.map((card) => <button type=\"button\" className=\"wiw-shift-card\" style={{ '--wiw-shift-hue': String(effectiveHue(card.shift)) } as React.CSSProperties} key={card.key} onClick={() => openEdit(card)}>\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """          <Row icon={colorPaletteOutline} label=\"Standardfarbe\" />\n""",
              """          <Row\n            icon={colorPaletteOutline}\n            label=\"Standardfarbe\"\n            colorManaged\n            onClick={() => setSheet('color')}\n            trailing={<span className=\"wiw-color-row-tail\"><i style={{ '--wiw-color-hue': String(form.color_hue ?? formAutoHue) } as React.CSSProperties} /><b>{form.color_hue == null ? 'Kundenfarbe · automatisch' : (COLOR_CHOICES.find((choice) => choice.hue === form.color_hue)?.label || 'Individuell')}</b><IonIcon className=\"wiw-row-chevron\" icon={chevronForwardOutline} /></span>}\n          />\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """        {sheet === 'groups' ? <MultiChoiceSheet title=\"Zeitplan\" choices={SCHEDULE_GROUPS} selected={form.schedule_groups} onClose={() => setSheet('')} onChange={(values) => setForm((current) => ({ ...current, schedule_groups: values }))} /> : null}\n        {sheet === 'workers' ? <MultiChoiceSheet title={editing?.isOpen ? 'Mitarbeiter zuweisen' : 'Geeignete Benutzer'} choices={workerChoices} selected={form.workers} limit={editing ? 1 : form.required_count} onClose={() => setSheet('')} onChange={(values) => setForm((current) => ({ ...current, workers: values }))} /> : null}\n""",
              """        {sheet === 'groups' ? <MultiChoiceSheet title=\"Zeitplan\" choices={SCHEDULE_GROUPS} selected={form.schedule_groups} onClose={() => setSheet('')} onChange={(values) => setForm((current) => ({ ...current, schedule_groups: values }))} /> : null}\n        {sheet === 'color' ? <ColorSheet selected={form.color_hue} autoHue={formAutoHue} onClose={() => setSheet('')} onSelect={(hue) => setForm((current) => ({ ...current, color_hue: hue }))} /> : null}\n        {sheet === 'workers' ? <MultiChoiceSheet title={editing?.isOpen ? 'Mitarbeiter zuweisen' : 'Geeignete Benutzer'} choices={workerChoices} selected={form.workers} limit={editing ? 1 : form.required_count} onClose={() => setSheet('')} onChange={(values) => setForm((current) => ({ ...current, workers: values }))} /> : null}\n""",
          )
          replace(
              'frontend/src/WiwScheduleMobile.tsx',
              """    schedule_groups: [],\n    notes: '',\n    apply_all: false,\n""",
              """    schedule_groups: [],\n    color_hue: null,\n    notes: '',\n    apply_all: false,\n""",
          )

          # Mobile card accents and picker swatches.
          replace(
              'frontend/src/wiw-schedule-mobile.css',
              """  .wiw-shift-card{width:100%;min-height:54px;padding:7px 12px 7px 10px;display:grid;gap:5px;border:0;border-left:4px solid #6bad50;border-bottom:1px solid #dedede;background:#fff;color:#333;text-align:left;font:inherit}\n""",
              """  .wiw-shift-card{width:100%;min-height:54px;padding:7px 12px 7px 10px;display:grid;gap:5px;border:0;border-left:4px solid hsl(var(--wiw-shift-hue,215) 68% 44%);border-bottom:1px solid #dedede;background:linear-gradient(90deg,hsl(var(--wiw-shift-hue,215) 80% 97%) 0,#fff 24%);color:#333;text-align:left;font:inherit}\n""",
          )
          replace(
              'frontend/src/wiw-schedule-mobile.css',
              """  .wiw-form-row.muted .wiw-form-row-copy span{color:#b1b1b1}\n  .wiw-row-chevron{font-size:16px!important;color:#c4c4c4!important}\n""",
              """  .wiw-form-row.muted .wiw-form-row-copy span{color:#b1b1b1}\n  .wiw-row-chevron{font-size:16px!important;color:#c4c4c4!important}\n  .wiw-color-row-tail{min-width:0;display:flex;align-items:center;justify-content:flex-end;gap:7px}\n  .wiw-color-row-tail>i,.wiw-color-choice>i{width:14px;height:14px;border-radius:50%;background:hsl(var(--wiw-color-hue,215) 68% 44%);box-shadow:0 0 0 1px rgba(0,0,0,.14);flex:0 0 auto}\n  .wiw-color-row-tail>b{max-width:156px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#8e8e8e;font-size:11px;font-weight:500}\n  .wiw-color-row-tail>.wiw-row-chevron{flex:0 0 auto}\n""",
          )
          replace(
              'frontend/src/wiw-schedule-mobile.css',
              """  .wiw-choice-sheet>div>button.selected{color:#5d9f45;font-weight:600}\n  .wiw-date-sheet{padding-bottom:calc(18px + env(safe-area-inset-bottom))}\n""",
              """  .wiw-choice-sheet>div>button.selected{color:#5d9f45;font-weight:600}\n  .wiw-color-choice{display:flex;align-items:center;gap:10px;min-width:0}\n  .wiw-color-choice>i{width:20px;height:20px}\n  .wiw-color-choice>span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}\n  .wiw-date-sheet{padding-bottom:calc(18px + env(safe-area-inset-bottom))}\n""",
          )

          # Remove the one-shot workflow in the same patch commit.
          Path('.github/workflows/patch-mobile-open-count-colors.yml').unlink()
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align mobile OpenShift count and shift colors'
          git push
