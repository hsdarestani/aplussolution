name: Repair STRATO container conflict

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-strato-container-conflict.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-emergency-origin
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Clean stale app containers and restore STRATO
        run: |
          set -euo pipefail
          ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          # Database must remain the promoted primary and is never removed here.
          recovery="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"' | tr -d '[:space:]')"
          test "$recovery" = "f"

          systemctl disable --now aplus-primary-ensure.timer >/dev/null 2>&1 || true
          systemctl stop aplus-primary-ensure.service >/dev/null 2>&1 || true

          # Remove only application/gateway containers. Preserve db, redis and all volumes.
          docker compose rm -sf backend frontend celery celery-beat caddy >/dev/null 2>&1 || true

          for pattern in             aplussolution-backend-1             aplussolution-frontend-1             aplussolution-celery-1             aplussolution-celery-beat-1             aplussolution-caddy-1; do
            ids="$(docker ps -aq --filter "name=$pattern" || true)"
            if [ -n "$ids" ]; then
              docker rm -f $ids >/dev/null 2>&1 || true
            fi
          done

          # Also remove Compose temporary conflict names that contain the canonical service name.
          for service in backend frontend celery celery-beat caddy; do
            ids="$(docker ps -aq --format '{{.ID}} {{.Names}}' | awk -v s="aplussolution-$service-1" '$2 ~ s {print $1}' || true)"
            if [ -n "$ids" ]; then
              docker rm -f $ids >/dev/null 2>&1 || true
            fi
          done

          docker compose up -d db redis
          docker compose build backend frontend celery celery-beat
          docker compose up -d backend frontend celery celery-beat caddy
          docker compose up -d --force-recreate --no-deps caddy

          ready=0
          for i in $(seq 1 90); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          if [ "$ready" -ne 1 ]; then
            docker compose ps -a >&2 || true
            docker compose logs --no-color --tail=250 backend >&2 || true
            exit 1
          fi

          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py migrate --check
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          for service in db redis backend frontend celery celery-beat caddy; do
            cid="$(docker compose ps -q "$service" --status running)"
            test -n "$cid" || { echo "SERVICE_NOT_RUNNING=$service" >&2; exit 1; }
          done

          ss -ltn | grep -q ':80 '
          ss -ltn | grep -q ':443 '

          curl -fsS --max-time 15             --resolve app.aplus-solution.de:443:127.0.0.1             -D /tmp/local.headers -o /tmp/local.health             https://app.aplus-solution.de/health/
          grep -qi '^x-aplus-origin: strato-primary' /tmp/local.headers
          grep -q '"status"' /tmp/local.health

          # Re-enable the primary watchdog now that Compose is clean.
          systemctl enable --now aplus-primary-ensure.timer >/dev/null 2>&1 || true

          echo STRATO_APP_CONFLICT_REPAIRED
          docker compose ps
          REMOTE

      - name: Verify public STRATO origin
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 15); do
            if timeout 10 nc -vz "$STRATO_HOST" 443 >/tmp/nc443 2>&1; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" -eq 1
          echo STRATO_PUBLIC_443_OK

      - name: Verify Cloudflare to STRATO
        shell: bash
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 20); do
            if curl -fsS --connect-timeout 10 --max-time 20               -D /tmp/cf.headers -o /tmp/cf.health               "https://app.aplus-solution.de/health/?repair=$GITHUB_RUN_ID-$i"               && grep -qi '^x-aplus-origin: strato-primary' /tmp/cf.headers               && grep -q '"status"' /tmp/cf.health; then
              ok=1
              break
            fi
            sleep 3
          done
          test "$ok" -eq 1
          echo CLOUDFLARE_STRATO_HEALTH_OK

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/*.headers /tmp/*.health /tmp/nc443
