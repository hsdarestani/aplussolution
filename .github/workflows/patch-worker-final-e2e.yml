name: Patch final worker E2E fixtures

on:
  push:
    branches: [qa/worker-portal-deep]
    paths:
      - '.github/workflows/patch-worker-final-e2e.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/worker-portal-deep
      - name: Align deep worker tests with production readiness and friendly picker
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/e2e/worker-portal-deep.spec.ts')
          text = path.read_text()

          old_contract = "            signatures: state.contractSigned ? [{ id: 'sig-1', role: 'employee', signer_name: worker.name }] : [],\n            pdf: null,"
          new_contract = "            signatures: state.contractSigned ? [{ id: 'sig-1', role: 'employee', signer_name: worker.name }] : [],\n            readiness: {\n              state: state.contractSigned ? 'signed' : 'ready_to_sign',\n              blocking_issues: [],\n              generation_allowed: false,\n              send_allowed: false,\n              pending_signature_roles: state.contractSigned ? [] : ['employee'],\n              completed_signature_roles: state.contractSigned ? ['employee'] : [],\n              document_current: true,\n            },\n            pdf: null,"
          if old_contract not in text:
              raise SystemExit('contract readiness fixture marker missing')
          text = text.replace(old_contract, new_contract, 1)

          old_dates = "    await page.getByLabel('Beginn').fill('2026-08-24T09:00');\n    await page.getByLabel('Ende').fill('2026-08-24T18:00');"
          new_dates = "    const setDateTime = async (label: string, next: string) => {\n      const field = page.locator(`ion-input[label=\\\"${label}\\\"]`);\n      await field.click();\n      const picker = page.locator('ion-modal.friendly-picker-modal');\n      await expect(picker).toBeVisible();\n      const datetime = picker.locator('ion-datetime[presentation=\\\"date-time\\\"]');\n      await datetime.evaluate((element: any, value) => {\n        element.value = value;\n        element.dispatchEvent(new CustomEvent('ionChange', { detail: { value }, bubbles: true, composed: true }));\n      }, next);\n      await picker.getByRole('button', { name: 'Übernehmen' }).click();\n      await expect(picker).not.toBeVisible();\n      await expect.poll(async () => field.evaluate((element: any) => String(element.value || ''))).toBe(next);\n    };\n    await setDateTime('Beginn', '2026-08-24T09:00');\n    await setDateTime('Ende', '2026-08-24T18:00');"
          if old_dates not in text:
              raise SystemExit('availability direct-fill marker missing')
          text = text.replace(old_dates, new_dates, 1)

          path.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/e2e/worker-portal-deep.spec.ts
          git commit -m 'test: align worker deep E2E with production UI'
          git push origin HEAD:qa/worker-portal-deep
