name: Restamp Store Review signed contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-restamp-store-review-contract.yml'

permissions:
  contents: read

jobs:
  restamp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Wait for signer caption renderer deployment
        shell: bash
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            if ssh -i "$HOME/.ssh/strato_ed25519" \
              -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
              -o ConnectTimeout=20 root@"$STRATO_HOST" \
              "grep -q '_stamp_signature_caption' /opt/aplussolution/backend/core/signature_pdf.py && grep -q '_VISIBLE_ROLE_LABELS' /opt/aplussolution/backend/core/signature_pdf.py"; then
              echo 'SIGNER_CAPTION_RENDERER_DEPLOYED'
              exit 0
            fi
            sleep 10
          done
          echo 'Timed out waiting for signer caption renderer.' >&2
          exit 1

      - name: Regenerate and restamp Store Review contract
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from core.document_engine import generate_contract_files
          from core.models import Contract
          from core.signature_pdf import stamp_drawn_signatures

          contract_id = '98c112fa-3c87-449b-92c4-e360b393dc26'
          contract = Contract.objects.select_related('template').get(pk=contract_id)
          if contract.template.slug != 'arbeitsvertrag-dgb-gvp':
              raise RuntimeError(f'Unexpected template: {contract.template.slug}')
          if contract.signatures.count() < 1:
              raise RuntimeError('The Store Review test contract has no recorded signatures.')

          generate_contract_files(contract, validate=False)
          if not stamp_drawn_signatures(contract):
              raise RuntimeError('Signature restamp did not produce a stamped PDF.')
          contract.refresh_from_db()
          print(
              'CONTRACT_SIGNER_CAPTION_OK '
              f'id={contract.pk} status={contract.status} signatures={contract.signatures.count()} '
              f'pdf={contract.pdf.name}'
          )
          PY
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"

# 2026-09-06: retrigger after adding visible signer name, role and signed date.
