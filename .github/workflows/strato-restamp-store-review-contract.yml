name: Restamp Store Review signed contract

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-restamp-store-review-contract.yml'

permissions:
  contents: read

jobs:
  restamp:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Calibrate signature fields and restamp Store Review contract
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          import fitz

          from core.document_engine import generate_contract_files
          from core.models import Contract
          from core.signature_pdf import stamp_drawn_signatures

          contract_id = '98c112fa-3c87-449b-92c4-e360b393dc26'
          contract = Contract.objects.select_related('template').get(pk=contract_id)
          if contract.template.slug != 'arbeitsvertrag-dgb-gvp':
              raise RuntimeError(f'Unexpected template: {contract.template.slug}')
          if contract.signatures.count() < 1:
              raise RuntimeError('The Store Review test contract has no recorded signatures.')

          # Build an unsigned/current-layout PDF first.
          generate_contract_files(contract, validate=False)
          contract.refresh_from_db()
          contract.pdf.open('rb')
          try:
              source = contract.pdf.read()
          finally:
              contract.pdf.close()

          doc = fitz.open(stream=source, filetype='pdf')
          try:
              if doc.page_count < 1:
                  raise RuntimeError('Generated PDF has no pages.')
              page_no = doc.page_count
              page = doc[-1]

              # Employment template invariant: the final page contains two signature
              # captions in document order: Arbeitnehmer first, Arbeitgeber second.
              rows = {}
              for word in page.get_text('words') or []:
                  if len(word) < 8:
                      continue
                  x0, y0, x1, y1, text, block, line, _ = word[:8]
                  key = (block, line)
                  row = rows.setdefault(key, {'rect': fitz.Rect(x0, y0, x1, y1), 'parts': []})
                  row['rect'] |= fitz.Rect(x0, y0, x1, y1)
                  row['parts'].append((x0, str(text)))

              signature_rows = []
              for row in rows.values():
                  row['parts'].sort(key=lambda item: item[0])
                  text = ' '.join(item[1] for item in row['parts'])
                  if 'unterschrift' in text.casefold():
                      signature_rows.append(row['rect'])
              signature_rows.sort(key=lambda rect: (rect.y0, rect.x0))
              if len(signature_rows) != 2:
                  raise RuntimeError(f'Expected exactly two final-page signature captions, got {len(signature_rows)}')

              horizontal = []
              for drawing in page.get_drawings() or []:
                  for item in drawing.get('items', []):
                      if item[0] == 'l':
                          p1, p2 = item[1], item[2]
                          if abs(p1.y - p2.y) <= 1.8 and abs(p2.x - p1.x) >= 65:
                              horizontal.append((min(p1.x, p2.x), max(p1.x, p2.x), (p1.y + p2.y) / 2))
                      elif item[0] == 're':
                          rect = fitz.Rect(item[1])
                          if rect.width >= 65 and rect.height <= 45:
                              horizontal.append((rect.x0, rect.x1, rect.y1))

              placements = {}
              for role, label_rect in zip(('employee', 'employer'), signature_rows):
                  candidates = []
                  for x0, x1, y in horizontal:
                      # The intended signature line sits immediately above its caption.
                      if y > label_rect.y0 + 3:
                          continue
                      delta = label_rect.y0 - y
                      if not (0 <= delta <= 48):
                          continue
                      overlap = max(0.0, min(x1, label_rect.x1 + 180) - max(x0, label_rect.x0 - 90))
                      if overlap <= 0 and abs(x0 - label_rect.x0) > 120:
                          continue
                      candidates.append((delta, -overlap, x0, x1, y))
                  if not candidates:
                      raise RuntimeError(f'No signature line found for {role}.')
                  _, _, x0, x1, y = sorted(candidates)[0]

                  left = x0 + 5
                  right = x1 - 5
                  top = max(6.0, y - 38.0)
                  bottom = y - 1.5
                  placements[role] = {
                      'page': page_no,
                      'x': left / page.rect.width,
                      'y': top / page.rect.height,
                      'width': (right - left) / page.rect.width,
                      'height': (bottom - top) / page.rect.height,
                      'confidence': 1.0,
                  }
          finally:
              doc.close()

          schema = dict(contract.template.schema or {})
          schema['signature_placements'] = placements
          contract.template.schema = schema
          contract.template.save(update_fields=['schema', 'updated_at'])

          # Regenerate and stamp with exact template coordinates.
          generate_contract_files(contract, validate=False)
          if not stamp_drawn_signatures(contract):
              raise RuntimeError('Signature restamp did not produce a stamped PDF.')
          contract.refresh_from_db()
          print(
              'CONTRACT_SIGNATURE_CALIBRATED_OK '
              f'id={contract.pk} status={contract.status} signatures={contract.signatures.count()} '
              f'page={page_no} pdf={contract.pdf.name}'
          )
          PY
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
