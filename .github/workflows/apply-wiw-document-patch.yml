name: Apply WIW document automation patch

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.head_ref == 'feature/wiw-document-automation-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiw-document-automation-tests
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Reconstruct and verify patch archive
        run: |
          set -euo pipefail
          cat \
            .integration/chunk-00 \
            .integration/chunk-01 \
            .integration/chunk-02 \
            .integration/chunk-03 \
            .integration/chunk-04 \
            .integration/chunk-05 \
            .integration/chunk-06 \
            .integration/chunk-07 \
            .integration/chunk-08 \
            .integration/chunk-09 \
            .integration/chunk-10 \
            .integration/chunk-11 \
            .integration/chunk-12 \
            .integration/chunk-13 > /tmp/wiw-documents-tests-patch.b64
          echo '233d8be55b7c2a2697c9a7558c1d9a06e77badaf97e1a5720a24b79ce3831c29  /tmp/wiw-documents-tests-patch.b64' | sha256sum -c -
          base64 --decode /tmp/wiw-documents-tests-patch.b64 > /tmp/wiw-documents-tests-patch.tar.gz
          echo '63fc5b4e2d7c9b54da840acdb6c1c80c83fc953d216c1430f7c7be100fb86746  /tmp/wiw-documents-tests-patch.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wiw-documents-tests-patch.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/test/Operations.test.tsx')
          text = path.read_text()
          old = "vi.mock('ionicons/icons', () => new Proxy({}, { get: () => 'icon' }));"
          icons = [
              'alertCircleOutline', 'calendarOutline', 'checkmarkCircleOutline',
              'cloudDownloadOutline', 'copyOutline', 'documentTextOutline',
              'notificationsOutline', 'peopleOutline', 'refreshOutline',
              'swapHorizontalOutline', 'trashOutline', 'warningOutline',
          ]
          new = "vi.mock('ionicons/icons', () => ({ " + ", ".join(f"{icon}: 'icon'" for icon in icons) + " }));"
          replacements = [
              (old, new),
              (
                  "import { render, screen, waitFor } from '@testing-library/react';",
                  "import { cleanup, render, screen, waitFor } from '@testing-library/react';",
              ),
              (
                  "import { beforeEach, describe, expect, it, vi } from 'vitest';",
                  "import { afterEach, beforeEach, describe, expect, it, vi } from 'vitest';",
              ),
              (
                  "const admin = { id: '1', email: 'a', name: 'Admin', first_name: 'A', last_name: '', role: 'admin', phone: '' } as any;",
                  "const admin = { id: '1', email: 'a', name: 'Admin', first_name: 'A', last_name: '', role: 'admin', phone: '' } as any;\n\nafterEach(() => cleanup());",
              ),
          ]
          for source, target in replacements:
              if source not in text:
                  raise SystemExit(f'Expected frontend test text was not found: {source}')
              text = text.replace(source, target, 1)
          path.write_text(text)
          PY
          rm -rf .integration
          rm -f .github/workflows/apply-wiw-document-patch.yml
          rm -f .github/workflows/export-source-artifact.yml
      - name: Install backend dependencies and generate migrations
        run: |
          pip install -r backend/requirements.txt
          cd backend
          export DJANGO_SECRET_KEY=ci-patch-secret
          export DATABASE_URL=sqlite:///patch.sqlite3
          export ALLOWED_HOSTS=localhost,127.0.0.1,testserver
          export CORS_ALLOWED_ORIGINS=http://localhost:8080
          export CSRF_TRUSTED_ORIGINS=http://localhost:8080
          python manage.py makemigrations core --noinput
          python -m compileall .
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run backend test suite
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret
          DATABASE_URL: sqlite:///test.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: pytest --nomigrations --cov=core --cov-report=term-missing --cov-fail-under=60
      - name: Run frontend tests and production build
        id: frontend
        continue-on-error: true
        working-directory: frontend
        env:
          VITE_API_URL: https://solution.smarbiz.sbs/api
        run: |
          set -o pipefail
          {
            npm install --no-audit --no-fund
            npm test
            npm run build
          } 2>&1 | tee /tmp/frontend-validation.log
      - name: Upload frontend validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-validation-log
          path: /tmp/frontend-validation.log
          retention-days: 1
      - name: Fail when frontend validation failed
        if: steps.frontend.outcome != 'success'
        run: exit 1
      - name: Commit only the fully validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Add WIW sync, eight-document automation and comprehensive tests'
          git push origin HEAD:feature/wiw-document-automation-tests
