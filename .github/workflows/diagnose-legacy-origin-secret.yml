name: Diagnose legacy public origin secret

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-legacy-origin-secret.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare legacy candidates
        env:
          OLD_HOST: ${{ secrets.HOST }}
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OLD_HOST"
          test -n "$STRATO_HOST"

          if [ "$OLD_HOST" = "$STRATO_HOST" ]; then
            echo "old_equals_strato=true"
          else
            echo "old_equals_strato=false"
          fi

          if timeout 5 bash -c 'cat < /dev/null > /dev/tcp/'"$OLD_HOST"'/22' 2>/dev/null; then
            echo "old_ssh_tcp=true"
          else
            echo "old_ssh_tcp=false"
          fi

          for label in old strato; do
            if [ "$label" = old ]; then host="$OLD_HOST"; else host="$STRATO_HOST"; fi
            echo "=== $label direct https ==="
            rm -f /tmp/h /tmp/b
            if curl -ksS --resolve solution.smarbiz.sbs:443:"$host" \
              -D /tmp/h -o /tmp/b --max-time 15 \
              "https://solution.smarbiz.sbs/health/?secret_diag=${GITHUB_RUN_ID}"; then
              grep -Ei '^(HTTP/|x-aplus-origin:|x-aplus-legacy-bridge:|server:)' /tmp/h || true
              grep -q '"status"' /tmp/b && echo "health=true" || echo "health=false"
            else
              echo "https=false"
            fi
          done
