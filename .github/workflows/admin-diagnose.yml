name: Diagnose production admin
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/admin-diagnose.yml'
  workflow_dispatch:
jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install sshpass
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass >/dev/null
      - name: Recheck production admin
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell -c "import os; from core.models import User; email=(os.getenv('DJANGO_SUPERUSER_EMAIL') or 'admin@aplus-solution.de').strip().lower(); u=User.objects.filter(email__iexact=email).first(); print('ADMIN_EXISTS=' + str(bool(u))); print('ADMIN_EMAIL=' + (u.email if u else email)); print('ADMIN_ACTIVE=' + str(u.is_active if u else None)); print('ADMIN_ROLE=' + str(u.role if u else None)); print('ADMIN_STAFF=' + str(u.is_staff if u else None)); print('ADMIN_SUPERUSER=' + str(u.is_superuser if u else None)); print('ADMIN_USABLE_PASSWORD=' + str(u.has_usable_password() if u else None)); configured=os.getenv('DJANGO_SUPERUSER_PASSWORD') or ''; print('CONFIGURED_PASSWORD_PRESENT=' + str(bool(configured))); print('CONFIGURED_PASSWORD_MATCHES=' + str(bool(u and configured and u.check_password(configured))))"
          REMOTE
