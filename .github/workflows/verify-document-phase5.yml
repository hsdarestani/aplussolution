name: Verify Phase 5 document production
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify deployed document lifecycle
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" "test -f /opt/aplussolution/backend/core/document_center.py && test -f /opt/aplussolution/backend/core/contract_views.py && test -f /opt/aplussolution/frontend/src/DocumentCenterV5.tsx && grep -q 'DocumentCenterV5' /opt/aplussolution/frontend/src/App.tsx && grep -q 'def _schema_parts' /opt/aplussolution/backend/core/document_center.py && grep -q 'def _schema_needs_repair' /opt/aplussolution/backend/core/document_catalog_service.py"; then
              break
            fi
            if [ "$attempt" = 40 ]; then
              echo 'Merged Phase 5 schema compatibility fix did not reach production host in time.' >&2
              exit 1
            fi
            sleep 10
          done
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose build backend celery celery-beat frontend >/dev/null
          docker compose up -d --force-recreate backend celery celery-beat frontend caddy >/dev/null
          docker compose exec -T backend python manage.py migrate --noinput </dev/null
          docker compose exec -T backend python manage.py check </dev/null
          docker compose exec -T backend python manage.py shell -c "import core.document_center, core.contract_views, core.document_center_views; print('PHASE5_RUNTIME_IMPORT_OK')" </dev/null

          cat >/root/phase5-smoke.py <<'PY'
          from datetime import timedelta
          from django.db import transaction
          from django.utils import timezone
          from rest_framework.test import APIClient
          import core.document_center as document_center_module
          from core.document_center import dispatch_contract_reminders
          from core.models import Contract, ContractTemplate, Notification, User, WorkerProfile

          host='solution.smarbiz.sbs'
          generated_files=[]
          with transaction.atomic():
              manager=User.objects.create(email='verify.phase5.manager@example.invalid', username='verify.phase5.manager@example.invalid', role=User.Role.MANAGER, first_name='VerifyManager', is_active=True, is_onboarded=True)
              manager.set_unusable_password(); manager.save(update_fields=['password'])
              worker_user=User.objects.create(email='verify.phase5.worker@example.invalid', username='verify.phase5.worker@example.invalid', role=User.Role.WORKER, first_name='VerifyPhaseFive', last_name='Worker', is_active=True, is_onboarded=True)
              worker_user.set_unusable_password(); worker_user.save(update_fields=['password'])
              worker=WorkerProfile.objects.create(user=worker_user, employee_number='VERIFY-PHASE5-WORKER')

              admin=APIClient(); admin.force_authenticate(manager)
              employee=APIClient(); employee.force_authenticate(worker_user)

              center=admin.get('/api/document-center/', HTTP_HOST=host)
              assert center.status_code == 200, getattr(center,'data',center.content)
              assert center.data['summary']['templates_total'] >= 8
              assert employee.get('/api/document-center/', HTTP_HOST=host).status_code == 403

              template=ContractTemplate.objects.create(
                  name='VERIFY Phase5 HTML', slug='verify-phase5-html', kind=ContractTemplate.Kind.EMPLOYMENT,
                  audience=ContractTemplate.Audience.WORKER, source_format=ContractTemplate.SourceFormat.HTML,
                  html_template='<h1>{{ employee_name }}</h1><p>VERIFY PHASE5</p>',
                  schema={'fields': [], 'signature_roles': ['employee','employer']},
                  requires_signature=True, required_document=True,
              )
              contract=Contract.objects.create(template=template, worker=worker, title='VERIFY Phase5 Lifecycle', created_by=manager)

              readiness=employee.get(f'/api/contracts/{contract.id}/readiness/', HTTP_HOST=host)
              assert readiness.status_code == 200 and readiness.data['generation_allowed'] is True

              generated=admin.post(f'/api/contracts/{contract.id}/generate_pdf/', {}, format='json', HTTP_HOST=host)
              assert generated.status_code == 200, getattr(generated,'data',generated.content)
              contract.refresh_from_db(); assert contract.status == Contract.Status.READY and bool(contract.pdf)
              if contract.pdf: generated_files.append(contract.pdf.name)
              if contract.docx: generated_files.append(contract.docx.name)

              changed=admin.patch(f'/api/contracts/{contract.id}/', {'title':'VERIFY Phase5 Lifecycle geändert'}, format='json', HTTP_HOST=host)
              assert changed.status_code == 200, getattr(changed,'data',changed.content)
              contract.refresh_from_db(); assert contract.status == Contract.Status.DRAFT and not contract.pdf and contract.data_snapshot == {}

              sent=admin.post(f'/api/contracts/{contract.id}/send/', {}, format='json', HTTP_HOST=host)
              assert sent.status_code == 200, getattr(sent,'data',sent.content)
              contract.refresh_from_db(); assert contract.status == Contract.Status.SENT and bool(contract.pdf)
              if contract.pdf: generated_files.append(contract.pdf.name)
              if contract.docx: generated_files.append(contract.docx.name)
              assert admin.patch(f'/api/contracts/{contract.id}/', {'title':'BLOCKED'}, format='json', HTTP_HOST=host).status_code == 400
              assert admin.post(f'/api/contracts/{contract.id}/generate_pdf/', {}, format='json', HTTP_HOST=host).status_code == 400
              assert admin.delete(f'/api/contracts/{contract.id}/', HTTP_HOST=host).status_code == 400

              signed_employee=employee.post(f'/api/contracts/{contract.id}/sign/', {'name':'Verify Worker','signature':'VERIFY-WORKER'}, format='json', HTTP_HOST=host)
              assert signed_employee.status_code == 200, getattr(signed_employee,'data',signed_employee.content)
              signed_admin=admin.post(f'/api/contracts/{contract.id}/sign/', {'name':'A+ Solution GmbH','signature':'VERIFY-ADMIN'}, format='json', HTTP_HOST=host)
              assert signed_admin.status_code == 200, getattr(signed_admin,'data',signed_admin.content)
              contract.refresh_from_db(); assert contract.status == Contract.Status.SIGNED
              if contract.pdf: generated_files.append(contract.pdf.name)
              if contract.docx: generated_files.append(contract.docx.name)
              assert admin.post(f'/api/contracts/{contract.id}/sign/', {'name':'Overwrite','signature':'NO'}, format='json', HTTP_HOST=host).status_code == 400
              assert admin.post(f'/api/contracts/{contract.id}/cancel/', {'reason':'Soll blockiert werden'}, format='json', HTTP_HOST=host).status_code == 400

              reminder_template=ContractTemplate.objects.create(
                  name='VERIFY Reminder HTML', slug='verify-phase5-reminder', kind=ContractTemplate.Kind.EMPLOYMENT,
                  audience=ContractTemplate.Audience.WORKER, source_format=ContractTemplate.SourceFormat.HTML,
                  html_template='<p>Reminder</p>', schema={'fields': [], 'signature_roles': ['employee','employer']},
              )
              reminder_contract=Contract.objects.create(
                  template=reminder_template, worker=worker, title='VERIFY Signature Reminder', status=Contract.Status.SENT,
                  sent_at=timezone.now()-timedelta(days=3), created_by=manager,
              )
              document_center_module.send_mail=lambda *args, **kwargs: 1
              first=dispatch_contract_reminders(today=timezone.localdate())
              assert first['notifications'] >= 2
              reminder_kind=f'contract-signature-3d-{reminder_contract.id}'
              assert Notification.objects.filter(kind=reminder_kind, user=worker_user).exists()
              assert Notification.objects.filter(kind=reminder_kind, user=manager).exists()
              second=dispatch_contract_reminders(today=timezone.localdate())
              assert second['notifications'] == 0 and second['emails'] == 0

              manual=admin.post('/api/document-center/reminders/run/', {}, format='json', HTTP_HOST=host)
              assert manual.status_code == 200
              assert set(manual.data.keys()) == {'events','notifications','emails'}

              contract.refresh_from_db()
              storage = contract.pdf.storage if contract.pdf else None
              for name in set(filter(None, generated_files)):
                  try:
                      if storage and storage.exists(name): storage.delete(name)
                  except Exception:
                      pass
              transaction.set_rollback(True)
          print('PHASE5_TRANSACTIONAL_SMOKE_OK')
          PY
          docker compose exec -T backend python manage.py shell < /root/phase5-smoke.py
          rm -f /root/phase5-smoke.py
          docker compose exec -T frontend sh -c "grep -R -q 'Vor Erzeugen, Versand und Signatur wissen' /usr/share/nginx/html/assets" </dev/null
          curl -kfsS --resolve solution.smarbiz.sbs:443:127.0.0.1 https://solution.smarbiz.sbs/health/ >/dev/null
          REMOTE
      - name: Verify public HTTPS
        run: curl -fsS --retry 10 --retry-delay 10 --retry-all-errors https://solution.smarbiz.sbs/health/ >/dev/null
