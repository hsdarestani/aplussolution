name: Phase 5 one-shot patch

on:
  push:
    branches:
      - feature/phase5-calendar-navigation

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase5-calendar-navigation
          fetch-depth: 0
      - name: Apply targeted source changes
        run: python scripts/phase5_patch.py
      - name: Validate frontend
        working-directory: frontend
        run: |
          npm ci
          npm test
          npm run build
      - name: Commit clean Phase 5 implementation
        run: |
          rm scripts/phase5_patch.py
          rm .github/workflows/phase5-codegen.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Implement Phase 5 calendar cards and entity navigation'
          git push origin HEAD:feature/phase5-calendar-navigation
