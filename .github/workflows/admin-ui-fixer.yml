name: One-time admin UI fixer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  fix:
    if: github.event.issue.pull_request && github.event.issue.number == 5 && github.event.comment.body == '/fix-admin-ui'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hsdarestani/aplussolution
          ref: feature/admin-data-entry
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Replace unsupported Ionic color input
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          text = path.read_text()
          old = '''        <IonInput
          fill="outline"
          type="color"
          label="Farbe"
          labelPlacement="floating"
          value={positionForm.color}
          onIonInput={(event) => setPositionForm({ ...positionForm, color: value(event) })}
        />'''
          new = '''        <label style={{ display: 'flex', minHeight: 56, alignItems: 'center', justifyContent: 'space-between', gap: 16, padding: '9px 14px', border: '1px solid var(--line)', borderRadius: 12, color: 'var(--muted)', background: '#fff' }}>
          <span>Farbe</span>
          <input
            type="color"
            value={positionForm.color || '#155eef'}
            onChange={(event) => setPositionForm({ ...positionForm, color: event.target.value })}
          />
        </label>'''
          if old not in text:
              raise SystemExit('Expected color input was not found')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Validate frontend
        working-directory: frontend
        run: npm install --no-audit --no-fund && npm run build
      - name: Commit validated fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx
          git commit -m "Fix frontend color input type"
          git push origin HEAD:feature/admin-data-entry
