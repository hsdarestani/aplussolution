name: Configure production integrations

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Validate and deploy production']
    types: [completed]

permissions:
  contents: read

jobs:
  configure:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Ensure SSH tooling
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          if command -v sshpass >/dev/null 2>&1; then
            echo 'sshpass already available'
            exit 0
          fi
          if ! sudo -n timeout 60s apt-get install -y -qq sshpass; then
            sudo -n timeout 90s apt-get update -qq \
              -o Acquire::Retries=2 \
              -o Acquire::http::Timeout=15 \
              -o Acquire::https::Timeout=15
            sudo -n timeout 60s apt-get install -y -qq sshpass
          fi
          command -v sshpass >/dev/null

      - name: Validate production secret set
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
          APP_EMAIL_PASS: ${{ secrets.APPEMAILPASS }}
          WIW_OPENAI_KEY: ${{ secrets.WIW_OPENAI_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          APPLE_SIGNIN_KEY_ID: ${{ secrets.APPLE_SIGNIN_KEY_ID }}
          APPLE_SIGNIN_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_SIGNIN_PRIVATE_KEY_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: '7ZH6Y6V744'
          APNS_PRIVATE_KEY_BASE64: ${{ secrets.APNS_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$PASS"
          test -n "$APP_EMAIL_PASS"
          test -n "$WIW_OPENAI_KEY"
          if { [ -n "$GOOGLE_OAUTH_CLIENT_ID" ] && [ -z "$GOOGLE_OAUTH_CLIENT_SECRET" ]; } || \
             { [ -z "$GOOGLE_OAUTH_CLIENT_ID" ] && [ -n "$GOOGLE_OAUTH_CLIENT_SECRET" ]; }; then
            echo 'Google OAuth secrets must be configured as a pair.' >&2
            exit 2
          fi
          if { [ -n "$APPLE_SIGNIN_KEY_ID" ] && [ -z "$APPLE_SIGNIN_PRIVATE_KEY_BASE64" ]; } || \
             { [ -z "$APPLE_SIGNIN_KEY_ID" ] && [ -n "$APPLE_SIGNIN_PRIVATE_KEY_BASE64" ]; }; then
            echo 'Apple Sign in secrets must be configured as a pair.' >&2
            exit 2
          fi
          firebase_parts=0
          [ -n "$FIREBASE_PROJECT_ID" ] && firebase_parts=$((firebase_parts+1))
          [ -n "$FIREBASE_CREDENTIALS_JSON_BASE64" ] && firebase_parts=$((firebase_parts+1))
          if [ "$firebase_parts" -ne 0 ] && [ "$firebase_parts" -ne 2 ]; then
            echo 'Firebase push secrets must include project ID and service-account JSON.' >&2
            exit 2
          fi
          apns_parts=0
          [ -n "$APNS_TEAM_ID" ] && apns_parts=$((apns_parts+1))
          [ -n "$APNS_KEY_ID" ] && apns_parts=$((apns_parts+1))
          [ -n "$APNS_PRIVATE_KEY_BASE64" ] && apns_parts=$((apns_parts+1))
          if [ "$apns_parts" -ne 0 ] && [ "$apns_parts" -ne 3 ]; then
            echo 'APNs push secrets must include team ID, key ID and private key.' >&2
            exit 2
          fi
          echo "Native push secrets: firebase=$([ "$firebase_parts" -eq 2 ] && echo ready || echo missing) apns=$([ "$apns_parts" -eq 3 ] && echo ready || echo missing)"

      - name: Sync integrations into production .env
        timeout-minutes: 15
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
          APP_EMAIL_PASS: ${{ secrets.APPEMAILPASS }}
          WIW_OPENAI_KEY: ${{ secrets.WIW_OPENAI_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          APPLE_SIGNIN_KEY_ID: ${{ secrets.APPLE_SIGNIN_KEY_ID }}
          APPLE_SIGNIN_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_SIGNIN_PRIVATE_KEY_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: '7ZH6Y6V744'
          APNS_PRIVATE_KEY_BASE64: ${{ secrets.APNS_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          EMAIL_PASS_B64="$(printf '%s' "$APP_EMAIL_PASS" | base64 -w0)"
          OPENAI_KEY_B64="$(printf '%s' "$WIW_OPENAI_KEY" | base64 -w0)"
          GOOGLE_ID_B64="$(printf '%s' "$GOOGLE_OAUTH_CLIENT_ID" | base64 -w0)"
          GOOGLE_SECRET_B64="$(printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | base64 -w0)"
          APPLE_KEY_ID_B64="$(printf '%s' "$APPLE_SIGNIN_KEY_ID" | base64 -w0)"
          FIREBASE_PROJECT_ID_B64="$(printf '%s' "$FIREBASE_PROJECT_ID" | base64 -w0)"
          APNS_TEAM_ID_B64="$(printf '%s' "$APNS_TEAM_ID" | base64 -w0)"
          APNS_KEY_ID_B64="$(printf '%s' "$APNS_KEY_ID" | base64 -w0)"

          timeout 720s sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            root@"$HOST" \
            "EMAIL_PASS_B64='$EMAIL_PASS_B64' OPENAI_KEY_B64='$OPENAI_KEY_B64' GOOGLE_ID_B64='$GOOGLE_ID_B64' GOOGLE_SECRET_B64='$GOOGLE_SECRET_B64' APPLE_KEY_ID_B64='$APPLE_KEY_ID_B64' APPLE_PRIVATE_KEY_B64='$APPLE_SIGNIN_PRIVATE_KEY_BASE64' FIREBASE_PROJECT_ID_B64='$FIREBASE_PROJECT_ID_B64' FIREBASE_CREDS_B64='$FIREBASE_CREDENTIALS_JSON_BASE64' APNS_TEAM_ID_B64='$APNS_TEAM_ID_B64' APNS_KEY_ID_B64='$APNS_KEY_ID_B64' APNS_PRIVATE_KEY_B64='$APNS_PRIVATE_KEY_BASE64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          test -f .env

          export APP_EMAIL_PASS="$(printf '%s' "$EMAIL_PASS_B64" | base64 -d)"
          export OPENAI_SECRET="$(printf '%s' "$OPENAI_KEY_B64" | base64 -d)"
          export GOOGLE_OAUTH_ID_SECRET="$(printf '%s' "$GOOGLE_ID_B64" | base64 -d)"
          export GOOGLE_OAUTH_CLIENT_SECRET_VALUE="$(printf '%s' "$GOOGLE_SECRET_B64" | base64 -d)"
          export APPLE_SIGNIN_KEY_ID_VALUE="$(printf '%s' "$APPLE_KEY_ID_B64" | base64 -d)"
          export APPLE_PRIVATE_KEY_SECRET="$(printf '%s' "${APPLE_PRIVATE_KEY_B64:-}" | base64 -d 2>/dev/null || true)"
          export FIREBASE_PROJECT_ID_VALUE="$(printf '%s' "$FIREBASE_PROJECT_ID_B64" | base64 -d)"
          export FIREBASE_CREDENTIALS_VALUE="$(printf '%s' "${FIREBASE_CREDS_B64:-}" | base64 -d 2>/dev/null || true)"
          export APNS_TEAM_ID_VALUE="$(printf '%s' "$APNS_TEAM_ID_B64" | base64 -d)"
          export APNS_KEY_ID_VALUE="$(printf '%s' "$APNS_KEY_ID_B64" | base64 -d)"
          export APNS_PRIVATE_KEY_VALUE="$(printf '%s' "${APNS_PRIVATE_KEY_B64:-}" | base64 -d 2>/dev/null || true)"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.env')
          lines = path.read_text(encoding='utf-8').splitlines()
          updates = {
              'EMAIL_HOST': 'smtp.strato.de',
              'EMAIL_PORT': '587',
              'EMAIL_HOST_USER': 'app@aplus-solution.de',
              'EMAIL_HOST_PASSWORD': os.environ['APP_EMAIL_PASS'],
              'EMAIL_USE_TLS': '1',
              'DEFAULT_FROM_EMAIL': 'A+ Solution <app@aplus-solution.de>',
              'OPENAI_API_KEY': os.environ['OPENAI_SECRET'],
              'WIW_OPENAI_KEY': os.environ['OPENAI_SECRET'],
              'COMPANY_NAME': 'A+ Solution GmbH',
              'COMPANY_ADDRESS': 'Carl-Sonnenschein Straße 57, D-65936 Frankfurt am Main',
              'GOOGLE_OAUTH_REDIRECT_URI': 'https://solution.smarbiz.sbs/api/auth/oauth/google/callback/',
              'APPLE_SERVICE_ID': 'de.aplussolution.workforce.web',
              'APPLE_TEAM_ID': '884MVA2MD5',
              'APPLE_OAUTH_REDIRECT_URI': 'https://solution.smarbiz.sbs/api/auth/oauth/apple/callback/',
              'APNS_BUNDLE_ID': 'de.aplussolution.workforce',
              'APNS_USE_SANDBOX': '0',
          }

          google_id = os.environ.get('GOOGLE_OAUTH_ID_SECRET', '').strip()
          google_secret = os.environ.get('GOOGLE_OAUTH_CLIENT_SECRET_VALUE', '').strip()
          if google_id and google_secret:
              updates['GOOGLE_OAUTH_CLIENT_ID'] = google_id
              updates['GOOGLE_OAUTH_CLIENT_SECRET'] = google_secret

          apple_key_id = os.environ.get('APPLE_SIGNIN_KEY_ID_VALUE', '').strip()
          apple_private_key = os.environ.get('APPLE_PRIVATE_KEY_SECRET', '')
          if apple_key_id and apple_private_key:
              updates['APPLE_KEY_ID'] = apple_key_id
              updates['APPLE_PRIVATE_KEY'] = apple_private_key.replace('\r\n', '\n').replace('\n', '\\n')
              updates['APPLE_PRIVATE_KEY_PATH'] = ''

          firebase_project = os.environ.get('FIREBASE_PROJECT_ID_VALUE', '').strip()
          firebase_credentials = os.environ.get('FIREBASE_CREDENTIALS_VALUE', '').strip()
          if firebase_project and firebase_credentials:
              updates['FIREBASE_PROJECT_ID'] = firebase_project
              updates['FIREBASE_CREDENTIALS_JSON'] = firebase_credentials.replace('\r\n', '\n').replace('\n', '\\n')

          apns_team = os.environ.get('APNS_TEAM_ID_VALUE', '').strip()
          apns_key = os.environ.get('APNS_KEY_ID_VALUE', '').strip()
          apns_private = os.environ.get('APNS_PRIVATE_KEY_VALUE', '').strip()
          if apns_team and apns_key and apns_private:
              updates['APNS_TEAM_ID'] = apns_team
              updates['APNS_KEY_ID'] = apns_key
              updates['APNS_PRIVATE_KEY'] = apns_private.replace('\r\n', '\n').replace('\n', '\\n')

          remaining = dict(updates)
          output = []
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0].strip()
                  if key in remaining:
                      output.append(f'{key}={remaining.pop(key)}')
                      continue
              output.append(line)
          if remaining:
              if output and output[-1] != '':
                  output.append('')
              output.append('# Managed production integrations')
              output.extend(f'{key}={value}' for key, value in remaining.items())
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

          docker compose up -d --build --remove-orphans

          backend_ready=0
          for i in $(seq 1 60); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              backend_ready=1
              break
            fi
            sleep 5
          done
          test "$backend_ready" -eq 1

          docker compose exec -T backend python manage.py shell -c "from django.conf import settings; assert settings.OPENAI_API_KEY; assert settings.EMAIL_HOST == 'smtp.strato.de'; assert settings.EMAIL_HOST_USER == 'app@aplus-solution.de'; assert settings.COMPANY_ADDRESS; assert settings.GOOGLE_OAUTH_REDIRECT_URI.endswith('/google/callback/'); assert settings.APPLE_TEAM_ID == '884MVA2MD5'; assert settings.APPLE_SERVICE_ID == 'de.aplussolution.workforce.web'; assert settings.APPLE_OAUTH_REDIRECT_URI.endswith('/apple/callback/'); print('Production integration settings loaded')"
          docker compose exec -T backend python manage.py shell -c "from django.conf import settings; from core.oauth import apple_client_secret; assert settings.APPLE_KEY_ID; assert settings.APPLE_PRIVATE_KEY; token=apple_client_secret(); assert isinstance(token, str) and token.count('.') == 2; print('Apple Sign in client secret generation OK')"
          docker compose exec -T backend python manage.py shell -c "from core.push_notifications import push_provider_status; print('Native push providers', push_provider_status())"
          docker compose exec -T backend python manage.py shell -c "from django.core.mail import get_connection; c=get_connection(); opened=c.open(); assert opened is not False; c.close(); print('STRATO SMTP authentication OK')"
          curl -fsS --max-time 20 https://solution.smarbiz.sbs/health/ >/dev/null
          REMOTE
