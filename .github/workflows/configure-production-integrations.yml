name: Configure production integrations

on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Validate and deploy A+ Solution']
    types: [completed]

permissions:
  contents: read

jobs:
  configure:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PRODUCTION_DOMAIN: app.aplus-solution.de
    steps:
      - name: Validate complete production secret set
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
          APP_EMAIL_PASS: ${{ secrets.APPEMAILPASS }}
          WIW_OPENAI_KEY: ${{ secrets.WIW_OPENAI_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          APPLE_SIGNIN_KEY_ID: ${{ secrets.APPLE_SIGNIN_KEY_ID }}
          APPLE_SIGNIN_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_SIGNIN_PRIVATE_KEY_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY_BASE64: ${{ secrets.APNS_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          require_secret() {
            local name="$1" value="$2"
            if [ -z "$value" ]; then
              echo "Missing required production secret: $name" >&2
              missing=1
            else
              echo "$name=ready"
            fi
          }
          require_secret STRATO_HOST "$STRATO_HOST"
          require_secret STRATO_SSH_PRIVATE_KEY "$STRATO_SSH_PRIVATE_KEY"
          require_secret APPEMAILPASS "$APP_EMAIL_PASS"
          require_secret WIW_OPENAI_KEY "$WIW_OPENAI_KEY"
          require_secret GOOGLE_OAUTH_CLIENT_ID "$GOOGLE_OAUTH_CLIENT_ID"
          require_secret GOOGLE_OAUTH_CLIENT_SECRET "$GOOGLE_OAUTH_CLIENT_SECRET"
          require_secret APPLE_SIGNIN_KEY_ID "$APPLE_SIGNIN_KEY_ID"
          require_secret APPLE_SIGNIN_PRIVATE_KEY_BASE64 "$APPLE_SIGNIN_PRIVATE_KEY_BASE64"
          require_secret FIREBASE_PROJECT_ID "$FIREBASE_PROJECT_ID"
          require_secret FIREBASE_CREDENTIALS_JSON_BASE64 "$FIREBASE_CREDENTIALS_JSON_BASE64"
          require_secret APNS_TEAM_ID "$APNS_TEAM_ID"
          # The APNs key ID is not secret; retain the previously provisioned production key as a safe fallback.
          if [ -z "$APNS_KEY_ID" ]; then APNS_KEY_ID='7ZH6Y6V744'; fi
          require_secret APNS_KEY_ID "$APNS_KEY_ID"
          require_secret APNS_PRIVATE_KEY_BASE64 "$APNS_PRIVATE_KEY_BASE64"
          test "$missing" -eq 0

      - name: Configure Strato SSH authentication
        env:
          STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Sync integrations into Strato production and verify providers
        timeout-minutes: 15
        env:
          STRATO_HOST: ${{ secrets.STRATO_HOST }}
          APP_EMAIL_PASS: ${{ secrets.APPEMAILPASS }}
          WIW_OPENAI_KEY: ${{ secrets.WIW_OPENAI_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          APPLE_SIGNIN_KEY_ID: ${{ secrets.APPLE_SIGNIN_KEY_ID }}
          APPLE_SIGNIN_PRIVATE_KEY_BASE64: ${{ secrets.APPLE_SIGNIN_PRIVATE_KEY_BASE64 }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID_SECRET: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY_BASE64: ${{ secrets.APNS_PRIVATE_KEY_BASE64 }}
        shell: bash
        run: |
          set -euo pipefail
          APNS_KEY_ID="${APNS_KEY_ID_SECRET:-7ZH6Y6V744}"
          EMAIL_PASS_B64="$(printf '%s' "$APP_EMAIL_PASS" | base64 -w0)"
          OPENAI_KEY_B64="$(printf '%s' "$WIW_OPENAI_KEY" | base64 -w0)"
          GOOGLE_ID_B64="$(printf '%s' "$GOOGLE_OAUTH_CLIENT_ID" | base64 -w0)"
          GOOGLE_SECRET_B64="$(printf '%s' "$GOOGLE_OAUTH_CLIENT_SECRET" | base64 -w0)"
          APPLE_KEY_ID_B64="$(printf '%s' "$APPLE_SIGNIN_KEY_ID" | base64 -w0)"
          FIREBASE_PROJECT_ID_B64="$(printf '%s' "$FIREBASE_PROJECT_ID" | base64 -w0)"
          APNS_TEAM_ID_B64="$(printf '%s' "$APNS_TEAM_ID" | base64 -w0)"
          APNS_KEY_ID_B64="$(printf '%s' "$APNS_KEY_ID" | base64 -w0)"

          timeout 720s ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=3 \
            root@"$STRATO_HOST" \
            "EMAIL_PASS_B64='$EMAIL_PASS_B64' OPENAI_KEY_B64='$OPENAI_KEY_B64' GOOGLE_ID_B64='$GOOGLE_ID_B64' GOOGLE_SECRET_B64='$GOOGLE_SECRET_B64' APPLE_KEY_ID_B64='$APPLE_KEY_ID_B64' APPLE_PRIVATE_KEY_B64='$APPLE_SIGNIN_PRIVATE_KEY_BASE64' FIREBASE_PROJECT_ID_B64='$FIREBASE_PROJECT_ID_B64' FIREBASE_CREDS_B64='$FIREBASE_CREDENTIALS_JSON_BASE64' APNS_TEAM_ID_B64='$APNS_TEAM_ID_B64' APNS_KEY_ID_B64='$APNS_KEY_ID_B64' APNS_PRIVATE_KEY_B64='$APNS_PRIVATE_KEY_BASE64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          test -f .env

          export APP_EMAIL_PASS="$(printf '%s' "$EMAIL_PASS_B64" | base64 -d)"
          export OPENAI_SECRET="$(printf '%s' "$OPENAI_KEY_B64" | base64 -d)"
          export GOOGLE_OAUTH_ID_SECRET="$(printf '%s' "$GOOGLE_ID_B64" | base64 -d)"
          export GOOGLE_OAUTH_CLIENT_SECRET_VALUE="$(printf '%s' "$GOOGLE_SECRET_B64" | base64 -d)"
          export APPLE_SIGNIN_KEY_ID_VALUE="$(printf '%s' "$APPLE_KEY_ID_B64" | base64 -d)"
          export APPLE_PRIVATE_KEY_SECRET="$(printf '%s' "${APPLE_PRIVATE_KEY_B64:-}" | base64 -d)"
          export FIREBASE_PROJECT_ID_VALUE="$(printf '%s' "$FIREBASE_PROJECT_ID_B64" | base64 -d)"
          export APNS_TEAM_ID_VALUE="$(printf '%s' "$APNS_TEAM_ID_B64" | base64 -d)"
          export APNS_KEY_ID_VALUE="$(printf '%s' "$APNS_KEY_ID_B64" | base64 -d)"
          export APNS_PRIVATE_KEY_VALUE="$(printf '%s' "${APNS_PRIVATE_KEY_B64:-}" | base64 -d)"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.env')
          lines = path.read_text(encoding='utf-8').splitlines()
          updates = {
              'EMAIL_HOST': 'smtp.strato.de',
              'EMAIL_PORT': '587',
              'EMAIL_HOST_USER': 'app@aplus-solution.de',
              'EMAIL_HOST_PASSWORD': os.environ['APP_EMAIL_PASS'],
              'EMAIL_USE_TLS': '1',
              'DEFAULT_FROM_EMAIL': 'A+ Solution <app@aplus-solution.de>',
              'OPENAI_API_KEY': os.environ['OPENAI_SECRET'],
              'WIW_OPENAI_KEY': os.environ['OPENAI_SECRET'],
              'COMPANY_NAME': 'A+ Solution GmbH',
              'COMPANY_ADDRESS': 'Carl-Sonnenschein Straße 57, D-65936 Frankfurt am Main',
              'GOOGLE_OAUTH_CLIENT_ID': os.environ['GOOGLE_OAUTH_ID_SECRET'].strip(),
              'GOOGLE_OAUTH_CLIENT_SECRET': os.environ['GOOGLE_OAUTH_CLIENT_SECRET_VALUE'].strip(),
              'GOOGLE_OAUTH_REDIRECT_URI': 'https://app.aplus-solution.de/api/auth/oauth/google/callback/',
              'APPLE_SERVICE_ID': 'de.aplussolution.workforce.web',
              'APPLE_TEAM_ID': '884MVA2MD5',
              'APPLE_KEY_ID': os.environ['APPLE_SIGNIN_KEY_ID_VALUE'].strip(),
              'APPLE_PRIVATE_KEY': os.environ['APPLE_PRIVATE_KEY_SECRET'].replace('\r\n', '\n').replace('\n', '\\n'),
              'APPLE_PRIVATE_KEY_PATH': '',
              'APPLE_OAUTH_REDIRECT_URI': 'https://app.aplus-solution.de/api/auth/oauth/apple/callback/',
              'FIREBASE_PROJECT_ID': os.environ['FIREBASE_PROJECT_ID_VALUE'].strip(),
              'FIREBASE_CREDENTIALS_JSON': os.environ['FIREBASE_CREDS_B64'].strip(),
              'APNS_TEAM_ID': os.environ['APNS_TEAM_ID_VALUE'].strip(),
              'APNS_KEY_ID': os.environ['APNS_KEY_ID_VALUE'].strip(),
              'APNS_PRIVATE_KEY': os.environ['APNS_PRIVATE_KEY_VALUE'].replace('\r\n', '\n').replace('\n', '\\n'),
              'APNS_BUNDLE_ID': 'de.aplussolution.workforce',
              'APNS_USE_SANDBOX': '0',
          }
          assert all(updates[k] for k in (
              'EMAIL_HOST_PASSWORD','GOOGLE_OAUTH_CLIENT_ID','GOOGLE_OAUTH_CLIENT_SECRET',
              'APPLE_KEY_ID','APPLE_PRIVATE_KEY','FIREBASE_PROJECT_ID','FIREBASE_CREDENTIALS_JSON',
              'APNS_TEAM_ID','APNS_KEY_ID','APNS_PRIVATE_KEY'))

          remaining = dict(updates)
          output = []
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0].strip()
                  if key in remaining:
                      output.append(f'{key}={remaining.pop(key)}')
                      continue
              output.append(line)
          if remaining:
              if output and output[-1] != '':
                  output.append('')
              output.append('# Managed production integrations')
              output.extend(f'{key}={value}' for key, value in remaining.items())
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY

          docker compose up -d --build --remove-orphans

          backend_ready=0
          for i in $(seq 1 60); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              backend_ready=1
              break
            fi
            sleep 3
          done
          test "$backend_ready" -eq 1

          for service in backend frontend caddy celery celery-beat db redis; do
            cid=$(docker compose ps -q "$service")
            test -n "$cid"
            test "$(docker inspect -f '{{.State.Running}}' "$cid")" = 'true'
          done

          docker compose exec -T backend python manage.py shell -c "from django.conf import settings; assert settings.OPENAI_API_KEY; assert settings.EMAIL_HOST == 'smtp.strato.de'; assert settings.EMAIL_HOST_USER == 'app@aplus-solution.de'; assert settings.GOOGLE_OAUTH_CLIENT_ID and settings.GOOGLE_OAUTH_CLIENT_SECRET; assert settings.GOOGLE_OAUTH_REDIRECT_URI == 'https://app.aplus-solution.de/api/auth/oauth/google/callback/'; assert settings.APPLE_TEAM_ID == '884MVA2MD5'; assert settings.APPLE_SERVICE_ID == 'de.aplussolution.workforce.web'; assert settings.APPLE_OAUTH_REDIRECT_URI == 'https://app.aplus-solution.de/api/auth/oauth/apple/callback/'; print('Production integrations loaded on Strato')"
          docker compose exec -T backend python manage.py shell -c "from django.conf import settings; from core.oauth import apple_client_secret; assert settings.APPLE_KEY_ID and settings.APPLE_PRIVATE_KEY; token=apple_client_secret(); assert isinstance(token, str) and token.count('.') == 2; print('Apple Sign in signing OK')"
          docker compose exec -T backend python manage.py shell -c "from core.push_notifications import push_provider_status; status=push_provider_status(); assert status.get('android') and status.get('ios'), status; print('Native push providers ready', status)"
          docker compose exec -T backend python manage.py shell -c "from django.core.mail import get_connection; c=get_connection(); opened=c.open(); assert opened is not False; c.close(); print('STRATO SMTP authentication OK')"
          curl -fsS --max-time 20 https://app.aplus-solution.de/health/ >/dev/null
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
