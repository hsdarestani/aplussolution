name: Verify production integrations on temporary primary

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PRIMARY_HOST: ${{ secrets.BACKUP_HOST }}
      PRIMARY_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Verify integrations without mutating production
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             root@"$PRIMARY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell -c "from django.conf import settings; assert settings.OPENAI_API_KEY; assert settings.EMAIL_HOST; assert settings.GOOGLE_OAUTH_CLIENT_ID and settings.GOOGLE_OAUTH_CLIENT_SECRET; assert settings.APPLE_TEAM_ID and settings.APPLE_KEY_ID and settings.APPLE_PRIVATE_KEY; print('PRIMARY_INTEGRATIONS_CONFIGURED')"
          docker compose exec -T backend python manage.py shell -c "from core.push_notifications import push_provider_status; s=push_provider_status(); assert s.get('android') and s.get('ios'), s; print('PRIMARY_NATIVE_PUSH_READY')"
          REMOTE
