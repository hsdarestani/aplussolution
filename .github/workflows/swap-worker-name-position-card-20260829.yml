name: Swap worker name and position in mobile schedule cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swap-worker-name-position-card-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put worker name above job title
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/WiwScheduleMobile.tsx')
          text = path.read_text()
          replacements = [
              (
                  "<b>{card.shift.position_name || 'Schicht'}</b>",
                  "<b>{card.worker?.name || (card.shift.status === 'draft' ? 'Entwurf' : 'OpenShift')}</b>",
              ),
              (
                  "<span className={card.isOpen ? 'open' : ''}>{card.worker?.name || (card.shift.status === 'draft' ? 'Entwurf' : 'OpenShift')}</span>",
                  "<span className={card.isOpen ? 'open' : ''}>{card.shift.position_name || 'Schicht'}</span>",
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected exactly one match, got {count}: {old}')
              text = text.replace(old, new, 1)
          path.write_text(text)
          PY

          rm .github/workflows/swap-worker-name-position-card-20260829.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/WiwScheduleMobile.tsx .github/workflows/swap-worker-name-position-card-20260829.yml
          git commit -m 'Show worker name before position in mobile schedule'
          git push
