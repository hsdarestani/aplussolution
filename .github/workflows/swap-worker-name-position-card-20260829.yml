name: Swap worker name and position in mobile schedule cards

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/swap-worker-name-position-card-20260829.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Put worker name above job title
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('frontend/src/WiwScheduleMobile.tsx')
          text = path.read_text()
          old = '''              <div className="wiw-card-line primary"><b>{card.shift.position_name || 'Schicht'}</b><span>{formatTimeIso(card.shift.starts_at)}–{formatTimeIso(card.shift.ends_at)}</span></div>
              <div className="wiw-card-line secondary"><span className={card.isOpen ? 'open' : ''}>{card.worker?.name || (card.shift.status === 'draft' ? 'Entwurf' : 'OpenShift')}</span><small>{card.shift.client_name || ''}{card.shift.location_name ? ` · ${card.shift.location_name}` : ''}</small></div>'''
          new = '''              <div className="wiw-card-line primary"><b>{card.worker?.name || (card.shift.status === 'draft' ? 'Entwurf' : 'OpenShift')}</b><span>{formatTimeIso(card.shift.starts_at)}–{formatTimeIso(card.shift.ends_at)}</span></div>
              <div className="wiw-card-line secondary"><span className={card.isOpen ? 'open' : ''}>{card.shift.position_name || 'Schicht'}</span><small>{card.shift.client_name || ''}{card.shift.location_name ? ` · ${card.shift.location_name}` : ''}</small></div>'''
          if old not in text:
              raise SystemExit('Expected schedule card markup was not found; refusing an unsafe edit.')
          path.write_text(text.replace(old, new, 1))
          PY

          rm .github/workflows/swap-worker-name-position-card-20260829.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/WiwScheduleMobile.tsx .github/workflows/swap-worker-name-position-card-20260829.yml
          git commit -m 'Show worker name before position in mobile schedule'
          git push
