name: Direct final WIW account archive

on:
  push:
    branches:
      - wiw-final-export-20260920
    paths:
      - '.github/workflows/wiw-final-export-direct.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiw-final-export-direct
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH and archive folders
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh" archive/{live,database,local,media,historical,meta,source}
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          printf '%s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > archive/meta/export-stamp-utc.txt
          git rev-parse HEAD > archive/meta/export-workflow-commit.txt
          git rev-parse origin/main > archive/meta/main-commit.txt || true

      - name: Export complete live WIW API snapshot
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python -' <<'PY' > archive/live/core-snapshot.json
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from core.wiw import WhenIWorkClient
          from core.wiw_migration import fetch_complete_wiw_snapshot
          client = WhenIWorkClient()
          snapshot, errors = fetch_complete_wiw_snapshot(client)
          result = {
              "resources": snapshot,
              "counts": {k: len(v) for k, v in snapshot.items()},
              "errors": errors,
          }
          print(json.dumps(result, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          if errors:
              raise SystemExit("WIW core snapshot incomplete: " + json.dumps(errors, ensure_ascii=False))
          PY
          test -s archive/live/core-snapshot.json
          gzip -9 archive/live/core-snapshot.json

      - name: Export additional read-only WIW resource probes
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python -' <<'PY' > archive/live/additional-readonly-probes.json
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from core.wiw import WhenIWorkClient
          c = WhenIWorkClient()
          candidates = {
              "schedules": [("/schedules", {"limit": 1000})],
              "shift_templates": [
                  ("/shift_templates", {"limit": 1000}),
                  ("/shifttemplates", {"limit": 1000}),
                  ("/templates", {"limit": 1000}),
              ],
              "absences": [
                  ("/absences", {"start": "2000-01-01T00:00:00Z", "end": "2100-01-01T00:00:00Z", "limit": 1000}),
                  ("/absences", {"limit": 1000}),
              ],
              "pay_periods": [
                  ("/pay_periods", {"limit": 1000}),
                  ("/payperiods", {"limit": 1000}),
              ],
              "payroll": [("/payroll", {"limit": 1000})],
              "account": [("/account", {})],
              "settings": [("/settings", {})],
              "tasks": [("/tasks", {"limit": 1000})],
              "task_lists": [
                  ("/task_lists", {"limit": 1000}),
                  ("/tasklists", {"limit": 1000}),
              ],
          }
          out = {}
          for name, variants in candidates.items():
              attempts = []
              success = None
              for path, params in variants:
                  try:
                      payload = c.get(path, params=params)
                      success = {"path": path, "params": params, "payload": payload}
                      attempts.append({"path": path, "params": params, "ok": True})
                      break
                  except Exception as exc:
                      attempts.append({"path": path, "params": params, "ok": False, "error": str(exc)})
              out[name] = {"success": success, "attempts": attempts}
          print(json.dumps(out, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          PY
          test -s archive/live/additional-readonly-probes.json
          gzip -9 archive/live/additional-readonly-probes.json

      - name: Export WIW reconciliation report
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python -' <<'PY' > archive/meta/wiw-reconciliation.json
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from core.wiw_migration import build_wiw_migration_report
          report = build_wiw_migration_report(apply_full_sync=False)
          print(json.dumps(report, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          PY
          test -s archive/meta/wiw-reconciliation.json

      - name: Stream full PostgreSQL production database
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" \
            'cd /opt/aplussolution && docker compose exec -T db sh -lc '"'"'PGPASSWORD="$POSTGRES_PASSWORD" exec pg_dump -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Fc'"'"'' \
            > archive/database/full-production.dump
          test -s archive/database/full-production.dump
          file archive/database/full-production.dump

      - name: Stream PostgreSQL schema
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" \
            'cd /opt/aplussolution && docker compose exec -T db sh -lc '"'"'PGPASSWORD="$POSTGRES_PASSWORD" exec pg_dump -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" --schema-only'"'"'' \
            | gzip -9 > archive/database/schema.sql.gz
          test -s archive/database/schema.sql.gz
          gzip -t archive/database/schema.sql.gz

      - name: Stream complete human-readable core dataset
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" \
            'cd /opt/aplussolution && docker compose exec -T backend python manage.py dumpdata core --indent 2' \
            | gzip -9 > archive/local/core-dumpdata.json.gz
          test -s archive/local/core-dumpdata.json.gz
          gzip -t archive/local/core-dumpdata.json.gz

      - name: Export all core model counts and sanitized WIW config
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python -' <<'PY' > archive/meta/model-counts.json
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.apps import apps
          from core.models import User, WorkerProfile, Location, Position, Shift, TimeEntry
          counts = {}
          for model in apps.get_app_config("core").get_models():
              try:
                  counts[model.__name__] = model.objects.count()
              except Exception as exc:
                  counts[model.__name__] = {"error": str(exc)}
          focused = {
              "users_with_wiw_id": User.objects.exclude(wiw_id__isnull=True).exclude(wiw_id="").count(),
              "workers_with_wiw_id": WorkerProfile.objects.exclude(wiw_user_id__isnull=True).exclude(wiw_user_id="").count(),
              "locations_with_wiw_location_id": Location.objects.exclude(wiw_location_id__isnull=True).exclude(wiw_location_id="").count(),
              "locations_with_wiw_site_id": Location.objects.exclude(wiw_site_id__isnull=True).exclude(wiw_site_id="").count(),
              "positions_with_wiw_id": Position.objects.exclude(wiw_position_id__isnull=True).exclude(wiw_position_id="").count(),
              "shifts_with_wiw_id": Shift.objects.exclude(wiw_shift_id__isnull=True).exclude(wiw_shift_id="").count(),
              "times_with_wiw_id": TimeEntry.objects.exclude(wiw_time_id__isnull=True).exclude(wiw_time_id="").count(),
          }
          print(json.dumps({"all_core_models": counts, "wiw_linked": focused}, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          PY

          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python -' <<'PY' > archive/meta/wiw-config-sanitized.json
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          data = {
              "API_BASE": "https://api.wheniwork.com/2",
              "WIW_USER_ID": getattr(settings, "WIW_USER_ID", ""),
              "WIW_SYNC_ENABLED": getattr(settings, "WIW_SYNC_ENABLED", False),
              "WIW_READ_ONLY": getattr(settings, "WIW_READ_ONLY", True),
              "WIW_HTTP_TIMEOUT": getattr(settings, "WIW_HTTP_TIMEOUT", None),
              "WIW_TOKEN_CACHE_SECONDS": getattr(settings, "WIW_TOKEN_CACHE_SECONDS", None),
              "credentials_present": {
                  "WIW_DEV_KEY": bool(getattr(settings, "WIW_DEV_KEY", "")),
                  "WIW_EMAIL": bool(getattr(settings, "WIW_EMAIL", "")),
                  "WIW_PASSWORD": bool(getattr(settings, "WIW_PASSWORD", "")),
                  "WIW_WEBHOOK_SECRET": bool(getattr(settings, "WIW_WEBHOOK_SECRET", "")),
              },
          }
          print(json.dumps(data, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          PY

      - name: Stream entire production media volume
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" \
            'cd /opt/aplussolution && docker compose exec -T backend sh -c '"'"'tar -C /app/media -czf - .'"'"'' \
            > archive/media/media.tar.gz
          test -s archive/media/media.tar.gz
          tar -tzf archive/media/media.tar.gz >/dev/null

      - name: Stream historical server-side WIW backups and reports
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" \
            'if [ -d /root/aplussolution-backups ]; then tar -C /root/aplussolution-backups -czf - --ignore-failed-read --wildcards "*wiw*" "pre-wiw-*" "post-wiw-*" 2>/dev/null || tar -czf - --files-from /dev/null; else tar -czf - --files-from /dev/null; fi' \
            > archive/historical/server-wiw-backups.tar.gz
          test -s archive/historical/server-wiw-backups.tar.gz
          tar -tzf archive/historical/server-wiw-backups.tar.gz >/dev/null

      - name: Save WIW-related source code snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import tarfile, re
          root=Path(".")
          out=Path("archive/source/wiw-related-source.tar.gz")
          rx=re.compile(r"(wiw|when.?i.?work|working_time|attendance|shift|schedule|timeentry|worker|employee|payroll|contract|document)", re.I)
          files=[]
          for p in root.rglob("*"):
              if not p.is_file() or ".git" in p.parts or "archive" in p.parts:
                  continue
              rel=p.as_posix()
              if rx.search(rel):
                  files.append(p)
          with tarfile.open(out, "w:gz") as t:
              for p in sorted(files):
                  t.add(p, arcname=p.as_posix())
          Path("archive/meta/source-file-count.txt").write_text(str(len(files))+"\n")
          PY
          test -s archive/source/wiw-related-source.tar.gz

      - name: Create README, inventories and checksums
        shell: bash
        run: |
          set -euo pipefail
          cat > archive/README.txt <<'TXT'
          FINAL WHEN I WORK (WIW) ACCOUNT ARCHIVE

          This is a private, restore-grade archive made before deleting/cancelling
          the external When I Work account.

          live/core-snapshot.json.gz
            Direct complete WIW API snapshot for users, positions, locations,
            sites, shifts, times, availabilities and requests. Dynamic resources
            are fetched across 2000-01-01..2100-01-01 with recursive window
            splitting and 1000-row safety checks.

          live/additional-readonly-probes.json.gz
            Additional read-only WIW API probes for schedules, shift templates,
            absences, pay periods/payroll, account/settings and task resources.
            Unsupported endpoints and errors are preserved explicitly.

          database/full-production.dump
            Full restore-grade PostgreSQL custom-format production backup.

          database/schema.sql.gz
            Full PostgreSQL schema backup.

          local/core-dumpdata.json.gz
            Human-readable Django JSON for every core model, including legacy
            WIW migration data and raw WIW payloads stored in A+.

          media/media.tar.gz
            Entire production media volume: contracts, documents, payroll files,
            avatars, order attachments and time-clock photos.

          historical/server-wiw-backups.tar.gz
            Earlier server-side WIW migration backups/reports if present.

          source/wiw-related-source.tar.gz
            Snapshot of WIW/workforce/time/schedule-related source files from the
            repository at the commit recorded in meta/.

          meta/
            Reconciliation report, model counts, sanitized WIW integration config,
            source commits, inventories and SHA-256 checksums.

          Secret credential values (API keys/passwords/webhook secrets) are not
          copied into this archive. Restore-grade database content, including
          password hashes and personal/business records, is included.
          TXT

          find archive -type f -printf '%P\t%s bytes\n' | sort > archive/meta/file-inventory.txt
          (
            cd archive
            find . -type f ! -path './meta/checksums.sha256' -print0 | sort -z | xargs -0 sha256sum
          ) > archive/meta/checksums.sha256

      - name: Verify every archived file and summarize
        shell: bash
        run: |
          set -euo pipefail
          (
            cd archive
            sha256sum -c meta/checksums.sha256
          )

          echo "=== CORE WIW COUNTS ==="
          gzip -dc archive/live/core-snapshot.json.gz | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({"counts":d.get("counts",{}),"errors":d.get("errors",{})},ensure_ascii=False,sort_keys=True))'

          echo "=== RECONCILIATION ==="
          python3 - <<'PY'
          import json
          d=json.load(open("archive/meta/wiw-reconciliation.json",encoding="utf-8"))
          out={"cutover_ready":d.get("cutover_ready"),"resources":{}}
          for k,v in d.get("resources",{}).items():
              out["resources"][k]={
                  "remote_count":v.get("remote_count"),
                  "local_count":v.get("local_count"),
                  "missing_count":len(v.get("missing",[])),
                  "extra_count":len(v.get("extra",[])),
                  "complete":v.get("complete"),
              }
          print(json.dumps(out,ensure_ascii=False,sort_keys=True))
          PY

          echo "=== ADDITIONAL PROBES ==="
          gzip -dc archive/live/additional-readonly-probes.json.gz | python3 -c 'import json,sys; d=json.load(sys.stdin); print(json.dumps({k:{"supported":bool(v.get("success")),"path":(v.get("success") or {}).get("path"),"attempt_errors":[a.get("error") for a in v.get("attempts",[]) if not a.get("ok")]} for k,v in d.items()},ensure_ascii=False,sort_keys=True))'

          echo "=== MODEL COUNTS ==="
          cat archive/meta/model-counts.json
          echo "=== INVENTORY ==="
          cat archive/meta/file-inventory.txt

      - name: Package final archive
        shell: bash
        run: |
          set -euo pipefail
          tar -czf wiw-final-account-archive.tar.gz -C archive .
          tar -tzf wiw-final-account-archive.tar.gz >/dev/null
          sha256sum wiw-final-account-archive.tar.gz > wiw-final-account-archive.sha256
          echo "Final archive: $(du -h wiw-final-account-archive.tar.gz | cut -f1)"

      - name: Upload final WIW artifact
        uses: actions/upload-artifact@v4
        with:
          name: wiw-final-account-archive-20260920
          path: |
            wiw-final-account-archive.tar.gz
            wiw-final-account-archive.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
