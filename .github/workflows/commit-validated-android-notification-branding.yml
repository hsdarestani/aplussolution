name: Commit validated Android notification branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/commit-validated-android-notification-branding.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply already validated Android branding source
        run: python3 scripts/apply_android_notification_branding.py
      - name: Commit and push validated source
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/core/push_notifications.py \
            frontend/src/NativePushRegistration.tsx \
            frontend/scripts/prepare-native.mjs
          git add -f \
            frontend/native-assets/android/solution_signature.wav \
            frontend/native-assets/android/ic_stat_aplus.xml
          if git diff --cached --quiet; then
            echo 'Branding source already applied.'
            exit 0
          fi
          git commit -m 'Brand Android push with A+ icon and Signature Motif'
          git reset --hard HEAD
          git push origin HEAD:main
