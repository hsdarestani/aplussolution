name: Fix Ionic color input

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'feature/admin-data-entry'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - name: Replace unsupported Ionic color field
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          text = path.read_text()
          old = '''        <IonInput
                    fill="outline"
                    type="color"
                    label="Farbe"
                    labelPlacement="floating"
                    value={positionForm.color}
                    onIonInput={(event) => setPositionForm({ ...positionForm, color: value(event) })}
                  />'''
          # The source is normally indented by eight spaces; use a whitespace-stable fallback.
          old = '''        <IonInput
                    fill="outline"
                    type="color"
                    label="Farbe"
                    labelPlacement="floating"
                    value={positionForm.color}
                    onIonInput={(event) => setPositionForm({ ...positionForm, color: value(event) })}
                  />'''.replace('                  ', '          ')
          if old not in text:
              old = '''        <IonInput
          fill="outline"
          type="color"
          label="Farbe"
          labelPlacement="floating"
          value={positionForm.color}
          onIonInput={(event) => setPositionForm({ ...positionForm, color: value(event) })}
        />'''
          new = '''        <label className="color-field">
          <span>Farbe</span>
          <input
            type="color"
            value={positionForm.color || '#155eef'}
            onChange={(event) => setPositionForm({ ...positionForm, color: event.target.value })}
          />
        </label>'''
          if old not in text:
              raise SystemExit('Target color field not found')
          path.write_text(text.replace(old, new, 1))

          css = Path('frontend/src/theme.css')
          css_text = css.read_text()
          marker = '.form-divider {'
          style = '''.color-field {
            display: flex;
            min-height: 56px;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            padding: 9px 14px;
            border: 1px solid var(--line);
            border-radius: 12px;
            color: var(--muted);
            background: #fff;
          }

          .color-field input {
            width: 70px;
            height: 38px;
            border: 0;
            background: transparent;
            cursor: pointer;
          }

          '''
          if '.color-field {' not in css_text:
              css.write_text(css_text.replace(marker, style + marker, 1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/theme.css
          git diff --cached --quiet && exit 0
          git commit -m "Fix frontend color input type"
          git push origin HEAD:${{ github.head_ref }}
