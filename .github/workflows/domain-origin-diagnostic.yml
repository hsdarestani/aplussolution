name: Diagnose production domain origins
# rerun after legacy bridge repair

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/domain-origin-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public domain origins
        shell: bash
        run: |
          set -euo pipefail
          for domain in app.aplus-solution.de solution.smarbiz.sbs; do
            echo "=== $domain ==="
            rm -f /tmp/h /tmp/b
            curl -fsS -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
              -D /tmp/h -o /tmp/b --max-time 20 \
              "https://$domain/health/?origin_diag=${GITHUB_RUN_ID}"
            grep -Ei '^(HTTP/|x-aplus-origin:|x-aplus-legacy-bridge:|server:|cf-ray:)' /tmp/h || true
            cat /tmp/b
            echo
          done

      - name: Compare non-cacheable API origin
        shell: bash
        run: |
          set -euo pipefail
          for domain in app.aplus-solution.de solution.smarbiz.sbs; do
            echo "=== POST $domain ==="
            rm -f /tmp/ph /tmp/pb
            curl -sS -X POST \
              -H 'Content-Type: application/json' \
              -H 'Cache-Control: no-store' \
              -D /tmp/ph -o /tmp/pb --max-time 20 \
              --data '{"email":"origin-diagnostic-invalid@example.invalid","password":"not-a-real-password"}' \
              "https://$domain/api/auth/login/?origin_post=${GITHUB_RUN_ID}"
            grep -Ei '^(HTTP/|x-aplus-origin:|x-aplus-legacy-bridge:|server:|cf-cache-status:|age:|cf-ray:)' /tmp/ph || true
          done

# rerun after Caddy recreate

# final verification after profile deploy
