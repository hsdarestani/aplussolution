name: Diagnose Lexware annual import failures
# Verify historical archive after chunked Lohnkonto upload
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lexware-import-health-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIMARY_HOST: ${{ secrets.STRATO_HOST }}
      PRIMARY_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect STRATO errors and Lexware archival status without personal data
        run: |
          set -euo pipefail
          test -n "$PRIMARY_HOST"
          test -n "$PRIMARY_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIMARY_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$PRIMARY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell -c '
          from core.models import Document, PayrollStatement
          from django.db.models import Q
          from core.payroll_views import _lexware_document_kind
          items = Document.objects.filter(folder="payroll", title__startswith="Lexware 2025")
          print("LEXWARE_ARCHIVES_2025: total=%s large_annual=%s uv_annual=%s tax_annual=%s monthly=%s" % (
            items.count(),
            items.filter(title__icontains="Lohnkonto(1)").count() + items.filter(title__icontains="Lohnkonto_2025").count(),
            items.filter(title__icontains="Lohnkonto-UV").count(),
            items.filter(title__icontains="Lohnsteuerbescheinigungen").count(),
            items.filter(title__contains="2025-12").count()
          ), flush=True)
          print("LEXWARE_IMPORTED_PAYROLL_2025_12=%s" % PayrollStatement.objects.filter(period__year=2025,period__month=12).count(),flush=True)
          print("LEXWARE_ARCHIVE_CATEGORIES:", sorted(set((_lexware_document_kind(d.title), d.title[:15]) for d in items)),flush=True)
          print("LEXWARE_ARCHIVE_SIZES_MB:", sorted(round(d.file.size / 1048576, 2) for d in items if "lohnkonto" in d.title.lower())[:20],flush=True)
          '
          printf 'DISK_AVAILABLE: '; df -h /opt/aplussolution | tail -n 1 | awk '{print $4}'
          printf 'CONTAINER_MEM: '; docker stats --no-stream --format '{{.Name}}={{.MemUsage}}' | grep 'aplussolution-backend' | head -n 1 || true
          docker compose logs --since 12h --no-color backend 2>&1 | python3 -c '
          import sys,re,collections
          data=sys.stdin.read()
          keys=re.findall(r"\\b(?:[A-Za-z_][A-Za-z_0-9.]*(?:Error|Exception|Timeout)|SIGKILL|WORKER TIMEOUT|Out of memory|OOMKilled|No space left|Permission denied)\\b",data,re.I)
          print("BACKEND_EXCEPTION_TYPES:",dict(collections.Counter(keys).most_common(25)),flush=True)
          print("BACKEND_GUNICORN_TIMEOUTS:",len(re.findall(r"WORKER TIMEOUT|worker was sent SIGKILL",data,re.I)),flush=True)
          '
          REMOTE
