name: Read-only 2025 Lexware July to November audit
# Final check after backed-up historical month completion
on:
  push:
    branches: [main]
    paths: ['.github/workflows/lexware-history-jul-nov-audit-2025.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PRIMARY_HOST: ${{ secrets.STRATO_HOST }}
      PRIMARY_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Inspect archived 2025 monthly files, imported payroll and identity matches
        run: |
          set -euo pipefail
          test -n "$PRIMARY_HOST"
          test -n "$PRIMARY_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIMARY_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$PRIMARY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          echo "READ_ONLY_LEXWARE_2025_AUDIT"
          docker compose exec -T backend python manage.py shell -c '
          import collections
          from core.models import Document, PayrollStatement, WorkingTimeAccountRecord, WorkerProfile
          from core.payroll_views import _lexware_document_kind
          for month in range(1, 13):
              period = "2025-%02d" % month
              docs = list(Document.objects.filter(folder="payroll", title__startswith="Lexware "+period+" ·"))
              categories = sorted(collections.Counter(_lexware_document_kind(d.title) for d in docs).items())
              payroll = PayrollStatement.objects.filter(period__year=2025,period__month=month)
              historic = payroll.filter(worker__employment_type="historisch").count()
              accounts = WorkingTimeAccountRecord.objects.filter(year_month__year=2025,year_month__month=month).count()
              print("LEXWARE_MONTH period=%s files=%s categories=%s payroll_months=%s historical_months=%s time_accounts=%s" % (period,len(docs),categories,payroll.count(),historic,accounts), flush=True)
          ' < /dev/null
          for MONTH in 07 08 09 10 11; do
            echo "DRY_RUN_MONTH=$MONTH"
            docker compose exec -T backend python manage.py reconcile_lexware_archive --year 2025 --month "$MONTH" < /dev/null
          done
          echo "=== Verify all historical archived staff have a per-month payroll record ==="
          docker compose exec -T backend python manage.py shell -c '
          from datetime import date
          from core.lexware_historical import _evidence
          from core.payroll_views import _employee_matchers,_find_worker
          from core.models import PayrollStatement,WorkerProfile
          roster=_employee_matchers()
          for month in range(7,13):
              source, errors=_evidence(2025,month)
              absent=set()
              historical_rows=0
              missing_rows=0
              for title,row in source:
                  person=_find_worker({"employee_name":row.get("employee_name") or ""},roster)
                  if not person or person.employment_type!="historisch": continue
                  historical_rows+=1
                  target=str(row.get("period") or "") if row.get("kind")=="payslip" else "2025-%02d"%month
                  try: year_text,month_text=target.split("-"); period=date(int(year_text),int(month_text),1)
                  except (ValueError,TypeError): continue
                  if not PayrollStatement.objects.filter(worker=person,period=period).exists():
                      absent.add((str(person.pk),target))
                      missing_rows+=1
              print("HISTORICAL_COVERAGE month=%02d historical_evidence_rows=%s missing_statement_months=%s missing_evidence_rows=%s parse_errors=%s" % (month,historical_rows,len(absent),missing_rows,errors),flush=True)
          ' < /dev/null
          REMOTE
