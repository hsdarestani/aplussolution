name: Install and verify production templates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    if: github.head_ref == 'ops/activate-wiw-install-templates'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Upload private template builder
        run: sshpass -e scp -q -o StrictHostKeyChecking=no .ops-template-payload/build_private_templates.py root@"$HOST":/root/build_private_templates.py
      - name: Build, import and verify all eight templates
        run: |
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE' 2>&1 | tee template-install-result.txt
          set -euo pipefail
          cd /opt/aplussolution
          python3 - <<'PY'
          from pathlib import Path
          values = {
              'COMPANY_NAME': 'A+ Solution GmbH',
              'COMPANY_ADDRESS': 'Carl-Sonnenschein-Str. 57, 65936 Frankfurt am Main',
              'AUEG_LICENSE_AUTHORITY': 'Bundesagentur für Arbeit, Agentur für Arbeit Düsseldorf',
              'AUEG_LICENSE_DATE': '19.04.2026',
          }
          path = Path('.env')
          lines = path.read_text(encoding='utf-8').splitlines()
          output, seen = [], set()
          for line in lines:
              if line and not line.lstrip().startswith('#') and '=' in line:
                  key = line.split('=', 1)[0]
                  if key in values:
                      output.append(f'{key}={values[key]}')
                      seen.add(key)
                      continue
              output.append(line)
          for key, value in values.items():
              if key not in seen:
                  output.append(f'{key}={value}')
          path.write_text('\n'.join(output).rstrip() + '\n', encoding='utf-8')
          path.chmod(0o600)
          PY
          docker compose up -d --force-recreate backend celery celery-beat
          for attempt in $(seq 1 30); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then break; fi
            sleep 3
          done
          BACKEND_ID=$(docker compose ps -q backend)
          test -n "$BACKEND_ID"
          docker cp /root/build_private_templates.py "$BACKEND_ID":/tmp/build_private_templates.py
          docker compose exec -T backend env TEMPLATE_BUNDLE_OUTPUT=/tmp/aplus-document-templates.zip python /tmp/build_private_templates.py
          docker compose exec -T backend python manage.py import_document_bundle /tmp/aplus-document-templates.zip
          docker compose exec -T backend python manage.py shell <<'PY'
          from pathlib import Path
          from core.document_engine import seed_document_catalog
          from core.models import ContractTemplate, IntegrationSyncRun, WorkerProfile, ClientCompany, Shift, TimeEntry
          seed_document_catalog()
          required = list(ContractTemplate.objects.filter(required_document=True).order_by('slug'))
          installed = [item for item in required if item.source_file and Path(item.source_file.path).exists() and item.source_checksum]
          print('TEMPLATE_REQUIRED', len(required))
          print('TEMPLATE_INSTALLED', len(installed))
          for item in installed:
              print('TEMPLATE_OK', item.slug, item.version, item.source_format, item.source_checksum[:12])
          assert len(required) == 8
          assert len(installed) == 8
          last = IntegrationSyncRun.objects.filter(provider='wiw').order_by('-created_at').first()
          assert last is not None
          print('WIW_SYNC_STATUS', last.status)
          print('WIW_SYNC_COUNTS', last.counts)
          print('WIW_SYNC_ERRORS', len(last.errors or []))
          print('WIW_WORKERS', WorkerProfile.objects.exclude(wiw_user_id__isnull=True).exclude(wiw_user_id='').count())
          print('WIW_CLIENTS', ClientCompany.objects.exclude(wiw_location_id__isnull=True).exclude(wiw_location_id='').count())
          print('WIW_SHIFTS', Shift.objects.exclude(wiw_shift_id__isnull=True).exclude(wiw_shift_id='').count())
          print('WIW_TIMES', TimeEntry.objects.exclude(wiw_time_id__isnull=True).exclude(wiw_time_id='').count())
          print('DEMO_WORKERS', WorkerProfile.objects.filter(employee_number__startswith='DEMO-').count())
          print('DEMO_CLIENTS', ClientCompany.objects.filter(customer_number='KD-DEMO').count())
          PY
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null
          curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null
          HTTP_CODE=$(curl -sS -o /tmp/login-smoke.json -w '%{http_code}' -X POST https://solution.smarbiz.sbs/api/auth/login/ -H 'Content-Type: application/json' --data '{"email":"invalid@example.com","password":"invalid"}')
          test "$HTTP_CODE" != '502'
          test "$HTTP_CODE" != '503'
          echo "PUBLIC_LOGIN_ENDPOINT_HTTP=$HTTP_CODE"
          rm -f /root/build_private_templates.py
          docker compose exec -T backend rm -f /tmp/build_private_templates.py /tmp/aplus-document-templates.zip
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-template-install-result
          path: template-install-result.txt
          retention-days: 1
