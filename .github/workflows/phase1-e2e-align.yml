name: Align phase 1 E2E expectations

on:
  push:
    branches: [feature/phase1-workforce-cleanup]
    paths:
      - scripts/align_phase1_e2e.py
      - .github/workflows/phase1-e2e-align.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-workforce-cleanup
          fetch-depth: 0
      - name: Align E2E expectations
        run: python scripts/align_phase1_e2e.py
      - name: Remove temporary files
        run: |
          rm scripts/align_phase1_e2e.py
          rm .github/workflows/phase1-e2e-align.yml
      - name: Commit aligned tests
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Align E2E coverage with phase 1 navigation'
          git push origin HEAD:feature/phase1-workforce-cleanup
