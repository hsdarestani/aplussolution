name: Production routing diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-primary-routing-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
    steps:
      - name: Identify current public target without exposing addresses
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, socket
          domain='app.aplus-solution.de'
          resolved={x[4][0] for x in socket.getaddrinfo(domain,443,type=socket.SOCK_STREAM)}
          def host_ips(name):
              try:
                  return {x[4][0] for x in socket.getaddrinfo(name,443,type=socket.SOCK_STREAM)}
              except Exception:
                  return {name}
          strato=host_ips(os.environ['STRATO_HOST'])
          backup=host_ips(os.environ['BACKUP_HOST'])
          print('PUBLIC_MATCH_STRATO='+str(bool(resolved & strato)).lower())
          print('PUBLIC_MATCH_BACKUP='+str(bool(resolved & backup)).lower())
          print('PUBLIC_ADDRESS_COUNT='+str(len(resolved)))
          PY
