name: Diagnose customer location color mappings

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diag-customer-location-colors.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Inspect live client location mappings
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from core.models import ClientCompany, Location, Shift

          print('=== ACTIVE CLIENTS ===')
          for client in ClientCompany.objects.filter(active=True).order_by('name'):
              print('CLIENT', client.id, '|', client.name)

          print('=== ACTIVE LOCATIONS ===')
          for loc in Location.objects.filter(active=True).select_related('client').order_by('client__name','name'):
              print('LOCATION', loc.id, '| CLIENT=', loc.client.name, '| NAME=', loc.name)

          print('=== SHIFT/LOCATION CLIENT MISMATCHES ===')
          mismatches = Shift.objects.exclude(client_id=models.F('location__client_id')).select_related('client','location__client')
          print('MISMATCH_COUNT', mismatches.count())
          for shift in mismatches.order_by('-starts_at')[:50]:
              print('MISMATCH', shift.id, '| SHIFT_CLIENT=', shift.client.name, '| LOCATION_CLIENT=', shift.location.client.name, '| LOCATION=', shift.location.name)

          print('=== MARTHA LOCATIONS ===')
          for loc in Location.objects.filter(active=True).select_related('client').filter(client__name__icontains='martha').order_by('name'):
              print('MARTHA_LOCATION', loc.id, '|', loc.name)
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
