name: Diagnose hidden production shift

on:
  push:
    branches: [diagnose/hidden-shift-20260823]
    paths:
      - '.github/workflows/diagnose-hidden-shift.yml'

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install sshpass
        run: |
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq sshpass
          fi
      - name: Verify production schedule API
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 180s env SSHPASS="$PASS" sshpass -e ssh \
            -o StrictHostKeyChecking=no -o ConnectTimeout=20 \
            root@"$HOST" 'bash -s' <<'REMOTE' | tee /tmp/hidden-shift.txt
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from datetime import datetime, timezone as dt_timezone
          from zoneinfo import ZoneInfo
          from django.conf import settings
          from rest_framework.test import APIClient
          from core.models import Shift, User

          berlin = ZoneInfo('Europe/Berlin')
          start = datetime(2026, 8, 23, tzinfo=berlin).astimezone(dt_timezone.utc)
          end = datetime(2026, 8, 24, tzinfo=berlin).astimezone(dt_timezone.utc)
          target_ids = {str(x) for x in Shift.objects.filter(starts_at__gte=start, starts_at__lt=end).values_list('id', flat=True)}

          admin = User.objects.filter(role__in=[User.Role.ADMIN, User.Role.MANAGER], is_active=True).first()
          client = APIClient()
          client.force_authenticate(admin)
          response = client.get('/api/shifts/?ordering=starts_at', HTTP_HOST='solution.smarbiz.sbs')
          payload = response.data
          rows = payload.get('results', payload) if isinstance(payload, dict) else payload
          response_ids = {str(row.get('id')) for row in rows}

          print('pagination_class=', settings.REST_FRAMEWORK.get('DEFAULT_PAGINATION_CLASS'))
          print('api_status=', response.status_code)
          print('api_reported_count=', payload.get('count') if isinstance(payload, dict) else len(rows))
          print('api_rows_received=', len(rows))
          print('production_total_shifts=', Shift.objects.count())
          print('target_day_count=', len(target_ids))
          print('target_day_rows_present_in_api=', len(target_ids & response_ids))
          print('all_target_day_rows_visible=', target_ids.issubset(response_ids))
          PY
          REMOTE
      - name: Publish result
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/hidden-shift.txt','utf8').trim();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 126,
              body: [
                'Post-deploy production verification for the schedule/reminder mismatch.',
                '',
                '```text', output, '```',
                '',
                'No employee names, emails, credentials or tokens are included.',
                `Run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n')
            });
