name: Verify final HA state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/verify-final-ha-state.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Verify STRATO primary and replication sender
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          recovery="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select pg_is_in_recovery()"' | tr -d '[:space:]')"
          slot_active="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select coalesce((select active::text from pg_replication_slots where slot_name='''aplus_backup_slot'''),'''false''')"' | tr -d '[:space:]')"
          streamers="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select count(*) from pg_stat_replication where application_name='''backup_standby'''"' | tr -d '[:space:]')"

          test "$recovery" = "f"
          test "$slot_active" = "true"
          test "$streamers" -ge 1
          test -n "$(docker compose ps -q celery --status running)"
          test -n "$(docker compose ps -q celery-beat --status running)"
          systemctl is-active --quiet aplus-media-push.timer
          systemctl is-active --quiet aplus-repl-reverse-tunnel.service
          systemctl is-active --quiet aplus-postgres-repl-source.service

          echo STRATO_PRIMARY_OK
          echo STRATO_STREAMING_TO_BACKUP_OK
          echo STRATO_ONLY_WORKERS_OK
          echo STRATO_MEDIA_TIMER_OK
          REMOTE

      - name: Verify BACKUP standby and no writers
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          recovery="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select pg_is_in_recovery()"' | tr -d '[:space:]')"
          receiving="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select (pg_last_wal_receive_lsn() is not null)::text"' | tr -d '[:space:]')"
          replaying="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -Atc "select (pg_last_wal_replay_lsn() is not null)::text"' | tr -d '[:space:]')"

          test "$recovery" = "t"
          test "$receiving" = "true"
          test "$replaying" = "true"
          test -z "$(docker compose ps -q backend --status running)"
          test -z "$(docker compose ps -q celery --status running)"
          test -z "$(docker compose ps -q celery-beat --status running)"
          systemctl is-active --quiet aplus-repl-docker-bridge.service

          echo BACKUP_STANDBY_OK
          echo BACKUP_NO_APP_WRITERS_OK
          REMOTE

      - name: Verify public production
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 "https://app.aplus-solution.de/health/?ha_verify=$GITHUB_RUN_ID" | grep -q '"status"'
          echo PUBLIC_PRODUCTION_OK
