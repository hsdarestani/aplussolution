name: Finalize standby with reverse tunnel

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/finalize-standby-reverse-tunnel.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-ha-maintenance
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH clients
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Verify production primary stays on STRATO
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          test "$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"' | tr -d '[:space:]')" = "f"
          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null
          test -n "$(docker compose ps -q celery --status running)"
          test -n "$(docker compose ps -q celery-beat --status running)"
          echo STRATO_PRIMARY_UNCHANGED
          REMOTE

      - name: Create STRATO to backup tunnel key
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" '
              set -e
              mkdir -p /root/.ssh
              chmod 700 /root/.ssh
              if [ ! -s /root/.ssh/aplus_reverse_repl ]; then
                ssh-keygen -q -t ed25519 -N "" -f /root/.ssh/aplus_reverse_repl
              fi
              cat /root/.ssh/aplus_reverse_repl.pub
            ' > /tmp/strato-repl.pub
          test -s /tmp/strato-repl.pub

      - name: Authorize only reverse replication forwarding on backup
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/strato-repl.pub root@"$BACKUP_HOST":/tmp/strato-repl.pub

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          mkdir -p /root/.ssh
          chmod 700 /root/.ssh
          touch /root/.ssh/authorized_keys
          PUB="$(cat /tmp/strato-repl.pub)"
          grep -vF "$PUB" /root/.ssh/authorized_keys >/tmp/root.keys || true
          mv /tmp/root.keys /root/.ssh/authorized_keys
          printf 'command="/bin/false",no-agent-forwarding,no-X11-forwarding,no-pty,permitlisten="127.0.0.1:55431" %s\n' "$PUB" >> /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          rm -f /tmp/strato-repl.pub
          REMOTE

      - name: Prepare STRATO PostgreSQL replication source
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" "BACKUP_HOST='$BACKUP_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          cd /opt/aplussolution

          if ! command -v socat >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq socat
          fi
          if ! command -v autossh >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq autossh
          fi

          if [ ! -s /root/aplus-replication.secret ]; then
            umask 077
            openssl rand -hex 32 > /root/aplus-replication.secret
          fi
          REPL_PASS="$(cat /root/aplus-replication.secret)"

          docker compose exec -T db sh -lc             'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '"'"'replicator'"'"') THEN CREATE ROLE replicator WITH LOGIN REPLICATION; END IF; END \$\$;"'
          docker compose exec -T db sh -lc             "psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"ALTER ROLE replicator WITH LOGIN REPLICATION PASSWORD '$REPL_PASS';\""
          docker compose exec -T db sh -lc '
            grep -q "^host[[:space:]]\+replication[[:space:]]\+replicator[[:space:]]" "$PGDATA/pg_hba.conf" ||
              printf "\nhost replication replicator 0.0.0.0/0 scram-sha-256\n" >> "$PGDATA/pg_hba.conf"
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();" >/dev/null
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_create_physical_replication_slot('"'"'aplus_backup_slot'"'"') WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name='"'"'aplus_backup_slot'"'"');" >/dev/null
          '

          cat >/usr/local/sbin/aplus-postgres-repl-source <<'SCRIPT'
          #!/bin/sh
          set -eu
          cd /opt/aplussolution
          CID="$(docker compose ps -q db)"
          test -n "$CID"
          IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$CID")"
          test -n "$IP"
          exec /usr/bin/socat TCP-LISTEN:55432,bind=127.0.0.1,reuseaddr,fork TCP:"$IP":5432
          SCRIPT
          chmod 700 /usr/local/sbin/aplus-postgres-repl-source

          cat >/etc/systemd/system/aplus-postgres-repl-source.service <<'EOF'
          [Unit]
          Description=A+ Solution PostgreSQL replication source
          After=docker.service
          Requires=docker.service

          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/aplus-postgres-repl-source
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          EOF

          cat >/etc/systemd/system/aplus-repl-reverse-tunnel.service <<EOF
          [Unit]
          Description=A+ Solution reverse PostgreSQL tunnel to backup
          After=network-online.target aplus-postgres-repl-source.service
          Wants=network-online.target
          Requires=aplus-postgres-repl-source.service

          [Service]
          Type=simple
          Environment=AUTOSSH_GATETIME=0
          ExecStart=/usr/bin/autossh -M 0 -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o IdentitiesOnly=yes -i /root/.ssh/aplus_reverse_repl -R 127.0.0.1:55431:127.0.0.1:55432 root@$BACKUP_HOST
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now aplus-postgres-repl-source.service
          systemctl restart aplus-postgres-repl-source.service
          systemctl enable --now aplus-repl-reverse-tunnel.service
          systemctl restart aplus-repl-reverse-tunnel.service

          docker run --rm --network host postgres:16-alpine             pg_isready -h 127.0.0.1 -p 55432 -U replicator >/dev/null
          echo STRATO_REPLICATION_SOURCE_READY
          REMOTE

      - name: Publish reverse tunnel to backup Docker network
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          cd /opt/aplussolution

          if ! command -v socat >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq socat
          fi

          GW="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' aplussolution_default)"
          test -n "$GW"

          cat >/usr/local/sbin/aplus-repl-docker-bridge <<EOF
          #!/bin/sh
          exec /usr/bin/socat TCP-LISTEN:55432,bind=$GW,reuseaddr,fork TCP:127.0.0.1:55431
          EOF
          chmod 700 /usr/local/sbin/aplus-repl-docker-bridge

          cat >/etc/systemd/system/aplus-repl-docker-bridge.service <<'EOF'
          [Unit]
          Description=A+ Solution expose reverse replication tunnel to Docker
          After=network-online.target docker.service
          Requires=docker.service

          [Service]
          Type=simple
          ExecStart=/usr/local/sbin/aplus-repl-docker-bridge
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now aplus-repl-docker-bridge.service
          systemctl restart aplus-repl-docker-bridge.service

          ready=0
          for i in $(seq 1 40); do
            if timeout 2 bash -c "</dev/tcp/127.0.0.1/55431" >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          echo BACKUP_REVERSE_TUNNEL_READY
          REMOTE

      - name: Copy replication credential to backup
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST":/root/aplus-replication.secret /tmp/aplus-replication.secret
          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-replication.secret root@"$BACKUP_HOST":/root/aplus-replication.secret
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" 'chmod 600 /root/aplus-replication.secret'

      - name: Rebuild backup PostgreSQL as streaming standby
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ServerAliveInterval=15             -o ServerAliveCountMax=12             root@"$BACKUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          NET_NAME="aplussolution_default"
          GW="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$NET_NAME")"
          REPL_PASS="$(cat /root/aplus-replication.secret)"

          probe="$(
            docker run --rm --network "$NET_NAME"               -e PGPASSWORD="$REPL_PASS" -e PGCONNECT_TIMEOUT=5               postgres:16-alpine               psql -h "$GW" -p 55432 -U replicator -d postgres -tAc 'select 1' 2>/dev/null               | tr -d '[:space:]' || true
          )"
          test "$probe" = "1"

          # Standby must not run application writers.
          docker compose stop backend frontend caddy celery celery-beat >/dev/null 2>&1 || true

          DB_CID="$(docker compose ps -aq db || true)"
          DB_VOL=""
          if [ -n "$DB_CID" ]; then
            DB_VOL="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$DB_CID")"
          fi
          if [ -z "$DB_VOL" ]; then
            DB_VOL="$(docker volume ls --format '{{.Name}}' | grep -E '(^|_)postgres_data$' | head -n1 || true)"
          fi
          if [ -z "$DB_VOL" ]; then
            DB_VOL="aplussolution_postgres_data"
            docker volume create "$DB_VOL" >/dev/null
          fi

          docker compose stop db >/dev/null 2>&1 || true
          docker compose rm -sf db >/dev/null 2>&1 || true

          docker run --rm             --network "$NET_NAME"             -e PGPASSWORD="$REPL_PASS"             -e PGCONNECT_TIMEOUT=10             -e REPL_HOST="$GW"             -v "$DB_VOL":/var/lib/postgresql/data             postgres:16-alpine             sh -ceu '
              find /var/lib/postgresql/data -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              pg_basebackup -h "$REPL_HOST" -p 55432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R -S aplus_backup_slot
            '

          docker run --rm             -e REPL_HOST="$GW"             -e REPL_PASS="$REPL_PASS"             -v "$DB_VOL":/var/lib/postgresql/data             postgres:16-alpine             sh -ceu '
              printf "\nprimary_conninfo = '\''host=%s port=55432 user=replicator password=%s application_name=backup_standby connect_timeout=10 keepalives_idle=30 keepalives_interval=10 keepalives_count=3'\''\n" "$REPL_HOST" "$REPL_PASS" >> /var/lib/postgresql/data/postgresql.auto.conf
              printf "primary_slot_name = '\''aplus_backup_slot'\''\n" >> /var/lib/postgresql/data/postgresql.auto.conf
              touch /var/lib/postgresql/data/standby.signal
              chown -R postgres:postgres /var/lib/postgresql/data
            '

          docker compose up -d db

          recovery=0
          for i in $(seq 1 90); do
            state="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"' 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$state" = "t" ]; then
              recovery=1
              break
            fi
            sleep 2
          done
          test "$recovery" -eq 1
          test -n "$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select coalesce(pg_last_wal_receive_lsn()::text, '"'"''"'"')"' | tr -d '[:space:]')"
          test -n "$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select coalesce(pg_last_wal_replay_lsn()::text, '"'"''"'"')"' | tr -d '[:space:]')"
          echo BACKUP_STREAMING_STANDBY_READY
          REMOTE

      - name: Verify both sides
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" '
              set -e
              cd /opt/aplussolution
              test "$(docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select active from pg_replication_slots where slot_name='"'"'aplus_backup_slot'"'"'" | tr -d "[:space:]")" = "t"
              test "$(docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from pg_stat_replication where application_name='"'"'backup_standby'"'"'" | tr -d "[:space:]")" -ge 1
              test -n "$(docker compose ps -q celery --status running)"
              test -n "$(docker compose ps -q celery-beat --status running)"
              echo STRATO_PRIMARY_AND_STREAMING_OK
            '

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" '
              set -e
              cd /opt/aplussolution
              test "$(docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"'"'"' | tr -d "[:space:]")" = "t"
              test "$(docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_last_wal_receive_lsn() is not null"'"'"' | tr -d "[:space:]")" = "t"
              test -z "$(docker compose ps -q backend --status running)"
              test -z "$(docker compose ps -q celery --status running)"
              test -z "$(docker compose ps -q celery-beat --status running)"
              echo BACKUP_SAFE_STANDBY_OK
            '

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/strato-repl.pub /tmp/aplus-replication.secret
