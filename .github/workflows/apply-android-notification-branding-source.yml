name: Validate and apply Android notification branding source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-android-notification-branding-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-build-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Android-only notification branding
        run: python3 scripts/apply_android_notification_branding.py

      - name: Validate backend and patch script
        run: |
          python3 -m py_compile backend/core/push_notifications.py scripts/apply_android_notification_branding.py
          node --check frontend/scripts/prepare-native.mjs
          grep -q "'sound': 'default'" backend/core/push_notifications.py
          test -s frontend/native-assets/android/solution_signature.wav
          test -s frontend/native-assets/android/ic_stat_aplus.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Build Android release bundle for validation
        working-directory: frontend
        env:
          VITE_API_URL: https://app.aplus-solution.de/api
        run: |
          npm install --no-audit --no-fund
          npm run build
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/prepare-native.mjs android
          test -s android/app/src/main/res/raw/solution_signature.wav
          test -s android/app/src/main/res/drawable/ic_stat_aplus.xml
          grep -q 'com.google.firebase.messaging.default_notification_icon' android/app/src/main/AndroidManifest.xml
          grep -q 'aplus_updates_signature_v1' android/app/src/main/AndroidManifest.xml
          cd android
          ./gradlew bundleRelease
          test -n "$(find app/build/outputs/bundle/release -maxdepth 1 -name '*.aab' -print -quit)"

      - uses: actions/upload-artifact@v4
        with:
          name: aplus-android-notification-branding-validation-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Commit validated Android branding
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/core/push_notifications.py \
            frontend/src/NativePushRegistration.tsx \
            frontend/scripts/prepare-native.mjs \
            frontend/native-assets/android/solution_signature.wav \
            frontend/native-assets/android/ic_stat_aplus.xml
          if git diff --cached --quiet; then
            echo 'Branding source already applied.'
            exit 0
          fi
          git commit -m 'Brand Android push with A+ icon and Signature Motif'
          git pull --rebase origin main
          git push origin HEAD:main
