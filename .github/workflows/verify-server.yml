name: Diagnose production HTTPS

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH client helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Inspect production server
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" <<'REMOTE'
          set -u
          cd /opt/aplussolution
          echo '=== COMPOSE PS ==='
          docker compose ps || true
          echo '=== LISTEN PORTS ==='
          ss -lntp | grep -E ':(22|80|443) ' || true
          echo '=== LOCAL HTTP ==='
          curl -sS -D - --max-time 10 -H 'Host: solution.smarbiz.sbs' http://127.0.0.1/health/ -o /tmp/http-body || true
          cat /tmp/http-body 2>/dev/null || true
          echo
          echo '=== LOCAL HTTPS ==='
          curl -ksS -D - --max-time 10 --resolve solution.smarbiz.sbs:443:127.0.0.1 https://solution.smarbiz.sbs/health/ -o /tmp/https-body || true
          cat /tmp/https-body 2>/dev/null || true
          echo
          echo '=== CADDY LOGS ==='
          docker compose logs --tail=120 caddy || true
          echo '=== BACKEND LOGS ==='
          docker compose logs --tail=40 backend || true
          REMOTE

      - name: Inspect public endpoint
        run: |
          set +e
          echo '=== PUBLIC DNS ==='
          getent ahostsv4 solution.smarbiz.sbs
          echo '=== PUBLIC HTTPS ==='
          curl -vkI --max-time 20 https://solution.smarbiz.sbs/health/
          exit 0
