name: Diagnose Caddy configuration

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  diagnose-caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Read Caddy failure
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e ssh -qT -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" '
            touch /root/.hushlogin
            cd /opt/aplussolution
            echo ===CADDY_LOG===
            docker compose logs --no-color --tail=40 caddy 2>&1 || true
            echo ===CADDY_VALIDATE===
            docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile 2>&1 || true
          '
