name: Validate and deploy Caddy fix

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  fix-caddy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4

      - name: Validate Caddyfile with official image
        run: |
          docker run --rm -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            caddy:2-alpine caddy validate --config /etc/caddy/Caddyfile

      - name: Install deployment tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass

      - name: Upload fixed Caddyfile and restart proxy
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          sshpass -e scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 \
            Caddyfile root@"$HOST":/opt/aplussolution/Caddyfile
          sshpass -e ssh -qT -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" '
            touch /root/.hushlogin
            cd /opt/aplussolution
            docker compose up -d --force-recreate caddy
            for attempt in $(seq 1 30); do
              if docker compose ps caddy | grep -q "Up"; then
                break
              fi
              sleep 2
            done
            docker compose ps caddy
            docker compose logs --no-color --tail=60 caddy
            ss -lntp | grep -E ":(80|443) "
          '

      - name: Verify origin and public HTTPS
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          set -euxo pipefail
          curl -kfsSL --retry 30 --retry-all-errors --retry-delay 3 \
            --resolve solution.smarbiz.sbs:443:$HOST \
            https://solution.smarbiz.sbs/health/
          curl -fsSL --retry 30 --retry-all-errors --retry-delay 3 \
            https://solution.smarbiz.sbs/health/
