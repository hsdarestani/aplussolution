name: Verify production server access

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve domain
        run: |
          set -euxo pipefail
          getent ahostsv4 solution.smarbiz.sbs
      - name: Check public ports
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          set -euxo pipefail
          test -n "$HOST"
          timeout 10 bash -c "</dev/tcp/$HOST/22"
          for PORT in 80 443; do
            if timeout 10 bash -c "</dev/tcp/$HOST/$PORT"; then
              echo "PORT_${PORT}=OPEN"
            else
              echo "PORT_${PORT}=CLOSED_OR_REFUSED"
            fi
          done
      - name: Verify SSH login and server state
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" '
            set -e
            echo SSH_OK
            hostname
            uptime
            echo ---OS---
            cat /etc/os-release | head -5
            echo ---DOCKER---
            command -v docker || true
            docker --version || true
            docker compose version || true
            echo ---PORTS---
            ss -lntp || true
            echo ---APP_DIR---
            ls -la /opt/aplussolution 2>/dev/null || true
            echo ---CONTAINERS---
            docker ps -a 2>/dev/null || true
          '
