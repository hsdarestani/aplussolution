name: Verify production server access

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve domain
        run: |
          set -euxo pipefail
          getent ahostsv4 solution.smarbiz.sbs
      - name: Check public ports
        env:
          HOST: ${{ secrets.HOST }}
        run: |
          set -euxo pipefail
          test -n "$HOST"
          timeout 10 bash -c "</dev/tcp/$HOST/22"
          timeout 10 bash -c "</dev/tcp/$HOST/80"
          timeout 10 bash -c "</dev/tcp/$HOST/443" || true
      - name: Verify SSH login
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          sshpass -e ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 root@"$HOST" 'echo SSH_OK; hostname; uptime; command -v docker || true'
