name: Final schedule UX patch

on:
  push:
    branches:
      - feature/final-notification-copy-splash
    paths:
      - scripts/final_schedule_ux_patch.py
      - .github/workflows/final-schedule-ux-patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/final-notification-copy-splash
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply final patch
        run: python scripts/final_schedule_ux_patch.py
      - name: Verify no accidental workflow changes
        run: |
          git diff --check
          git diff -- .github/workflows
      - name: Commit source changes
        run: |
          if git diff --quiet; then
            echo 'No source changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend frontend
          git commit -m 'Complete Dienstplan UX and splash animation'
          git push origin HEAD:feature/final-notification-copy-splash
