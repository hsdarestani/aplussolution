name: Harden worker conversation mutations

on:
  push:
    branches: [qa/worker-portal-deep]
    paths:
      - '.github/workflows/patch-worker-conversation-mutations.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/worker-portal-deep
      - name: Make conversation participant mutations manager-only
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/core/views.py')
          text = path.read_text()
          marker = "class ConversationViewSet(BaseModelViewSet):\n    queryset = Conversation.objects.prefetch_related('participants', 'messages__sender').all()\n    serializer_class = ConversationSerializer\n\n    def get_queryset(self):"
          replacement = "class ConversationViewSet(BaseModelViewSet):\n    queryset = Conversation.objects.prefetch_related('participants', 'messages__sender').all()\n    serializer_class = ConversationSerializer\n\n    def get_permissions(self):\n        if getattr(self, 'action', None) in {'update', 'partial_update', 'destroy'}:\n            return [IsAdminOrManager()]\n        return super().get_permissions()\n\n    def get_queryset(self):"
          if marker in text:
              text = text.replace(marker, replacement, 1)
          elif replacement not in text:
              raise SystemExit('Conversation permission marker missing.')
          path.write_text(text)
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/views.py
          git commit -m 'fix: restrict conversation participant mutations'
          git push origin HEAD:qa/worker-portal-deep
