name: Verify requested workforce profiles after mobile release
on:
  push:
    branches: [ops/mobile-workforce-20260902]
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read matching production identities
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          DEPLOY_HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          cat > /tmp/askpass <<'SH'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          SH
          chmod 700 /tmp/askpass
          export SSH_ASKPASS=/tmp/askpass SSH_ASKPASS_REQUIRE=force DISPLAY=:0
          setsid -w ssh -T -o StrictHostKeyChecking=no -o ConnectTimeout=20 root@"$DEPLOY_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell' <<'PY'
          import json
          from core.models import WorkerProfile
          from core.notification_settings import all_push_rule_payloads
          expected = {
              'Izabella Somodo': ['housekeeping'],
              'Musa Jamali': ['service', 'housekeeping', 'front_office'],
              'Max Najmudinov': ['service'],
          }
          rows = []
          for name, groups in expected.items():
              first, last = name.split(' ', 1)
              worker = WorkerProfile.objects.select_related('user').get(user__first_name=first, user__last_name=last)
              assert set(worker.schedule_groups) == set(groups), name
              assert worker.active and worker.open_shift_client_ids == [], name
              if first == 'Izabella':
                  assert worker.user.email == 'izabellasomodi21@yahoo.com'
              rows.append({'name': name, 'groups': worker.schedule_groups, 'all_clients': not worker.open_shift_client_ids, 'email_pending': worker.user.email.endswith('@pending.invalid')})
          rules = all_push_rule_payloads()
          assert all(rule['display_title'] != '{title}' and rule['display_body'] != '{body}' for rule in rules)
          print('VERIFIED_WORKFORCE=' + json.dumps(rows))
          print('VERIFIED_NOTIFICATION_PREVIEWS=' + str(len(rules)))
          PY
