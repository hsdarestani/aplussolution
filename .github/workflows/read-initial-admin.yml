name: Retrieve initial admin credentials

on:
  pull_request:
    branches: [main]

jobs:
  retrieve:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
      - name: Copy credentials from server
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          umask 077
          sshpass -e scp -q -o StrictHostKeyChecking=no root@"$HOST":/root/aplussolution-initial-admin.txt ./aplussolution-initial-admin.txt
      - name: Upload private credential artifact
        uses: actions/upload-artifact@v4
        with:
          name: initial-admin-credentials
          path: aplussolution-initial-admin.txt
          retention-days: 1
          if-no-files-found: error
