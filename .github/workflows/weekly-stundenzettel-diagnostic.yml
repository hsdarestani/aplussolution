name: Verify weekly Stundenzettel production persistence
on:
  push:
    branches: [main]
    paths: ['.github/workflows/weekly-stundenzettel-diagnostic.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PRIMARY_HOST: ${{ secrets.STRATO_HOST }}
      PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Verify image survives primary recovery and both PDF exports work
        run: |
          set -euo pipefail
          umask 077
          key="$RUNNER_TEMP/stundenzettel.key"
          printf '%s\n' "$PRIVATE_KEY" > "$key"
          trap 'rm -f "$key"' EXIT
          ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$PRIMARY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          systemctl is-active --quiet aplus-primary-ensure.timer
          live="$(docker compose ps -q backend)"
          pin='ghcr.io/hsdarestani/aplus-bluegreen-backend@sha256:d6b43013062ffc85b729e55279265d22004b459367c712e0477d70bdf9ce206a'
          test "$(docker inspect -f '{{.Config.Image}}' "$live")" = "$pin"
          sleep 30
          live="$(docker compose ps -q backend)"
          test "$(docker inspect -f '{{.Config.Image}}' "$live")" = "$pin"
          systemctl is-active --quiet aplus-primary-ensure.timer
          curl -fsS --max-time 15 --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/api/status/ready/
          front="$(docker compose ps -q frontend)"
          docker exec "$front" sh -c 'grep -Rq "reports/stundenzettel.pdf" /usr/share/nginx/html/assets'
          echo RECOVERY_TIMER_AND_NEW_WEB_BUNDLE_VERIFIED
          REMOTE
          ssh -i "$key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$PRIMARY_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell' < scripts/verify-weekly-stundenzettel.py
          status="$(curl -sS --max-time 20 -o /tmp/stundenzettel-anonymous.json -w '%{http_code}' 'https://app.aplus-solution.de/api/reports/stundenzettel.pdf?week=2026-W45&group=housekeeping')"
          test "$status" = 401
          echo PUBLIC_EXPORT_AUTH_REQUIRED_AND_PRODUCTION_PERSISTENCE_OK
