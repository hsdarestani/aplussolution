name: Diagnose Apple Calendar public feed

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-feed-diagnostics.yml'

permissions:
  contents: read

jobs:
  check-calendar-transport:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Check production HTTPS, encoded tokens, and iOS Calendar user agent
        shell: bash
        run: |
          set -uo pipefail
          host=app.aplus-solution.de
          url="https://$host"
          echo "::group::Primary production TLS"
          echo | openssl s_client -connect "$host:443" -servername "$host" -verify_return_error 2>/dev/null | openssl x509 -noout -subject -issuer -dates
          failed=0
          for test_path in /health/ /api/calendar/feed/not-a-valid-token.ics /api/calendar/feed/dummy%3Asignature.ics; do
            for agent in 'curl/8.0' 'CalendarAgent/1.0 (iPhone; iOS 26)'; do
              f=$(mktemp)
              code=$(curl -sS --proto '=https' --max-time 20 --location -A "$agent" -o "$f" -w '%{http_code}' "$url$test_path")
              rc=$?
              echo "path=$test_path agent=$agent http=$code curl_exit=$rc body=$(head -c 70 "$f")"
              if [ "$rc" != 0 ] || { [ "$test_path" = '/health/' ] && [ "$code" != '200' ]; } || { [ "$test_path" != '/health/' ] && [ "$code" != '404' ]; }; then failed=1; fi
              rm -f "$f"
            done
          done
          echo "::endgroup::"
          echo "::group::HTTP-to-HTTPS redirect"
          curl -sS -I --max-time 15 http://app.aplus-solution.de/health/ | head -n 12 || true
          echo "::endgroup::"
          echo "::group::Fallback domain check (warning only)"
          c=$(curl -sS --max-time 25 -o /dev/null -w '%{http_code}' https://solution.smarbiz.sbs/health/); echo "fallback health=$c"
          if [ "$c" != '200' ]; then echo "::warning::Legacy solution.smarbiz.sbs origin unhealthy (not used by production calendar links)"; fi
          echo "::endgroup::"
          test "$failed" = 0
