name: Verify Phase 4 admin exception/search production
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Verify deployed Phase 4 behavior
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 40); do
            if sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" "test -f /opt/aplussolution/backend/core/admin_center_views.py && test -f /opt/aplussolution/frontend/src/AdminHomeV4.tsx && grep -q 'GlobalSearch' /opt/aplussolution/frontend/src/App.tsx"; then
              break
            fi
            if [ "$attempt" = 40 ]; then
              echo 'Phase 4 source did not reach production host in time.' >&2
              exit 1
            fi
            sleep 10
          done
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          # Rebuild from the source that actually reached production so the smoke test cannot race an older container image.
          docker compose build backend celery celery-beat frontend >/dev/null
          docker compose up -d --force-recreate backend celery celery-beat frontend caddy >/dev/null
          docker compose exec -T backend python manage.py migrate --noinput </dev/null
          docker compose exec -T backend python manage.py check </dev/null
          docker compose exec -T backend python manage.py shell -c "import core.admin_center_views, core.searchable_views; print('PHASE4_RUNTIME_IMPORT_OK')" </dev/null

          cat >/root/phase4-smoke.py <<'PY'
          from datetime import timedelta
          from django.db import transaction
          from django.utils import timezone
          from rest_framework.test import APIClient
          from core.attendance_models import TimeEntryCorrection
          from core.models import ClientCompany, ClientOrder, Contract, ContractTemplate, EmployeeMasterData, IntegrationSyncRun, Location, Position, Shift, TimeEntry, User, WorkerProfile
          from core.shift_slots import ShiftSlot

          host='solution.smarbiz.sbs'
          now=timezone.now()
          with transaction.atomic():
              manager=User.objects.create(email='verify.phase4.manager@example.invalid', username='verify.phase4.manager@example.invalid', role=User.Role.MANAGER, first_name='VerifyManager', is_active=True, is_onboarded=True)
              manager.set_unusable_password(); manager.save(update_fields=['password'])
              worker_user=User.objects.create(email='verify.phase4.worker@example.invalid', username='verify.phase4.worker@example.invalid', role=User.Role.WORKER, first_name='VerifyPhaseFour', last_name='Worker', is_active=True, is_onboarded=True)
              worker_user.set_unusable_password(); worker_user.save(update_fields=['password'])
              worker=WorkerProfile.objects.create(user=worker_user, employee_number='VERIFY-PHASE4-WORKER')
              EmployeeMasterData.objects.create(worker=worker, completeness=40, missing_fields=['iban','tax_identification_number'])

              client=ClientCompany.objects.create(name='VERIFYSEARCH Event GmbH', customer_number='VERIFYSEARCH-CLIENT', address='Frankfurt')
              location=Location.objects.create(client=client, name='VERIFYSEARCH Messe Frankfurt', address='Frankfurt am Main')
              position=Position.objects.create(name='VERIFYSEARCH Servicekraft')
              order=ClientOrder.objects.create(client=client, location=location, title='VERIFYSEARCH Sommergala', description='VERIFYSEARCH Testauftrag', starts_at=now+timedelta(days=2), ends_at=now+timedelta(days=2,hours=8), requested_staff=4, created_by=manager)

              demand=Shift.objects.create(order=order, client=client, location=location, position=position, starts_at=now+timedelta(hours=3), ends_at=now+timedelta(hours=8), status=Shift.Status.PUBLISHED, required_count=2, notes='VERIFYSEARCH staffing')
              slot=demand.slots.order_by('created_at').first(); slot.worker=worker; slot.status=ShiftSlot.Status.CLAIMED; slot.claimed_at=now; slot.save(update_fields=['worker','status','claimed_at','updated_at'])

              late=Shift.objects.create(client=client, location=location, position=position, starts_at=now-timedelta(hours=1), ends_at=now+timedelta(hours=3), status=Shift.Status.PUBLISHED, required_count=1)
              late_slot=late.slots.first(); late_slot.worker=worker; late_slot.status=ShiftSlot.Status.CLAIMED; late_slot.claimed_at=now-timedelta(hours=2); late_slot.save(update_fields=['worker','status','claimed_at','updated_at'])

              entry=TimeEntry.objects.create(worker=worker, shift=demand, clock_in=now-timedelta(hours=5), clock_out=now-timedelta(hours=1), approved=False)
              correction=TimeEntryCorrection.objects.create(entry=entry, requested_by=worker, requested_clock_in=entry.clock_in-timedelta(minutes=15), reason='VERIFYSEARCH Arbeitszeitkorrektur')

              template=ContractTemplate.objects.create(name='VERIFYSEARCH Arbeitsvertrag', slug='verifysearch-phase4-contract', kind=ContractTemplate.Kind.EMPLOYMENT, schema={})
              contract=Contract.objects.create(template=template, client=client, title='VERIFYSEARCH Vertrag Sommergala', status=Contract.Status.SENT, ends_on=timezone.localdate()+timedelta(days=5), created_by=manager)
              IntegrationSyncRun.objects.create(provider='wiw', status=IntegrationSyncRun.Status.FAILED, mode='incremental', errors=[{'error':'VERIFYSEARCH API nicht erreichbar'}])

              admin=APIClient(); admin.force_authenticate(manager)
              exceptions=admin.get('/api/admin/exceptions/?limit=120', HTTP_HOST=host)
              assert exceptions.status_code == 200, getattr(exceptions,'data',exceptions.content)
              categories={item['category'] for item in exceptions.data['results']}
              assert {'staffing','attendance','contracts','documents','integrations'} <= categories, categories
              staffing=[item for item in exceptions.data['results'] if item['category']=='staffing' and item['object_id']==str(demand.id)]
              assert staffing and staffing[0]['meta']['open_count']==1, staffing
              assert any(item['title']=='Kein Check-in erfasst' and item['object_id']==str(late.id) for item in exceptions.data['results'])
              assert any(item['object_id']==str(correction.id) for item in exceptions.data['results'] if item['category']=='attendance')
              assert any(item['object_id']==str(contract.id) for item in exceptions.data['results'] if item['category']=='contracts')

              filtered=admin.get('/api/admin/exceptions/?category=documents&q=VerifyPhaseFour', HTTP_HOST=host)
              assert filtered.status_code == 200 and filtered.data['results']
              assert all(item['category']=='documents' for item in filtered.data['results'])

              search=admin.get('/api/search/global/?q=VERIFYSEARCH&limit=10', HTTP_HOST=host)
              assert search.status_code == 200, getattr(search,'data',search.content)
              found={item['type'] for item in search.data['results']}
              assert {'client','order','shift','contract'} <= found, found

              orders=admin.get('/api/orders/?search=VERIFYSEARCH&ordering=-starts_at', HTTP_HOST=host)
              assert orders.status_code == 200
              assert any(str(item['id'])==str(order.id) for item in orders.data['results'])
              workers=admin.get('/api/workers/?search=VerifyPhaseFour&ordering=employee_number', HTTP_HOST=host)
              assert workers.status_code == 200
              assert any(str(item['id'])==str(worker.id) for item in workers.data['results'])

              employee=APIClient(); employee.force_authenticate(worker_user)
              assert employee.get('/api/admin/exceptions/', HTTP_HOST=host).status_code == 403
              assert employee.get('/api/search/global/?q=VERIFYSEARCH', HTTP_HOST=host).status_code == 403

              transaction.set_rollback(True)
          print('PHASE4_TRANSACTIONAL_SMOKE_OK')
          PY
          docker compose exec -T backend python manage.py shell < /root/phase4-smoke.py
          rm -f /root/phase4-smoke.py
          docker compose exec -T frontend sh -c "grep -R -q 'Nur das, was heute Aufmerksamkeit braucht' /usr/share/nginx/html/assets || true" </dev/null
          curl -kfsS --resolve solution.smarbiz.sbs:443:127.0.0.1 https://solution.smarbiz.sbs/health/ >/dev/null
          REMOTE
      - name: Verify public HTTPS
        run: curl -fsS --retry 10 --retry-delay 10 --retry-all-errors https://solution.smarbiz.sbs/health/ >/dev/null
