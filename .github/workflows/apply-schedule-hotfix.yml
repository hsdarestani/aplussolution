name: Apply schedule visibility hotfix

on:
  push:
    branches: [hotfix/schedule-pagination-reminder-timezone]
    paths:
      - '.github/workflows/apply-schedule-hotfix.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/schedule-pagination-reminder-timezone
      - name: Patch backend and frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          # Backend: date-bounded schedule queries.
          p = Path('backend/core/shift_views.py')
          s = p.read_text()
          s = s.replace(
              "from django.db import transaction\n",
              "from datetime import datetime, time, timedelta\n\nfrom django.db import transaction\n",
              1,
          )
          s = s.replace(
              "from django.utils import timezone\n",
              "from django.utils import timezone\nfrom django.utils.dateparse import parse_date\n",
              1,
          )
          old = """    def get_queryset(self):
        user = self.request.user
        qs = self.base_queryset()
        if user.role in {User.Role.ADMIN, User.Role.MANAGER}:
            return qs
"""
          new = """    def get_queryset(self):
        user = self.request.user
        qs = self.base_queryset()

        # Calendar views request only their visible date window. This avoids the
        # global DRF page-size limit hiding valid future shifts behind old rows.
        from_date = parse_date(str(self.request.query_params.get('from_date') or ''))
        to_date = parse_date(str(self.request.query_params.get('to_date') or ''))
        current_tz = timezone.get_current_timezone()
        if from_date:
            qs = qs.filter(starts_at__gte=timezone.make_aware(datetime.combine(from_date, time.min), current_tz))
        if to_date:
            exclusive_end = datetime.combine(to_date + timedelta(days=1), time.min)
            qs = qs.filter(starts_at__lt=timezone.make_aware(exclusive_end, current_tz))

        if user.role in {User.Role.ADMIN, User.Role.MANAGER}:
            return qs
"""
          if old not in s:
              raise SystemExit('shift_views get_queryset anchor not found')
          p.write_text(s.replace(old, new, 1))

          # Reminder: always render the Berlin-local shift time.
          p = Path('backend/core/tasks.py')
          s = p.read_text()
          old = """    for slot in slots:
        shift = slot.shift
        user = slot.worker.user
        _, created = Notification.objects.get_or_create(
"""
          new = """    for slot in slots:
        shift = slot.shift
        user = slot.worker.user
        local_start = timezone.localtime(shift.starts_at)
        _, created = Notification.objects.get_or_create(
"""
          if old not in s:
              raise SystemExit('tasks loop anchor not found')
          s = s.replace(old, new, 1)
          s = s.replace("f'{shift.starts_at:%d.%m.%Y %H:%M} – {shift.location.name} – {shift.position.name}'", "f'{local_start:%d.%m.%Y %H:%M} – {shift.location.name} – {shift.position.name}'", 1)
          s = s.replace("f'{shift.starts_at:%d.%m.%Y %H:%M}\\n{shift.location.name}\\n{shift.position.name}'", "f'{local_start:%d.%m.%Y %H:%M}\\n{shift.location.name}\\n{shift.position.name}'", 1)
          p.write_text(s)

          # Frontend: query the visible calendar range and safely consume every
          # page returned inside that range.
          p = Path('frontend/src/ScheduleV2.tsx')
          s = p.read_text()
          old = """  async function load() {
    const q=search.trim()?`&search=${encodeURIComponent(search.trim())}`:'';
    if(user.role==='worker') { const endpoint=tab==='mine'?'shifts/mine/':'shifts/available/'; setRows(unpack(await api(`${endpoint}?ordering=starts_at${q}`))); return; }
    if(user.role==='client') { setRows(unpack(await api(`shifts/?ordering=starts_at${q}`))); return; }
    const [s,c,l,p,o,w]=await Promise.all([api(`shifts/?ordering=starts_at${q}`),api('clients/'),api('locations/'),api('positions/'),api('orders/'),api('workers/?ordering=user__last_name')]);
    setRows(unpack(s)); setClients(unpack(c)); setLocations(unpack(l)); setPositions(unpack(p)); setOrders(unpack(o)); setWorkers(unpack(w).filter((item:any)=>item.active!==false&&!isSyntheticWorker(item)));
  }
  useEffect(()=>{void load();},[tab]);
"""
          new = """  function scheduleRangeQuery() {
    if(view==='month') {
      const date=keyToDate(anchor); date.setUTCDate(1); const month=keyFromDate(date);
      const day=keyToDate(month).getUTCDay(); const start=addKeyDays(month,-(day===0?6:day-1));
      return `&from_date=${start}&to_date=${addKeyDays(start,41)}`;
    }
    if(view==='week'||view==='timeline') {
      const start=startOfWeekKey(anchor);
      return `&from_date=${start}&to_date=${addKeyDays(start,6)}`;
    }
    // Operational list: keep a useful window while still paging through every
    // result inside it. The "Alle" tab intentionally remains unbounded.
    if(tab!=='all') return `&from_date=${berlinDate(-31)}&to_date=${berlinDate(365)}`;
    return '';
  }
  async function loadShiftPages(path:string) {
    const all:any[]=[]; let page=1;
    while(page<=100) {
      const separator=path.includes('?')?'&':'?';
      const response:any=await api(`${path}${separator}page=${page}`);
      all.push(...unpack(response));
      if(Array.isArray(response)||!response?.next) break;
      page += 1;
    }
    return all;
  }
  async function load() {
    const q=search.trim()?`&search=${encodeURIComponent(search.trim())}`:'';
    const range=scheduleRangeQuery();
    if(user.role==='worker') { const endpoint=tab==='mine'?'shifts/mine/':'shifts/available/'; setRows(await loadShiftPages(`${endpoint}?ordering=starts_at${range}${q}`)); return; }
    if(user.role==='client') { setRows(await loadShiftPages(`shifts/?ordering=starts_at${range}${q}`)); return; }
    const [shiftRows,c,l,p,o,w]=await Promise.all([loadShiftPages(`shifts/?ordering=starts_at${range}${q}`),api('clients/'),api('locations/'),api('positions/'),api('orders/'),api('workers/?ordering=user__last_name')]);
    setRows(shiftRows); setClients(unpack(c)); setLocations(unpack(l)); setPositions(unpack(p)); setOrders(unpack(o)); setWorkers(unpack(w).filter((item:any)=>item.active!==false&&!isSyntheticWorker(item)));
  }
  useEffect(()=>{void load();},[tab,view,anchor]);
"""
          if old not in s:
              raise SystemExit('ScheduleV2 load anchor not found')
          p.write_text(s.replace(old, new, 1))

          Path('backend/tests/test_schedule_reminder_visibility.py').write_text("""from datetime import datetime, timedelta, timezone as dt_timezone
from zoneinfo import ZoneInfo

import pytest
from django.core import mail
from django.utils import timezone

from core import tasks
from core.models import Notification, Shift
from core.shift_slots import ShiftSlot


@pytest.mark.django_db
def test_schedule_date_window_returns_target_shift(auth_admin, company, location, position):
    berlin = ZoneInfo('Europe/Berlin')
    target_start = datetime(2026, 8, 23, 9, 0, tzinfo=berlin)
    target = Shift.objects.create(
        client=company, location=location, position=position,
        starts_at=target_start, ends_at=target_start + timedelta(hours=5),
        status=Shift.Status.CONFIRMED,
    )
    old_start = datetime(2026, 7, 1, 9, 0, tzinfo=berlin)
    Shift.objects.create(
        client=company, location=location, position=position,
        starts_at=old_start, ends_at=old_start + timedelta(hours=5),
        status=Shift.Status.CONFIRMED,
    )

    response = auth_admin.get('/api/shifts/?from_date=2026-08-23&to_date=2026-08-23&ordering=starts_at')
    assert response.status_code == 200
    rows = response.data.get('results', response.data)
    assert [str(row['id']) for row in rows] == [str(target.id)]


@pytest.mark.django_db
def test_shift_reminder_uses_berlin_local_time(monkeypatch, worker_user, company, location, position):
    reference = datetime(2026, 8, 22, 7, 0, tzinfo=dt_timezone.utc)
    starts_at = reference + timedelta(hours=24)
    shift = Shift.objects.create(
        client=company, location=location, position=position,
        starts_at=starts_at, ends_at=starts_at + timedelta(hours=5),
        status=Shift.Status.CONFIRMED,
    )
    slot = shift.slots.first()
    slot.worker = worker_user.worker_profile
    slot.status = ShiftSlot.Status.CLAIMED
    slot.claimed_at = reference
    slot.save(update_fields=['worker','status','claimed_at','updated_at'])

    monkeypatch.setattr(tasks.timezone, 'now', lambda: reference)
    assert tasks.send_shift_reminders() == 1

    notification = Notification.objects.get(user=worker_user, kind=f'shift-24h-{slot.id}')
    assert '23.08.2026 09:00' in notification.body
    assert len(mail.outbox) == 1
    assert '23.08.2026 09:00' in mail.outbox[0].body
    assert '23.08.2026 07:00' not in mail.outbox[0].body
""")
          PY
      - name: Commit hotfix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add backend/core/shift_views.py backend/core/tasks.py frontend/src/ScheduleV2.tsx backend/tests/test_schedule_reminder_visibility.py
          git commit -m "fix schedule pagination and reminder timezone"
          git push origin HEAD:hotfix/schedule-pagination-reminder-timezone
