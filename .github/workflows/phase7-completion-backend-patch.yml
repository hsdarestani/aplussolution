name: Phase 7 completion backend patch

on:
  push:
    branches: [feature/phase7-completion-sweep]
    paths: ['.github/workflows/phase7-completion-backend-patch.yml']

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase7-completion-sweep
      - name: Apply backend completion gaps
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text(encoding='utf-8')
              if old not in text: raise SystemExit(f'missing block in {path}: {old[:120]!r}')
              p.write_text(text.replace(old,new,1),encoding='utf-8')

          replace_once('backend/core/models.py',
              "    skills = models.JSONField(default=list, blank=True)\n    active = models.BooleanField(default=True)",
              "    skills = models.JSONField(default=list, blank=True)\n    open_shift_client_ids = models.JSONField(default=list, blank=True)\n    schedule_groups = models.JSONField(default=list, blank=True)\n    active = models.BooleanField(default=True)")
          replace_once('backend/core/models.py',
              "    confirmation_required = models.BooleanField(default=False)\n    published_at = models.DateTimeField(blank=True, null=True)",
              "    confirmation_required = models.BooleanField(default=False)\n    schedule_groups = models.JSONField(default=list, blank=True)\n    published_at = models.DateTimeField(blank=True, null=True)")

          replace_once('backend/core/shift_api.py',
              "from .shift_slots import ShiftSlot\n",
              "from .shift_slots import ShiftSlot\nfrom .shift_rules import automatic_break_minutes, normalized_groups\n")
          replace_once('backend/core/shift_api.py',
              "    class Meta:\n        model = Shift",
              "    def validate(self, attrs):\n        attrs = super().validate(attrs)\n        starts_at = attrs.get('starts_at', getattr(self.instance, 'starts_at', None))\n        ends_at = attrs.get('ends_at', getattr(self.instance, 'ends_at', None))\n        if starts_at and ends_at:\n            if ends_at <= starts_at:\n                raise serializers.ValidationError({'ends_at': 'Das Ende muss nach dem Beginn liegen.'})\n            attrs['break_minutes'] = automatic_break_minutes(starts_at, ends_at)\n        if 'schedule_groups' in attrs:\n            attrs['schedule_groups'] = normalized_groups(attrs.get('schedule_groups'))\n        return attrs\n\n    class Meta:\n        model = Shift")
          replace_once('backend/core/shift_api.py',
              "            'required_count', 'confirmation_required', 'open_count', 'filled_count', 'assigned_workers',",
              "            'required_count', 'confirmation_required', 'schedule_groups', 'open_count', 'filled_count', 'assigned_workers',")

          replace_once('backend/core/serializers.py',
              "from .workforce_scope import canonical_position_name\n",
              "from .workforce_scope import canonical_position_name\nfrom .shift_rules import automatic_break_minutes, normalized_groups\n")
          replace_once('backend/core/serializers.py',
              "class ShiftSerializer(serializers.ModelSerializer):\n    worker_name",
              "class ShiftSerializer(serializers.ModelSerializer):\n    def validate(self, attrs):\n        attrs = super().validate(attrs)\n        starts_at = attrs.get('starts_at', getattr(self.instance, 'starts_at', None))\n        ends_at = attrs.get('ends_at', getattr(self.instance, 'ends_at', None))\n        if starts_at and ends_at:\n            if ends_at <= starts_at:\n                raise serializers.ValidationError({'ends_at': 'Das Ende muss nach dem Beginn liegen.'})\n            attrs['break_minutes'] = automatic_break_minutes(starts_at, ends_at)\n        if 'schedule_groups' in attrs:\n            attrs['schedule_groups'] = normalized_groups(attrs.get('schedule_groups'))\n        return attrs\n\n    worker_name")

          replace_once('backend/core/shift_views.py',
              "from .shift_slots import ShiftSlot\n",
              "from .shift_slots import ShiftSlot\nfrom .shift_rules import shift_visible_to_worker\n")
          replace_once('backend/core/shift_views.py',
              "        qs = self.filter_queryset(self.base_queryset().filter(\n            status=Shift.Status.PUBLISHED, starts_at__gte=timezone.now(), slots__status='open'\n        ).exclude(slots__worker=request.user.worker_profile).distinct())\n        return self._list_response(qs)",
              "        worker = request.user.worker_profile\n        qs = self.filter_queryset(self.base_queryset().filter(\n            status=Shift.Status.PUBLISHED, starts_at__gte=timezone.now(), slots__status='open'\n        ).exclude(slots__worker=worker).distinct())\n        visible = [shift for shift in qs if shift_visible_to_worker(shift, worker)]\n        return self._list_response(visible)")

          replace_once('backend/core/akten_views.py',
              "            worker_fields = {'employee_number', 'employment_type', 'monthly_hours', 'tariff_hourly_rate', 'extra_allowance', 'ranking_points', 'active', 'skills'}",
              "            worker_fields = {'employee_number', 'employment_type', 'monthly_hours', 'tariff_hourly_rate', 'extra_allowance', 'ranking_points', 'active', 'skills', 'open_shift_client_ids', 'schedule_groups'}")
          PY
      - name: Commit patch and retire helper workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase7-completion-backend-patch.yml
          git add backend/core/models.py backend/core/shift_api.py backend/core/serializers.py backend/core/shift_views.py backend/core/akten_views.py
          git commit -m 'Complete native shift rules and visibility'
          git push origin HEAD:feature/phase7-completion-sweep
