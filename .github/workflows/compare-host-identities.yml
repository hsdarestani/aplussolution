name: Compare primary host identities

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/compare-host-identities.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Compare machine identities
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          STRATO_ID="$(ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" 'cat /etc/machine-id')"

          BACKUP_ID="$(sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" 'cat /etc/machine-id')"

          test -n "$STRATO_ID"
          test -n "$BACKUP_ID"

          if [ "$STRATO_ID" = "$BACKUP_ID" ]; then
            echo HOSTS_ARE_SAME_MACHINE=true
            exit 2
          else
            echo HOSTS_ARE_SAME_MACHINE=false
          fi
