name: Calendar feed targeted regression checks
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-targeted-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  calendar:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Run only signed-calendar regression suite
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-calendar-regression-only
          DATABASE_URL: sqlite:///calendar-ci.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver,app.aplus-solution.de
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: pytest -q --nomigrations tests/test_calendar_sync.py
