name: Apply worker operations privacy patch

on:
  push:
    branches: [qa/worker-portal-deep]
    paths:
      - '.github/workflows/patch-worker-operations-privacy.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/worker-portal-deep
      - name: Remove peer email fallbacks from worker operations
        run: |
          python - <<'PY'
          from pathlib import Path

          live = Path('backend/core/live_operations.py')
          text = live.read_text()
          old = "{'id': str(candidate.id), 'name': candidate.user.get_full_name() or candidate.user.email}"
          new = "{'id': str(candidate.id), 'name': candidate.user.get_full_name() or candidate.employee_number}"
          if old in text:
              text = text.replace(old, new)
          elif new not in text:
              raise SystemExit('Worker swap candidate fallback marker missing.')
          live.write_text(text)

          advanced = Path('backend/core/advanced_views.py')
          text = advanced.read_text()
          replacements = {
              "'requested_by_name': obj.requested_by.user.get_full_name() or obj.requested_by.user.email,": "'requested_by_name': obj.requested_by.user.get_full_name() or obj.requested_by.employee_number,",
              "obj.offered_to.user.get_full_name() or obj.offered_to.user.email": "obj.offered_to.user.get_full_name() or obj.offered_to.employee_number",
          }
          for old, new in replacements.items():
              if old in text:
                  text = text.replace(old, new)
              elif new not in text:
                  raise SystemExit(f'Swap serialization marker missing: {old}')
          advanced.write_text(text)

          slots = Path('backend/core/slot_compat_views_v2.py')
          text = slots.read_text()
          old = "offered_to = WorkerProfile.objects.get(pk=request.data.get('offered_to'), active=True)"
          new = "offered_to = WorkerProfile.objects.filter(active=True, user__is_active=True).exclude(user__email__iendswith='@sync.invalid').get(pk=request.data.get('offered_to'))"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Swap offered_to eligibility marker missing.')
          slots.write_text(text)
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/live_operations.py backend/core/advanced_views.py backend/core/slot_compat_views_v2.py
          git commit -m 'fix: keep peer contact data private in worker operations'
          git push origin HEAD:qa/worker-portal-deep
