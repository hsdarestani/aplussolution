name: Diagnose Yohannes schedule visibility

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-yohannes-schedule.yml'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Inspect production assignment and visibility
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'bash -s' <<'REMOTE' | tee /tmp/yohannes-diagnostic.txt
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from datetime import datetime, time, timedelta
          from zoneinfo import ZoneInfo
          from django.db.models import Q
          from core.models import WorkerProfile, Shift
          from core.shift_slots import ShiftSlot
          from core.shift_rules import normalized_groups

          berlin = ZoneInfo('Europe/Berlin')
          utc = ZoneInfo('UTC')
          target_date = datetime(2026, 10, 7, tzinfo=berlin).date()
          start = datetime.combine(target_date, time.min, tzinfo=berlin).astimezone(utc)
          end = (datetime.combine(target_date, time.min, tzinfo=berlin) + timedelta(days=1)).astimezone(utc)

          def workers_for(term):
              return WorkerProfile.objects.filter(
                  Q(user__first_name__icontains=term) |
                  Q(user__last_name__icontains=term)
              ).select_related('user').order_by('id')

          yworkers = list(WorkerProfile.objects.filter(
              Q(user__first_name__icontains='Yohannes') |
              Q(user__last_name__icontains='Yohannes') |
              Q(user__first_name__icontains='Kiffle') |
              Q(user__last_name__icontains='Kiffle')
          ).select_related('user').order_by('id'))
          fworkers = list(workers_for('Francesco'))

          print('yohannes_profiles=', len(yworkers))
          for idx, wp in enumerate(yworkers, 1):
              print(f'yohannes_{idx}_name={wp.user.get_full_name()}')
              print(f'yohannes_{idx}_worker_active={wp.active}')
              print(f'yohannes_{idx}_user_active={wp.user.is_active}')
              print(f'yohannes_{idx}_groups={normalized_groups(wp.schedule_groups)}')
              print(f'yohannes_{idx}_has_wiw_id={bool(wp.wiw_user_id)}')

          print('francesco_profiles=', len(fworkers))
          for idx, wp in enumerate(fworkers, 1):
              print(f'francesco_{idx}_name={wp.user.get_full_name()}')
              print(f'francesco_{idx}_worker_active={wp.active}')
              print(f'francesco_{idx}_user_active={wp.user.is_active}')
              print(f'francesco_{idx}_groups={normalized_groups(wp.schedule_groups)}')

          service_worker_ids = {
              wp.id for wp in WorkerProfile.objects.filter(active=True, user__is_active=True)
              if 'service' in set(normalized_groups(wp.schedule_groups))
          }

          target_rows = []
          day_shifts = Shift.objects.filter(starts_at__gte=start, starts_at__lt=end).select_related('location','position','worker__user')
          for s in day_shifts:
              local_start = s.starts_at.astimezone(berlin)
              if local_start.hour != 17 or not s.location_id or 'stadthaus' not in (s.location.name or '').lower():
                  continue
              slots = list(ShiftSlot.objects.filter(shift=s).select_related('worker__user').order_by('created_at'))
              for slot in slots:
                  if slot.worker_id and (
                      'yohannes' in (slot.worker.user.get_full_name() or '').lower()
                      or 'kiffle' in (slot.worker.user.get_full_name() or '').lower()
                  ):
                      target_rows.append((s, slot))

          print('target_yohannes_shift_slots=', len(target_rows))
          for idx, (s, slot) in enumerate(target_rows, 1):
              print(f'target_{idx}_shift_status={s.status}')
              print(f'target_{idx}_slot_status={slot.status}')
              print(f'target_{idx}_slot_source={slot.source}')
              print(f'target_{idx}_slot_worker_active={slot.worker.active}')
              print(f'target_{idx}_slot_user_active={slot.worker.user.is_active}')
              print(f'target_{idx}_slot_worker_groups={normalized_groups(slot.worker.schedule_groups)}')
              print(f'target_{idx}_slot_worker_in_service_set={slot.worker_id in service_worker_ids}')
              print(f'target_{idx}_shift_worker_matches_slot={s.worker_id == slot.worker_id}')

          francesco = next((wp for wp in fworkers if wp.active and wp.user.is_active), None)
          if francesco:
              francesco_is_service = 'service' in set(normalized_groups(francesco.schedule_groups))
              visible_ids = [francesco.id]
              if francesco_is_service:
                  visible_ids = list(service_worker_ids)
                  if francesco.id not in visible_ids:
                      visible_ids.append(francesco.id)
              exact_visible_count = Shift.objects.filter(
                  starts_at__gte=start,
                  starts_at__lt=end,
                  slots__worker_id__in=visible_ids,
                  slots__status=ShiftSlot.Status.CLAIMED,
              ).distinct().count()
              target_visible = any(slot.worker_id in visible_ids and slot.status == ShiftSlot.Status.CLAIMED for _, slot in target_rows)
              print(f'francesco_service_schedule={francesco_is_service}')
              print(f'francesco_visible_shift_count_day={exact_visible_count}')
              print(f'yohannes_target_visible_to_francesco={target_visible}')

          cause = 'UNKNOWN'
          if len(target_rows) == 0:
              cause = 'NO_CLAIMED_YOHANNES_SLOT_FOUND'
          elif any(not slot.worker.active or not slot.worker.user.is_active for _, slot in target_rows):
              cause = 'YOHANNES_INACTIVE'
          elif francesco and 'service' in set(normalized_groups(francesco.schedule_groups)) and all(
              'service' not in set(normalized_groups(slot.worker.schedule_groups)) for _, slot in target_rows
          ):
              cause = 'YOHANNES_NOT_IN_SERVICE_SCHEDULE_GROUP'
          elif any(slot.status != ShiftSlot.Status.CLAIMED for _, slot in target_rows):
              cause = 'YOHANNES_SLOT_NOT_CLAIMED'
          elif any(s.worker_id != slot.worker_id for s, slot in target_rows):
              cause = 'SHIFT_SLOT_WORKER_MISMATCH'
          elif len(yworkers) > 1:
              cause = 'DUPLICATE_YOHANNES_PROFILES'
          else:
              cause = 'VISIBILITY_QUERY_NEEDS_DEEPER_CHECK'
          print('CAUSE=', cause)
          PY
          REMOTE

      - name: Publish diagnostic
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/yohannes-diagnostic.txt', 'utf8').trim();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 202,
              state: 'closed',
              body: [
                'One-off production diagnostic for the 07.10.2026 17:00 Stadthaus am Markt shift.',
                '',
                '~~~text', output, '~~~',
                '',
                'See the workflow run in GitHub Actions for this commit.'
              ].join('\n')
            });

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
