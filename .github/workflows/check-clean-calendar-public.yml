name: Check clean calendar public routing
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-clean-calendar-public.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PRIMARY_HOST: ${{ secrets.STRATO_HOST }}
    steps:
      - name: Inspect public HTTP status without revealing calendar tokens
        shell: bash
        run: |
          set -euo pipefail
          for path in /health/ /api/calendar/feed/invalid.ics /calendar/invalid.ics /calendar-compatibility-test.ics; do
            url="https://app.aplus-solution.de$path"
            code=$(curl -sS -L --max-time 20 --retry 2 --retry-delay 2 -D /tmp/calendar-headers -o /tmp/calendar-body -w '%{http_code}' "$url") || true
            echo "PUBLIC_PATH=$path HTTP=$code"
            grep -Ei '^(content-type|x-aplus-origin|location|server|cf-cache-status):' /tmp/calendar-headers || true
            echo "BODY_PREFIX=$(head -c 60 /tmp/calendar-body | tr '\n' ' ')"
          done

      - name: Compare Cloudflare and direct primary paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIMARY_HOST"
          for path in /health/ /calendar/invalid.ics /api/calendar/feed/invalid.ics; do
            for route in direct cloudflare; do
              url="https://app.aplus-solution.de$path"
              if [ "$route" = direct ]; then
                code=$(curl -sS --max-time 20 --resolve "app.aplus-solution.de:443:$PRIMARY_HOST" -o /tmp/route-response -w '%{http_code}' "$url") || true
              else
                code=$(curl -sS --max-time 20 -o /tmp/route-response -w '%{http_code}' "$url") || true
              fi
              printf 'ROUTE_COMPARE %s %s status=%s type=' "$route" "$path" "$code"
              if head -c 32 /tmp/route-response | grep -q 'Kalenderfeed'; then echo 'plain-error'; elif head -c 50 /tmp/route-response | grep -q '<!doctype html'; then echo 'spa-html'; elif head -c 80 /tmp/route-response | grep -q '"status"'; then echo 'json-health'; else echo 'other'; fi
            done
          done

      - name: Confirm direct origin does not traverse an HTTP proxy
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIMARY_HOST"
          for path in /health/ /calendar/invalid.ics; do
            outcome=$(curl --noproxy '*' -sS --max-time 20 --resolve "app.aplus-solution.de:443:$PRIMARY_HOST" -o /tmp/direct-check -w '%{http_code} %{remote_ip}' "https://app.aplus-solution.de$path") || true
            read -r status connected <<< "$outcome"
            if [ "$connected" = "$PRIMARY_HOST" ]; then origin=yes; else origin=no; fi
            if head -c 32 /tmp/direct-check | grep -q 'Kalenderfeed'; then kind=calendar-404; elif head -c 50 /tmp/direct-check | grep -q '<!doctype html'; then kind=spa-html; else kind=other; fi
            echo "DIRECT_ORIGIN_TEST path=$path status=$status connected_to_strato_secret=$origin type=$kind"
          done
