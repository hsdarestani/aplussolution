name: Diagnose Strato edge connectivity

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-edge-fix.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DOMAIN: app.aplus-solution.de
      NEW_HOST: ${{ secrets.STRATO_HOST }}
      NEW_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$NEW_HOST"
          test -n "$NEW_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$NEW_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Inspect and repair origin services
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$NEW_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          echo '=== Docker services ==='
          docker compose ps

          echo '=== Listening ports before firewall adjustment ==='
          ss -lntp | grep -E ':(22|80|443)\b' || true

          echo '=== Linux firewall ==='
          if command -v ufw >/dev/null 2>&1; then
            ufw status verbose || true
            if ufw status | grep -q '^Status: active'; then
              ufw allow 22/tcp
              ufw allow 80/tcp
              ufw allow 443/tcp
              ufw reload
            fi
            ufw status verbose || true
          fi

          echo '=== Ensure Caddy is running ==='
          docker compose up -d caddy
          sleep 3
          docker compose ps caddy

          echo '=== Caddy logs ==='
          docker compose logs --no-color --tail=120 caddy || true

          echo '=== Local backend check ==='
          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/
          echo

          echo '=== Local Caddy HTTP check ==='
          curl -sS -o /dev/null -D - --max-time 10 -H 'Host: app.aplus-solution.de' http://127.0.0.1/health/ || true

          echo '=== Local Caddy HTTPS check ==='
          curl -vk --max-time 15 --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/health/ || true

          echo '=== Listening ports after repair ==='
          ss -lntp | grep -E ':(22|80|443)\b' || true
          REMOTE

      - name: Test origin directly from the Internet
        run: |
          set +e
          echo '=== Direct origin HTTP ==='
          curl -v --max-time 15 -H "Host: $DOMAIN" "http://$NEW_HOST/health/"
          HTTP_RC=$?
          echo "Direct HTTP exit code: $HTTP_RC"

          echo '=== Direct origin HTTPS (Cloudflare bypass) ==='
          curl -vk --max-time 20 --resolve "$DOMAIN:443:$NEW_HOST" "https://$DOMAIN/health/"
          HTTPS_RC=$?
          echo "Direct HTTPS exit code: $HTTPS_RC"

          echo '=== Public Cloudflare endpoint ==='
          curl -vk --max-time 20 "https://$DOMAIN/health/"
          PUBLIC_RC=$?
          echo "Public HTTPS exit code: $PUBLIC_RC"

          if [ "$HTTPS_RC" -ne 0 ]; then
            echo 'RESULT=ORIGIN_NOT_REACHABLE' >> "$GITHUB_ENV"
          elif [ "$PUBLIC_RC" -ne 0 ]; then
            echo 'RESULT=CLOUDFLARE_TO_ORIGIN_FAILURE' >> "$GITHUB_ENV"
          else
            echo 'RESULT=HEALTHY' >> "$GITHUB_ENV"
          fi
          exit 0

      - name: Report diagnosis
        run: |
          echo "Diagnosis: $RESULT"
          if [ "$RESULT" = 'ORIGIN_NOT_REACHABLE' ]; then
            echo 'The app is healthy inside Strato but TCP 80/443 is not reachable from the Internet. This points to the Strato network firewall/security layer.'
            exit 2
          fi
          if [ "$RESULT" = 'CLOUDFLARE_TO_ORIGIN_FAILURE' ]; then
            echo 'The Strato origin is directly reachable but Cloudflare still cannot proxy it. Check Cloudflare origin record/SSL settings.'
            exit 3
          fi
          echo 'Public endpoint is healthy.'

      - name: Remove SSH key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
