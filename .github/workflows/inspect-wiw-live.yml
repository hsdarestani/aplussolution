name: Repair and inspect live WIW fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'ops/verify-wiw-production-fix'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Upload deterministic verification script
        run: |
          test -s .ops/verify_wiw_production.py
          sshpass -e scp -q -o StrictHostKeyChecking=no .ops/verify_wiw_production.py root@"$HOST":/root/verify_wiw_production.py
      - name: Rebuild backend and verify WIW resources
        run: |
          set -euo pipefail
          set +x
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE' 2>&1 | tee live-wiw-repair.txt
          set -euo pipefail
          cd /opt/aplussolution
          grep -q 'USER_CONTEXT_CACHE_KEY' backend/core/wiw.py

          docker compose build --no-cache backend
          docker compose up -d --force-recreate backend celery celery-beat
          for attempt in $(seq 1 30); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" = 30 ]; then
              docker compose logs --tail=100 backend
              exit 1
            fi
            sleep 4
          done

          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python -c "from core.wiw import WhenIWorkClient; assert hasattr(WhenIWorkClient, 'resolve_user_context'); print('CONTAINER_FIX_PRESENT true')"

          BACKEND_ID=$(docker compose ps -q backend)
          test -n "$BACKEND_ID"
          docker cp /root/verify_wiw_production.py "$BACKEND_ID":/tmp/verify_wiw_production.py
          docker compose exec -T backend sh -c 'python manage.py shell < /tmp/verify_wiw_production.py'
          docker compose exec -T backend rm -f /tmp/verify_wiw_production.py
          rm -f /root/verify_wiw_production.py

          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null
          curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null
          echo 'LIVE_WIW_REPAIR_COMPLETE true'
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-wiw-repair
          path: live-wiw-repair.txt
          retention-days: 1
