name: Verify rebuilt WIW production backend

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-wiw-production-fix'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Upload standalone verification files
        run: |
          test -s .ops/verify_wiw_production.py
          test -s .ops/repair_wiw_production.sh
          sshpass -e scp -q -o StrictHostKeyChecking=no .ops/verify_wiw_production.py root@"$HOST":/root/verify_wiw_production.py
          sshpass -e scp -q -o StrictHostKeyChecking=no .ops/repair_wiw_production.sh root@"$HOST":/root/repair_wiw_production.sh
      - name: Verify WIW resources, full sync and Arbeitszeitkonto
        run: |
          set -euo pipefail
          set +x
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'chmod 700 /root/repair_wiw_production.sh && /root/repair_wiw_production.sh' 2>&1 | tee live-wiw-verification.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-wiw-verification
          path: live-wiw-verification.txt
          retention-days: 1
