name: Hide archived WIW records from operations dashboard

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hide-archived-wiw-dashboard.yml

permissions:
  contents: write

# One-shot patch workflow; remove after successful application.
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Filter archive-only WIW data from admin exception center
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('backend/core/admin_center_views.py')
          text = path.read_text()

          replacements = [
            (
              """        Shift.objects.filter(\n            status__in=[Shift.Status.PUBLISHED, Shift.Status.CONFIRMED],\n            ends_at__gte=now,\n        ).select_related('client', 'location', 'position').annotate(""",
              """        Shift.objects.filter(\n            status__in=[Shift.Status.PUBLISHED, Shift.Status.CONFIRMED],\n            ends_at__gte=now,\n        ).filter(\n            Q(wiw_shift_id__isnull=True) | Q(wiw_shift_id='')\n        ).select_related('client', 'location', 'position').annotate(""",
            ),
            (
              """        ShiftSlot.objects.filter(\n            status=ShiftSlot.Status.CLAIMED,\n            worker__isnull=False,\n            shift__status__in=[Shift.Status.PUBLISHED, Shift.Status.CONFIRMED],""",
              """        ShiftSlot.objects.filter(\n            status=ShiftSlot.Status.CLAIMED,\n            worker__isnull=False,\n            worker__active=True,\n            worker__user__is_active=True,\n            shift__status__in=[Shift.Status.PUBLISHED, Shift.Status.CONFIRMED],""",
            ),
            (
              """            shift__ends_at__gte=now - timedelta(hours=12),\n        ).select_related(""",
              """            shift__ends_at__gte=now - timedelta(hours=12),\n        ).filter(\n            Q(shift__wiw_shift_id__isnull=True) | Q(shift__wiw_shift_id='')\n        ).select_related(""",
            ),
            (
              """    late_legacy = Shift.objects.filter(\n        worker__isnull=False,\n        status__in=[Shift.Status.PUBLISHED, Shift.Status.CONFIRMED],""",
              """    late_legacy = Shift.objects.filter(\n        worker__isnull=False,\n        worker__active=True,\n        worker__user__is_active=True,\n        status__in=[Shift.Status.PUBLISHED, Shift.Status.CONFIRMED],""",
            ),
            (
              """        ends_at__gte=now - timedelta(hours=12),\n    ).exclude(""",
              """        ends_at__gte=now - timedelta(hours=12),\n    ).filter(\n        Q(wiw_shift_id__isnull=True) | Q(wiw_shift_id='')\n    ).exclude(""",
            ),
            (
              """    for correction in TimeEntryCorrection.objects.filter(\n        status=TimeEntryCorrection.Status.PENDING\n    ).select_related('requested_by__user', 'entry').order_by('created_at')[:60]:""",
              """    for correction in TimeEntryCorrection.objects.filter(\n        status=TimeEntryCorrection.Status.PENDING,\n        requested_by__active=True,\n        requested_by__user__is_active=True,\n    ).filter(\n        Q(entry__wiw_time_id__isnull=True) | Q(entry__wiw_time_id='')\n    ).select_related('requested_by__user', 'entry').order_by('created_at')[:60]:""",
            ),
            (
              """    for entry in TimeEntry.objects.filter(\n        approved=False,\n        clock_out__isnull=False,\n    ).select_related('worker__user', 'shift__position').order_by('clock_out')[:60]:""",
              """    for entry in TimeEntry.objects.filter(\n        approved=False,\n        clock_out__isnull=False,\n        worker__active=True,\n        worker__user__is_active=True,\n    ).filter(\n        Q(wiw_time_id__isnull=True) | Q(wiw_time_id='')\n    ).select_related('worker__user', 'shift__position').order_by('clock_out')[:60]:""",
            ),
            (
              """    workers = list(WorkerProfile.objects.filter(active=True).select_related('user').order_by('user__last_name')[:250])""",
              """    workers = list(WorkerProfile.objects.filter(active=True, user__is_active=True).select_related('user').order_by('user__last_name')[:250])""",
            ),
            (
              """    for run in IntegrationSyncRun.objects.filter(\n        status=IntegrationSyncRun.Status.FAILED,\n        started_at__gte=now - timedelta(days=14),\n    ).order_by('-started_at')[:20]:""",
              """    for run in IntegrationSyncRun.objects.filter(\n        status=IntegrationSyncRun.Status.FAILED,\n        started_at__gte=now - timedelta(days=14),\n    ).exclude(provider='wiw').order_by('-started_at')[:20]:""",
            ),
            (
              """    for request in TimeOffRequest.objects.filter(status=TimeOffRequest.Status.PENDING).select_related(\n        'worker__user'\n    ).order_by('created_at')[:40]:""",
              """    for request in TimeOffRequest.objects.filter(\n        status=TimeOffRequest.Status.PENDING,\n        worker__active=True,\n        worker__user__is_active=True,\n    ).select_related('worker__user').order_by('created_at')[:40]:""",
            ),
            (
              """    for swap in ShiftSwapRequest.objects.filter(status=ShiftSwapRequest.Status.PENDING).select_related(\n        'requested_by__user', 'shift__position'\n    ).order_by('created_at')[:40]:""",
              """    for swap in ShiftSwapRequest.objects.filter(\n        status=ShiftSwapRequest.Status.PENDING,\n        requested_by__active=True,\n        requested_by__user__is_active=True,\n    ).filter(\n        Q(shift__wiw_shift_id__isnull=True) | Q(shift__wiw_shift_id='')\n    ).select_related('requested_by__user', 'shift__position').order_by('created_at')[:40]:""",
            ),
          ]

          for old, new in replacements:
            if new in text:
              continue
            if old not in text:
              raise SystemExit(f'patch marker not found: {old[:100]!r}')
            text = text.replace(old, new, 1)

          path.write_text(text)

          test_path = Path('backend/tests/test_admin_center_phase4.py')
          tests = test_path.read_text()
          tests = tests.replace("provider='wiw',", "provider='mail',", 1)

          import_old = """    TimeEntry,\n)"""
          import_new = """    TimeEntry,\n    User,\n    WorkerProfile,\n)"""
          if import_new not in tests:
            if import_old not in tests:
              raise SystemExit('test import marker not found')
            tests = tests.replace(import_old, import_new, 1)

          new_test = r'''

@pytest.mark.django_db
def test_admin_exception_center_ignores_archived_wiw_history(auth_admin, company, location, position):
    now = timezone.now()
    archived_user = User.objects.create_user(
        email='wiw-archive-123@sync.invalid',
        password='unused',
        role=User.Role.WORKER,
        is_active=False,
        is_onboarded=False,
        wiw_id='archive-123',
        wiw_payload={'historical_archive_stub': True, 'source': 'wiw_times'},
    )
    archived_worker = WorkerProfile.objects.create(
        user=archived_user,
        employee_number='WIW-HIST-ARCHIVE-123',
        active=False,
        wiw_user_id='archive-123',
        wiw_payload={'historical_archive_stub': True, 'source': 'wiw_times'},
    )
    archived_shift = Shift.objects.create(
        client=company,
        location=location,
        position=position,
        worker=archived_worker,
        starts_at=now - timedelta(days=2),
        ends_at=now - timedelta(days=2) + timedelta(hours=4),
        status=Shift.Status.COMPLETED,
        required_count=1,
        wiw_shift_id='wiw-shift-archive-123',
    )
    archived_entry = TimeEntry.objects.create(
        worker=archived_worker,
        shift=archived_shift,
        clock_in=archived_shift.starts_at,
        clock_out=archived_shift.ends_at,
        approved=False,
        wiw_time_id='wiw-time-archive-123',
    )
    IntegrationSyncRun.objects.create(
        provider='wiw',
        status=IntegrationSyncRun.Status.FAILED,
        mode='final_full',
        errors=[{'error': 'historischer Importfehler'}],
    )

    response = auth_admin.get('/api/admin/exceptions/')
    assert response.status_code == 200
    assert not any(item.get('object_id') == str(archived_entry.id) for item in response.data['results'])
    assert not any('wiw-archive-123@sync.invalid' in item.get('message', '') for item in response.data['results'])
    assert not any(item['category'] == 'integrations' and 'WIW' in item.get('message', '') for item in response.data['results'])
'''
          marker = 'def test_admin_exception_center_filters_category_and_query'
          if 'test_admin_exception_center_ignores_archived_wiw_history' not in tests:
            idx = tests.find('@pytest.mark.django_db\n' + marker)
            if idx < 0:
              raise SystemExit('test insertion marker not found')
            tests = tests[:idx] + new_test + '\n\n' + tests[idx:]
          test_path.write_text(tests)
          PY
          git diff --check
          git diff -- backend/core/admin_center_views.py backend/tests/test_admin_center_phase4.py
      - name: Commit archive filtering
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/core/admin_center_views.py backend/tests/test_admin_center_phase4.py
          git commit -m "Keep archived WIW history out of admin attention queue"
          git push origin main
