name: Apply Berlin German Akten changes
on:
  push:
    branches: [feature/berlin-german-akten]
    paths:
      - '.github/workflows/apply-berlin-german-akten.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/berlin-german-akten
      - name: Apply source patches
        run: python scripts/fix_akte_view_routing.py
      - name: Commit implementation
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add frontend
          git diff --cached --quiet && exit 0
          git commit -m 'align Akte routing with app shell router'
          git push origin HEAD:feature/berlin-german-akten
