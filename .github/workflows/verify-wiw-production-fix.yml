name: Verify WIW production authentication fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-wiw-production-fix'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Upload deterministic verification script
        run: |
          test -s .ops/verify_wiw_production.py
          sshpass -e scp -q -o StrictHostKeyChecking=no .ops/verify_wiw_production.py root@"$HOST":/root/verify_wiw_production.py
      - name: Wait for deploy, run full WIW sync and verify working time
        run: |
          set -euo pipefail
          set +x
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE' 2>&1 | tee wiw-production-verification.txt
          set -euo pipefail
          cd /opt/aplussolution

          for attempt in $(seq 1 20); do
            if grep -q 'USER_CONTEXT_CACHE_KEY' backend/core/wiw.py && docker compose exec -T backend python -c "from core.wiw import WhenIWorkClient; assert hasattr(WhenIWorkClient, 'resolve_user_context')" >/dev/null 2>&1; then
              echo "DEPLOYED_FIX_VISIBLE true"
              break
            fi
            if [ "$attempt" = 20 ]; then
              echo "DEPLOYED_FIX_VISIBLE false"
              exit 1
            fi
            sleep 20
          done

          docker compose exec -T backend python manage.py check
          BACKEND_ID=$(docker compose ps -q backend)
          test -n "$BACKEND_ID"
          docker cp /root/verify_wiw_production.py "$BACKEND_ID":/tmp/verify_wiw_production.py
          docker compose exec -T backend sh -c 'python manage.py shell < /tmp/verify_wiw_production.py'
          docker compose exec -T backend rm -f /tmp/verify_wiw_production.py
          rm -f /root/verify_wiw_production.py

          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null
          curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null
          HTTP_CODE=$(curl -sS -o /tmp/login-check.json -w '%{http_code}' -X POST https://solution.smarbiz.sbs/api/auth/login/ -H 'Content-Type: application/json' --data '{"email":"invalid@example.com","password":"invalid"}')
          test "$HTTP_CODE" != 502
          test "$HTTP_CODE" != 503
          echo "PUBLIC_LOGIN_HTTP $HTTP_CODE"
          echo "WIW_PRODUCTION_FIX_VERIFIED true"
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiw-production-verification
          path: wiw-production-verification.txt
          retention-days: 1
