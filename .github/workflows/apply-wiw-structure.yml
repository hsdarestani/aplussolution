name: Apply WIW familiar structure

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.head_ref == 'feature/wiw-familiar-structure' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiw-familiar-structure
          fetch-depth: 0
      - name: Apply structure migration
        run: python scripts/apply_wiw_familiar_structure.py
      - name: Commit generated changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/src/AdminHomeV4.tsx frontend/src/Operations.tsx frontend/e2e/app-shell.spec.ts
          git commit -m "Align admin and worker structure with familiar WIW workflow"
          git push origin HEAD:feature/wiw-familiar-structure
