name: One-time notification kind model fix
on:
  push:
    branches: [fix/notification-kind-length]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/notification-kind-length
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Widen notification kind model field
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/core/models.py')
          text = path.read_text(encoding='utf-8')
          old = "    kind = models.CharField(max_length=50, default='general')"
          new = "    kind = models.CharField(max_length=120, default='general')"
          if new not in text:
              if old not in text:
                  raise SystemExit('Notification.kind marker not found')
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/fix-notification-kind-length.yml
      - name: Validate migration state
        run: |
          pip install -r backend/requirements.txt
          cd backend
          python manage.py check
          python manage.py makemigrations --check --dry-run
          pytest -q --disable-warnings --maxfail=1 tests/test_notification_kinds.py tests/test_attendance_phase3.py tests/test_attendance_phase3_actions.py
      - name: Commit validated model fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/models.py .github/workflows/fix-notification-kind-length.yml
          git commit -m 'Widen notification kind model field'
          git push origin HEAD:fix/notification-kind-length
