name: Apply WordPress workflow migration

on:
  pull_request:
    branches: [main]
  push:
    branches: [feature/wiw-document-automation-tests]

permissions:
  contents: write

concurrency:
  group: wordpress-migration-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate-and-test:
    if: github.event_name == 'push' || github.head_ref == 'feature/wiw-document-automation-tests'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiw-document-automation-tests
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Detect staged migration
        id: staged
        shell: bash
        run: |
          if [ -f .plugin-integration/chunk-00 ]; then
            echo 'present=true' >> "$GITHUB_OUTPUT"
          else
            echo 'present=false' >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        if: steps.staged.outputs.present == 'true'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - uses: actions/setup-node@v4
        if: steps.staged.outputs.present == 'true'
        with:
          node-version: '22'

      - name: Reconstruct verified migration archive
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .plugin-integration/chunk-00 \
            .plugin-integration/chunk-01 \
            .plugin-integration/chunk-02 \
            .plugin-integration/chunk-03 \
            .plugin-integration/chunk-04 \
            .plugin-integration/chunk-05 \
            .plugin-integration/chunk-06 \
            .plugin-integration/chunk-07 > /tmp/wordpress-plugin-migration.tar.gz.b64
          echo '4d731d054630f4da5c1d168228992012aac0b1218b1f9937a05c6ba3e0854e63  /tmp/wordpress-plugin-migration.tar.gz.b64' | sha256sum -c -
          base64 --decode /tmp/wordpress-plugin-migration.tar.gz.b64 > /tmp/wordpress-plugin-migration.tar.gz
          echo 'b4807dccb2b9f956b2db102590b891d489b0913d1e6ea634c06072f4684128c0  /tmp/wordpress-plugin-migration.tar.gz' | sha256sum -c -
          tar -xzf /tmp/wordpress-plugin-migration.tar.gz -C .
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/tests/test_plugin_migration.py')
          text = path.read_text()
          old = '''@pytest.mark.django_db
def test_migrated_endpoints_require_manager(auth_worker, auth_admin):
    assert auth_worker.get('/api/automation/orders/packages/').status_code == 403
    assert auth_worker.get('/api/working-time/settings/').status_code == 403
    assert auth_admin.get('/api/automation/orders/packages/').status_code == 200
    assert auth_admin.get('/api/working-time/settings/').status_code == 200
'''
          new = '''@pytest.mark.django_db
def test_migrated_endpoints_require_manager(api_client, worker_user, admin_user):
    api_client.force_authenticate(worker_user)
    assert api_client.get('/api/automation/orders/packages/').status_code == 403
    assert api_client.get('/api/working-time/settings/').status_code == 403
    api_client.force_authenticate(admin_user)
    assert api_client.get('/api/automation/orders/packages/').status_code == 200
    assert api_client.get('/api/working-time/settings/').status_code == 200
'''
          if old not in text:
              raise SystemExit('Expected permission test block was not found')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -rf .plugin-integration

      - name: Generate and validate Django migrations
        if: steps.staged.outputs.present == 'true'
        shell: bash
        env:
          DJANGO_SECRET_KEY: ci-wordpress-migration-secret
          DATABASE_URL: sqlite:///plugin-migration.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: |
          set -euo pipefail
          pip install -r backend/requirements.txt
          cd backend
          python manage.py makemigrations core --noinput
          python -m compileall .
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Run complete backend test suite
        id: backend
        continue-on-error: true
        if: steps.staged.outputs.present == 'true'
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-wordpress-tests-secret
          DATABASE_URL: sqlite:///plugin-tests.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: |
          set -o pipefail
          pytest --nomigrations --cov=core --cov-report=term-missing --cov-fail-under=60 2>&1 | tee /tmp/backend-migration-tests.log

      - name: Upload backend test log
        if: always() && steps.staged.outputs.present == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: backend-migration-tests-log
          path: /tmp/backend-migration-tests.log
          retention-days: 1

      - name: Stop after backend failure
        if: steps.backend.outcome != 'success'
        run: exit 1

      - name: Run frontend tests and production build
        if: steps.staged.outputs.present == 'true'
        working-directory: frontend
        env:
          VITE_API_URL: https://solution.smarbiz.sbs/api
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm test
          npm run build

      - name: Commit only validated migration
        if: steps.staged.outputs.present == 'true'
        shell: bash
        run: |
          set -euo pipefail
          rm -f backend/.coverage frontend/package-lock.json
          rm -rf backend/htmlcov
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Migrate WIW order automation and Arbeitszeitkonto from WordPress'
          git push origin HEAD:feature/wiw-document-automation-tests
