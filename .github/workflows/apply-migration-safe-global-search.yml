name: Apply migration-safe global search

on:
  push:
    branches: ['fix/migration-safe-global-search']
    paths:
      - '.github/workflows/apply-migration-safe-global-search.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Patch backend search and regression coverage
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          view_path = Path('backend/core/admin_center_views.py')
          text = view_path.read_text()

          anchor = "SEVERITY_ORDER = {'critical': 0, 'warning': 1, 'info': 2}\n"
          constant = "SYNTHETIC_MIGRATION_EMAIL_SUFFIX = '@sync.invalid'\n"
          if constant not in text:
              if anchor not in text:
                  raise SystemExit('Could not find severity anchor')
              text = text.replace(anchor, anchor + constant, 1)

          old_workers = "    workers = WorkerProfile.objects.filter(worker_q).select_related('user').order_by('-active', 'user__last_name')[:per_group]\n"
          new_workers = """    workers = (\n        WorkerProfile.objects.filter(worker_q)\n        .exclude(user__email__iendswith=SYNTHETIC_MIGRATION_EMAIL_SUFFIX)\n        .select_related('user')\n        .order_by('-active', 'user__last_name')[:per_group]\n    )\n"""
          if old_workers in text:
              text = text.replace(old_workers, new_workers, 1)
          elif new_workers not in text:
              raise SystemExit('Could not find worker search queryset')
          view_path.write_text(text)

          test_path = Path('backend/tests/test_admin_center_phase4.py')
          tests = test_path.read_text()
          old_import = "    Shift,\n    TimeEntry,\n)\n"
          new_import = "    Shift,\n    TimeEntry,\n    User,\n    WorkerProfile,\n)\n"
          if old_import in tests:
              tests = tests.replace(old_import, new_import, 1)
          elif '    User,\n    WorkerProfile,\n)\n' not in tests:
              raise SystemExit('Could not extend model imports')

          marker = 'def test_global_search_filters_migration_only_workers_before_limit'
          if marker not in tests:
              tests += """


@pytest.mark.django_db
def test_global_search_filters_migration_only_workers_before_limit(auth_admin, worker_user):
    for index in range(5):
        user = User.objects.create_user(
            f'anna-migration-{index}@sync.invalid',
            'StrongPass123!',
            first_name='Anna',
            last_name=f'Aaa Migration {index}',
            role=User.Role.WORKER,
            is_onboarded=True,
        )
        WorkerProfile.objects.create(
            user=user,
            employee_number=f'MIG-{index:03d}',
            employment_type='minijob',
            monthly_hours='38.90',
            tariff_hourly_rate='14.50',
        )

    response = auth_admin.get('/api/search/global/?q=Anna&limit=3')
    assert response.status_code == 200

    workers = response.data['groups']['workers']
    assert any(item['id'] == str(worker_user.worker_profile.id) for item in workers)
    assert all('@sync.invalid' not in item['subtitle'].lower() for item in workers)
    assert all('@sync.invalid' not in item['subtitle'].lower() for item in response.data['results'])
"""
          test_path.write_text(tests)
          PY

      - name: Install backend test dependencies
        working-directory: backend
        run: pip install -r requirements.txt

      - name: Run focused regression tests
        working-directory: backend
        run: pytest -q tests/test_admin_center_phase4.py

      - name: Validate patch
        run: |
          python -m py_compile backend/core/admin_center_views.py backend/tests/test_admin_center_phase4.py
          git diff --check

      - name: Commit tested patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- backend/core/admin_center_views.py backend/tests/test_admin_center_phase4.py
          if git diff --cached --quiet; then
            echo 'No code changes needed.'
            exit 0
          fi
          git commit -m 'Filter migration-only workers before global search limit'
          git push origin "HEAD:${GITHUB_REF_NAME}"
