name: Freeze DR background writers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-dr-freeze.yml'

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Stop DR background workers until final sync
        run: |
          set -euo pipefail
          sshpass -p "$BACKUP_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            root@"$BACKUP_HOST" '
              cd /opt/aplussolution
              docker compose stop celery celery-beat
              docker compose ps
              echo DR_BACKGROUND_FROZEN
            '
