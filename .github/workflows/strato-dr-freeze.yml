name: Freeze legacy STRATO background writers

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-dr-freeze.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure STRATO SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Stop legacy STRATO schedulers and workers
        run: |
          set -euo pipefail
          ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=15             root@"$STRATO_HOST" '
              cd /opt/aplussolution
              docker compose stop celery celery-beat
              test -z "$(docker compose ps -q celery --status running)"
              test -z "$(docker compose ps -q celery-beat --status running)"
              docker compose ps
              echo LEGACY_STRATO_WRITERS_FROZEN
            '

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
