name: Diagnose native push production

on:
  push:
    paths:
      - '.github/workflows/production-native-push-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-native-push-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Inspect and verify production iOS push
        run: |
          set -euo pipefail
          DIAG_B64="$(python3 - <<'PY'
          import base64
          code = r'''import json
          from datetime import timedelta
          from django.utils import timezone
          from core.models import Notification, User
          from core.push_models import PushDevice, PushDelivery
          from core.push_notifications import push_provider_status, _apns_values, _send_ios

          recent = timezone.now() - timedelta(hours=3)
          admins = User.objects.filter(role='admin', is_active=True).order_by('email')
          team_id, key_id, private_key, bundle_id, sandbox = _apns_values()
          payload = {
              'providers': push_provider_status(),
              'apns_config': {
                  'team_id': team_id,
                  'key_id': key_id,
                  'bundle_id': bundle_id,
                  'sandbox': sandbox,
                  'private_key_present': bool(private_key),
              },
              'active_admin_users': admins.count(),
              'active_devices_total': PushDevice.objects.filter(active=True).count(),
              'admin_android_active': PushDevice.objects.filter(user__role='admin', active=True, platform='android').count(),
              'admin_ios_active': PushDevice.objects.filter(user__role='admin', active=True, platform='ios').count(),
              'admin_android_inactive': PushDevice.objects.filter(user__role='admin', active=False, platform='android').count(),
              'admin_ios_inactive': PushDevice.objects.filter(user__role='admin', active=False, platform='ios').count(),
              'admins': [],
              'recent_open_shift_notifications': [],
              'ios_test_send': None,
          }
          for admin in admins:
              payload['admins'].append({
                  'email': admin.email,
                  'name': admin.get_full_name(),
                  'devices': [
                      {
                          'platform': d.platform,
                          'active': d.active,
                          'last_seen_at': d.last_seen_at.isoformat() if d.last_seen_at else None,
                          'last_error': d.last_error,
                          'app_id': d.app_id,
                          'device_name': d.device_name,
                      }
                      for d in PushDevice.objects.filter(user=admin).order_by('-last_seen_at')
                  ],
              })
          notes = Notification.objects.filter(
              user__role='admin',
              kind__startswith='admin-open-shift-summary-',
              created_at__gte=recent,
          ).select_related('user').order_by('-created_at')[:30]
          for n in notes:
              payload['recent_open_shift_notifications'].append({
                  'id': str(n.id),
                  'user_email': n.user.email,
                  'user_name': n.user.get_full_name(),
                  'created_at': n.created_at.isoformat(),
                  'kind': n.kind,
                  'title': n.title,
                  'body': n.body,
                  'deliveries': [
                      {
                          'platform': x.device.platform,
                          'device_active': x.device.active,
                          'device_last_seen_at': x.device.last_seen_at.isoformat() if x.device.last_seen_at else None,
                          'sent_at': x.sent_at.isoformat() if x.sent_at else None,
                          'delivery_last_error': x.last_error,
                          'device_last_error': x.device.last_error,
                      }
                      for x in PushDelivery.objects.filter(notification=n).select_related('device').order_by('device__platform', 'created_at')
                  ],
              })

          ios = PushDevice.objects.filter(user__role='admin', active=True, platform='ios').order_by('-last_seen_at').first()
          sample = Notification.objects.filter(user=ios.user).order_by('-created_at').first() if ios else None
          if ios and sample:
              ok, error, invalid = _send_ios(
                  ios,
                  sample,
                  'A+ Solution Push-Test',
                  'iOS-Push nach Servermigration erfolgreich geprüft.',
              )
              payload['ios_test_send'] = {'ok': ok, 'error': error, 'invalid': invalid}
              if ok:
                  ios.last_error = ''
                  ios.save(update_fields=['last_error', 'updated_at'])
          print(json.dumps(payload, ensure_ascii=False, default=str))
          '''
          print(base64.b64encode(code.encode()).decode())
          PY
          )"

          : > /tmp/push-diagnostic.txt
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" \
            "cd /opt/aplussolution && printf '%s' '$DIAG_B64' | base64 -d | docker compose exec -T backend python manage.py shell" \
            > /tmp/push-diagnostic.txt 2>&1

          echo '--- CELERY ---' >> /tmp/push-diagnostic.txt
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" \
            "cd /opt/aplussolution && docker compose logs --since=3h --no-color celery 2>&1 | grep -E 'send_notification_push|FCM|APNs|Task core\\.push_notifications' | tail -n 200 || true" \
            >> /tmp/push-diagnostic.txt 2>&1

          echo "diagnostic_bytes=$(wc -c < /tmp/push-diagnostic.txt)"

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-push-production-diagnostic
          path: /tmp/push-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/push-diagnostic.txt
