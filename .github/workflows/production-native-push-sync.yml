name: Diagnose native push production

on:
  push:
    paths:
      - '.github/workflows/production-native-push-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-native-push-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ensure SSH tooling
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo -n timeout 60s apt-get install -y -qq sshpass || {
              sudo -n timeout 90s apt-get update -qq
              sudo -n timeout 60s apt-get install -y -qq sshpass
            }
          fi

      - name: Prepare diagnostic script
        run: |
          cat > /tmp/pushdiag.py <<'PY'
          import base64
          import json
          import os
          import sys
          from datetime import timedelta

          sys.path.insert(0, '/app')
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django
          django.setup()

          from django.utils import timezone
          from core.models import Notification, User
          from core.push_models import PushDevice
          from core.push_notifications import push_provider_status, _firebase_credentials, firebase_project_id

          raw = os.getenv('FIREBASE_CREDENTIALS_JSON', '')
          parsed = _firebase_credentials()
          manual_b64_ok = False
          manual_json_ok = False
          if raw and not raw.lstrip().startswith('{'):
              try:
                  decoded = base64.b64decode(raw).decode('utf-8')
                  manual_b64_ok = True
                  json.loads(decoded)
                  manual_json_ok = True
              except Exception:
                  pass

          recent = timezone.now() - timedelta(hours=2)
          admin_devices = PushDevice.objects.filter(user__role='admin').order_by('-last_seen_at')
          result = {
              'push_providers': push_provider_status(),
              'firebase_env_project_present': bool(os.getenv('FIREBASE_PROJECT_ID', '').strip()),
              'firebase_resolved_project_present': bool(firebase_project_id()),
              'firebase_credentials_env_present': bool(raw.strip()),
              'firebase_credentials_length': len(raw),
              'firebase_credentials_starts_json': raw.lstrip().startswith('{'),
              'firebase_credentials_manual_b64_ok': manual_b64_ok,
              'firebase_credentials_manual_json_ok': manual_json_ok,
              'firebase_parsed_nonempty': bool(parsed),
              'firebase_parsed_has_project_id': bool(parsed.get('project_id')) if parsed else False,
              'firebase_parsed_has_client_email': bool(parsed.get('client_email')) if parsed else False,
              'firebase_parsed_has_private_key': bool(parsed.get('private_key')) if parsed else False,
              'active_admin_users': User.objects.filter(role='admin', is_active=True).count(),
              'active_devices_total': PushDevice.objects.filter(active=True).count(),
              'admin_android_active': admin_devices.filter(active=True, platform='android').count(),
              'admin_ios_active': admin_devices.filter(active=True, platform='ios').count(),
              'admin_android_inactive': admin_devices.filter(active=False, platform='android').count(),
              'admin_ios_inactive': admin_devices.filter(active=False, platform='ios').count(),
              'recent_admin_open_shift_notifications': Notification.objects.filter(
                  user__role='admin', kind__startswith='admin-open-shift-summary-', created_at__gte=recent
              ).count(),
              'admin_devices': [
                  {
                      'platform': device.platform,
                      'active': device.active,
                      'last_seen_at': device.last_seen_at.isoformat() if device.last_seen_at else None,
                      'last_error': (device.last_error or '')[:1000],
                  }
                  for device in admin_devices[:10]
              ],
          }
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Collect production push state
        continue-on-error: true
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set +e
          : > /tmp/pushdiag.out
          test -n "$HOST" && test -n "$SSHPASS" || { echo 'missing ssh secret' >> /tmp/pushdiag.out; exit 0; }
          SSH_OPTS='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15'
          sshpass -e scp $SSH_OPTS /tmp/pushdiag.py root@"$HOST":/tmp/pushdiag.py >> /tmp/pushdiag.out 2>&1
          echo "script_scp_exit=$?" >> /tmp/pushdiag.out
          sshpass -e ssh $SSH_OPTS root@"$HOST" 'bash -s' >> /tmp/pushdiag.out 2>&1 <<'REMOTE'
          set +e
          cd /opt/aplussolution || { echo 'cd_failed'; exit 0; }
          echo 'REMOTE_DIAGNOSTIC_BEGIN'
          CID="$(docker compose ps -q backend)"
          echo "backend_cid_present=$([ -n "$CID" ] && echo yes || echo no)"
          if [ -n "$CID" ]; then
            docker cp /tmp/pushdiag.py "$CID":/tmp/pushdiag.py
            docker compose exec -T backend python /tmp/pushdiag.py
            echo "python_diag_exit=$?"
          fi
          echo '--- celery push task log tail ---'
          docker compose logs --since=2h --no-color celery 2>&1 | grep -E 'send_notification_push|FCM|APNs|Task core\.push_notifications' | tail -n 120 || true
          echo 'REMOTE_DIAGNOSTIC_END'
          exit 0
          REMOTE
          echo "ssh_diag_exit=$?" >> /tmp/pushdiag.out

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-push-production-diagnostic
          path: /tmp/pushdiag.out
          retention-days: 1
