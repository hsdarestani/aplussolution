name: Diagnose native push production

on:
  push:
    paths:
      - '.github/workflows/production-native-push-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-native-push-diagnostics-${{ github.ref }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Inspect production push path
        run: |
          set -uo pipefail
          : > /tmp/push-diagnostic.txt
          set +e
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            root@"$STRATO_HOST" 'bash -s' > /tmp/push-diagnostic.txt 2>&1 <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null
          echo 'PUSH_DIAGNOSTIC_BEGIN'
          docker compose exec -T backend python manage.py shell <<'PY'
          from datetime import timedelta
          from django.utils import timezone
          from core.models import Notification, User
          from core.push_models import PushDevice, PushDelivery
          from core.push_notifications import push_provider_status

          recent = timezone.now() - timedelta(hours=3)
          admins = User.objects.filter(role='admin', is_active=True).order_by('email')
          print('push_providers=', push_provider_status(), flush=True)
          print('active_admin_users=', admins.count(), flush=True)
          print('active_devices_total=', PushDevice.objects.filter(active=True).count(), flush=True)
          print('admin_android_active=', PushDevice.objects.filter(user__role='admin', active=True, platform='android').count(), flush=True)
          print('admin_ios_active=', PushDevice.objects.filter(user__role='admin', active=True, platform='ios').count(), flush=True)
          print('admin_android_inactive=', PushDevice.objects.filter(user__role='admin', active=False, platform='android').count(), flush=True)
          print('admin_ios_inactive=', PushDevice.objects.filter(user__role='admin', active=False, platform='ios').count(), flush=True)

          print('--- ADMIN DEVICE STATE ---', flush=True)
          for admin in admins:
              print('ADMIN', {
                  'user_id': str(admin.id),
                  'email': admin.email,
                  'name': admin.get_full_name(),
              }, flush=True)
              devices = PushDevice.objects.filter(user=admin).order_by('-last_seen_at')
              for d in devices:
                  print(' DEVICE', {
                      'id': str(d.id),
                      'platform': d.platform,
                      'active': d.active,
                      'last_seen_at': d.last_seen_at.isoformat() if d.last_seen_at else None,
                      'last_error': d.last_error,
                      'app_id': d.app_id,
                      'device_name': d.device_name,
                  }, flush=True)

          print('--- RECENT ADMIN OPEN SHIFT NOTIFICATIONS ---', flush=True)
          notes = Notification.objects.filter(
              user__role='admin',
              kind__startswith='admin-open-shift-summary-',
              created_at__gte=recent,
          ).select_related('user').order_by('-created_at')[:20]
          print('recent_count=', notes.count(), flush=True)
          for n in notes:
              print(' NOTIFICATION', {
                  'id': str(n.id),
                  'user_email': n.user.email,
                  'user_name': n.user.get_full_name(),
                  'created_at': n.created_at.isoformat(),
                  'kind': n.kind,
                  'title': n.title,
                  'body': n.body,
              }, flush=True)
              deliveries = PushDelivery.objects.filter(notification=n).select_related('device').order_by('device__platform', 'created_at')
              if not deliveries.exists():
                  print('  DELIVERY none', flush=True)
              for delivery in deliveries:
                  print('  DELIVERY', {
                      'platform': delivery.device.platform,
                      'device_active': delivery.device.active,
                      'device_last_seen_at': delivery.device.last_seen_at.isoformat() if delivery.device.last_seen_at else None,
                      'sent_at': delivery.sent_at.isoformat() if delivery.sent_at else None,
                      'last_error': delivery.last_error,
                      'device_last_error': delivery.device.last_error,
                  }, flush=True)
          PY
          echo '--- CELERY PUSH TASK LOG TAIL ---'
          docker compose logs --since=3h --no-color celery 2>&1 | grep -E 'send_notification_push|FCM|APNs|Task core\.push_notifications' | tail -n 200 || true
          echo 'PUSH_DIAGNOSTIC_END'
          REMOTE
          diagnostic_exit=$?
          set -e
          echo "diagnostic_exit=$diagnostic_exit"
          echo "diagnostic_bytes=$(wc -c < /tmp/push-diagnostic.txt)"
          if [ "$diagnostic_exit" -ne 0 ]; then
            tail -n 80 /tmp/push-diagnostic.txt || true
            exit "$diagnostic_exit"
          fi

      - name: Upload diagnostic artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-push-production-diagnostic
          path: /tmp/push-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/push-diagnostic.txt
