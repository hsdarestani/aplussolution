name: Repair native push production

on:
  push:
    paths:
      - '.github/workflows/production-native-push-sync.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-native-push-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 7
    steps:
      - name: Ensure SSH tooling
        run: |
          set -euo pipefail
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo -n timeout 60s apt-get install -y -qq sshpass || {
              sudo -n timeout 90s apt-get update -qq
              sudo -n timeout 60s apt-get install -y -qq sshpass
            }
          fi

      - name: Repair Firebase configuration and test Android delivery
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          test -n "$FIREBASE_PROJECT_ID" && test -n "$FIREBASE_CREDENTIALS_JSON_BASE64"
          PROJECT_B64="$(printf '%s' "$FIREBASE_PROJECT_ID" | base64 -w0)"
          CREDS_B64="$FIREBASE_CREDENTIALS_JSON_BASE64"
          SSH_OPTS='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3'

          sshpass -e ssh $SSH_OPTS root@"$HOST" \
            "PROJECT_B64='$PROJECT_B64' CREDS_B64='$CREDS_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          export FIREBASE_PROJECT_VALUE="$(printf '%s' "$PROJECT_B64" | base64 -d)"
          export FIREBASE_CREDS_VALUE="$CREDS_B64"

          python3 - <<'PY'
          import os
          from pathlib import Path

          path = Path('.env')
          lines = path.read_text(encoding='utf-8').splitlines()
          updates = {
              'FIREBASE_PROJECT_ID': os.environ['FIREBASE_PROJECT_VALUE'].strip(),
              'FIREBASE_CREDENTIALS_JSON': os.environ['FIREBASE_CREDS_VALUE'].strip(),
          }
          output = []
          seen = set()
          for line in lines:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0].strip()
                  if key in updates:
                      output.append(f'{key}={updates[key]}')
                      seen.add(key)
                      continue
              output.append(line)
          for key, value in updates.items():
              if key not in seen:
                  output.append(f'{key}={value}')
          path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          chmod 600 .env

          docker compose up -d --force-recreate backend celery celery-beat
          ready=0
          for i in $(seq 1 30); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1

          docker compose exec -T backend python manage.py shell -c "from core.push_notifications import push_provider_status; s=push_provider_status(); assert s.get('android'), s; print('Android provider ready')"
          docker compose exec -T backend python manage.py shell -c "from core.models import Notification; from core.push_models import PushDevice; from core.push_notifications import _send_android; d=PushDevice.objects.filter(active=True,user__role='admin',platform='android').order_by('-last_seen_at').first(); n=Notification.objects.filter(user=d.user,kind__startswith='admin-open-shift-summary-').order_by('-created_at').first() if d else None; assert d is not None, 'No active admin Android device'; assert n is not None, 'No admin OpenShift notification'; ok,error,invalid=_send_android(d,n); print('Android direct push sent=',ok,'invalid=',invalid,'error=',error[:250]); assert ok, error"
          REMOTE
