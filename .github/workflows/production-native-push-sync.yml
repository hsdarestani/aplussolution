name: Sync native push production

on:
  workflow_run:
    workflows: ["Validate and deploy production"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-native-push-production
  cancel-in-progress: true

jobs:
  sync:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Prepare SSH authentication
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PASSWORD"
          cat > /tmp/aplus-askpass.sh <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          ASKPASS
          chmod 700 /tmp/aplus-askpass.sh

      - name: Prepare production push configuration
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON_BASE64: ${{ secrets.FIREBASE_CREDENTIALS_JSON_BASE64 }}
          APNS_TEAM_ID: ${{ secrets.APNS_TEAM_ID }}
          APNS_KEY_ID: ${{ secrets.APNS_KEY_ID }}
          APNS_PRIVATE_KEY_BASE64: ${{ secrets.APNS_PRIVATE_KEY_BASE64 }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          required = [
              'FIREBASE_PROJECT_ID',
              'FIREBASE_CREDENTIALS_JSON_BASE64',
              'APNS_TEAM_ID',
              'APNS_KEY_ID',
              'APNS_PRIVATE_KEY_BASE64',
          ]
          missing = [name for name in required if not os.environ.get(name, '').strip()]
          if missing:
              raise SystemExit('Missing native push secrets: ' + ', '.join(missing))

          try:
              apns_key = base64.b64decode(os.environ['APNS_PRIVATE_KEY_BASE64']).decode('utf-8').strip()
          except Exception as exc:
              raise SystemExit(f'APNS_PRIVATE_KEY_BASE64 is invalid: {exc}')
          if 'BEGIN PRIVATE KEY' not in apns_key:
              raise SystemExit('Decoded APNs key is not a .p8 private key')

          escaped_apns = apns_key.replace('\\', '\\\\').replace('\n', '\\n')
          lines = [
              f"FIREBASE_PROJECT_ID={os.environ['FIREBASE_PROJECT_ID'].strip()}",
              f"FIREBASE_CREDENTIALS_JSON={os.environ['FIREBASE_CREDENTIALS_JSON_BASE64'].strip()}",
              f"APNS_TEAM_ID={os.environ['APNS_TEAM_ID'].strip()}",
              f"APNS_KEY_ID={os.environ['APNS_KEY_ID'].strip()}",
              f"APNS_PRIVATE_KEY={escaped_apns}",
              'APNS_BUNDLE_ID=de.aplussolution.workforce',
              'APNS_USE_SANDBOX=0',
          ]
          path = Path('/tmp/aplus-push.env')
          path.write_text('\n'.join(lines) + '\n', encoding='utf-8')
          path.chmod(0o600)
          print('Native push secret bundle prepared without exposing values.')
          PY

      - name: Sync push configuration and verify production
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          SSH_ASKPASS: /tmp/aplus-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$DEPLOY_PASSWORD"
          export DEPLOY_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          setsid -w scp -q \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            /tmp/aplus-push.env root@"$HOST":/tmp/aplus-push.env

          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          test -f .env
          test -f /tmp/aplus-push.env

          python3 - <<'PY'
          from pathlib import Path

          env_path = Path('.env')
          patch_path = Path('/tmp/aplus-push.env')
          updates = {}
          for line in patch_path.read_text(encoding='utf-8').splitlines():
              if not line or '=' not in line:
                  continue
              key, value = line.split('=', 1)
              updates[key] = value

          existing = env_path.read_text(encoding='utf-8').splitlines()
          output = []
          seen = set()
          for line in existing:
              if '=' in line and not line.lstrip().startswith('#'):
                  key = line.split('=', 1)[0]
                  if key in updates:
                      output.append(f'{key}={updates[key]}')
                      seen.add(key)
                      continue
              output.append(line)
          for key, value in updates.items():
              if key not in seen:
                  output.append(f'{key}={value}')
          env_path.write_text('\n'.join(output) + '\n', encoding='utf-8')
          PY
          chmod 600 .env
          rm -f /tmp/aplus-push.env

          docker compose up -d --force-recreate backend celery celery-beat

          ready=0
          for i in $(seq 1 30); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 3
          done
          test "$ready" -eq 1

          docker compose exec -T backend python manage.py shell -c "from core.push_notifications import push_provider_status; from core.push_models import PushDevice; s=push_provider_status(); print('push_providers=', s); print('active_devices=', PushDevice.objects.filter(active=True).count()); print('admin_android_devices=', PushDevice.objects.filter(active=True, user__role='admin', platform='android').count()); print('admin_ios_devices=', PushDevice.objects.filter(active=True, user__role='admin', platform='ios').count()); print('devices_with_last_error=', PushDevice.objects.filter(active=True).exclude(last_error='').count()); assert s.get('android') and s.get('ios')"
          REMOTE
