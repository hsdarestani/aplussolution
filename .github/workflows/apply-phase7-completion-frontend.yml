name: Apply Phase 7 completion frontend

on:
  push:
    branches:
      - feature/phase7-completion-sweep
    paths:
      - scripts/phase7_completion_frontend_patch.py
      - .github/workflows/apply-phase7-completion-frontend.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase7-completion-sweep
      - name: Apply patch
        run: python scripts/phase7_completion_frontend_patch.py
      - name: Commit product changes and retire helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/phase7_completion_frontend_patch.py .github/workflows/apply-phase7-completion-frontend.yml
          git add frontend/src frontend/e2e/friendly-datetime.spec.ts
          git commit -m 'Finish Phase 7 staffing UX gaps'
          git push origin HEAD:feature/phase7-completion-sweep
