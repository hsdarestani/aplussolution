name: One-time workforce completion finalizer

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: read

jobs:
  finalize:
    if: >-
      github.repository == 'hsdarestani/aplussolution' &&
      github.event.issue.pull_request &&
      github.event.issue.number == 9 &&
      github.event.comment.body == '/finalize-workforce-completion'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          repository: hsdarestani/aplussolution
          ref: feature/complete-workforce-parity
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply final security and workflow hardening
        run: python scripts/finalize_workforce_completion.py
      - name: Validate backend syntax
        run: python -m compileall backend
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://solution.smarbiz.sbs/api
        run: npm install --no-audit --no-fund && npm run build
      - name: Persist validated finalization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/core/oauth.py backend/core/views.py backend/core/advanced_views.py frontend/src/App.tsx
          git diff --cached --quiet && exit 0
          git commit -m "Harden workforce permissions, GPS and contracts"
          git push origin HEAD:feature/complete-workforce-parity
