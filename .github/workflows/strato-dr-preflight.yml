name: STRATO DR preflight

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-dr-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
      STRATO_IPV6: 2a01:239:44b:d900::1
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Configure STRATO key
        run: |
          set -euo pipefail
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Test STRATO over IPv6 from GitHub runner
        continue-on-error: true
        run: |
          set -euo pipefail
          ssh -6 -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=12 \
            root@"$STRATO_IPV6" \
            'echo STRATO_IPV6_SSH_OK; test -s /root/aplus-db.dump; test -s /root/aplus-media.tgz; test -s /root/aplus.env.backup; ls -lh /root/aplus-db.dump /root/aplus-media.tgz /root/aplus.env.backup'

      - name: Test backup server
        run: |
          set -euo pipefail
          test -n "$BACKUP_HOST"
          test -n "$BACKUP_PASSWORD"
          sshpass -p "$BACKUP_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=12 \
            root@"$BACKUP_HOST" '
              echo BACKUP_SSH_OK
              uname -a
              . /etc/os-release 2>/dev/null || true
              echo "OS=${PRETTY_NAME:-unknown}"
              echo "--- disk ---"
              df -h /
              echo "--- memory ---"
              free -h
              echo "--- docker ---"
              if command -v docker >/dev/null 2>&1; then docker --version; docker compose version || true; else echo DOCKER_NOT_INSTALLED; fi
              echo "--- ports 80/443 ---"
              ss -lntp | grep -E ":(80|443) " || true
              echo "--- global IPv6 ---"
              ip -6 -o addr show scope global || true
              echo "--- IPv6 route ---"
              ip -6 route || true
              echo "--- caddy restart ---"
              cd /opt/aplussolution
              docker compose restart caddy || true
              sleep 12
              echo "--- caddy status ---"
              docker compose ps caddy || true
              echo "--- caddy logs ---"
              docker compose logs --no-color --tail=120 caddy || true
              echo "--- local HTTPS ---"
              curl -skv --max-time 12 --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/health/ -o /dev/null 2>&1 | tail -80 || true
              echo "--- push providers ---"
              docker compose exec -T backend python manage.py shell -c "from core.push_notifications import push_provider_status; from core.push_models import PushDevice; print('provider_status='+str(push_provider_status())); print('active_android='+str(PushDevice.objects.filter(active=True,platform='android').count())); print('active_ios='+str(PushDevice.objects.filter(active=True,platform='ios').count()))" </dev/null || true
              echo "--- firebase auth ---"
              docker compose exec -T backend python manage.py shell -c "from core.push_notifications import _fcm_access_token; print('fcm_auth_ok='+str(bool(_fcm_access_token())))" </dev/null || echo FCM_AUTH_FAILED
              echo "--- apns signing ---"
              docker compose exec -T backend python manage.py shell -c "from core.push_notifications import _apns_provider_token; print('apns_signing_ok='+str(bool(_apns_provider_token())))" </dev/null || echo APNS_SIGNING_FAILED
              echo "--- celery status ---"
              docker compose ps celery celery-beat || true
              echo "--- recent celery errors ---"
              docker compose logs --no-color --tail=120 celery celery-beat 2>&1 | grep -Ei "error|exception|traceback" | tail -40 || true
            '

      - name: Check whether backup host has IPv6
        run: |
          python3 - <<'PY'
          import os, socket
          host = os.environ["BACKUP_HOST"]
          infos = socket.getaddrinfo(host, 22, type=socket.SOCK_STREAM)
          has_v6 = any(item[0] == socket.AF_INET6 for item in infos)
          print("BACKUP_HOST_IPV6=" + ("yes" if has_v6 else "no"))
          PY

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
