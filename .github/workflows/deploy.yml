name: Validate and deploy production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: aplus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  integrate_phase4:
    if: github.event_name == 'pull_request' && github.head_ref == 'feature/admin-exception-search-phase4' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/admin-exception-search-phase4
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
      - name: Apply validated Phase 4 integration
        run: python scripts/phase4_integrate.py
      - name: Restore workflow and remove temporary integration helpers
        run: |
          git fetch origin main
          git checkout origin/main -- .github/workflows/deploy.yml
          rm -f .github/workflows/phase4-integrate-admin-search.yml scripts/phase4_integrate.py
      - name: Commit Phase 4 integration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/admin_center_views.py frontend/src/App.tsx .github/workflows/deploy.yml .github/workflows/phase4-integrate-admin-search.yml scripts/phase4_integrate.py
          git commit -m 'Integrate Phase 4 admin exception search UX'
          git push origin HEAD:feature/admin-exception-search-phase4
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate backend syntax and Django configuration
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-validation-secret-only
          DATABASE_URL: sqlite:///ci.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: |
          python -m compileall .
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run backend tests with coverage
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-only
          DATABASE_URL: sqlite:///test.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: pytest --nomigrations --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://solution.smarbiz.sbs/api
        run: npm run build
  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass rsync
      - name: Upload release
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'mkdir -p /opt/aplussolution'
          sshpass -e rsync -az --delete --exclude '.git' --exclude '.env' --exclude 'frontend/node_modules' -e 'ssh -o StrictHostKeyChecking=no' ./ root@"$HOST":/opt/aplussolution/
      - name: Configure production secrets and start release
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          WIW_DEV_KEY: ${{ secrets.WIW_DEV_KEY }}
          WIW_EMAIL: ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
          WIW_USER_ID: ${{ secrets.WIW_USER_ID }}
          WIW_OPENAI_KEY: ${{ secrets.WIW_OPENAI_KEY }}
          WIW_WEBHOOK_SECRET: ${{ secrets.WIW_WEBHOOK_SECRET }}
        run: |
          set -euo pipefail
          test -n "$WIW_DEV_KEY" && test -n "$WIW_EMAIL" && test -n "$WIW_PASSWORD" && test -n "$WIW_USER_ID"
          b64() { printf '%s' "$1" | base64 -w0; }
          export WIW_DEV_KEY_B64="$(b64 "$WIW_DEV_KEY")"
          export WIW_EMAIL_B64="$(b64 "$WIW_EMAIL")"
          export WIW_PASSWORD_B64="$(b64 "$WIW_PASSWORD")"
          export WIW_USER_ID_B64="$(b64 "$WIW_USER_ID")"
          export WIW_OPENAI_KEY_B64="$(b64 "$WIW_OPENAI_KEY")"
          export WIW_WEBHOOK_SECRET_B64="$(b64 "$WIW_WEBHOOK_SECRET")"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" \
            "WIW_DEV_KEY_B64='$WIW_DEV_KEY_B64' WIW_EMAIL_B64='$WIW_EMAIL_B64' WIW_PASSWORD_B64='$WIW_PASSWORD_B64' WIW_USER_ID_B64='$WIW_USER_ID_B64' WIW_OPENAI_KEY_B64='$WIW_OPENAI_KEY_B64' WIW_WEBHOOK_SECRET_B64='$WIW_WEBHOOK_SECRET_B64' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          if [ ! -f .env ]; then
            cp .env.example .env
            DB_PASS=$(openssl rand -hex 24)
            DJANGO_KEY=$(openssl rand -hex 48)
            ADMIN_PASS=$(openssl rand -base64 32 | tr -d '/+=' | head -c 28)
            sed -i 's/^DEBUG=.*/DEBUG=0/' .env
            sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=$DJANGO_KEY/" .env
            sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$DB_PASS/" .env
            sed -i "s#^DATABASE_URL=.*#DATABASE_URL=postgresql://aplussolution:$DB_PASS@db:5432/aplussolution#" .env
            sed -i "s/^DJANGO_SUPERUSER_PASSWORD=.*/DJANGO_SUPERUSER_PASSWORD=$ADMIN_PASS/" .env
            printf 'Admin: admin@aplus-solution.de\nPasswort: %s\n' "$ADMIN_PASS" > /root/aplussolution-initial-admin.txt
            chmod 600 /root/aplussolution-initial-admin.txt
          fi
          upsert_b64() {
            key="$1"; encoded="$2"
            [ -n "$encoded" ] || return 0
            value=$(printf '%s' "$encoded" | base64 -d)
            KEY="$key" VALUE="$value" python - <<'PY'
          import os
          from pathlib import Path
          key, value = os.environ['KEY'], os.environ['VALUE']
          path = Path('.env')
          rows = path.read_text().splitlines()
          replacement = f'{key}={value}'
          for index, row in enumerate(rows):
              if row.startswith(key + '='):
                  rows[index] = replacement
                  break
          else:
              rows.append(replacement)
          path.write_text('\n'.join(rows) + '\n')
          PY
          }
          upsert_b64 WIW_DEV_KEY "$WIW_DEV_KEY_B64"
          upsert_b64 WIW_EMAIL "$WIW_EMAIL_B64"
          upsert_b64 WIW_PASSWORD "$WIW_PASSWORD_B64"
          upsert_b64 WIW_USER_ID "$WIW_USER_ID_B64"
          upsert_b64 WIW_OPENAI_KEY "$WIW_OPENAI_KEY_B64"
          upsert_b64 WIW_WEBHOOK_SECRET "$WIW_WEBHOOK_SECRET_B64"
          grep -q '^WIW_WEBHOOK_SECRET=.' .env || printf 'WIW_WEBHOOK_SECRET=%s\n' "$(openssl rand -hex 32)" >> .env
          if grep -q '^WIW_SYNC_ENABLED=' .env; then sed -i 's/^WIW_SYNC_ENABLED=.*/WIW_SYNC_ENABLED=1/' .env; else printf 'WIW_SYNC_ENABLED=1\n' >> .env; fi
          if ! command -v docker >/dev/null 2>&1; then curl -fsSL https://get.docker.com | sh; fi
          docker compose pull db redis caddy || true
          docker compose up -d --build --remove-orphans
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py shell -c "from core.wiw import WhenIWorkClient; client=WhenIWorkClient(); client.login(force=True); client.collection('shifts', params={'limit': 1}); client.collection('times', params={'limit': 1}); print('WIW authentication and resource access OK')"
          docker compose exec -T backend curl -fsS --retry 10 --retry-delay 5 http://127.0.0.1:8000/health/ >/dev/null
          curl -fsS --retry 10 --retry-delay 5 https://solution.smarbiz.sbs/health/ >/dev/null
          docker compose ps
          docker image prune -f
          REMOTE
