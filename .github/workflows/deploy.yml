name: Validate and deploy production
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aplus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate backend syntax and Django configuration
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-validation-secret-only
          DATABASE_URL: sqlite:///ci.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: |
          python -m compileall .
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run backend tests with coverage
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-only
          DATABASE_URL: sqlite:///test.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: pytest --nomigrations --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: https://solution.smarbiz.sbs/api
        run: npm run build
      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run frontend E2E smoke tests
        working-directory: frontend
        run: npm run test:e2e
  deploy:
    if: github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        timeout-minutes: 3
        run: |
          set -euo pipefail
          sudo timeout 120s apt-get -o Acquire::Retries=3 update -qq
          sudo timeout 120s apt-get -o Acquire::Retries=3 install -y -qq sshpass rsync
      - name: Preflight production connectivity
        timeout-minutes: 2
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e ssh -qT \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=3 \
            root@"$HOST" 'mkdir -p /opt/aplussolution && test -d /opt/aplussolution'
      - name: Upload release
        timeout-minutes: 5
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          sshpass -e rsync -az --delete \
            --exclude '.git' \
            --exclude '.env' \
            --exclude 'frontend/node_modules' \
            -e 'ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3' \
            ./ root@"$HOST":/opt/aplussolution/
      - name: Configure and start production release
        timeout-minutes: 12
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=10 \
            -o ServerAliveCountMax=6 \
            root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          if [ ! -f .env ]; then
            cp .env.example .env
            DB_PASS=$(openssl rand -hex 24)
            DJANGO_KEY=$(openssl rand -hex 48)
            ADMIN_PASS=$(openssl rand -base64 32 | tr -d '/+=' | head -c 28)
            sed -i 's/^DEBUG=.*/DEBUG=0/' .env
            sed -i "s/^DJANGO_SECRET_KEY=.*/DJANGO_SECRET_KEY=$DJANGO_KEY/" .env
            sed -i "s/^POSTGRES_PASSWORD=.*/POSTGRES_PASSWORD=$DB_PASS/" .env
            sed -i "s#^DATABASE_URL=.*#DATABASE_URL=postgresql://aplussolution:$DB_PASS@db:5432/aplussolution#" .env
            sed -i "s/^DJANGO_SUPERUSER_PASSWORD=.*/DJANGO_SUPERUSER_PASSWORD=$ADMIN_PASS/" .env
            printf 'Admin: admin@aplus-solution.de\nPasswort: %s\n' "$ADMIN_PASS" > /root/aplussolution-initial-admin.txt
            chmod 600 /root/aplussolution-initial-admin.txt
          fi
          if grep -q '^WIW_SYNC_ENABLED=' .env; then
            sed -i 's/^WIW_SYNC_ENABLED=.*/WIW_SYNC_ENABLED=0/' .env
          else
            printf 'WIW_SYNC_ENABLED=0\n' >> .env
          fi
          if ! command -v docker >/dev/null 2>&1; then curl -fsSL https://get.docker.com | sh; fi
          docker compose pull db redis caddy || true

          # backend/entrypoint.sh owns migrate + collectstatic + bootstrap.
          # Do not invoke migrate in parallel from the deployment shell: doing
          # so can race PostgreSQL DDL while the backend container is starting.
          docker compose up -d --build --remove-orphans

          backend_ready=0
          for i in $(seq 1 60); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              backend_ready=1
              break
            fi
            sleep 5
          done
          if [ "$backend_ready" -ne 1 ]; then
            echo 'Backend did not become ready; recent backend logs:' >&2
            docker compose logs --no-color --tail=250 backend >&2 || true
            exit 1
          fi

          # Read-only post-start checks: migrations have already completed in
          # entrypoint before Gunicorn starts serving the health endpoint.
          docker compose exec -T backend python manage.py migrate --check
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py shell -c "from django.conf import settings; assert settings.WIW_SYNC_ENABLED is False; print('A+ Workforce source-of-truth mode OK')"
          curl -fsS --retry 10 --retry-delay 5 https://solution.smarbiz.sbs/health/ >/dev/null
          docker compose ps
          docker image prune -f
          REMOTE
