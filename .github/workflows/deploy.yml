name: Validate and deploy A+ Solution

on:
  push:
    branches: [main]
    paths-ignore:
      - '.github/workflows/**'
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PRODUCTION_DOMAIN: app.aplus-solution.de

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate backend syntax and Django configuration
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-validation-secret-only
          DATABASE_URL: sqlite:///ci.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: |
          python -m compileall .
          python manage.py check
          python manage.py makemigrations --check --dry-run
      - name: Run backend tests with coverage
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-only
          DATABASE_URL: sqlite:///test.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: pytest --nomigrations --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend for production
        working-directory: frontend
        env:
          VITE_API_URL: https://app.aplus-solution.de/api
        run: npm run build

  deploy:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && !contains(github.event.head_commit.message, '[frontend-only]'))
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      PRIMARY_HOST: ${{ secrets.STRATO_HOST }}
      PRIMARY_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure STRATO SSH
        run: |
          set -euo pipefail
          test -n "$PRIMARY_HOST"
          test -n "$PRIMARY_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIMARY_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Package release
        run: |
          set -euo pipefail
          tar             --exclude='.git'             --exclude='.env'             --exclude='frontend/node_modules'             -czf /tmp/aplussolution-release.tgz .

      - name: Upload release to STRATO primary
        run: |
          set -euo pipefail
          scp -q \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            /tmp/aplussolution-release.tgz root@"$PRIMARY_HOST":/tmp/aplussolution-release.tgz

      - name: Deploy release to STRATO primary without replacing production data
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            root@"$PRIMARY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          mkdir -p /opt/aplussolution
          cd /opt/aplussolution
          test -f .env

          # Replace application source only. The primary database, Redis state,
          # media and TLS volumes remain untouched.
          find /opt/aplussolution -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          tar -xzf /tmp/aplussolution-release.tgz -C /opt/aplussolution
          rm -f /tmp/aplussolution-release.tgz

          docker compose pull db redis caddy || true
          docker compose up -d --build --remove-orphans
          docker compose up -d --force-recreate --no-deps caddy

          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile

          backend_ready=0
          for i in $(seq 1 60); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              backend_ready=1
              break
            fi
            sleep 3
          done
          if [ "$backend_ready" -ne 1 ]; then
            docker compose ps -a >&2 || true
            docker compose logs --no-color --tail=250 backend >&2 || true
            exit 1
          fi

          sleep 4
          for service in backend frontend caddy celery celery-beat db redis; do
            cid=$(docker compose ps -q "$service")
            if [ -z "$cid" ] || [ "$(docker inspect -f '{{.State.Running}}' "$cid")" != 'true' ]; then
              echo "Required service is not running: $service" >&2
              docker compose logs --no-color --tail=180 "$service" >&2 || true
              exit 1
            fi
          done

          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py migrate --check
          docker compose exec -T backend python manage.py shell -c "from core.push_notifications import push_provider_status; s=push_provider_status(); assert s.get('android') and s.get('ios'), s; print('PRIMARY_PUSH_PROVIDERS_OK')"
          curl -fsS --max-time 15 --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/health/

          docker compose ps
          docker image prune -f >/dev/null 2>&1 || true
          REMOTE

      - name: Verify public production is served by STRATO primary
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            rm -f /tmp/headers /tmp/health
            if curl -fsS --retry 2 --retry-delay 3 --max-time 20               -D /tmp/headers -o /tmp/health               "https://${PRODUCTION_DOMAIN}/health/?primary_check=${GITHUB_RUN_ID}-$i"               && grep -q '"status"' /tmp/health               && grep -qi '^x-aplus-origin: strato-primary' /tmp/headers; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" -eq 1
          echo "A+ Solution STRATO primary is serving https://${PRODUCTION_DOMAIN}"

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/aplussolution-release.tgz /tmp/headers /tmp/health
