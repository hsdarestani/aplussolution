name: Validate A+ Solution

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-validate-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate backend syntax and Django configuration
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-validation-secret-only
          DATABASE_URL: sqlite:///ci.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: |
          python -m compileall .
          python manage.py check
          python manage.py makemigrations --check --dry-run
          bash -n ../scripts/production_wiw_full_reset.sh
      - name: Run backend tests with coverage
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: ci-test-secret-only
          DATABASE_URL: sqlite:///test.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: pytest --nomigrations --cov=core --cov-report=term-missing --cov-report=xml --cov-fail-under=60
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Run frontend tests
        working-directory: frontend
        run: npm test
      - name: Build frontend for new production domain
        working-directory: frontend
        env:
          VITE_API_URL: https://app.aplus-solution.de/api
        run: npm run build
