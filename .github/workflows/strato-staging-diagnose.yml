name: Repair and verify staging TLS on Strato

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-staging-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_DOMAIN: staging.app.aplus-solution.de
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Rebind Caddy config and verify origin
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          grep -q 'staging.app.aplus-solution.de' Caddyfile
          docker compose up -d --force-recreate --no-deps caddy
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile
          docker compose exec -T caddy grep -q 'staging.app.aplus-solution.de' /etc/caddy/Caddyfile
          docker compose exec -T caddy wget -qO- http://aplus_staging_edge/health/

          production_ok=0
          staging_ok=0
          for i in $(seq 1 36); do
            if [ "$production_ok" -eq 0 ] && curl -fsS --connect-timeout 5 --max-time 15 --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/health/ >/dev/null 2>&1; then
              production_ok=1
            fi
            if [ "$staging_ok" -eq 0 ] && curl -fsS --connect-timeout 5 --max-time 15 --resolve staging.app.aplus-solution.de:443:127.0.0.1 https://staging.app.aplus-solution.de/health/ >/dev/null 2>&1; then
              staging_ok=1
            fi
            if [ "$production_ok" -eq 1 ] && [ "$staging_ok" -eq 1 ]; then
              break
            fi
            sleep 5
          done

          echo "production_origin_tls=$production_ok"
          echo "staging_origin_tls=$staging_ok"
          if [ "$staging_ok" -ne 1 ]; then
            docker compose logs --no-color --since=15m caddy 2>&1 | grep -Ei 'staging\.app\.aplus-solution\.de|acme|certificate|challenge|authorization|tls|issuer|error' | tail -200 >&2 || true
          fi
          test "$production_ok" -eq 1
          test "$staging_ok" -eq 1
          REMOTE

      - name: Verify public production and staging
        run: |
          set -euo pipefail
          curl -fsS --retry 8 --retry-delay 3 --connect-timeout 10 --max-time 20 https://app.aplus-solution.de/health/
          curl -fsS --retry 12 --retry-delay 5 --connect-timeout 10 --max-time 20 "https://${STAGING_DOMAIN}/health/"

      - name: Cleanup runner key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
