name: Inspect staging backend state

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-staging-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Inspect staging backend containers
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set +e
          cd /opt/aplussolution-staging
          COMPOSE='docker compose -p aplus_staging -f docker-compose.staging.yml'

          echo '=== compose ps -a ==='
          $COMPOSE ps -a

          for service in staging_backend staging_db staging_redis staging_celery staging_frontend staging_edge; do
            echo "=== $service state ==="
            cid=$($COMPOSE ps -aq "$service" | head -n1)
            echo "cid=$cid"
            if [ -n "$cid" ]; then
              docker inspect -f 'status={{.State.Status}} running={{.State.Running}} restart_count={{.RestartCount}} exit_code={{.State.ExitCode}} error={{.State.Error}} oom_killed={{.State.OOMKilled}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$cid" || true
              docker inspect -f '{{json .NetworkSettings.Networks}}' "$cid" || true
            fi
          done

          echo '=== backend logs ==='
          $COMPOSE logs --no-color --tail=400 staging_backend 2>&1 || true

          echo '=== db logs ==='
          $COMPOSE logs --no-color --tail=160 staging_db 2>&1 || true

          echo '=== edge logs ==='
          $COMPOSE logs --no-color --tail=200 staging_edge 2>&1 || true

          echo '=== backend env sanity (non-secret) ==='
          backend_id=$($COMPOSE ps -aq staging_backend | head -n1)
          if [ -n "$backend_id" ] && [ "$(docker inspect -f '{{.State.Running}}' "$backend_id" 2>/dev/null)" = 'true' ]; then
            $COMPOSE exec -T staging_backend sh -lc 'echo DATABASE_HOST=${DATABASE_URL#*@}; echo REDIS_URL=$REDIS_URL; echo ALLOWED_HOSTS=$ALLOWED_HOSTS; echo APP_URL=$APP_URL' || true
            $COMPOSE exec -T staging_backend curl -v --max-time 10 http://127.0.0.1:8000/health/ || true
          fi
          exit 0
          REMOTE

      - name: Cleanup runner key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
