name: Trace staging Docker gateway path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-staging-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_DOMAIN: staging.app.aplus-solution.de
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Trace production gateway to staging edge
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set +e
          PROD_DIR=/opt/aplussolution
          STAGING_DIR=/opt/aplussolution-staging
          cd "$PROD_DIR"
          prod_caddy_id=$(docker compose ps -q caddy)
          echo "prod_caddy_id=$prod_caddy_id"
          echo '=== production Caddy networks ==='
          docker inspect -f '{{json .NetworkSettings.Networks}}' "$prod_caddy_id"

          cd "$STAGING_DIR"
          edge_id=$(docker compose -p aplus_staging -f docker-compose.staging.yml ps -q staging_edge)
          backend_id=$(docker compose -p aplus_staging -f docker-compose.staging.yml ps -q staging_backend)
          echo "staging_edge_id=$edge_id"
          echo "staging_backend_id=$backend_id"
          echo '=== staging edge networks ==='
          docker inspect -f '{{json .NetworkSettings.Networks}}' "$edge_id"
          echo '=== staging backend networks ==='
          docker inspect -f '{{json .NetworkSettings.Networks}}' "$backend_id"

          cd "$PROD_DIR"
          echo '=== DNS from production Caddy ==='
          docker compose exec -T caddy sh -lc 'getent hosts aplus_staging_edge || nslookup aplus_staging_edge || true'
          echo '=== direct HTTP from production Caddy to staging edge ==='
          docker compose exec -T caddy wget -S -O- http://aplus_staging_edge/health/ 2>&1 || true

          echo '=== public request ==='
          curl -vk --connect-timeout 10 --max-time 20 --resolve staging.app.aplus-solution.de:443:127.0.0.1 https://staging.app.aplus-solution.de/health/ 2>&1 | tail -100 || true

          echo '=== production Caddy reverse proxy logs ==='
          docker compose logs --no-color --since=15m caddy 2>&1 | grep -Ei 'aplus_staging_edge|staging\.app\.aplus-solution\.de|dial tcp|connect|502|error' | tail -250 || true

          cd "$STAGING_DIR"
          echo '=== staging edge logs ==='
          docker compose -p aplus_staging -f docker-compose.staging.yml logs --no-color --since=15m staging_edge 2>&1 | tail -250 || true
          exit 0
          REMOTE

      - name: Cleanup runner key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
