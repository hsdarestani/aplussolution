name: Diagnose staging TLS on Strato

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-staging-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_DOMAIN: staging.app.aplus-solution.de
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Runner DNS, CAA and TLS view
        run: |
          set +e
          echo '=== A ==='
          dig +short A "$STAGING_DOMAIN"
          echo '=== CNAME ==='
          dig +short CNAME "$STAGING_DOMAIN"
          echo '=== inherited CAA ==='
          for name in "$STAGING_DOMAIN" app.aplus-solution.de aplus-solution.de; do
            echo "-- $name"
            dig +short CAA "$name"
          done
          echo '=== TLS ==='
          curl -vkI --connect-timeout 10 --max-time 20 "https://${STAGING_DOMAIN}/health/" 2>&1 | grep -E 'Trying|Connected|TLS|SSL|subject:|issuer:|HTTP/' | tail -80
          exit 0

      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Read Caddy ACME state on origin
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set +e
          cd /opt/aplussolution

          echo '=== live route ==='
          docker compose exec -T caddy sh -lc "grep -n 'staging.app.aplus-solution.de' /etc/caddy/Caddyfile || true"

          echo '=== upstream ==='
          docker compose exec -T caddy wget -qO- http://aplus_staging_edge/health/ || true

          echo '=== local SNI TLS ==='
          curl -vk --connect-timeout 10 --max-time 20 --resolve staging.app.aplus-solution.de:443:127.0.0.1 https://staging.app.aplus-solution.de/health/ 2>&1 | grep -E 'Trying|Connected|TLS|SSL|subject:|issuer:|HTTP/|error' | tail -80

          echo '=== stored cert files ==='
          docker compose exec -T caddy sh -lc "find /data/caddy/certificates -type f 2>/dev/null | grep -F 'staging.app.aplus-solution.de' || true"

          echo '=== ACME/TLS log lines ==='
          docker compose logs --no-color --since=60m caddy 2>&1 | grep -Ei 'staging\.app\.aplus-solution\.de|acme|certificate|challenge|authorization|tls|issuer|error' | tail -160
          exit 0
          REMOTE

      - name: Cleanup runner key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
