name: Read staging backend restart cause

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-staging-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Read backend failure
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set +e
          cd /opt/aplussolution-staging
          COMPOSE='docker compose -p aplus_staging -f docker-compose.staging.yml'
          cid=$($COMPOSE ps -aq staging_backend | head -n1)
          echo "backend_id=$cid"
          docker inspect -f 'status={{.State.Status}} restarts={{.RestartCount}} exit={{.State.ExitCode}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}' "$cid" || true
          echo '=== last backend logs ==='
          docker logs --tail 120 "$cid" 2>&1 || true
          echo '=== migration table from DB ==='
          $COMPOSE exec -T staging_db psql -U aplussolution_staging -d aplussolution_staging -Atc "select app||'.'||name from django_migrations where app='core' order by id desc limit 12;" 2>&1 || true
          exit 0
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
