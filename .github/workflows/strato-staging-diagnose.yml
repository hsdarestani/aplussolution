name: Trace staging TLS path

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-staging-diagnose.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trace:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STAGING_DOMAIN: staging.app.aplus-solution.de
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Compare DNS path and direct origin path
        run: |
          set +e
          origin_ip=$(getent ahostsv4 "$STRATO_HOST" | awk 'NR==1{print $1}')
          staging_ip=$(getent ahostsv4 "$STAGING_DOMAIN" | awk 'NR==1{print $1}')
          echo "origin_resolved=$([ -n "$origin_ip" ] && echo yes || echo no)"
          echo "staging_resolved=$([ -n "$staging_ip" ] && echo yes || echo no)"
          if [ -n "$origin_ip" ] && [ -n "$staging_ip" ] && [ "$origin_ip" = "$staging_ip" ]; then
            echo 'dns_matches_origin=yes'
          else
            echo 'dns_matches_origin=no'
          fi

          echo '=== normal DNS TLS ==='
          curl -vk --connect-timeout 10 --max-time 20 "https://${STAGING_DOMAIN}/health/" >/tmp/normal.out 2>/tmp/normal.err
          normal_rc=$?
          tail -50 /tmp/normal.err
          echo "normal_rc=$normal_rc"

          echo '=== forced origin TLS ==='
          forced_rc=99
          if [ -n "$origin_ip" ]; then
            curl -vk --connect-timeout 10 --max-time 20 --resolve "${STAGING_DOMAIN}:443:${origin_ip}" "https://${STAGING_DOMAIN}/health/" >/tmp/forced.out 2>/tmp/forced.err
            forced_rc=$?
            tail -50 /tmp/forced.err
            cat /tmp/forced.out
          fi
          echo "forced_origin_rc=$forced_rc"
          exit 0

      - name: Read Caddy handshake logs after runner probes
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set +e
          cd /opt/aplussolution
          echo '=== live staging route ==='
          docker compose exec -T caddy grep -n 'staging.app.aplus-solution.de' /etc/caddy/Caddyfile || true
          echo '=== recent Caddy TLS logs ==='
          docker compose logs --no-color --since=5m caddy 2>&1 | grep -Ei 'staging\.app\.aplus-solution\.de|tls|handshake|certificate|acme|error' | tail -200 || true
          exit 0
          REMOTE

      - name: Cleanup runner key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/normal.out /tmp/normal.err /tmp/forced.out /tmp/forced.err
