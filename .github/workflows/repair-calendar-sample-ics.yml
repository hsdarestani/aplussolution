name: Restore public calendar compatibility test as real ICS
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-calendar-sample-ics.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STRATO_HOST }}
      PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload three validated backend and proxy files
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/cal_sample_key"
          chmod 600 "$HOME/.ssh/cal_sample_key"
          opts="-i $HOME/.ssh/cal_sample_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20"
          ssh $opts root@"$HOST" 'mkdir -p /tmp/aplus-calendar-sample-stage'
          scp $opts Caddyfile root@"$HOST":/tmp/aplus-calendar-sample-stage/Caddyfile
          scp $opts backend/core/calendar_sync.py root@"$HOST":/tmp/aplus-calendar-sample-stage/calendar_sync.py
          scp $opts backend/config/urls.py root@"$HOST":/tmp/aplus-calendar-sample-stage/urls.py
      - name: Hot apply with rollback; verify real ICS bytes locally
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/cal_sample_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          b=$(docker compose ps -q backend)
          c=$(docker compose ps -q caddy)
          test -n "$b" && test -n "$c"
          test "$(docker inspect -f '{{.State.Running}}' "$b")" = true
          test "$(docker inspect -f '{{.State.Running}}' "$c")" = true
          stage=/tmp/aplus-calendar-sample-stage
          test -s "$stage/Caddyfile" && test -s "$stage/calendar_sync.py" && test -s "$stage/urls.py"
          grep -Fq 'handle /calendar-compatibility-test.ics' "$stage/Caddyfile"
          grep -Fq 'calendar_compatibility_test' "$stage/calendar_sync.py"
          grep -Fq "path('calendar-compatibility-test.ics'" "$stage/urls.py"
          backup=/tmp/aplus-calendar-sample-backup
          mkdir -p "$backup"
          cp Caddyfile "$backup/Caddyfile"
          cp backend/core/calendar_sync.py "$backup/disk_calendar.py"
          cp backend/config/urls.py "$backup/disk_urls.py"
          docker cp "$b":/app/core/calendar_sync.py "$backup/container_calendar.py"
          docker cp "$b":/app/config/urls.py "$backup/container_urls.py"
          rollback() {
            echo "Restoring previous Calendar configuration"
            cp "$backup/Caddyfile" Caddyfile || true
            cp "$backup/disk_calendar.py" backend/core/calendar_sync.py || true
            cp "$backup/disk_urls.py" backend/config/urls.py || true
            docker cp "$backup/container_calendar.py" "$b":/app/core/calendar_sync.py || true
            docker cp "$backup/container_urls.py" "$b":/app/config/urls.py || true
            docker compose restart backend || true
            docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null || true
          }
          trap rollback ERR
          cp "$stage/Caddyfile" Caddyfile
          cp "$stage/calendar_sync.py" backend/core/calendar_sync.py
          cp "$stage/urls.py" backend/config/urls.py
          docker cp backend/core/calendar_sync.py "$b":/app/core/calendar_sync.py
          docker cp backend/config/urls.py "$b":/app/config/urls.py
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null
          docker compose exec -T backend python -m py_compile /app/core/calendar_sync.py /app/config/urls.py </dev/null
          docker compose restart backend
          docker compose exec -T backend python manage.py check </dev/null
          docker compose exec -T caddy caddy reload --config /etc/caddy/Caddyfile --adapter caddyfile </dev/null
          ok=0
          for attempt in $(seq 1 24); do
            if curl -fsS --max-time 8 --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/health/ | grep -q '"ok"'; then ok=1; break; fi
            sleep 3
          done
          test "$ok" -eq 1
          url=https://app.aplus-solution.de/calendar-compatibility-test.ics
          curl -fsS --max-time 20 --resolve app.aplus-solution.de:443:127.0.0.1 -D /tmp/sample-headers -o /tmp/sample-body "$url"
          grep -Eqi '^content-type: text/calendar' /tmp/sample-headers
          python3 - <<'PY'
          from pathlib import Path
          body=Path('/tmp/sample-body').read_bytes()
          assert body.startswith(b'BEGIN:VCALENDAR\r\n')
          assert body.endswith(b'END:VCALENDAR\r\n')
          assert body.count(b'BEGIN:VEVENT') == 1
          assert b'SUMMARY:A+ Solution Testtermin' in body
          assert b'<html' not in body.lower()
          print('LOCAL_PUBLIC_ICS_OK',len(body))
          PY
          head_status=$(curl -sS -I --max-time 20 --resolve app.aplus-solution.de:443:127.0.0.1 -o /dev/null -w '%{http_code}' "$url")
          test "$head_status" = 200
          echo 'CALENDAR_SAMPLE_RESTORED'
          trap - ERR
          rm -rf "$backup" "$stage" /tmp/sample-headers /tmp/sample-body
          REMOTE
      - name: Verify internet-facing GET and HEAD return calendar, not HTML
        shell: bash
        run: |
          set -euo pipefail
          url=https://app.aplus-solution.de/calendar-compatibility-test.ics
          for attempt in $(seq 1 7); do
            if curl -fsS --max-time 20 -D /tmp/public-headers -o /tmp/public-sample "$url" &&
               grep -Eqi '^content-type: text/calendar' /tmp/public-headers &&
               grep -aq '^BEGIN:VCALENDAR' /tmp/public-sample &&
               ! grep -aq '<!doctype html' /tmp/public-sample &&
               test "$(curl -sS -I --max-time 20 -o /dev/null -w '%{http_code}' "$url")" = 200; then
              echo 'PUBLIC_GET_HEAD_TEXT_CALENDAR_OK'
              exit 0
            fi
            sleep 3
          done
          echo "::error::Public sample still not returning a calendar"
          exit 1
      - name: Remove temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/cal_sample_key"
