name: One-shot final OpenShift idempotence guard

on:
  push:
    paths:
      - '.github/workflows/fix-final-open-shift-idempotence-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch final guard
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Validate backend
        working-directory: backend
        run: |
          python -m pip install -q -r requirements.txt
          python manage.py check
          python -m py_compile core/shift_views.py
          pytest -q tests/test_operational_push_wiring.py tests/test_push_notifications.py
      - name: Commit and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-final-open-shift-idempotence-once.yml
          git add backend/core/shift_views.py
          git commit -m 'Make OpenShift assignment push idempotent'
          git push origin HEAD:main
