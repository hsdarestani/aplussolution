name: Verify active worker credential batch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-verify-active-worker-credential-batch.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify public retrieval page
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 5 --retry-delay 2 --max-time 15 https://app.aplus-solution.de/active-worker-credentials.html | grep -q 'Mitarbeiter-Zugangsdaten'
          echo 'CREDENTIAL_PAGE_OK'

      - name: Verify encrypted batch without reading credentials
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django
          django.setup()
          from core.credential_reset import PASSWORD_RESET_BATCH_KEY, _redis_client, active_real_workers
          ttl = _redis_client().ttl(PASSWORD_RESET_BATCH_KEY)
          active = active_real_workers().count()
          if active != 25:
              raise RuntimeError(f'Unexpected active worker count after reset: {active}')
          if ttl <= 0:
              raise RuntimeError('Encrypted credential batch is missing or expired.')
          print(f'CREDENTIAL_BATCH_OK active_workers={active} ttl_seconds={ttl}')
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
