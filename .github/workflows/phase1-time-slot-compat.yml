name: One-time multi-slot attendance compatibility
on:
  push:
    branches: [feature/wiw-self-service-phase1-ci]
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiw-self-service-phase1-ci
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Make clock-in follow claimed slots
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('backend/core/views.py')
          s=p.read_text(encoding='utf-8')
          old1="""            shift = Shift.objects.filter(pk=request.data.get('shift'), worker=worker).select_related('location').first()
            if not shift:
                return Response({'detail': 'Die ausgewählte Schicht gehört nicht zu deinem Profil.'}, status=403)
"""
          new1="""            shift = Shift.objects.filter(
                pk=request.data.get('shift'),
                slots__worker=worker,
                slots__status='claimed',
            ).select_related('location').distinct().first()
            if not shift:
                return Response({'detail': 'Die ausgewählte Schicht gehört nicht zu deinem Profil.'}, status=403)
"""
          old2="""            shift = Shift.objects.filter(
                worker=worker,
                starts_at__lte=now + timedelta(hours=4),
                ends_at__gte=now - timedelta(hours=4),
                status__in=[Shift.Status.PUBLISHED, Shift.Status.CONFIRMED],
            ).select_related('location').order_by('starts_at').first()
"""
          new2="""            shift = Shift.objects.filter(
                slots__worker=worker,
                slots__status='claimed',
                starts_at__lte=now + timedelta(hours=4),
                ends_at__gte=now - timedelta(hours=4),
                status__in=[Shift.Status.PUBLISHED, Shift.Status.CONFIRMED],
            ).select_related('location').distinct().order_by('starts_at').first()
"""
          if old1 not in s or old2 not in s:
              raise SystemExit('Time-entry slot compatibility marker not found')
          p.write_text(s.replace(old1,new1,1).replace(old2,new2,1),encoding='utf-8')

          t=Path('backend/tests/test_scheduling.py')
          tests=t.read_text(encoding='utf-8')
          marker='''\n\n@pytest.mark.django_db\ndef test_copy_week_and_bulk_publish'''
          test='''\n\n@pytest.mark.django_db\ndef test_multi_place_claim_can_clock_in_without_legacy_shift_worker(company, location, position, second_worker):\n    start = timezone.now() - timedelta(minutes=10)\n    candidate = published_shift(company, location, position, start, required_count=2)\n    client = APIClient(); client.force_authenticate(second_worker.user)\n    claimed = client.post(f'/api/shifts/{candidate.id}/claim/', {}, format='json')\n    assert claimed.status_code == 200\n    candidate.refresh_from_db()\n    assert candidate.worker is None\n    clocked = client.post('/api/time-entries/clock_in/', {'shift': str(candidate.id), 'lat': 50.1101, 'lng': 8.6801}, format='json')\n    assert clocked.status_code == 201\n    assert TimeEntry.objects.filter(worker=second_worker, shift=candidate, clock_out__isnull=True).exists()\n'''
          if 'test_multi_place_claim_can_clock_in_without_legacy_shift_worker' not in tests:
              if marker not in tests: raise SystemExit('Scheduling test insertion marker not found')
              tests=tests.replace(marker,test+marker,1)
              t.write_text(tests,encoding='utf-8')
          PY
          rm .github/workflows/phase1-time-slot-compat.yml
      - name: Validate backend behavior
        run: |
          pip install -r backend/requirements.txt
          cd backend
          python manage.py check
          python manage.py makemigrations --check --dry-run
          pytest -q --disable-warnings --maxfail=1 tests/test_scheduling.py tests/test_wiw.py
      - name: Commit validated compatibility patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/views.py backend/tests/test_scheduling.py .github/workflows/phase1-time-slot-compat.yml
          git commit -m 'Support attendance for multi-slot claimed shifts'
          git push origin HEAD:feature/wiw-self-service-phase1-ci
