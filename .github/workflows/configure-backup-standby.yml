name: Configure backup streaming standby

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/configure-backup-standby.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-ha-maintenance
  cancel-in-progress: false

jobs:
  configure:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Verify STRATO and resolve database address
        run: |
          set -euo pipefail

          state="$(
            ssh -i "$HOME/.ssh/strato_ed25519"               -o IdentitiesOnly=yes               -o StrictHostKeyChecking=no               -o UserKnownHostsFile=/dev/null               root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          recovery="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"' | tr -d '[:space:]')"
          test "$recovery" = "f"
          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null

          DB_CID="$(docker compose ps -q db)"
          test -n "$DB_CID"
          DB_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DB_CID")"
          test -n "$DB_IP"
          timeout 3 bash -c "</dev/tcp/$DB_IP/5432"

          printf '%s\n' "$DB_IP"
          REMOTE
          )"

          STRATO_DB_IP="$(printf '%s\n' "$state" | tail -n1 | tr -d '[:space:]')"
          test -n "$STRATO_DB_IP"
          echo "STRATO_DB_IP=$STRATO_DB_IP" >> "$GITHUB_ENV"
          echo STRATO_PRIMARY_AND_DB_ROUTE_OK

      - name: Create backup replication key
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" '
              set -e
              mkdir -p /root/.ssh
              chmod 700 /root/.ssh
              if [ ! -s /root/.ssh/aplus_repl_from_strato ]; then
                ssh-keygen -q -t ed25519 -N "" -f /root/.ssh/aplus_repl_from_strato
              fi
              cat /root/.ssh/aplus_repl_from_strato.pub
            ' > /tmp/backup-repl.pub
          test -s /tmp/backup-repl.pub

      - name: Prepare STRATO replication role and restricted SSH forwarding
        run: |
          set -euo pipefail

          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/backup-repl.pub root@"$STRATO_HOST":/tmp/backup-repl.pub

          ssh -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" "STRATO_DB_IP='$STRATO_DB_IP' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          systemctl disable --now aplus-postgres-loopback.service >/dev/null 2>&1 || true
          rm -f /etc/systemd/system/aplus-postgres-loopback.service /usr/local/sbin/aplus-postgres-loopback
          systemctl daemon-reload || true
          docker rm -f aplus-pg-repl-proxy >/dev/null 2>&1 || true

          if [ ! -s /root/aplus-replication.secret ]; then
            umask 077
            openssl rand -hex 32 > /root/aplus-replication.secret
          fi
          REPL_PASS="$(cat /root/aplus-replication.secret)"

          docker compose exec -T db sh -lc             'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '"'"'replicator'"'"') THEN CREATE ROLE replicator WITH LOGIN REPLICATION; END IF; END \$\$;"'

          docker compose exec -T db sh -lc             "psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"ALTER ROLE replicator WITH LOGIN REPLICATION PASSWORD '$REPL_PASS';\""

          docker compose exec -T db sh -lc '
            grep -q "^host[[:space:]]\+replication[[:space:]]\+replicator[[:space:]]" "$PGDATA/pg_hba.conf" ||
              printf "\nhost replication replicator 0.0.0.0/0 scram-sha-256\n" >> "$PGDATA/pg_hba.conf"
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();" >/dev/null
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_create_physical_replication_slot('"'"'aplus_backup_slot'"'"') WHERE NOT EXISTS (SELECT 1 FROM pg_replication_slots WHERE slot_name='"'"'aplus_backup_slot'"'"');" >/dev/null
          '

          id -u aplusrepl >/dev/null 2>&1 || useradd -m -s /bin/bash aplusrepl
          usermod -s /bin/bash aplusrepl
          passwd -d aplusrepl >/dev/null 2>&1 || true

          install -d -m 700 -o aplusrepl -g aplusrepl /home/aplusrepl/.ssh
          touch /home/aplusrepl/.ssh/authorized_keys
          PUB="$(cat /tmp/backup-repl.pub)"
          grep -vF "$PUB" /home/aplusrepl/.ssh/authorized_keys >/tmp/aplusrepl.keys || true
          mv /tmp/aplusrepl.keys /home/aplusrepl/.ssh/authorized_keys
          printf 'no-agent-forwarding,no-X11-forwarding,no-pty,permitopen="%s:5432" %s\n' "$STRATO_DB_IP" "$PUB" >> /home/aplusrepl/.ssh/authorized_keys
          chown -R aplusrepl:aplusrepl /home/aplusrepl/.ssh
          chmod 700 /home/aplusrepl/.ssh
          chmod 600 /home/aplusrepl/.ssh/authorized_keys

          mkdir -p /etc/ssh/sshd_config.d
          cat >/etc/ssh/sshd_config.d/99-aplus-replication.conf <<EOF
          Match User aplusrepl
              PasswordAuthentication no
              PubkeyAuthentication yes
              AllowTcpForwarding local
              PermitOpen $STRATO_DB_IP:5432
              X11Forwarding no
              AllowAgentForwarding no
              PermitTTY no
          EOF

          sshd -t
          systemctl reload ssh 2>/dev/null || systemctl reload sshd
          rm -f /tmp/backup-repl.pub

          timeout 3 bash -c "</dev/tcp/$STRATO_DB_IP/5432"
          echo STRATO_REPLICATION_ENDPOINT_READY
          REMOTE

      - name: Copy replication secret to backup
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077

          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST":/root/aplus-replication.secret /tmp/aplus-replication.secret

          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-replication.secret root@"$BACKUP_HOST":/root/aplus-replication.secret

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" 'chmod 600 /root/aplus-replication.secret'

      - name: Start and prove direct PostgreSQL tunnel
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" "STRATO_HOST='$STRATO_HOST' STRATO_DB_IP='$STRATO_DB_IP' bash -s" <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          cd /opt/aplussolution

          if ! command -v autossh >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq autossh
          fi

          NET_NAME="aplussolution_default"
          docker network inspect "$NET_NAME" >/dev/null
          GW="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$NET_NAME")"
          test -n "$GW"

          cat >/etc/systemd/system/aplus-repl-from-strato.service <<EOF
          [Unit]
          Description=A+ Solution PostgreSQL replication tunnel from STRATO
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          Environment=AUTOSSH_GATETIME=0
          ExecStart=/usr/bin/autossh -M 0 -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /root/.ssh/aplus_repl_from_strato -L $GW:55432:$STRATO_DB_IP:5432 aplusrepl@$STRATO_HOST
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now aplus-repl-from-strato.service
          systemctl restart aplus-repl-from-strato.service

          REPL_PASS="$(cat /root/aplus-replication.secret)"
          test -n "$REPL_PASS"

          ok=0
          for i in $(seq 1 30); do
            result="$(
              docker run --rm                 --network "$NET_NAME"                 -e PGPASSWORD="$REPL_PASS"                 postgres:16-alpine                 psql -h "$GW" -p 55432 -U replicator -d postgres -tAc 'select 1' 2>/dev/null                 | tr -d '[:space:]' || true
            )"
            if [ "$result" = "1" ]; then
              ok=1
              break
            fi
            sleep 2
          done

          if [ "$ok" -ne 1 ]; then
            systemctl --no-pager --full status aplus-repl-from-strato.service >&2 || true
            journalctl -u aplus-repl-from-strato.service -n 60 --no-pager >&2 || true
            exit 1
          fi

          echo BACKUP_TO_STRATO_POSTGRES_TUNNEL_OK
          REMOTE

      - name: Rebuild backup database as streaming standby
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ServerAliveInterval=15             -o ServerAliveCountMax=12             root@"$BACKUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          NET_NAME="aplussolution_default"
          GW="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$NET_NAME")"
          test -n "$GW"

          docker compose stop backend frontend caddy celery celery-beat >/dev/null 2>&1 || true

          DB_CID="$(docker compose ps -aq db || true)"
          DB_VOL=""
          if [ -n "$DB_CID" ]; then
            DB_VOL="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$DB_CID")"
          fi
          if [ -z "$DB_VOL" ]; then
            DB_VOL="$(docker volume ls --format '{{.Name}}' | grep -E '(^|_)postgres_data$' | head -n1 || true)"
          fi
          if [ -z "$DB_VOL" ]; then
            DB_VOL="aplussolution_postgres_data"
            docker volume create "$DB_VOL" >/dev/null
          fi

          docker compose stop db >/dev/null 2>&1 || true
          docker compose rm -sf db >/dev/null 2>&1 || true

          REPL_PASS="$(cat /root/aplus-replication.secret)"
          test -n "$REPL_PASS"

          docker run --rm             --network "$NET_NAME"             -e PGPASSWORD="$REPL_PASS"             -e REPL_HOST="$GW"             -v "$DB_VOL":/var/lib/postgresql/data             postgres:16-alpine             sh -ceu '
              find /var/lib/postgresql/data -mindepth 1 -maxdepth 1 -exec rm -rf {} +
              pg_basebackup -h "$REPL_HOST" -p 55432 -U replicator -D /var/lib/postgresql/data -Fp -Xs -P -R -S aplus_backup_slot
            '

          docker run --rm             -e REPL_HOST="$GW"             -e REPL_PASS="$REPL_PASS"             -v "$DB_VOL":/var/lib/postgresql/data             postgres:16-alpine             sh -ceu '
              printf "\nprimary_conninfo = '\''host=%s port=55432 user=replicator password=%s application_name=backup_standby connect_timeout=5 keepalives_idle=30 keepalives_interval=10 keepalives_count=3'\''\n" "$REPL_HOST" "$REPL_PASS" >> /var/lib/postgresql/data/postgresql.auto.conf
              printf "primary_slot_name = '\''aplus_backup_slot'\''\n" >> /var/lib/postgresql/data/postgresql.auto.conf
              touch /var/lib/postgresql/data/standby.signal
              chown -R postgres:postgres /var/lib/postgresql/data
            '

          docker compose up -d db

          recovery=0
          for i in $(seq 1 90); do
            state="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"' 2>/dev/null | tr -d '[:space:]' || true)"
            if [ "$state" = "t" ]; then
              recovery=1
              break
            fi
            sleep 2
          done
          test "$recovery" -eq 1

          receive_lsn="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select coalesce(pg_last_wal_receive_lsn()::text, '"'"''"'"')"' | tr -d '[:space:]')"
          replay_lsn="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select coalesce(pg_last_wal_replay_lsn()::text, '"'"''"'"')"' | tr -d '[:space:]')"
          test -n "$receive_lsn"
          test -n "$replay_lsn"

          echo BACKUP_STREAMING_STANDBY_READY
          echo "receive_lsn=$receive_lsn"
          echo "replay_lsn=$replay_lsn"
          REMOTE

      - name: Verify final replication state
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          ssh -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          active="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select active from pg_replication_slots where slot_name='"'"'aplus_backup_slot'"'"'" | tr -d '[:space:]')"
          streamers="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select count(*) from pg_stat_replication where application_name='"'"'backup_standby'"'"'" | tr -d '[:space:]')"

          test "$active" = "t"
          test "$streamers" -ge 1
          echo STRATO_SEES_BACKUP_STREAMING
          REMOTE

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          recovery="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"' | tr -d '[:space:]')"
          receiving="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_last_wal_receive_lsn() is not null"' | tr -d '[:space:]')"

          test "$recovery" = "t"
          test "$receiving" = "t"
          test -z "$(docker compose ps -q backend --status running)"
          test -z "$(docker compose ps -q celery --status running)"
          test -z "$(docker compose ps -q celery-beat --status running)"

          echo BACKUP_SAFE_STANDBY_CONFIRMED
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/backup-repl.pub /tmp/aplus-replication.secret
