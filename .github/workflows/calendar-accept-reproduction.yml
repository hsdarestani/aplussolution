name: Reproduce 406 with Apple iCalendar Accept header
on:
  push:
    branches: [feature/apple-calendar-secure-subscription-20261013]
    paths: ['.github/workflows/calendar-accept-reproduction.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Compare public fixture for iOS Calendar and browser request headers
        shell: bash
        run: |
          set -euo pipefail
          url='https://app.aplus-solution.de/calendar-compatibility-test.ics'
          for accept in '*/*' 'text/calendar' 'text/calendar, */*' 'text/html' 'application/json'; do
            code=$(curl -sS --max-time 18 --get --data-urlencode "qa_accept_probe=1" -H "Accept: $accept" -D /tmp/cal-h -o /tmp/cal-b -w '%{http_code}' "$url")
            kind=$(grep -i '^content-type:' /tmp/cal-h | tail -n 1 | tr -d '\r')
            if head -c 20 /tmp/cal-b | grep -q 'BEGIN:VCALENDAR'; then calendar=yes; else calendar=no; fi
            echo "ACCEPT_PROBE accept=$accept status=$code is_ics=$calendar type=$kind"
          done
