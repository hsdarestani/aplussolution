name: Diagnose DGB signature geometry

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-dgb-signature.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Inspect and assert production signature geometry
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          import json
          import fitz
          from core.models import Contract

          cid='98c112fa-3c87-449b-92c4-e360b393dc26'
          c=Contract.objects.select_related('template').get(pk=cid)
          signature=c.signatures.order_by('signed_at').first()
          assert signature is not None
          placements=(c.template.schema or {}).get('signature_placements') or {}
          print('PLACEMENTS', json.dumps(placements, sort_keys=True))
          assert placements.get('employee',{}).get('page') == 6
          assert float(placements['employee']['x']) < 0.12
          print('PDF_NAME', c.pdf.name)

          c.pdf.open('rb')
          data=c.pdf.read(); c.pdf.close()
          d=fitz.open(stream=data,filetype='pdf')
          assert d.page_count == 6
          p=d[5]
          print('PAGE_RECT',tuple(p.rect))

          image_rects=[]
          for img in p.get_images(full=True):
              image_rects.extend(p.get_image_rects(img[0]))
          print('IMAGE_RECTS',[tuple(round(float(v),2) for v in r) for r in image_rects])
          signature_rects=[r for r in image_rects if r.x0 < 250 and r.x1 > 70 and r.y0 < 225 and r.y1 > 175 and r.width >= 20 and r.height >= 10]
          assert signature_rects, 'Handwriting is not on the employee signature line.'

          signer_hits=[r for r in p.search_for(signature.signer_name) if r.x0 < 260 and 205 <= r.y0 <= 235]
          role_hits=[r for r in p.search_for('Arbeitnehmer') if r.x0 < 260 and r.y0 < 245]
          date_text=signature.signed_at.strftime('%d.%m.%Y')
          date_hits=[r for r in p.search_for(date_text) if r.x0 < 260 and r.y0 < 245]
          print('SIGNER',repr(signature.signer_name),'HITS',[tuple(round(float(v),2) for v in r) for r in signer_hits])
          print('ROLE_HITS',[tuple(round(float(v),2) for v in r) for r in role_hits])
          print('DATE',date_text,'HITS',[tuple(round(float(v),2) for v in r) for r in date_hits])
          assert signer_hits, 'Signer name is not aligned beneath the signature.'
          assert role_hits, 'Role caption is not aligned beneath the signature.'
          assert date_hits, 'Signed date is not aligned beneath the signature.'
          print('DGB_SIGNATURE_GEOMETRY_VERIFIED')
          d.close()
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
