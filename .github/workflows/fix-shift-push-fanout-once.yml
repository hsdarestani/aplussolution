name: One-shot shift push fanout fix

on:
  push:
    paths:
      - '.github/workflows/fix-shift-push-fanout-once.yml'

permissions:
  contents: write

jobs:
  patch-test-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply regression patch
        run: python -c "import base64;exec(base64.b64decode(''))"
      - name: Backend regression tests
        working-directory: backend
        run: |
          python -m pip install -q -r requirements.txt
          pytest -q tests/test_push_notifications.py tests/test_operational_push_wiring.py
      - name: Frontend build
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Commit patch and remove one-shot workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-shift-push-fanout-once.yml
          git add frontend/src/WiwScheduleMobile.tsx frontend/src/ScheduleV2.tsx backend/tests/test_push_notifications.py backend/tests/test_operational_push_wiring.py
          git commit -m 'Fix shift copy push fanout regression'
          git push origin HEAD:main
