name: Run encrypted one-time production operation

on:
  push:
    branches: [main]
    paths:
      - 'ops/encrypted-one-time-op.json'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Configure SSH and upload encrypted package
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          scp -q -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ops/encrypted-one-time-op.json root@"$STRATO_HOST":/tmp/encrypted-one-time-op.json
      - name: Run operation and return encrypted result
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          KEY=/root/.aplus_worker_provision_key.pem
          test -s "$KEY"
          jq -r '.operator_public_key_b64' /tmp/encrypted-one-time-op.json | base64 -d > /tmp/operator_public.pem
          jq -r '.ciphertext' /tmp/encrypted-one-time-op.json | base64 -d | openssl pkeyutl -decrypt -inkey "$KEY" -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 > /tmp/op.json
          TOKEN="$(jq -r '.token' /tmp/op.json)"
          EMAIL="$(jq -r '.email' /tmp/op.json)"
          FIRST="$(jq -r '.first_name' /tmp/op.json)"
          LAST="$(jq -r '.last_name' /tmp/op.json)"
          PHONE="$(jq -r '.phone' /tmp/op.json)"
          RESULT="$(curl -fsS --get \
            --data-urlencode "token=$TOKEN" \
            --data-urlencode "email=$EMAIL" \
            --data-urlencode "first_name=$FIRST" \
            --data-urlencode "last_name=$LAST" \
            --data-urlencode "phone=$PHONE" \
            http://127.0.0.1:8000/api/internal/one-time/housekeeping-provision/)"
          CIPHER="$(printf '%s' "$RESULT" | openssl pkeyutl -encrypt -pubin -inkey /tmp/operator_public.pem -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 | base64 -w0)"
          echo "OP_RESULT_CIPHERTEXT=$CIPHER"
          rm -f "$KEY" "$KEY.pub" /tmp/operator_public.pem /tmp/op.json /tmp/encrypted-one-time-op.json
          REMOTE
      - name: Cleanup runner
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
