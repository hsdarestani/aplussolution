name: Verify live production state

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/fix-production-state'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Install SSH tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Read and assert live state
        shell: bash
        run: |
          set -euo pipefail
          set +x
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE' > live-production-state.txt 2>&1
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from django.db.models import Q
          from core.document_catalog import CATALOG_BY_SLUG
          from core.models import ClientCompany, ClientOrder, ContractTemplate, WorkerProfile
          expected=set(CATALOG_BY_SLUG)
          templates=list(ContractTemplate.objects.filter(slug__in=expected).order_by('slug'))
          installed=[x for x in templates if x.source_file and x.source_file.storage.exists(x.source_file.name) and x.source_checksum]
          demo_workers=WorkerProfile.objects.filter(Q(employee_number__startswith='DEMO-')|Q(user__email__startswith='demo.worker')).count()
          demo_clients=ClientCompany.objects.filter(Q(customer_number='KD-DEMO')|Q(name='A+ Demo Kunde')).count()
          demo_orders=ClientOrder.objects.filter(title='Sommerempfang Frankfurt').count()
          print('DB_EXPECTED_TEMPLATES',len(expected))
          print('DB_INSTALLED_TEMPLATES',len(installed))
          print('DB_DEMO_WORKERS',demo_workers)
          print('DB_DEMO_CLIENTS',demo_clients)
          print('DB_DEMO_ORDERS',demo_orders)
          assert len(expected)==8 and len(templates)==8 and len(installed)==8
          assert demo_workers==0 and demo_clients==0 and demo_orders==0
          PY
          FRONTEND_ID=$(docker compose ps -q frontend)
          test -n "$FRONTEND_ID"
          docker exec "$FRONTEND_ID" sh -c "grep -R -q 'Woche kopieren' /usr/share/nginx/html"
          docker exec "$FRONTEND_ID" sh -c "grep -R -q 'Zeiterfassung' /usr/share/nginx/html"
          echo 'DEPLOYED_FRONTEND_ACTIONS true'
          TOKEN=$(docker compose exec -T backend python manage.py shell -c "from rest_framework_simplejwt.tokens import RefreshToken; from core.models import User; u=User.objects.filter(role='admin',is_active=True).order_by('date_joined').first(); print(str(RefreshToken.for_user(u).access_token))" | tail -n 1 | tr -d '\r')
          curl -fsS https://solution.smarbiz.sbs/api/document-catalog/ -H "Authorization: Bearer $TOKEN" -o /tmp/catalog-verify.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/catalog-verify.json'))
          installed=sum(bool(x.get('source_installed')) for x in d.get('documents',[]))
          print('PUBLIC_API_COUNT',d.get('count'))
          print('PUBLIC_API_INSTALLED',installed)
          print('PUBLIC_API_COMPLETE',d.get('complete'))
          assert d.get('count')==8 and installed==8 and d.get('complete') is True
          PY
          rm -f /tmp/catalog-verify.json
          curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null
          HTTP_CODE=$(curl -sS -o /tmp/login-verify.json -w '%{http_code}' -X POST https://solution.smarbiz.sbs/api/auth/login/ -H 'Content-Type: application/json' --data '{"email":"invalid@example.com","password":"invalid"}')
          test "$HTTP_CODE" != 502 && test "$HTTP_CODE" != 503
          echo "PUBLIC_LOGIN_HTTP $HTTP_CODE"
          echo 'LIVE_PRODUCTION_STATE_OK true'
          REMOTE
          cat live-production-state.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-production-state
          path: live-production-state.txt
          retention-days: 1
