name: Phase 5 avatar title compatibility fix

on:
  push:
    branches:
      - feature/phase5-calendar-navigation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase5-calendar-navigation
      - name: Preserve the existing avatar title contract
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/ScheduleV2.tsx')
          text = path.read_text(encoding='utf-8')
          old = 'title={`${worker.name} · Akte öffnen`}'
          new = 'title={worker.name}'
          if text.count(old) != 1:
              raise SystemExit(f'expected one avatar title match, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit compatibility fix
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/ScheduleV2.tsx
          git commit -m 'Preserve worker avatar title while linking profile'
          git push origin HEAD:feature/phase5-calendar-navigation
