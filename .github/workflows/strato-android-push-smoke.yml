name: Android notification smoke test

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-android-push-smoke.yml'

permissions:
  contents: read

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Send one push to latest active Android admin device
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from core.models import Notification, User
          from core.push_models import PushDevice
          from core.push_notifications import _send_android, push_provider_status

          providers = push_provider_status()
          assert providers.get('android'), f'Android push provider not configured: {providers}'

          device = (
              PushDevice.objects
              .filter(
                  platform=PushDevice.Platform.ANDROID,
                  active=True,
                  user__role=User.Role.ADMIN,
                  user__is_active=True,
              )
              .select_related('user')
              .order_by('-last_seen_at')
              .first()
          )
          assert device is not None, 'No active Android admin push device found.'

          notification = Notification(
              user=device.user,
              title='A+ Push-Test 2',
              body='Icon + Signature-Motif Sound Test',
              kind='android-notification-smoke-test-2',
              action_url='/',
          )
          ok, error, invalid = _send_android(
              device,
              notification,
              notification.title,
              notification.body,
          )
          print(f'PUSH_RESULT ok={ok} invalid={invalid} device_id={device.id} last_seen_at={device.last_seen_at.isoformat()}')
          if not ok:
              raise SystemExit(error)
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
