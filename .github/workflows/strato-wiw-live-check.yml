name: A+ Strato WIW live check

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-wiw-live-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Check current live integration state
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from django.conf import settings
          from core.models import IntegrationSyncRun
          from core.push_notifications import push_provider_status
          from core.wiw import WhenIWorkClient

          print(f'WORKER_EMAILS_ENABLED={settings.WORKER_EMAILS_ENABLED}')
          print(f'WIW_SYNC_ENABLED={settings.WIW_SYNC_ENABLED}')
          print(f'WIW_READ_ONLY={settings.WIW_READ_ONLY}')
          print(f'EMAIL_CONFIGURED={bool(settings.EMAIL_HOST and settings.EMAIL_HOST_USER and settings.EMAIL_HOST_PASSWORD)}')
          print(f'PUSH_PROVIDERS={push_provider_status()}')

          client = WhenIWorkClient()
          token = client.login(force=True)
          assert token
          client.resolve_user_context(token, force=True)
          print('WIW_LOGIN=ok')
          results = client.discover()
          supported = sorted(name for name, row in results.items() if row.get('supported'))
          unsupported = sorted(name for name, row in results.items() if not row.get('supported'))
          print('WIW_READ_SUPPORTED=' + ','.join(supported))
          print('WIW_READ_UNSUPPORTED=' + ','.join(unsupported))

          latest = IntegrationSyncRun.objects.filter(provider='wiw').order_by('-started_at').first()
          if latest:
              print(f'WIW_LATEST_SYNC_STATUS={latest.status}')
              print(f'WIW_LATEST_SYNC_STARTED={latest.started_at.isoformat()}')
              print(f'WIW_LATEST_SYNC_FINISHED={latest.finished_at.isoformat() if latest.finished_at else "none"}')
              print(f'WIW_LATEST_SYNC_ERROR_COUNT={len(latest.errors or [])}')
          else:
              print('WIW_LATEST_SYNC_STATUS=none')
          PY
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
