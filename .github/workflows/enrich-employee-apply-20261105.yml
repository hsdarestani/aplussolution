name: Apply encrypted existing employee enrichment once (2026-11-05)
on:
  push:
    branches: [main]
    paths:
      - 'ops/secure-worker-20261105.cms.b64'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aplus-one-time-existing-worker-enrichment-20261105
  cancel-in-progress: false
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Upload encrypted payload and code containing no personal values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST" && test -n "$STRATO_SSH_PRIVATE_KEY"
          test -s ops/secure-worker-20261105.cms.b64
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/worker_enrich"
          chmod 600 "$HOME/.ssh/worker_enrich"
          scp -q -i "$HOME/.ssh/worker_enrich" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            ops/secure-worker-20261105.cms.b64 root@"$STRATO_HOST":/tmp/aplus-secure-worker-20261105.cms.b64
          scp -q -i "$HOME/.ssh/worker_enrich" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            deploy/secure_ops/enrich_existing_employee_20261105.py root@"$STRATO_HOST":/tmp/aplus-enrich-worker-20261105.py
      - name: Decrypt on server and patch one existing employee record only
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/worker_enrich" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$STRATO_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          KEY=/root/.aplus_employee_enrichment_20261105.key
          CERT=/root/.aplus_employee_enrichment_20261105.crt
          PAYLOAD=/tmp/aplus-secure-worker-20261105.cms.b64
          SCRIPT=/tmp/aplus-enrich-worker-20261105.py
          test -s "$KEY" && test -s "$CERT" && test -s "$PAYLOAD" && test -s "$SCRIPT"
          WORKDIR="$(mktemp -d /tmp/aplus-enrich-worker-20261105.XXXXXXXX)"
          trap 'rm -rf "$WORKDIR"; rm -f "$PAYLOAD" "$SCRIPT"' EXIT
          base64 -d "$PAYLOAD" > "$WORKDIR/payload.cms"
          openssl cms -decrypt -binary -inform DER -in "$WORKDIR/payload.cms" \
            -recip "$CERT" -inkey "$KEY" -out "$WORKDIR/payload.json"
          test -s "$WORKDIR/payload.json"
          cd /opt/aplussolution
          docker compose exec -T backend python -c "$(cat "$SCRIPT")" < "$WORKDIR/payload.json"
          # The encrypted envelope cannot be replayed after deleting the key.
          rm -f "$KEY" "$CERT"
          echo "ONE_TIME_EMPLOYEE_ENRICHMENT_FINISHED_AND_KEY_DESTROYED"
          REMOTE
      - name: Remove temporary SSH key from CI runner
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/worker_enrich"
