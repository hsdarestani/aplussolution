name: Diagnose Calendar requests from existing logs
on:
  push:
    branches: [main]
    paths: [.github/workflows/calendar-existing-request-logs.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HOST: ${{ secrets.STRATO_HOST }}
      KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Aggregate recent calendar HTTP status without exposing URLs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/read_logs
          chmod 600 ~/.ssh/read_logs
          ssh -i ~/.ssh/read_logs -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" "cd /opt/aplussolution && docker compose logs --since=3h --no-color backend caddy 2>&1 | python3 -c 'import sys,re,collections; s=[x for x in sys.stdin if "/calendar/" in x or "/api/calendar/feed/" in x or "calendar-compatibility-test.ics" in x]; methods=collections.Counter((re.search(r"\\b(GET|HEAD|OPTIONS|PROPFIND|POST)\\b",x) or [None,"not-shown"])[1] for x in s); kinds=collections.Counter("fixture" if "calendar-compatibility-test.ics" in x else "signed" for x in s); print("MATCHED_LOG_LINES",len(s),"METHODS",dict(methods),"KINDS",dict(kinds))'"
          rm -f ~/.ssh/read_logs
