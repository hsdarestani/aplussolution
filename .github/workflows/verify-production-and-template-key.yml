name: Verify production and prepare template key

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-production-and-template-install'
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.PASS }}
      HOST: ${{ secrets.HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Confirm merged source is present
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          for attempt in $(seq 1 24); do
            if sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'test -f /opt/aplussolution/backend/core/order_automation.py && test -f /opt/aplussolution/backend/core/working_time.py'; then
              exit 0
            fi
            sleep 10
          done
          echo 'The merged release did not appear on the server in time.' >&2
          exit 1
      - name: Verify Docker services
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose ps && test "$(docker compose ps --services --filter status=running | wc -l)" -ge 6'
      - name: Verify database migrations
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py migrate --check'
      - name: Verify Django configuration
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py check'
      - name: Verify WIW authentication
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell -c "from core.wiw import WhenIWorkClient; WhenIWorkClient().login(force=True); print(\"WIW authentication OK\")"'
      - name: Verify document catalog
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell -c "from core.document_engine import seed_document_catalog; from core.models import ContractTemplate; seed_document_catalog(); count=ContractTemplate.objects.filter(required_document=True).count(); print(\"Document catalog count:\", count); assert count == 8"'
      - name: Verify internal and public health
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null && curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null'
      - name: Generate server-held template key
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" <<'REMOTE'
          set -euo pipefail
          if [ ! -f /root/aplus-template-private.pem ]; then
            umask 077
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /root/aplus-template-private.pem
          fi
          chmod 600 /root/aplus-template-private.pem
          openssl pkey -in /root/aplus-template-private.pem -pubout -out /tmp/aplus-template-public.pem
          REMOTE
      - name: Retrieve public encryption key
        run: |
          sshpass -e scp -o StrictHostKeyChecking=no root@"$HOST":/tmp/aplus-template-public.pem ./aplus-template-public.pem
          openssl pkey -pubin -in ./aplus-template-public.pem -text -noout >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: aplus-template-public-key
          path: aplus-template-public.pem
          retention-days: 1
