name: Verify rebuilt production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-production-and-template-install'
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.PASS }}
      HOST: ${{ secrets.HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Verify rebuilt backend image
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend test -f /app/core/wiw.py && docker compose exec -T backend python manage.py migrate --check && docker compose exec -T backend python manage.py check'
      - name: Verify eight-document catalog
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell -c "from core.document_engine import seed_document_catalog; from core.models import ContractTemplate; print(seed_document_catalog()); count=ContractTemplate.objects.filter(required_document=True).count(); print(\"Document catalog count:\", count); assert count == 8"'
      - name: Verify internal health
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null'
      - name: Verify public health
        run: sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null'
      - name: Diagnose WIW authentication
        id: wiw
        continue-on-error: true
        run: |
          set -o pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell -c "from core.wiw import WhenIWorkClient; WhenIWorkClient().login(force=True); print(\"WIW authentication OK\")"' 2>&1 | tee wiw-auth-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiw-auth-diagnostic
          path: wiw-auth-diagnostic.txt
          retention-days: 1
      - name: Retrieve template public key
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'openssl pkey -in /root/aplus-template-private.pem -pubout -out /tmp/aplus-template-public.pem'
          sshpass -e scp -o StrictHostKeyChecking=no root@"$HOST":/tmp/aplus-template-public.pem ./aplus-template-public.pem
          openssl pkey -pubin -in ./aplus-template-public.pem -text -noout >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: aplus-template-public-key
          path: aplus-template-public.pem
          retention-days: 1
      - name: Fail if WIW authentication is not ready
        if: steps.wiw.outcome != 'success'
        run: exit 1
