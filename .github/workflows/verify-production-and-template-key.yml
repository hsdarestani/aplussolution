name: Verify permanent production schema hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-production-and-template-install'
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.PASS }}
      HOST: ${{ secrets.HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Verify permanent fix on VPS
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          for attempt in $(seq 1 36); do
            if test -f backend/core/migrations/0002_repair_legacy_schema.py && ! grep -q 'makemigrations core' backend/entrypoint.sh; then
              break
            fi
            if [ "$attempt" -eq 36 ]; then
              echo 'Permanent hotfix did not reach the VPS in time.' >&2
              exit 1
            fi
            sleep 10
          done

          docker compose up -d --build backend celery celery-beat
          sleep 15
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py showmigrations core | grep -E '^ \[X\] 0002_repair_legacy_schema$'
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/
          curl -fsS https://solution.smarbiz.sbs/health/

          HTTP_CODE=$(curl -sS -o /tmp/login-response.txt -w '%{http_code}' -X POST https://solution.smarbiz.sbs/api/auth/login/ -H 'Content-Type: application/json' --data '{"email":"invalid@example.com","password":"invalid"}')
          cat /tmp/login-response.txt
          echo "Login smoke HTTP: $HTTP_CODE"
          test "$HTTP_CODE" -lt 500
          docker compose ps --services --filter status=running | grep -qx backend
          REMOTE
