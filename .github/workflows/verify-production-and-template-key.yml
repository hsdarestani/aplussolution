name: Diagnose and recover production backend

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'ops/verify-production-and-template-install'
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.PASS }}
      HOST: ${{ secrets.HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Diagnose backend and attempt safe recovery
        id: recovery
        continue-on-error: true
        run: |
          set -o pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE' 2>&1 | tee production-backend-diagnostic.txt
          set +e
          cd /opt/aplussolution
          echo '=== docker compose ps -a ==='
          docker compose ps -a
          echo '=== backend logs ==='
          docker compose logs --no-color --tail=400 backend
          echo '=== backend inspect ==='
          BACKEND_ID=$(docker compose ps -aq backend | head -n1)
          if [ -n "$BACKEND_ID" ]; then
            docker inspect "$BACKEND_ID" --format 'status={{.State.Status}} exit={{.State.ExitCode}} error={{.State.Error}} oom={{.State.OOMKilled}} started={{.State.StartedAt}} finished={{.State.FinishedAt}}'
          fi
          echo '=== verify source and imports in image ==='
          docker compose run --rm --no-deps backend sh -lc 'pwd; test -f /app/core/wiw.py; test -f /app/core/order_automation.py; test -f /app/core/working_time.py; python -c "import core.wiw, core.order_automation, core.working_time; print(\"imports-ok\")"'
          echo '=== django check ==='
          docker compose run --rm backend python manage.py check
          echo '=== migrations ==='
          docker compose run --rm backend python manage.py migrate --noinput
          echo '=== collectstatic ==='
          docker compose run --rm backend python manage.py collectstatic --noinput
          echo '=== bootstrap ==='
          docker compose run --rm backend python manage.py bootstrap
          echo '=== restart backend and proxy ==='
          docker compose up -d --force-recreate backend celery celery-beat frontend caddy
          sleep 12
          docker compose ps -a
          echo '=== backend logs after recovery ==='
          docker compose logs --no-color --tail=250 backend
          echo '=== internal health ==='
          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/
          echo '=== public health ==='
          curl -fsS https://solution.smarbiz.sbs/health/
          echo '=== login endpoint smoke ==='
          curl -sS -o /tmp/login-response.txt -w 'HTTP %{http_code}\n' -X POST https://solution.smarbiz.sbs/api/auth/login/ -H 'Content-Type: application/json' --data '{"email":"invalid@example.com","password":"invalid"}'
          cat /tmp/login-response.txt
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-backend-diagnostic
          path: production-backend-diagnostic.txt
          retention-days: 1
      - name: Fail when recovery did not complete
        if: steps.recovery.outcome != 'success'
        run: exit 1
