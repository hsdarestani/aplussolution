name: Rebuild and verify production

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    if: github.head_ref == 'ops/verify-production-and-template-install'
    runs-on: ubuntu-latest
    env:
      SSHPASS: ${{ secrets.PASS }}
      HOST: ${{ secrets.HOST }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Confirm merged source is present
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'test -f /opt/aplussolution/backend/core/order_automation.py && test -f /opt/aplussolution/backend/core/wiw.py && test -f /opt/aplussolution/backend/core/working_time.py'
      - name: Rebuild and migrate production containers
        id: rebuild
        continue-on-error: true
        run: |
          set -o pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" <<'REMOTE' 2>&1 | tee production-rebuild.log
          set -euo pipefail
          cd /opt/aplussolution
          docker compose up -d --build --remove-orphans
          docker compose exec -T backend test -f /app/core/wiw.py
          docker compose exec -T backend python manage.py migrate --noinput
          docker compose exec -T backend python manage.py check
          docker compose ps
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-rebuild-log
          path: production-rebuild.log
          retention-days: 1
      - name: Stop if rebuild failed
        if: steps.rebuild.outcome != 'success'
        run: exit 1
      - name: Verify document catalog and health
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell -c "from core.document_engine import seed_document_catalog; from core.models import ContractTemplate; seed_document_catalog(); count=ContractTemplate.objects.filter(required_document=True).count(); print('Document catalog count:', count); assert count == 8"
          docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null
          curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null
          REMOTE
      - name: Diagnose WIW authentication
        id: wiw
        continue-on-error: true
        run: |
          set -o pipefail
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell -c "from core.wiw import WhenIWorkClient; WhenIWorkClient().login(force=True); print(\"WIW authentication OK\")"' 2>&1 | tee wiw-auth-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiw-auth-diagnostic
          path: wiw-auth-diagnostic.txt
          retention-days: 1
      - name: Ensure server-held template key exists
        run: |
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" <<'REMOTE'
          set -euo pipefail
          if [ ! -f /root/aplus-template-private.pem ]; then
            umask 077
            openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 -out /root/aplus-template-private.pem
          fi
          chmod 600 /root/aplus-template-private.pem
          openssl pkey -in /root/aplus-template-private.pem -pubout -out /tmp/aplus-template-public.pem
          REMOTE
          sshpass -e scp -o StrictHostKeyChecking=no root@"$HOST":/tmp/aplus-template-public.pem ./aplus-template-public.pem
          openssl pkey -pubin -in ./aplus-template-public.pem -text -noout >/dev/null
      - uses: actions/upload-artifact@v4
        with:
          name: aplus-template-public-key
          path: aplus-template-public.pem
          retention-days: 1
      - name: Fail if WIW authentication is not ready
        if: steps.wiw.outcome != 'success'
        run: exit 1
