name: Check final A+ cutover readiness

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-final-cutover-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Check public DNS HTTPS and origin headers
        run: |
          set -euo pipefail
          echo 'new_dns:'
          getent ahostsv4 app.aplus-solution.de | awk '{print $1}' | sort -u || true
          echo 'old_dns:'
          getent ahostsv4 solution.smarbiz.sbs | awk '{print $1}' | sort -u || true
          echo 'new_health:'
          curl -sS -D /tmp/new-headers -o /tmp/new-health -w 'http=%{http_code} ip=%{remote_ip}\n' --max-time 20 https://app.aplus-solution.de/health/ || true
          cat /tmp/new-health 2>/dev/null || true
          echo
          grep -iE '^(server|x-aplus-origin|cf-ray):' /tmp/new-headers 2>/dev/null || true
          echo 'old_health:'
          curl -sS -D /tmp/old-headers -o /tmp/old-health -w 'http=%{http_code} ip=%{remote_ip}\n' --max-time 20 https://solution.smarbiz.sbs/health/ || true
          cat /tmp/old-health 2>/dev/null || true
          echo
          grep -iE '^(server|x-aplus-origin|cf-ray):' /tmp/old-headers 2>/dev/null || true

      - name: Inspect Strato domain configuration
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          python3 - <<'PY'
          from pathlib import Path
          wanted = {
              'ALLOWED_HOSTS','CSRF_TRUSTED_ORIGINS','CORS_ALLOWED_ORIGINS',
              'NATIVE_APP_CORS_ORIGINS','APP_URL','API_URL','APP_DOMAIN',
              'GOOGLE_OAUTH_REDIRECT_URI','APPLE_OAUTH_REDIRECT_URI','SAML_ENABLED'
          }
          for line in Path('.env').read_text().splitlines():
              if '=' not in line or line.lstrip().startswith('#'):
                  continue
              key, value = line.split('=', 1)
              if key in wanted:
                  print(f'{key}={value}')
          PY
          echo 'caddyfile_site_label:'
          head -n 1 Caddyfile
          REMOTE

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/new-health /tmp/old-health /tmp/new-headers /tmp/old-headers
