name: Phase 6 implementation

on:
  push:
    branches:
      - feature/phase6-confirmations-mitteilungen

permissions:
  contents: write

# Revalidate the complete Phase 6 source patch after router hardening.
jobs:
  implement:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase6-confirmations-mitteilungen
      - name: Apply Phase 6 source changes
        run: python scripts/apply_phase6.py
      - name: Preserve send icon still used outside legacy Chat
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('frontend/src/App.tsx')
          text = p.read_text(encoding='utf-8')
          if 'sendOutline' not in text:
              raise SystemExit('sendOutline is no longer used; remove this compatibility guard')
          if '  sendOutline,' not in text:
              marker = '  megaphoneOutline,'
              if text.count(marker) != 1:
                  raise SystemExit(f'expected one megaphone import marker, found {text.count(marker)}')
              text = text.replace(marker, marker + '\n  sendOutline,', 1)
              p.write_text(text, encoding='utf-8')
          PY
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt
      - name: Validate migrations and Phase 6 backend
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: phase6-ci-only
          DATABASE_URL: sqlite:///phase6.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run
          pytest --nomigrations tests/test_phase6_confirmations_announcements.py tests/test_direct_assignment_and_geofence.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Validate frontend and Phase 6 contracts
        working-directory: frontend
        env:
          VITE_API_URL: https://solution.smarbiz.sbs/api
        run: |
          npm test
          npm run build
          npx playwright test e2e/phase5-calendar-navigation.spec.ts e2e/phase6-confirmations-mitteilungen.spec.ts
      - name: Commit clean Phase 6 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/apply_phase6.py .github/workflows/phase6-implement.yml .github/workflows/phase6-send-icon-fix.yml
          git add backend frontend
          git commit -m 'Phase 6: add confirmations and one-way Mitteilungen'
          git push origin HEAD:feature/phase6-confirmations-mitteilungen
