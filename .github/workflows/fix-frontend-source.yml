name: Fix frontend source
on:
  push:
    branches: [agent/validate-materialized]
    paths:
      - '.github/workflows/fix-frontend-source.yml'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/validate-materialized
      - name: Apply TypeScript source fixes
        run: |
          python - <<'PY'
          from pathlib import Path
          app = Path('frontend/src/App.tsx')
          text = app.read_text()
          old = 'useEffect(load,[])'
          count = text.count(old)
          if count != 5:
              raise SystemExit(f'Expected 5 async effect callbacks, found {count}')
          app.write_text(text.replace(old, 'useEffect(()=>{void load()},[])'))
          Path('frontend/src/vite-env.d.ts').write_text('/// <reference types="vite/client" />\n')
          PY
          rm .github/workflows/fix-frontend-source.yml
      - name: Commit source fixes
        run: |
          git config user.name 'A+ Solution Automation'
          git config user.email 'automation@aplus-solution.de'
          git add -A
          git commit -m 'Fix frontend TypeScript build'
          git push origin HEAD:agent/validate-materialized
