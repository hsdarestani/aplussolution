name: A+ Cloudflare independent staging Worker (NO PROD ROUTE)
on:
  push:
    branches: [feature/aplus-cloudflare-staging-20261016]
    paths: ['.github/workflows/aplus-cloudflare-staging.yml']
permissions:
  contents: read
concurrency:
  group: aplus-cloudflare-staging-20261016
  cancel-in-progress: false
jobs:
  staging:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Discover account ID from allowed zone, without writing routes or DNS
        shell: bash
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo 'CLOUDFLARE_API_TOKEN secret missing'; exit 1; }
          python3 - <<'PY'
          import os, urllib.request, urllib.parse, json
          req=urllib.request.Request(
            'https://api.cloudflare.com/client/v4/zones?'+urllib.parse.urlencode({'name':'aplus-solution.de','per_page':30}),
            headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'], 'Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=15) as r: data=json.load(r)
          assert data['success']
          zone=next(z for z in data['result'] if z['name']=='aplus-solution.de')
          assert zone['status']=='active'
          account=zone['account']['id']
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('CLOUDFLARE_ACCOUNT_ID='+account+'\n')
          print('STAGING_ACCOUNT_RESOLVED')
          PY
      - name: Cloudflare bundle dry run (NO ROUTE)
        working-directory: edge
        run: |
          npx --yes wrangler@4 deploy --config wrangler.staging.toml --dry-run --outdir /tmp/aplus-cloudflare-staging
      - name: Deploy standalone workers.dev test (NO PRODUCTION ROUTE)
        working-directory: edge
        run: |
          npx --yes wrangler@4 deploy --config wrangler.staging.toml
      - name: Resolve staging Worker hostname from Cloudflare account
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, json
          req=urllib.request.Request(
            'https://api.cloudflare.com/client/v4/accounts/'+os.environ['CLOUDFLARE_ACCOUNT_ID']+'/workers/subdomain',
            headers={'Authorization':'Bearer '+os.environ['CLOUDFLARE_API_TOKEN'],'Accept':'application/json'})
          with urllib.request.urlopen(req, timeout=15) as r: data=json.load(r)
          assert data.get('success') and data.get('result',{}).get('subdomain')
          sub=data['result']['subdomain']
          assert sub.replace('-','').isalnum()
          url='https://aplus-availability-fallback-staging.'+sub+'.workers.dev'
          with open(os.environ['GITHUB_ENV'],'a') as f: f.write('STAGING_URL='+url+'\n')
          print('STAGING_URL='+url)
          PY
      - name: Verify availability, simulated 503, and API/write isolation on staging only
        shell: bash
        run: |
          set -euo pipefail
          : "${STAGING_URL:?}"
          ready=0
          for i in $(seq 1 12); do
            if curl -fsS --connect-timeout 6 --max-time 15 "$STAGING_URL/" -o /tmp/aplus-staging-home; then
              if grep -q '<div id="root"' /tmp/aplus-staging-home; then ready=1; break; fi
            fi
            sleep 5
          done
          test "$ready" = 1
          result="$(curl -sS -D /tmp/aplus-outage-headers -o /tmp/aplus-outage-page -w '%{http_code}' --connect-timeout 6 --max-time 15 "$STAGING_URL/__aplus/simulate-outage")"
          test "$result" = 503
          grep -qi '^X-Aplus-Fallback: edge' /tmp/aplus-outage-headers
          grep -q 'Gleich wieder' /tmp/aplus-outage-page
          result="$(curl -sS -o /dev/null -w '%{http_code}' "$STAGING_URL/api/status/ready/")"
          test "$result" = 404
          result="$(curl -sS -X POST -o /dev/null -w '%{http_code}' "$STAGING_URL/")"
          test "$result" = 405
          curl -fsS --connect-timeout 6 --max-time 14 "$STAGING_URL/__aplus/availability" | grep -q '"status":"ok"'
          curl -fsS --connect-timeout 6 --max-time 14 https://app.aplus-solution.de/api/status/ready/ | grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"'
          echo 'STAGING_TESTS_PASSED_NO_PRODUCTION_ROUTE_CHANGED'
          echo "Standalone staging Worker: $STAGING_URL" >> "$GITHUB_STEP_SUMMARY"
