name: Apply registration push fallback
on:
  push:
    paths: ['.github/workflows/apply-registration-push-fallback.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch first-login registration notification and env docs
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              actual = text.count(old)
              assert actual == count, f'{path}: expected {count}, found {actual}'
              p.write_text(text.replace(old, new, count))

          replace(
              'backend/core/views.py',
              'from .permissions import IsAdminOrManager\n',
              'from .permissions import IsAdminOrManager\nfrom .operational_notifications import ensure_registration_completed_notification\n',
          )
          replace(
              'backend/core/views.py',
              "    if not user:\n        return Response({'detail': 'E-Mail oder Passwort ist falsch.'}, status=400)\n    refresh = RefreshToken.for_user(user)\n",
              "    if not user:\n        return Response({'detail': 'E-Mail oder Passwort ist falsch.'}, status=400)\n    # Invitation/onboarding flows notify on the is_onboarded transition. Older\n    # employee/customer accounts were historically created as already onboarded;\n    # this idempotent fallback records their first real successful portal login.\n    ensure_registration_completed_notification(user)\n    refresh = RefreshToken.for_user(user)\n",
          )
          replace(
              '.env.example',
              'APNS_USE_SANDBOX=0\n',
              'APNS_USE_SANDBOX=0\n# Check-in/check-out reminder delay; Celery checks every five minutes.\nATTENDANCE_REMINDER_MINUTES=15\n',
          )

          Path('.github/workflows/apply-registration-push-fallback.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Notify admins when portal registration completes'
          git push origin HEAD:main
