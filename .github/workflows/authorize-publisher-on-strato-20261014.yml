name: Recover Publisher SSH on shared Strato
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/authorize-publisher-on-strato-20261014.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  grant:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HOST: ${{ secrets.STRATO_HOST }}
      PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Check target and open audited SSH session
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PRIVATE_KEY"
          test "$HOST" = "82.165.187.14"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" | tr -d '\r' > "$HOME/.ssh/strato-maintenance"
          chmod 600 "$HOME/.ssh/strato-maintenance"
          ssh-keyscan -T 10 -H "$HOST" >> "$HOME/.ssh/known_hosts" 2>/dev/null
          test -s "$HOME/.ssh/known_hosts"
      - name: Authorize the existing Publisher public key only on the shared host
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato-maintenance" -o BatchMode=yes -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 root@"$HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          test -d /opt/aplus-publisher
          test -d /opt/aplussolution
          install -d -m 700 /root/.ssh
          touch /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          pubkey='ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIGg8D3WOjBUwd3GjRhRboX/ODqaoiMSLxWAhvqoptFlB strato-main'
          keydata='AAAAC3NzaC1lZDI1NTE5AAAAIGg8D3WOjBUwd3GjRhRboX/ODqaoiMSLxWAhvqoptFlB'
          if ! grep -Fq "$keydata" /root/.ssh/authorized_keys; then
            printf '%s\n' "$pubkey" >> /root/.ssh/authorized_keys
          fi
          grep -Fq "$keydata" /root/.ssh/authorized_keys
          echo 'PUBLISHER_PUBLIC_KEY_AUTHORIZED_ON_SHARED_STRATO'
          REMOTE
      - name: Remove temporary key
        if: always()
        run: rm -f "$HOME/.ssh/strato-maintenance"
