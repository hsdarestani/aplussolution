name: Hotfix Apple Calendar signed feed compatibility
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/hotfix-calendar-head.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      HOST: ${{ secrets.STRATO_HOST }}
      KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Ship only calendar handler to production
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST"; test -n "$KEY"
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/calendar_head_key
          chmod 600 ~/.ssh/calendar_head_key
          scp -i ~/.ssh/calendar_head_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null backend/core/calendar_sync.py root@"$HOST":/tmp/aplus-calendar-head-v2.py
      - name: Update backend with rollback and test GET plus HEAD
        shell: bash
        run: |
          set -euo pipefail
          ssh -i ~/.ssh/calendar_head_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          cid=$(docker compose ps -q backend)
          test -n "$cid"
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true
          test -s /tmp/aplus-calendar-head-v2.py
          grep -Fq "@api_view(['GET', 'HEAD'])" /tmp/aplus-calendar-head-v2.py
          backup=/tmp/aplus-calendar-head-original.py
          diskbackup=/tmp/aplus-calendar-head-disk-original.py
          docker cp "$cid":/app/core/calendar_sync.py "$backup"
          cp backend/core/calendar_sync.py "$diskbackup"
          undo() {
            echo "Reverting calendar HEAD patch"
            docker cp "$backup" "$cid":/app/core/calendar_sync.py || true
            cp "$diskbackup" backend/core/calendar_sync.py || true
            docker compose restart backend || true
          }
          trap 'undo' ERR
          cp /tmp/aplus-calendar-head-v2.py backend/core/calendar_sync.py
          docker cp /tmp/aplus-calendar-head-v2.py "$cid":/app/core/calendar_sync.py
          docker compose exec -T backend python -m py_compile /app/core/calendar_sync.py </dev/null
          docker compose restart backend
          ready=no
          for n in $(seq 1 30); do
            if docker compose exec -T backend curl -fsS --max-time 5 http://127.0.0.1:8000/health/ >/dev/null 2>&1 </dev/null; then ready=yes; break; fi
            sleep 3
          done
          test "$ready" = yes
          docker compose exec -T backend python manage.py check </dev/null
          docker compose exec -T backend python manage.py shell -c "from core.models import WorkerProfile; from core.calendar_sync import _calendar_token; import requests; w=WorkerProfile.objects.filter(active=True,user__is_active=True).first(); assert w is not None; token=_calendar_token(w); url='https://app.aplus-solution.de/calendar/'+token+'.ics'; old='https://app.aplus-solution.de/api/calendar/feed/'+token+'.ics'; resp=[requests.request(m,u,timeout=20) for u in (url,old) for m in ('GET','HEAD')]; assert all(r.status_code==200 and r.headers.get('Content-Type','').startswith('text/calendar') for r in resp); print('LIVE_ICAL_GET_AND_HEAD_OK',len(resp))" </dev/null
          # Ensure the live HTTP response uses the same standards-friendly
          # subscription headers as the accepted public calendar fixture.
          docker compose exec -T backend python manage.py shell -c "from core.models import WorkerProfile; from core.calendar_sync import _calendar_token; import requests; w=WorkerProfile.objects.filter(active=True,user__is_active=True).first(); assert w is not None; url='https://app.aplus-solution.de/calendar/'+_calendar_token(w)+'.ics'; r=requests.get(url,timeout=20); assert r.status_code==200 and r.content.startswith(b'BEGIN:VCALENDAR\\r\\n'); assert 'Content-Disposition' not in r.headers; assert 'no-store' not in r.headers.get('Cache-Control',''); assert b'REFRESH-INTERVAL' not in r.content and b'X-PUBLISHED-TTL' not in r.content; print('LIVE_ICAL_COMPAT_HEADERS_OK')" </dev/null
          echo "CALENDAR_COMPAT_PATCH_APPLIED"
          trap - ERR
          rm -f "$backup" "$diskbackup" /tmp/aplus-calendar-head-v2.py
          REMOTE
      - name: Confirm public site health and invalid HEAD response
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 https://app.aplus-solution.de/health/ | grep -q '"ok"'
          status=$(curl -sS -I --max-time 20 -o /dev/null -w '%{http_code}' https://app.aplus-solution.de/calendar/invalid.ics)
          test "$status" = 404
          echo "PUBLIC_ROUTE_HEAD_VERIFIED"
      - name: Cleanup keys
        if: always()
        run: rm -f ~/.ssh/calendar_head_key
