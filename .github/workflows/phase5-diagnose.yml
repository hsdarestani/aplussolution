name: Phase 5 focused diagnostics
on:
  pull_request:
    branches: [main]
jobs:
  diagnose:
    if: github.head_ref == 'feature/document-engine-phase5'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - run: pip install -r backend/requirements.txt
      - name: Run Phase 5 tests and keep concise failure tail
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: phase5-diagnostic-only
          DATABASE_URL: sqlite:///phase5-diagnostic.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        run: |
          set +e
          pytest -q --disable-warnings --maxfail=1 tests/test_document_center_phase5.py tests/test_document_source_phase5.py tests/test_documents.py > phase5-test.log 2>&1
          status=$?
          tail -n 160 phase5-test.log > phase5-failure-tail.txt
          cat phase5-failure-tail.txt
          exit $status
      - name: Upload diagnostic tail
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase5-failure-tail
          path: backend/phase5-failure-tail.txt
          retention-days: 1
