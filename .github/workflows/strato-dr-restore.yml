name: STRATO DR restore on backup server

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-dr-restore.yml'

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Restore production copy on DR server
        run: |
          set -euo pipefail
          sshpass -p "$BACKUP_PASSWORD" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=15 \
            -o ServerAliveCountMax=12 \
            root@"$BACKUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail

          test -s /root/aplus-db.dump
          test -s /root/aplus-media.tgz
          test -s /root/aplus.env.backup
          test -f /opt/aplussolution/docker-compose.yml

          echo "Backups present:"
          ls -lh /root/aplus-db.dump /root/aplus-media.tgz /root/aplus.env.backup

          if ! swapon --show | grep -q .; then
            fallocate -l 2G /swapfile
            chmod 600 /swapfile
            mkswap /swapfile >/dev/null
            swapon /swapfile
            grep -q '^/swapfile ' /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab
          fi

          cd /opt/aplussolution
          cp /root/aplus.env.backup .env
          chmod 600 .env

          docker compose down --remove-orphans || true
          docker compose up -d db redis

          db_ready=0
          for i in $(seq 1 60); do
            if docker compose exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
              db_ready=1
              break
            fi
            sleep 2
          done
          test "$db_ready" -eq 1

          docker compose exec -T db sh -c 'dropdb -U "$POSTGRES_USER" --if-exists "$POSTGRES_DB"'
          docker compose exec -T db sh -c 'createdb -U "$POSTGRES_USER" "$POSTGRES_DB"'
          cat /root/aplus-db.dump | docker compose exec -T db sh -c 'pg_restore --no-owner --no-privileges -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

          docker compose build backend frontend

          docker compose run --rm --no-deps \
            -v /root/aplus-media.tgz:/tmp/aplus-media.tgz:ro \
            backend sh -c 'find /app/media -mindepth 1 -maxdepth 1 -exec rm -rf {} +; tar xzf /tmp/aplus-media.tgz -C /app/media'

          docker compose up -d --remove-orphans

          backend_ready=0
          for i in $(seq 1 90); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              backend_ready=1
              break
            fi
            sleep 3
          done
          if [ "$backend_ready" -ne 1 ]; then
            docker compose ps -a
            docker compose logs --no-color --tail=200 backend
            exit 1
          fi

          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py migrate --check

          echo "Database row counts:"
          docker compose exec -T backend python manage.py shell -c "from core.models import User,Shift,TimeEntry; print('users=%s shifts=%s time_entries=%s' % (User.objects.count(), Shift.objects.count(), TimeEntry.objects.count()))"

          echo "Service status:"
          docker compose ps
          echo "DR_RESTORE_READY"
          REMOTE
