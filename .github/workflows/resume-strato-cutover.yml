name: Resume STRATO cutover after promotion

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/resume-strato-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-primary-cutover
  cancel-in-progress: false

jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure SSH clients
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Verify STRATO is the promoted writable primary
        run: |
          set -euo pipefail
          state="$(
            ssh -i "$HOME/.ssh/strato_ed25519"               -o IdentitiesOnly=yes               -o StrictHostKeyChecking=no               -o UserKnownHostsFile=/dev/null               root@"$STRATO_HOST" '
                set -e
                cd /opt/aplussolution
                recovery="$(docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"'"'"' | tr -d "[:space:]")"
                docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null
                printf "%s\n" "$recovery"
              '
          )"
          test "$state" = "f"
          echo STRATO_WRITABLE_PRIMARY_CONFIRMED

      - name: Forward backup origin ports directly to STRATO
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          cat >/tmp/aplus-tcp-gateway.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd /opt/aplussolution
          STRATO_IP="$(getent ahostsv4 "$STRATO_HOST" | awk 'NR==1 {print $1}')"
          test -n "$STRATO_IP"

          docker compose stop caddy >/dev/null 2>&1 || true
          docker rm -f aplus-cutover-gateway aplus-gateway-http aplus-gateway-https >/dev/null 2>&1 || true

          docker run -d             --name aplus-gateway-http             --restart unless-stopped             --network host             alpine/socat             TCP-LISTEN:80,reuseaddr,fork TCP:"$STRATO_IP":80 >/dev/null

          docker run -d             --name aplus-gateway-https             --restart unless-stopped             --network host             alpine/socat             TCP-LISTEN:443,reuseaddr,fork TCP:"$STRATO_IP":443 >/dev/null

          ready=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 15               --resolve app.aplus-solution.de:443:127.0.0.1               -D /tmp/gateway.headers -o /tmp/gateway.health               https://app.aplus-solution.de/health/               && grep -qi '^x-aplus-origin: strato-primary' /tmp/gateway.headers; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          echo BACKUP_TCP_GATEWAY_TO_STRATO_READY
          SCRIPT
          chmod 700 /tmp/aplus-tcp-gateway.sh
          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-tcp-gateway.sh root@"$BACKUP_HOST":/tmp/aplus-tcp-gateway.sh
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" "STRATO_HOST='$STRATO_HOST' bash /tmp/aplus-tcp-gateway.sh && rm -f /tmp/aplus-tcp-gateway.sh"

          ok=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 -D /tmp/public.headers -o /tmp/public.health               "https://app.aplus-solution.de/health/?resume=$GITHUB_RUN_ID-$i"               && grep -qi '^x-aplus-origin: strato-primary' /tmp/public.headers; then
              ok=1
              break
            fi
            sleep 2
          done
          test "$ok" -eq 1
          echo PUBLIC_TRAFFIC_REACHES_STRATO

      - name: Create restricted reverse replication path
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" '
              set -e
              mkdir -p /root/.ssh
              chmod 700 /root/.ssh
              if [ ! -s /root/.ssh/aplus_repl_from_strato ]; then
                ssh-keygen -q -t ed25519 -N "" -f /root/.ssh/aplus_repl_from_strato
              fi
            '

          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST":/root/.ssh/aplus_repl_from_strato.pub /tmp/backup-repl.pub

          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/backup-repl.pub root@"$STRATO_HOST":/tmp/backup-repl.pub

          cat >/tmp/aplus-setup-strato-repl.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd /opt/aplussolution

          DB_CID="$(docker compose ps -q db)"
          test -n "$DB_CID"
          DB_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DB_CID")"
          test -n "$DB_IP"

          PUB="$(cat /tmp/backup-repl.pub)"
          id -u aplusrepl >/dev/null 2>&1 || useradd -m -s /bin/bash aplusrepl
          install -d -m 700 -o aplusrepl -g aplusrepl /home/aplusrepl/.ssh
          touch /home/aplusrepl/.ssh/authorized_keys
          grep -vF "$PUB" /home/aplusrepl/.ssh/authorized_keys >/tmp/aplus-repl-keys || true
          mv /tmp/aplus-repl-keys /home/aplusrepl/.ssh/authorized_keys
          printf 'command="/bin/false",no-agent-forwarding,no-X11-forwarding,no-pty,permitopen="%s:5432" %s\n' "$DB_IP" "$PUB" >> /home/aplusrepl/.ssh/authorized_keys
          chown -R aplusrepl:aplusrepl /home/aplusrepl/.ssh
          chmod 700 /home/aplusrepl/.ssh
          chmod 600 /home/aplusrepl/.ssh/authorized_keys

          mkdir -p /etc/ssh/sshd_config.d
          cat >/etc/ssh/sshd_config.d/99-aplus-replication.conf <<EOF
          Match User aplusrepl
              AllowTcpForwarding local
              PermitOpen $DB_IP:5432
              X11Forwarding no
              AllowAgentForwarding no
              PermitTTY no
          EOF
          sshd -t
          systemctl reload ssh 2>/dev/null || systemctl reload sshd

          printf '%s\n' "$DB_IP" >/root/aplus-strato-db-ip
          chmod 600 /root/aplus-strato-db-ip
          rm -f /tmp/backup-repl.pub
          echo STRATO_REPLICATION_SSH_READY
          SCRIPT
          chmod 700 /tmp/aplus-setup-strato-repl.sh

          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-setup-strato-repl.sh root@"$STRATO_HOST":/tmp/aplus-setup-strato-repl.sh

          ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" 'bash /tmp/aplus-setup-strato-repl.sh && rm -f /tmp/aplus-setup-strato-repl.sh'

          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST":/root/aplus-strato-db-ip /tmp/aplus-strato-db-ip

          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-strato-db-ip root@"$BACKUP_HOST":/root/aplus-strato-db-ip

      - name: Rebuild backup PostgreSQL as STRATO streaming standby
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          cat >/tmp/aplus-build-backup-standby.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cd /opt/aplussolution

          STRATO_DB_IP="$(cat /root/aplus-strato-db-ip)"
          REPL_PASS="$(cat /root/aplus-replication.secret)"
          test -n "$STRATO_DB_IP"
          test -n "$REPL_PASS"

          if ! command -v autossh >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq autossh
          fi

          NET_NAME="aplussolution_default"
          docker network inspect "$NET_NAME" >/dev/null
          GW="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$NET_NAME")"
          test -n "$GW"

          cat >/etc/systemd/system/aplus-repl-from-strato.service <<EOF
          [Unit]
          Description=A+ Solution PostgreSQL replication tunnel from STRATO primary
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          Environment=AUTOSSH_GATETIME=0
          ExecStart=/usr/bin/autossh -M 0 -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /root/.ssh/aplus_repl_from_strato -L $GW:55432:$STRATO_DB_IP:5432 aplusrepl@$STRATO_HOST
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now aplus-repl-from-strato.service
          systemctl restart aplus-repl-from-strato.service

          tunnel=0
          for i in $(seq 1 45); do
            if timeout 2 bash -c "</dev/tcp/$GW/55432" >/dev/null 2>&1; then
              tunnel=1
              break
            fi
            sleep 2
          done
          test "$tunnel" -eq 1

          DB_CID="$(docker compose ps -aq db)"
          test -n "$DB_CID"
          DB_VOL="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$DB_CID")"
          test -n "$DB_VOL"

          docker compose stop backend celery celery-beat db >/dev/null 2>&1 || true
          docker compose rm -sf db >/dev/null 2>&1 || true

          docker run --rm             --network "$NET_NAME"             -e PGPASSWORD="$REPL_PASS"             -e REPL_HOST="$GW"             -v "$DB_VOL":/var/lib/postgresql/data             postgres:16-alpine             sh -ceu '
              rm -rf /var/lib/postgresql/data/*
              pg_basebackup -h "$REPL_HOST" -p 55432 -U replicator                 -D /var/lib/postgresql/data -Fp -Xs -P -R
            '

          docker run --rm             -e REPL_HOST="$GW"             -e REPL_PASS="$REPL_PASS"             -v "$DB_VOL":/var/lib/postgresql/data             postgres:16-alpine             sh -ceu '
              printf "\nprimary_conninfo = '\''host=%s port=55432 user=replicator password=%s application_name=backup_standby connect_timeout=5'\''\n" "$REPL_HOST" "$REPL_PASS" >> /var/lib/postgresql/data/postgresql.auto.conf
              touch /var/lib/postgresql/data/standby.signal
              chown -R postgres:postgres /var/lib/postgresql/data
            '

          docker compose up -d db

          recovery=0
          for i in $(seq 1 90); do
            if [ "$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"' 2>/dev/null | tr -d '[:space:]')" = "t" ]; then
              recovery=1
              break
            fi
            sleep 2
          done
          test "$recovery" -eq 1

          receive_lsn="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select coalesce(pg_last_wal_receive_lsn()::text, '"'"''"'"')"' | tr -d '[:space:]')"
          replay_lsn="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select coalesce(pg_last_wal_replay_lsn()::text, '"'"''"'"')"' | tr -d '[:space:]')"
          test -n "$receive_lsn"
          test -n "$replay_lsn"

          docker compose stop backend celery celery-beat >/dev/null 2>&1 || true
          echo BACKUP_STREAMING_STANDBY_READY
          SCRIPT
          chmod 700 /tmp/aplus-build-backup-standby.sh

          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-build-backup-standby.sh root@"$BACKUP_HOST":/tmp/aplus-build-backup-standby.sh

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" "STRATO_HOST='$STRATO_HOST' bash /tmp/aplus-build-backup-standby.sh && rm -f /tmp/aplus-build-backup-standby.sh"

      - name: Configure continuous media mirror on backup
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST":/root/.ssh/aplus_repl_from_strato.pub /tmp/backup-media.pub

          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/backup-media.pub root@"$STRATO_HOST":/tmp/backup-media.pub

          cat >/tmp/aplus-media-export-setup.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          PUB="$(cat /tmp/backup-media.pub)"
          cat >/usr/local/sbin/aplus-media-export <<'EXPORT'
          #!/bin/sh
          exec docker run --rm -v aplussolution_media_data:/data:ro alpine:3.20 tar -C /data -cf - .
          EXPORT
          chmod 700 /usr/local/sbin/aplus-media-export
          mkdir -p /root/.ssh
          touch /root/.ssh/authorized_keys
          grep -vF "$PUB" /root/.ssh/authorized_keys >/tmp/root-keys || true
          mv /tmp/root-keys /root/.ssh/authorized_keys
          printf 'command="/usr/local/sbin/aplus-media-export",no-port-forwarding,no-agent-forwarding,no-X11-forwarding,no-pty %s\n' "$PUB" >> /root/.ssh/authorized_keys
          chmod 600 /root/.ssh/authorized_keys
          rm -f /tmp/backup-media.pub
          SCRIPT
          chmod 700 /tmp/aplus-media-export-setup.sh
          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-media-export-setup.sh root@"$STRATO_HOST":/tmp/aplus-media-export-setup.sh
          ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" 'bash /tmp/aplus-media-export-setup.sh && rm -f /tmp/aplus-media-export-setup.sh'

          cat >/tmp/aplus-media-pull-setup.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail
          cat >/usr/local/sbin/aplus-media-pull <<EOF
          #!/bin/sh
          set -eu
          exec 9>/run/aplus-media-pull.lock
          flock -n 9 || exit 0
          ssh -i /root/.ssh/aplus_repl_from_strato -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@$STRATO_HOST             | docker run --rm -i -v aplussolution_media_data:/data alpine:3.20 tar -xf - -C /data
          EOF
          chmod 700 /usr/local/sbin/aplus-media-pull

          cat >/etc/systemd/system/aplus-media-pull.service <<'EOF'
          [Unit]
          Description=A+ Solution mirror media from STRATO primary
          After=network-online.target docker.service
          Wants=network-online.target
          Requires=docker.service

          [Service]
          Type=oneshot
          ExecStart=/usr/local/sbin/aplus-media-pull
          EOF

          cat >/etc/systemd/system/aplus-media-pull.timer <<'EOF'
          [Unit]
          Description=Refresh A+ Solution standby media

          [Timer]
          OnBootSec=30
          OnUnitActiveSec=60
          Unit=aplus-media-pull.service
          Persistent=true

          [Install]
          WantedBy=timers.target
          EOF

          systemctl daemon-reload
          systemctl enable --now aplus-media-pull.timer
          systemctl start aplus-media-pull.service
          systemctl is-active aplus-media-pull.timer
          echo BACKUP_MEDIA_MIRROR_ACTIVE
          SCRIPT
          chmod 700 /tmp/aplus-media-pull-setup.sh

          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-media-pull-setup.sh root@"$BACKUP_HOST":/tmp/aplus-media-pull-setup.sh

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" "STRATO_HOST='$STRATO_HOST' bash /tmp/aplus-media-pull-setup.sh && rm -f /tmp/aplus-media-pull-setup.sh"

      - name: Verify final primary standby state
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          strato_state="$(
            ssh -i "$HOME/.ssh/strato_ed25519"               -o IdentitiesOnly=yes               -o StrictHostKeyChecking=no               -o UserKnownHostsFile=/dev/null               root@"$STRATO_HOST" '
                cd /opt/aplussolution
                docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"'"'"' | tr -d "[:space:]"
              '
          )"
          test "$strato_state" = "f"

          backup_state="$(
            sshpass -e ssh               -o PubkeyAuthentication=no               -o PreferredAuthentications=password               -o StrictHostKeyChecking=no               -o UserKnownHostsFile=/dev/null               root@"$BACKUP_HOST" '
                cd /opt/aplussolution
                recovery="$(docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"'"'"' | tr -d "[:space:]")"
                receiving="$(docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_last_wal_receive_lsn() is not null"'"'"' | tr -d "[:space:]")"
                backend="$(docker compose ps -q backend --status running)"
                printf "%s|%s|%s\n" "$recovery" "$receiving" "$backend"
              '
          )"
          case "$backup_state" in
            t\|t\|) ;;
            *) echo "Unexpected backup state: $backup_state" >&2; exit 1 ;;
          esac

          curl -fsS --retry 5 --retry-delay 2 --max-time 20             -D /tmp/final.headers -o /tmp/final.health             "https://app.aplus-solution.de/health/?final=$GITHUB_RUN_ID"
          grep -qi '^x-aplus-origin: strato-primary' /tmp/final.headers
          echo FINAL_ARCHITECTURE_OK

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/aplus-* /tmp/*.pub /tmp/*.headers /tmp/*.health
