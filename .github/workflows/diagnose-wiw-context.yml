name: Diagnose WIW account context

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'ops/diagnose-wiw-context'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Inspect authorized WIW contexts without exposing credentials
        run: |
          set -euo pipefail
          set +x
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE' > wiw-context-diagnostic.txt 2>&1
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          import requests
          from django.conf import settings
          from core.wiw import WhenIWorkClient

          client = WhenIWorkClient()
          token = client.login(force=True)
          base_headers = {
              'Authorization': f'Bearer {token}',
              'W-Token': token,
              'W-Key': settings.WIW_DEV_KEY,
              'Accept': 'application/json',
          }
          response = requests.get(
              'https://api.wheniwork.com/2/login',
              headers=base_headers,
              params={'show_pending': 'true'},
              timeout=settings.WIW_HTTP_TIMEOUT,
          )
          print('LOGIN_CONTEXT_HTTP', response.status_code)
          payload = response.json() if response.content else {}

          candidates = []
          def collect(value):
              if isinstance(value, list):
                  for item in value:
                      collect(item)
              elif isinstance(value, dict):
                  if value.get('id') is not None and any(k in value for k in ('account_id','login_id','email','first_name','last_name','type','role','is_admin','is_manager')):
                      candidates.append(value)
                  for key in ('users','user','logins','accounts','data','items','results'):
                      if key in value:
                          collect(value[key])
          collect(payload)

          seen = set()
          unique = []
          for item in candidates:
              key = str(item.get('id'))
              if key and key not in seen:
                  seen.add(key)
                  unique.append(item)
          print('AUTHORIZED_CONTEXT_COUNT', len(unique))
          print('CONFIGURED_CONTEXT_PRESENT', str(settings.WIW_USER_ID) in seen)
          for item in unique:
              user_id = str(item.get('id'))
              role = item.get('role') or item.get('type') or item.get('access_level') or ''
              account_id = item.get('account_id') or ''
              headers = {**base_headers, 'W-UserId': user_id}
              shifts = requests.get('https://api.wheniwork.com/2/shifts', headers=headers, params={'limit': 1}, timeout=settings.WIW_HTTP_TIMEOUT)
              times = requests.get('https://api.wheniwork.com/2/times', headers=headers, params={'limit': 1}, timeout=settings.WIW_HTTP_TIMEOUT)
              print('CONTEXT_TEST', user_id, 'ACCOUNT', account_id, 'ROLE', role, 'SHIFTS', shifts.status_code, 'TIMES', times.status_code)
          PY
          REMOTE
          cat wiw-context-diagnostic.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wiw-context-diagnostic
          path: wiw-context-diagnostic.txt
          retention-days: 1
