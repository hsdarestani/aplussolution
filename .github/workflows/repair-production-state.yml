name: Repair production state

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  repair:
    if: github.head_ref == 'ops/fix-production-state'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - uses: actions/checkout@v4
      - name: Install SSH tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Repair and verify production state
        run: |
          set +x
          test -n "$HOST"
          test -n "$SSHPASS"
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE' 2>&1 | tee production-repair-result.txt
          set -euo pipefail
          cd /opt/aplussolution

          echo 'PHASE=DEMO_CLEANUP'
          docker compose exec -T backend python manage.py shell <<'PY'
          from django.db import transaction
          from django.db.models import Q
          from core.models import (
              ClientCompany, ClientOrder, Contract, Document, Location, PayrollStatement,
              Shift, TimeEntry, TimeOffRequest, User, WorkerProfile,
          )
          with transaction.atomic():
              demo_workers = WorkerProfile.objects.filter(
                  Q(employee_number__startswith='DEMO-') | Q(user__email__startswith='demo.worker')
              )
              demo_worker_ids = list(demo_workers.values_list('id', flat=True))
              demo_user_ids = list(demo_workers.values_list('user_id', flat=True))
              demo_clients = ClientCompany.objects.filter(
                  Q(customer_number='KD-DEMO') | Q(name='A+ Demo Kunde')
              )
              demo_client_ids = list(demo_clients.values_list('id', flat=True))
              demo_orders = ClientOrder.objects.filter(
                  Q(title='Sommerempfang Frankfurt') | Q(client_id__in=demo_client_ids)
              )
              demo_order_ids = list(demo_orders.values_list('id', flat=True))
              Shift.objects.filter(
                  Q(worker_id__in=demo_worker_ids) | Q(client_id__in=demo_client_ids) | Q(order_id__in=demo_order_ids)
              ).delete()
              TimeEntry.objects.filter(worker_id__in=demo_worker_ids).delete()
              TimeOffRequest.objects.filter(worker_id__in=demo_worker_ids).delete()
              Contract.objects.filter(Q(worker_id__in=demo_worker_ids) | Q(client_id__in=demo_client_ids)).delete()
              Document.objects.filter(Q(worker_id__in=demo_worker_ids) | Q(client_id__in=demo_client_ids)).delete()
              PayrollStatement.objects.filter(worker_id__in=demo_worker_ids).delete()
              demo_orders.delete()
              Location.objects.filter(client_id__in=demo_client_ids).delete()
              demo_workers.delete()
              User.objects.filter(Q(id__in=demo_user_ids) | Q(email__startswith='demo.worker')).delete()
              demo_clients.delete()
          counts = {
              'workers': WorkerProfile.objects.filter(Q(employee_number__startswith='DEMO-') | Q(user__email__startswith='demo.worker')).count(),
              'clients': ClientCompany.objects.filter(Q(customer_number='KD-DEMO') | Q(name='A+ Demo Kunde')).count(),
              'orders': ClientOrder.objects.filter(title='Sommerempfang Frankfurt').count(),
          }
          print('DEMO_COUNTS', counts)
          assert counts == {'workers': 0, 'clients': 0, 'orders': 0}
          PY

          echo 'PHASE=FRONTEND_REBUILD'
          grep -q 'Woche kopieren' frontend/src/Operations.tsx
          grep -q 'Zeiterfassung' frontend/src/Operations.tsx
          docker compose build --no-cache frontend
          docker compose up -d --force-recreate frontend caddy
          for attempt in $(seq 1 30); do
            if curl -kfsS --resolve solution.smarbiz.sbs:443:127.0.0.1 https://solution.smarbiz.sbs/health/ >/dev/null 2>&1; then break; fi
            sleep 3
          done
          FRONTEND_ID=$(docker compose ps -q frontend)
          test -n "$FRONTEND_ID"
          docker exec "$FRONTEND_ID" sh -c "grep -R -q 'Woche kopieren' /usr/share/nginx/html"
          docker exec "$FRONTEND_ID" sh -c "grep -R -q 'Zeiterfassung' /usr/share/nginx/html"
          echo 'FRONTEND_ACTIONS_OK=1'

          echo 'PHASE=TEMPLATE_RECOVERY'
          PRIVATE_KEY=''
          for candidate in /root/aplus-template-private.pem /root/aplussolution-template-private.pem /root/aplus-template-private-key.pem; do
            if [ -s "$candidate" ]; then PRIVATE_KEY="$candidate"; break; fi
          done
          if [ -z "$PRIVATE_KEY" ]; then
            PRIVATE_KEY=$(find /root -maxdepth 3 -type f -name '*.pem' -size +1k 2>/dev/null | head -n 1 || true)
          fi
          ENC_BUNDLE=$(find /root /opt/aplussolution -maxdepth 5 -type f \( -name 'aplus-document-templates.enc' -o -name 'templates.enc' \) 2>/dev/null | head -n 1 || true)
          ENC_KEY=$(find /root /opt/aplussolution -maxdepth 5 -type f \( -name 'keyiv.enc' -o -name 'keyiv.oaep.enc' \) 2>/dev/null | head -n 1 || true)
          if [ -n "$PRIVATE_KEY" ] && [ -n "$ENC_BUNDLE" ] && [ -n "$ENC_KEY" ]; then
            rm -f /tmp/keyiv.bin /tmp/original-templates.zip
            if ! openssl pkeyutl -decrypt -inkey "$PRIVATE_KEY" -in "$ENC_KEY" -out /tmp/keyiv.bin -pkeyopt rsa_padding_mode:oaep -pkeyopt rsa_oaep_md:sha256 2>/dev/null; then
              if ! openssl pkeyutl -decrypt -inkey "$PRIVATE_KEY" -in "$ENC_KEY" -out /tmp/keyiv.bin -pkeyopt rsa_padding_mode:oaep 2>/dev/null; then
                openssl pkeyutl -decrypt -inkey "$PRIVATE_KEY" -in "$ENC_KEY" -out /tmp/keyiv.bin -pkeyopt rsa_padding_mode:pkcs1 2>/dev/null
              fi
            fi
            test "$(stat -c %s /tmp/keyiv.bin)" = '48'
            KEY_HEX=$(dd if=/tmp/keyiv.bin bs=1 count=32 status=none | od -An -tx1 | tr -d ' \n')
            IV_HEX=$(dd if=/tmp/keyiv.bin bs=1 skip=32 count=16 status=none | od -An -tx1 | tr -d ' \n')
            openssl enc -d -aes-256-cbc -K "$KEY_HEX" -iv "$IV_HEX" -in "$ENC_BUNDLE" -out /tmp/original-templates.zip
            test "$(sha256sum /tmp/original-templates.zip | awk '{print $1}')" = '74dabc4bfd7df1357164e9821f2752388023902be1969b7ebba80a1568812f09'
            BACKEND_ID=$(docker compose ps -q backend)
            docker cp /tmp/original-templates.zip "$BACKEND_ID":/tmp/original-templates.zip
            docker compose exec -T backend python manage.py import_document_bundle /tmp/original-templates.zip
            docker compose exec -T backend rm -f /tmp/original-templates.zip
            rm -f /tmp/keyiv.bin /tmp/original-templates.zip
            echo 'EXISTING_ENCRYPTED_TEMPLATE_PAYLOAD_USED=1'
          else
            echo 'EXISTING_ENCRYPTED_TEMPLATE_PAYLOAD_USED=0'
          fi

          docker compose exec -T backend python manage.py shell <<'PY'
          from core.document_engine import seed_document_catalog
          from core.models import ContractTemplate
          seed_document_catalog()
          required = list(ContractTemplate.objects.filter(required_document=True).order_by('slug'))
          installed = [item for item in required if item.source_file and item.source_file.storage.exists(item.source_file.name) and item.source_checksum]
          print('TEMPLATE_REQUIRED', len(required))
          print('TEMPLATE_INSTALLED', len(installed))
          for item in required:
              print('TEMPLATE_STATE', item.slug, bool(item.source_file), bool(item.source_file and item.source_file.storage.exists(item.source_file.name)), bool(item.source_checksum))
          assert len(required) == 8
          assert len(installed) == 8
          PY

          echo 'PHASE=API_VERIFICATION'
          TOKEN=$(docker compose exec -T backend python manage.py shell -c "from rest_framework_simplejwt.tokens import RefreshToken; from core.models import User; u=User.objects.filter(role='admin',is_active=True).order_by('date_joined').first(); print(str(RefreshToken.for_user(u).access_token))" | tail -n 1 | tr -d '\r')
          test -n "$TOKEN"
          curl -fsS https://solution.smarbiz.sbs/api/document-catalog/ -H "Authorization: Bearer $TOKEN" -o /tmp/catalog.json
          curl -fsS https://solution.smarbiz.sbs/api/operations/folders/ -H "Authorization: Bearer $TOKEN" -o /tmp/folders.json
          python3 - <<'PY'
          import json
          catalog=json.load(open('/tmp/catalog.json'))
          folders=json.load(open('/tmp/folders.json'))
          assert catalog.get('count') == 8
          assert catalog.get('complete') is True
          assert sum(1 for item in catalog.get('documents', []) if item.get('source_installed')) == 8
          raw=json.dumps(folders, ensure_ascii=False)
          for forbidden in ('DEMO-001','DEMO-002','DEMO-003','A+ Demo Kunde','Anna Becker','Lukas Schmidt','Mia Wagner'):
              assert forbidden not in raw, forbidden
          print('API_TEMPLATE_COMPLETE', catalog.get('complete'))
          print('API_TEMPLATE_INSTALLED', sum(1 for item in catalog.get('documents', []) if item.get('source_installed')))
          print('API_DEMO_FREE', True)
          PY
          rm -f /tmp/catalog.json /tmp/folders.json
          docker compose exec -T backend python manage.py check
          curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null
          HTTP_CODE=$(curl -sS -o /tmp/login-smoke.json -w '%{http_code}' -X POST https://solution.smarbiz.sbs/api/auth/login/ -H 'Content-Type: application/json' --data '{"email":"invalid@example.com","password":"invalid"}')
          test "$HTTP_CODE" != '502'
          test "$HTTP_CODE" != '503'
          echo "PUBLIC_LOGIN_ENDPOINT_HTTP=$HTTP_CODE"
          echo 'PRODUCTION_REPAIR_COMPLETE=1'
          REMOTE
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-repair-result
          path: production-repair-result.txt
          retention-days: 1
