name: Diagnose production order planning
on:
  workflow_run:
    workflows: ['Validate and deploy production']
    types: [completed]
    branches: [main]
permissions:
  contents: read
  issues: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH authentication
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PASSWORD"
          cat > /tmp/aplus-askpass.sh <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          ASKPASS
          chmod 700 /tmp/aplus-askpass.sh
      - name: Recover failed deploy if needed and run rollback-only probe
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          SSH_ASKPASS: /tmp/aplus-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
          GH_TOKEN: ${{ github.token }}
          DEPLOY_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set +e
          export DEPLOY_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          remote_cmd="cd /opt/aplussolution; set -e; \
          if [ '$DEPLOY_CONCLUSION' != 'success' ]; then \
            echo 'ORDER_PROBE recovery: previous deployment concluded $DEPLOY_CONCLUSION'; \
            docker rm -f aplussolution-backend-1 aplussolution-frontend-1 aplussolution-celery-1 aplussolution-celery-beat-1 >/dev/null 2>&1 || true; \
            docker compose up -d --build --remove-orphans; \
            ready=0; \
            for i in \$(seq 1 60); do \
              if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then ready=1; break; fi; \
              sleep 3; \
            done; \
            if [ \"\$ready\" -ne 1 ]; then docker compose logs --no-color --tail=120 backend; exit 1; fi; \
            docker compose exec -T backend python manage.py migrate --check; \
            docker compose exec -T backend python manage.py check; \
          fi; \
          docker compose exec -T backend python manage.py diagnose_order_planning --title 'QA Client Order'"
          output=$(setsid -w ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            root@"$HOST" "$remote_cmd" 2>&1)
          status=$?
          printf '%s\n' "$output"
          clipped=$(printf '%s' "$output" | tail -c 12000)
          if [ "$status" -eq 0 ]; then result='SUCCESS'; else result='FAILED'; fi
          body=$(printf 'Production order-planning diagnostic: **%s**\n\nPrevious deploy: **%s**\n\n```text\n%s\n```\n\nProbe is rollback-only; it does not persist a Shift.' "$result" "$DEPLOY_CONCLUSION" "$clipped")
          gh api --method PATCH "repos/${{ github.repository }}/issues/84" -f body="$body" -f state=open >/dev/null
          exit "$status"
