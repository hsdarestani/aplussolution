name: Primary host diagnostic

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/primary-host-diagnostic.yml'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Configure STRATO key
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Inspect STRATO target
        continue-on-error: true
        run: |
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 root@"$STRATO_HOST" '
            echo TARGET=STRATO
            echo HOSTNAME=$(hostname)
            cd /opt/aplussolution 2>/dev/null || exit 0
            docker compose ps --format json 2>/dev/null | head -c 12000 || true
            echo
            docker compose exec -T backend python manage.py shell -c "from core.models import Notification; from core.push_models import PushDelivery; print(\"notifications=\"+str(Notification.objects.count())); print(\"push_deliveries=\"+str(PushDelivery.objects.count()))" 2>/dev/null || true
          '

      - name: Inspect BACKUP target
        continue-on-error: true
        run: |
          sshpass -p "$BACKUP_PASSWORD" ssh -o PubkeyAuthentication=no -o PreferredAuthentications=password -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 root@"$BACKUP_HOST" '
            echo TARGET=BACKUP
            echo HOSTNAME=$(hostname)
            cd /opt/aplussolution 2>/dev/null || exit 0
            docker compose ps --format json 2>/dev/null | head -c 12000 || true
            echo
            docker compose exec -T backend python manage.py shell -c "from core.models import Notification; from core.push_models import PushDelivery; print(\"notifications=\"+str(Notification.objects.count())); print(\"push_deliveries=\"+str(PushDelivery.objects.count()))" 2>/dev/null || true
          '

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
