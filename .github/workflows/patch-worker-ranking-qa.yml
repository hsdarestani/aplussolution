name: Apply worker portal QA patches

on:
  push:
    branches: [qa/worker-portal-deep]
    paths:
      - '.github/workflows/patch-worker-ranking-qa.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/worker-portal-deep
      - name: Patch worker portal frontend and conversation scope
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path('frontend/src/App.tsx')
          text = app.read_text()

          old_ranking = "function Ranking() {\n  const [workers, setWorkers] = useState<any[]>([]);\n  useEffect(() => {\n    api('workers/').then((data) =>"
          new_ranking = "function Ranking() {\n  const [workers, setWorkers] = useState<any[]>([]);\n  useEffect(() => {\n    api('employee/ranking/').then((data) =>"
          if old_ranking in text:
              text = text.replace(old_ranking, new_ranking, 1)
          elif new_ranking not in text:
              raise SystemExit('Ranking API marker was not found.')

          old_load = "    if (isManager(user)) {\n      const userData = await api('users/');\n      setUsers(unpack(userData));\n    }"
          new_load = "    const userData = await api(isManager(user) ? 'users/' : 'portal/message-recipients/');\n    setUsers(unpack(userData));"
          if old_load in text:
              text = text.replace(old_load, new_load, 1)
          elif new_load not in text:
              raise SystemExit('Messages recipient loading marker was not found.')

          old_action = "        action={\n          isManager(user) ? (\n            <IonButton onClick={() => setModal(true)}>\n              <IonIcon slot=\"start\" icon={addOutline} />\n              Unterhaltung\n            </IonButton>\n          ) : undefined\n        }"
          new_action = "        action={\n          <IonButton onClick={() => setModal(true)}>\n            <IonIcon slot=\"start\" icon={addOutline} />\n            Unterhaltung\n          </IonButton>\n        }"
          if old_action in text:
              text = text.replace(old_action, new_action, 1)
          elif new_action not in text:
              raise SystemExit('Messages action marker was not found.')

          app.write_text(text)

          views = Path('backend/core/views.py')
          text = views.read_text()
          old_create = "    def perform_create(self, serializer):\n        conversation = serializer.save()\n        conversation.participants.add(self.request.user)\n        audit(self.request, 'conversation.created', conversation)"
          new_create = "    def perform_create(self, serializer):\n        requested = list(serializer.validated_data.get('participants', []))\n        if self.request.user.role not in {'admin', 'manager'}:\n            if not requested:\n                raise ValidationError('Bitte die Disposition als Gesprächspartner auswählen.')\n            if any(person.role not in {'admin', 'manager'} for person in requested):\n                raise ValidationError('Mitarbeiter und Kunden können neue Unterhaltungen nur mit der Disposition starten.')\n        conversation = serializer.save()\n        conversation.participants.add(self.request.user)\n        audit(self.request, 'conversation.created', conversation)"
          if old_create in text:
              text = text.replace(old_create, new_create, 1)
          elif new_create not in text:
              raise SystemExit('Conversation perform_create marker was not found.')
          views.write_text(text)

          spec = Path('frontend/e2e/worker-portal-deep.spec.ts')
          text = spec.read_text()

          old_workers = "    if (path === 'workers/' || path.startsWith('workers/?')) return json(route, []);\n"
          ranking_mock = "    if (path === 'employee/ranking/') return json(route, [\n      { id: 'rank-2', employee_number: 'MA-002', ranking_points: 40, active: true, is_current_user: false, user_detail: { name: 'Lukas Schmidt' } },\n      { id: 'rank-1', employee_number: 'QA-MA-001', ranking_points: 25, active: true, is_current_user: true, user_detail: { name: worker.name } },\n    ]);\n"
          if ranking_mock not in text:
              if old_workers not in text:
                  raise SystemExit('Workers mock marker was not found.')
              text = text.replace(old_workers, ranking_mock + old_workers, 1)

          old_conv = "    if (path === 'conversations/') return json(route, []);\n    if (path === 'users/') return json(route, []);"
          new_conv = "    if (path === 'portal/message-recipients/') return json(route, [\n      { id: 'manager-1', name: 'A+ Disposition', role: 'manager' },\n    ]);\n    if (path === 'conversations/' && method === 'POST') {\n      const payload = JSON.parse(request.postData() || '{}');\n      return json(route, { id: 'conversation-worker-1', title: payload.title || 'Disposition', participants: payload.participants || [], participants_detail: [{ id: 'manager-1', name: 'A+ Disposition' }], messages: [] }, 201);\n    }\n    if (path === 'conversations/') return json(route, []);\n    if (path === 'users/') return json(route, []);"
          if old_conv in text:
              text = text.replace(old_conv, new_conv, 1)
          elif "path === 'portal/message-recipients/'" not in text:
              raise SystemExit('Conversation mock marker was not found.')

          old_secondary = "    await page.goto('/?view=messages');\n    await expect(page.getByText('Noch keine Unterhaltungen.')).toBeVisible();\n\n    const beforeRanking = state.requests.length;"
          new_secondary = "    const beforeMessages = state.requests.length;\n    await page.goto('/?view=messages');\n    await expect(page.getByText('Noch keine Unterhaltungen.')).toBeVisible();\n    await expect(page.getByRole('button', { name: 'Unterhaltung' })).toBeVisible();\n    const messageRequests = state.requests.slice(beforeMessages);\n    expect(messageRequests.some((r) => r.path === 'portal/message-recipients/')).toBe(true);\n    expect(messageRequests.some((r) => r.path === 'users/')).toBe(false);\n\n    const beforeRanking = state.requests.length;"
          if old_secondary in text:
              text = text.replace(old_secondary, new_secondary, 1)
          elif new_secondary not in text:
              raise SystemExit('Secondary messages test marker was not found.')

          old_ranking_test = "    await page.goto('/?view=ranking');\n    await expect(page.locator('body')).toContainText(/Ranking|Punkte|Mitarbeiter/i);\n\n    expect(forbiddenManagerFanout(state)).toEqual([]);"
          new_ranking_test = "    const beforeRanking = state.requests.length;\n    await page.goto('/?view=ranking');\n    await expect(page.getByText('Lukas Schmidt')).toBeVisible();\n    await expect(page.getByText('40 Punkte')).toBeVisible();\n    const rankingRequests = state.requests.slice(beforeRanking);\n    expect(rankingRequests.some((r) => r.path === 'employee/ranking/')).toBe(true);\n    expect(rankingRequests.some((r) => r.path === 'workers/' || r.path.startsWith('workers/?'))).toBe(false);\n\n    expect(forbiddenManagerFanout(state)).toEqual([]);"
          if old_ranking_test in text:
              text = text.replace(old_ranking_test, new_ranking_test, 1)
          elif "expect(rankingRequests.some((r) => r.path === 'employee/ranking/')).toBe(true);" not in text:
              raise SystemExit('Ranking test marker was not found.')

          spec.write_text(text)
          PY
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx frontend/e2e/worker-portal-deep.spec.ts backend/core/views.py
          git commit -m 'fix: harden worker ranking and messaging flows'
          git push origin HEAD:qa/worker-portal-deep
