name: Add 31 Oct private event

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/add-private-event-20261031.yml'

permissions:
  contents: read
  actions: read

jobs:
  add-event:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Wait for matching production deploy
        run: |
          set -euo pipefail
          for i in $(seq 1 100); do
            payload=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs?head_sha=${GITHUB_SHA}&per_page=20")
            status=$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.name == "Validate and deploy A+ Solution")][0].status // "missing"')
            conclusion=$(printf '%s' "$payload" | jq -r '[.workflow_runs[] | select(.name == "Validate and deploy A+ Solution")][0].conclusion // ""')
            echo "deploy status=$status conclusion=$conclusion"
            if [ "$status" = "completed" ]; then
              test "$conclusion" = "success"
              break
            fi
            sleep 10
          done
          test "$status" = "completed"
          test "$conclusion" = "success"

      - name: Configure Strato SSH key
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Add event through the standard Shift API path
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          cat >/tmp/add_private_event_20261031.py <<'PY'
          from datetime import datetime
          from zoneinfo import ZoneInfo

          from rest_framework.test import APIRequestFactory, force_authenticate

          from core.models import ClientCompany, Location, Position, Shift, User
          from core.shift_views import StaffingShiftViewSet

          EVENT_NAME = 'Private Veranstaltung'
          ADDRESS = 'Fuldastrasse 30, 63308 Dreieich'
          START = datetime(2026, 10, 31, 16, 0, tzinfo=ZoneInfo('Europe/Berlin'))
          END = datetime(2026, 10, 31, 22, 0, tzinfo=ZoneInfo('Europe/Berlin'))

          client = ClientCompany.objects.filter(name__iexact=EVENT_NAME).first()
          if client is None:
              base_number = 'PV-20261031'
              number = base_number
              suffix = 1
              while ClientCompany.objects.filter(customer_number=number).exists():
                  suffix += 1
                  number = f'{base_number}-{suffix}'
              client = ClientCompany.objects.create(
                  name=EVENT_NAME,
                  customer_number=number,
                  address=ADDRESS,
                  active=True,
              )

          location = Location.objects.filter(client=client, address__iexact=ADDRESS).first()
          if location is None:
              location = Location.objects.create(
                  client=client,
                  name='Fuldastrasse 30, Dreieich',
                  address=ADDRESS,
                  timezone='Europe/Berlin',
                  active=True,
              )

          actor = (
              User.objects.filter(role=User.Role.ADMIN, is_active=True).order_by('date_joined').first()
              or User.objects.filter(role=User.Role.MANAGER, is_active=True).order_by('date_joined').first()
          )
          if actor is None:
              raise RuntimeError('No active admin/manager available for the standard Shift API path.')

          service_position = Position.objects.filter(name__iexact='Servicekraft', active=True).first()
          bar_position = (
              Position.objects.filter(name__iexact='Bar', active=True).first()
              or Position.objects.filter(name__iexact='Bar-Support', active=True).first()
          )
          if service_position is None or bar_position is None:
              raise RuntimeError('Required Servicekraft / Bar position is not active.')

          factory = APIRequestFactory()
          create_view = StaffingShiftViewSet.as_view({'post': 'create'})

          def ensure_open_shift(position, required_count):
              existing = (
                  Shift.objects.filter(
                      client=client,
                      location=location,
                      position=position,
                      starts_at=START,
                      ends_at=END,
                      required_count=required_count,
                  )
                  .exclude(status=Shift.Status.CANCELLED)
                  .first()
              )
              if existing is not None:
                  return existing, False

              payload = {
                  'client': str(client.id),
                  'location': str(location.id),
                  'position': str(position.id),
                  'starts_at': START.isoformat(),
                  'ends_at': END.isoformat(),
                  'status': Shift.Status.PUBLISHED,
                  'notes': EVENT_NAME,
                  'required_count': required_count,
                  'confirmation_required': False,
                  'schedule_groups': ['service'],
              }
              request = factory.post('/api/shifts/', payload, format='json')
              force_authenticate(request, user=actor)
              response = create_view(request)
              response.render()
              if response.status_code not in (200, 201):
                  raise RuntimeError(f'Shift create failed ({response.status_code}): {response.data}')
              return Shift.objects.get(pk=response.data['id']), True

          service_shift, service_created = ensure_open_shift(service_position, 2)
          bar_shift, bar_created = ensure_open_shift(bar_position, 1)

          service_shift.refresh_from_db()
          bar_shift.refresh_from_db()
          print({
              'event': EVENT_NAME,
              'address': ADDRESS,
              'service_shift_id': str(service_shift.id),
              'service_created': service_created,
              'service_required_count': service_shift.required_count,
              'service_open_slots': service_shift.slots.filter(status='open', worker__isnull=True).count(),
              'bar_shift_id': str(bar_shift.id),
              'bar_created': bar_created,
              'bar_required_count': bar_shift.required_count,
              'bar_open_slots': bar_shift.slots.filter(status='open', worker__isnull=True).count(),
              'statuses': [service_shift.status, bar_shift.status],
          })
          PY

          docker compose exec -T backend python manage.py shell < /tmp/add_private_event_20261031.py
          rm -f /tmp/add_private_event_20261031.py
          REMOTE

      - name: Cleanup runner key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
