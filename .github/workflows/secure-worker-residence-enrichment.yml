name: Secure worker residence enrichment

on:
  workflow_dispatch:
    inputs:
      step:
        description: 'First choose prepare. Apply runs automatically after encrypted payload is committed.'
        required: true
        type: choice
        default: prepare
        options:
          - prepare
          - apply
  push:
    branches: [main]
    paths:
      - 'ops/encrypted-worker-residence-20261105.cms.b64'

permissions:
  contents: read

concurrency:
  group: secure-worker-residence-enrichment
  cancel-in-progress: false

jobs:
  prepare:
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.step == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Prepare temporary public encryption certificate on STRATO
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST" && test -n "$STRATO_SSH_PRIVATE_KEY"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/worker_enrich"
          chmod 600 "$HOME/.ssh/worker_enrich"
          ssh -i "$HOME/.ssh/worker_enrich" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 root@"$STRATO_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          KEY=/root/.aplus_residence_enrichment_20261105.key
          CERT=/root/.aplus_residence_enrichment_20261105.crt
          if [ -e "$KEY" ] || [ -e "$CERT" ]; then
            test -s "$KEY" && test -s "$CERT"
            openssl x509 -in "$CERT" -checkend 3600 -noout >/dev/null
          else
            openssl req -x509 -newkey rsa:3072 -nodes -sha256 -days 2 \
              -subj '/CN=aplus-residence-enrichment-20261105' \
              -keyout "$KEY" -out "$CERT" >/dev/null 2>&1
            chmod 600 "$KEY" "$CERT"
          fi
          echo "WORKER_RESIDENCE_PUBLIC_CERT_B64=$(base64 -w0 "$CERT")"
          echo 'PUBLIC_CERTIFICATE_PREPARED'
          REMOTE
      - name: Remove CI SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/worker_enrich"

  apply:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && github.event.inputs.step == 'apply')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check encrypted payload and production connection
        shell: bash
        run: |
          set -euo pipefail
          test -s ops/encrypted-worker-residence-20261105.cms.b64
          test -s deploy/secure_ops/enrich_existing_worker_residence.py
          test -n "$STRATO_HOST" && test -n "$STRATO_SSH_PRIVATE_KEY"
      - name: Upload ciphertext and safe application script
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/worker_enrich"
          chmod 600 "$HOME/.ssh/worker_enrich"
          scp -q -i "$HOME/.ssh/worker_enrich" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            ops/encrypted-worker-residence-20261105.cms.b64 \
            root@"$STRATO_HOST":/tmp/aplus-worker-residence.cms.b64
          scp -q -i "$HOME/.ssh/worker_enrich" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            deploy/secure_ops/enrich_existing_worker_residence.py \
            root@"$STRATO_HOST":/tmp/aplus-worker-residence.py
      - name: Decrypt on STRATO, patch one existing employee and verify saved data
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/worker_enrich" -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -se' <<'REMOTE'
          set -euo pipefail
          umask 077
          KEY=/root/.aplus_residence_enrichment_20261105.key
          CERT=/root/.aplus_residence_enrichment_20261105.crt
          PAYLOAD=/tmp/aplus-worker-residence.cms.b64
          SCRIPT=/tmp/aplus-worker-residence.py
          test -s "$KEY" && test -s "$CERT" && test -s "$PAYLOAD" && test -s "$SCRIPT"
          WORKDIR="$(mktemp -d /tmp/aplus-residence.XXXXXXXX)"
          trap 'rm -rf "$WORKDIR"; rm -f "$PAYLOAD" "$SCRIPT"' EXIT
          base64 -d "$PAYLOAD" > "$WORKDIR/data.cms"
          openssl cms -decrypt -binary -inform DER -in "$WORKDIR/data.cms" \
            -recip "$CERT" -inkey "$KEY" -out "$WORKDIR/data.json"
          test -s "$WORKDIR/data.json"
          cd /opt/aplussolution
          docker compose exec -T backend python -c "$(cat "$SCRIPT")" < "$WORKDIR/data.json"
          rm -f "$KEY" "$CERT"
          echo 'SECURE_RESIDENCE_ENRICHMENT_COMPLETE'
          REMOTE
      - name: Remove CI SSH key
        if: always()
        shell: bash
        run: rm -f "$HOME/.ssh/worker_enrich"
