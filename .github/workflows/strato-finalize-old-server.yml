name: Finalize A+ Strato cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-finalize-old-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OLD_HOST: ${{ secrets.HOST }}
      OLD_PASS: ${{ secrets.PASS }}
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Refresh Strato TLS for both domains
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose restart caddy
          sleep 4
          docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
          curl -fsS --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/health/
          curl -fsS --resolve solution.smarbiz.sbs:443:127.0.0.1 https://solution.smarbiz.sbs/health/
          REMOTE

      - name: Wait for public legacy HTTPS after DNS change
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 24); do
            code=$(curl -sS -o /tmp/body -w '%{http_code}' --max-time 20 https://solution.smarbiz.sbs/health/ || true)
            body=$(cat /tmp/body 2>/dev/null || true)
            echo "attempt=${i} http=${code} body=${body}"
            if [ "$code" = "200" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/body; then
              ok=1
              break
            fi
            sleep 5
          done
          if [ "$ok" -ne 1 ]; then
            echo 'Legacy domain did not become healthy after TLS refresh.' >&2
            ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'cd /opt/aplussolution && docker compose logs --no-color --tail=160 caddy' || true
            exit 1
          fi

      - name: Verify both public domains before stopping old writers
        run: |
          set -euo pipefail
          for domain in app.aplus-solution.de solution.smarbiz.sbs; do
            curl -fsS --retry 6 --retry-delay 3 --max-time 20 -o /tmp/body "https://${domain}/health/"
            grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/body
            echo "${domain} is publicly healthy"
          done

      - name: Stop only the old A+ Solution application writers
        run: |
          set -euo pipefail
          test -n "$OLD_HOST"
          test -n "$OLD_PASS"
          test "$OLD_HOST" != "$STRATO_HOST"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -p "$OLD_PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$OLD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -d /opt/aplussolution
          cd /opt/aplussolution
          test -f docker-compose.yml
          echo 'Old stack before stop:'
          docker compose ps || true
          # Stop only processes that can accept writes or execute background jobs.
          # DB, Redis, media and all volumes remain intact for rollback.
          docker compose stop backend celery celery-beat
          echo 'Old stack after stop:'
          docker compose ps || true
          REMOTE

      - name: Verify public traffic no longer depends on old writers
        id: verify_after
        continue-on-error: true
        run: |
          set -euo pipefail
          sleep 8
          for domain in app.aplus-solution.de solution.smarbiz.sbs; do
            curl -fsS --retry 6 --retry-delay 3 --max-time 20 -o /tmp/body "https://${domain}/health/"
            grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/body
            echo "${domain} remains healthy with old application writers stopped"
          done

      - name: Roll back old writers if verification failed
        if: steps.verify_after.outcome == 'failure'
        run: |
          set -euo pipefail
          sshpass -p "$OLD_PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$OLD_HOST" 'cd /opt/aplussolution && docker compose start backend celery celery-beat'
          echo 'Public verification failed; old writers were restarted for safety.' >&2
          exit 1

      - name: Confirm cutover
        if: steps.verify_after.outcome == 'success'
        run: |
          echo 'Strato cutover confirmed. Old backend/celery writers are stopped; rollback data remains intact.'

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/body
