name: Finalize A+ Strato cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-finalize-old-server.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      OLD_HOST: ${{ secrets.HOST }}
      OLD_PASS: ${{ secrets.PASS }}
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Verify both public domains are served by Strato
        run: |
          set -euo pipefail
          for domain in app.aplus-solution.de solution.smarbiz.sbs; do
            ok=0
            for i in $(seq 1 12); do
              rm -f /tmp/headers /tmp/body
              code=$(curl -sS -D /tmp/headers -o /tmp/body -w '%{http_code}' --max-time 20 "https://${domain}/health/" || true)
              origin=$(awk 'BEGIN{IGNORECASE=1} /^x-aplus-origin:/ {gsub("\r",""); print $2}' /tmp/headers | tail -n1)
              body=$(cat /tmp/body 2>/dev/null || true)
              echo "${domain}: http=${code} origin=${origin:-missing} body=${body}"
              if [ "$code" = "200" ] && [ "$origin" = "strato" ] && grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/body; then
                ok=1
                break
              fi
              sleep 5
            done
            if [ "$ok" -ne 1 ]; then
              echo "Refusing old-server shutdown because ${domain} is not confirmed on Strato." >&2
              exit 1
            fi
          done

      - name: Verify Strato origin directly
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose ps
          curl -fsS --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/health/
          curl -fsS --resolve solution.smarbiz.sbs:443:127.0.0.1 https://solution.smarbiz.sbs/health/
          REMOTE

      - name: Stop only the old A+ Solution application writers
        run: |
          set -euo pipefail
          test -n "$OLD_HOST"
          test -n "$OLD_PASS"
          test "$OLD_HOST" != "$STRATO_HOST"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass >/dev/null
          sshpass -p "$OLD_PASS" ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$OLD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -d /opt/aplussolution
          cd /opt/aplussolution
          test -f docker-compose.yml
          echo 'Old stack before stop:'
          docker compose ps || true
          # Stop services that can accept writes or execute background jobs.
          # Keep DB/Redis volumes and files intact for rollback; nothing is deleted.
          docker compose stop backend celery celery-beat
          echo 'Old stack after stop:'
          docker compose ps || true
          REMOTE

      - name: Re-verify public traffic after old writers are stopped
        run: |
          set -euo pipefail
          sleep 5
          for domain in app.aplus-solution.de solution.smarbiz.sbs; do
            curl -fsS -D /tmp/headers -o /tmp/body --max-time 20 "https://${domain}/health/"
            grep -qi '^x-aplus-origin: strato' /tmp/headers
            grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/body
            echo "${domain} remains healthy on Strato"
          done

      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519" /tmp/headers /tmp/body
