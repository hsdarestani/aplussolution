name: Final WIW full account archive

on:
  push:
    branches:
      - wiw-final-export-20260920
    paths:
      - '.github/workflows/wiw-final-export.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiw-final-export
  cancel-in-progress: false

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Build exhaustive WIW archive on production
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=30 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail
          cd /opt/aplussolution

          STAMP="$(date -u +%Y%m%dT%H%M%SZ)"
          BASE="/root/aplussolution-backups"
          OUT="$BASE/final-wiw-account-export-$STAMP"
          ARCHIVE="$BASE/final-wiw-account-export-$STAMP.tar.gz"

          mkdir -p "$OUT"/{live,local,database,media,historical,meta}
          chmod 700 "$OUT"

          echo "$STAMP" > "$OUT/meta/export-stamp-utc.txt"
          git rev-parse HEAD > "$OUT/meta/repo-commit.txt" || true
          docker compose ps > "$OUT/meta/docker-compose-ps.txt"

          # 1) Proven-complete live WIW snapshot using the exact bounded-history
          # migration reader that guards against silent-empty broad API ranges.
          docker compose exec -T backend python - <<'PY' > "$OUT/live/core-snapshot.json"
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from core.wiw import WhenIWorkClient
          from core.wiw_migration import fetch_complete_wiw_snapshot
          client = WhenIWorkClient()
          snapshot, errors = fetch_complete_wiw_snapshot(client)
          result = {
              "resources": snapshot,
              "counts": {k: len(v) for k, v in snapshot.items()},
              "errors": errors,
          }
          print(json.dumps(result, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          if errors:
              raise SystemExit("WIW core snapshot incomplete: " + json.dumps(errors, ensure_ascii=False))
          PY

          gzip -9 "$OUT/live/core-snapshot.json"

          # 2) Probe additional read-only WIW resource families that are listed by
          # WIW's own export guidance but were not part of the historical A+ sync.
          # Unsupported endpoints are retained in the report instead of being
          # silently ignored.
          docker compose exec -T backend python - <<'PY' > "$OUT/live/additional-readonly-probes.json"
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from core.wiw import WhenIWorkClient
          c = WhenIWorkClient()
          candidates = {
              "schedules": [
                  ("/schedules", {"limit": 1000}),
              ],
              "shift_templates": [
                  ("/shift_templates", {"limit": 1000}),
                  ("/shifttemplates", {"limit": 1000}),
                  ("/templates", {"limit": 1000}),
              ],
              "absences": [
                  ("/absences", {"start": "2000-01-01T00:00:00Z", "end": "2100-01-01T00:00:00Z", "limit": 1000}),
                  ("/absences", {"limit": 1000}),
              ],
              "pay_periods": [
                  ("/pay_periods", {"limit": 1000}),
                  ("/payperiods", {"limit": 1000}),
              ],
              "payroll": [
                  ("/payroll", {"limit": 1000}),
              ],
              "account": [
                  ("/account", {}),
              ],
              "settings": [
                  ("/settings", {}),
              ],
              "tasks": [
                  ("/tasks", {"limit": 1000}),
              ],
              "task_lists": [
                  ("/task_lists", {"limit": 1000}),
                  ("/tasklists", {"limit": 1000}),
              ],
          }
          out = {}
          for name, variants in candidates.items():
              attempts = []
              success = None
              for path, params in variants:
                  try:
                      payload = c.get(path, params=params)
                      success = {"path": path, "params": params, "payload": payload}
                      attempts.append({"path": path, "params": params, "ok": True})
                      break
                  except Exception as exc:
                      attempts.append({"path": path, "params": params, "ok": False, "error": str(exc)})
              out[name] = {"success": success, "attempts": attempts}
          print(json.dumps(out, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          PY
          gzip -9 "$OUT/live/additional-readonly-probes.json"

          # 3) Strict read-only reconciliation proving the core WIW snapshot is
          # present locally before the external account is deleted.
          docker compose exec -T backend python - <<'PY' > "$OUT/meta/wiw-reconciliation.json"
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from core.wiw_migration import build_wiw_migration_report
          report = build_wiw_migration_report(apply_full_sync=False)
          print(json.dumps(report, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          if not report.get("cutover_ready"):
              raise SystemExit("WIW reconciliation is not cutover-ready")
          PY

          # 4) Complete production PostgreSQL backup. This is the restore source
          # of truth for all imported WIW data plus legacy WordPress migration
          # tables, raw wiw_payload JSON and historical records.
          DB_USER="$(docker compose exec -T db printenv POSTGRES_USER | tr -d '\r')"
          DB_NAME="$(docker compose exec -T db printenv POSTGRES_DB | tr -d '\r')"
          : "${DB_USER:?POSTGRES_USER missing}"
          : "${DB_NAME:?POSTGRES_DB missing}"

          docker compose exec -T db pg_dump -U "$DB_USER" -d "$DB_NAME" -Fc > "$OUT/database/full-production.dump"
          test -s "$OUT/database/full-production.dump"
          docker compose exec -T db pg_dump -U "$DB_USER" -d "$DB_NAME" --schema-only | gzip -9 > "$OUT/database/schema.sql.gz"

          # Human-readable application data as a second independent representation.
          docker compose exec -T backend python manage.py dumpdata core --indent 2 | gzip -9 > "$OUT/local/core-dumpdata.json.gz"
          test -s "$OUT/local/core-dumpdata.json.gz"

          # Every Django model count + focused WIW-linked counts for validation.
          docker compose exec -T backend python - <<'PY' > "$OUT/meta/model-counts.json"
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.apps import apps
          from core.models import User, WorkerProfile, Location, Position, Shift, TimeEntry
          counts = {}
          for model in apps.get_app_config("core").get_models():
              try:
                  counts[model.__name__] = model.objects.count()
              except Exception as exc:
                  counts[model.__name__] = {"error": str(exc)}
          focused = {
              "users_with_wiw_id": User.objects.exclude(wiw_id__isnull=True).exclude(wiw_id="").count(),
              "workers_with_wiw_id": WorkerProfile.objects.exclude(wiw_user_id__isnull=True).exclude(wiw_user_id="").count(),
              "locations_with_wiw_location_id": Location.objects.exclude(wiw_location_id__isnull=True).exclude(wiw_location_id="").count(),
              "locations_with_wiw_site_id": Location.objects.exclude(wiw_site_id__isnull=True).exclude(wiw_site_id="").count(),
              "positions_with_wiw_id": Position.objects.exclude(wiw_position_id__isnull=True).exclude(wiw_position_id="").count(),
              "shifts_with_wiw_id": Shift.objects.exclude(wiw_shift_id__isnull=True).exclude(wiw_shift_id="").count(),
              "times_with_wiw_id": TimeEntry.objects.exclude(wiw_time_id__isnull=True).exclude(wiw_time_id="").count(),
          }
          print(json.dumps({"all_core_models": counts, "wiw_linked": focused}, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          PY

          # Sanitized integration configuration: preserve non-secret behavior and
          # identifiers, never archive passwords, API keys or webhook secrets.
          docker compose exec -T backend python - <<'PY' > "$OUT/meta/wiw-config-sanitized.json"
          import json, os
          os.environ.setdefault("DJANGO_SETTINGS_MODULE", "config.settings")
          import django
          django.setup()
          from django.conf import settings
          data = {
              "API_BASE": "https://api.wheniwork.com/2",
              "WIW_USER_ID": getattr(settings, "WIW_USER_ID", ""),
              "WIW_SYNC_ENABLED": getattr(settings, "WIW_SYNC_ENABLED", False),
              "WIW_READ_ONLY": getattr(settings, "WIW_READ_ONLY", True),
              "WIW_HTTP_TIMEOUT": getattr(settings, "WIW_HTTP_TIMEOUT", None),
              "WIW_TOKEN_CACHE_SECONDS": getattr(settings, "WIW_TOKEN_CACHE_SECONDS", None),
              "credentials_present": {
                  "WIW_DEV_KEY": bool(getattr(settings, "WIW_DEV_KEY", "")),
                  "WIW_EMAIL": bool(getattr(settings, "WIW_EMAIL", "")),
                  "WIW_PASSWORD": bool(getattr(settings, "WIW_PASSWORD", "")),
                  "WIW_WEBHOOK_SECRET": bool(getattr(settings, "WIW_WEBHOOK_SECRET", "")),
              },
          }
          print(json.dumps(data, ensure_ascii=False, default=str, indent=2, sort_keys=True))
          PY

          # 5) Entire media volume: contracts, documents, payroll files, avatars,
          # order attachments and time-clock photos are preserved, regardless of
          # whether an individual file still has an explicit WIW foreign key.
          docker compose exec -T backend sh -c 'tar -C /app/media -czf - .' > "$OUT/media/media.tar.gz"
          test -s "$OUT/media/media.tar.gz"

          # 6) Preserve every earlier server-side WIW migration backup/report,
          # including the pre-full-reset SQL backup if it still exists.
          shopt -s nullglob
          for f in "$BASE"/*wiw* "$BASE"/pre-wiw-* "$BASE"/post-wiw-*; do
            if [[ -f "$f" && "$f" != "$ARCHIVE" ]]; then
              cp -a "$f" "$OUT/historical/"
            fi
          done
          shopt -u nullglob

          # Inventory and cryptographic integrity.
          find "$OUT" -type f -printf '%P\t%s bytes\n' | sort > "$OUT/meta/file-inventory.txt"
          (
            cd "$OUT"
            find . -type f ! -path './meta/checksums.sha256' -print0 | sort -z | xargs -0 sha256sum
          ) > "$OUT/meta/checksums.sha256"

          cat > "$OUT/README.txt" <<'TXT'
          FINAL WIW ACCOUNT ARCHIVE

          This archive is intentionally redundant so a When I Work account can be
          removed without making A+ Solution dependent on the external account.

          live/core-snapshot.json.gz
            Proven-complete bounded history snapshot for:
            users, positions, locations, sites, shifts, times, availabilities, requests.

          live/additional-readonly-probes.json.gz
            Read-only probes for additional WIW resource families such as schedules,
            shift templates, absences and pay-period/payroll endpoints. Unsupported
            endpoints and errors are retained explicitly.

          database/full-production.dump
            PostgreSQL custom-format backup of the complete production database.

          local/core-dumpdata.json.gz
            Human-readable Django JSON representation of all core application data.

          media/media.tar.gz
            Complete production media volume.

          historical/
            Earlier WIW migration backups, reports and pre/post migration counts that
            were still present on the production server.

          meta/
            Reconciliation report, counts, sanitized configuration, inventory and
            SHA-256 checksums.

          Secrets/passwords/API keys are intentionally NOT written to the archive.
          TXT

          tar -C "$OUT" -czf "$ARCHIVE" .
          sha256sum "$ARCHIVE" > "$ARCHIVE.sha256"
          chmod 600 "$ARCHIVE" "$ARCHIVE.sha256"

          echo "$ARCHIVE" > /tmp/final_wiw_archive_path
          echo "FINAL_WIW_ARCHIVE_READY $ARCHIVE"
          REMOTE

      - name: Download archive from production
        shell: bash
        run: |
          set -euo pipefail
          REMOTE_PATH="$(ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST" 'cat /tmp/final_wiw_archive_path')"
          test -n "$REMOTE_PATH"
          scp -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST":"$REMOTE_PATH" ./wiw-final-account-archive.tar.gz
          scp -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$STRATO_HOST":"$REMOTE_PATH.sha256" ./wiw-final-account-archive.remote.sha256
          test -s ./wiw-final-account-archive.tar.gz
          sha256sum ./wiw-final-account-archive.tar.gz > ./wiw-final-account-archive.local.sha256
          echo "Archive size: $(du -h ./wiw-final-account-archive.tar.gz | cut -f1)"

      - name: Split large archive if needed
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifact
          size="$(stat -c %s ./wiw-final-account-archive.tar.gz)"
          if [ "$size" -gt 1800000000 ]; then
            split -b 1700M -d -a 3 ./wiw-final-account-archive.tar.gz artifact/wiw-final-account-archive.tar.gz.part-
            printf '%s\n' 'To restore: cat wiw-final-account-archive.tar.gz.part-* > wiw-final-account-archive.tar.gz' > artifact/RESTORE_PARTS.txt
          else
            mv ./wiw-final-account-archive.tar.gz artifact/
          fi
          cp ./wiw-final-account-archive.remote.sha256 artifact/
          cp ./wiw-final-account-archive.local.sha256 artifact/

      - name: Upload final WIW archive
        uses: actions/upload-artifact@v4
        with:
          name: wiw-final-account-archive-20260920
          path: artifact/
          if-no-files-found: error
          compression-level: 0
          retention-days: 30

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
