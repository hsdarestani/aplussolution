name: Apply Phase 8 signature audit label fix

on:
  push:
    branches: [feature/phase8-signatures-wiw-mobile]
    paths:
      - '.github/workflows/apply-phase8-signature-audit-label-fix.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase8-signatures-wiw-mobile
          fetch-depth: 0
      - name: Apply signature audit label fix
        run: python scripts/phase8_signature_audit_label_fix.py
      - name: Commit and retire helper
        run: |
          rm -f scripts/phase8_signature_audit_label_fix.py .github/workflows/apply-phase8-signature-audit-label-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Preserve Phase 8 signature audit labels"
          git push origin HEAD:feature/phase8-signatures-wiw-mobile
