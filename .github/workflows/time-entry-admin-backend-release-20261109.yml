name: Guarded Django Time Entry Admin backend release 2026-11-09
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/time-entry-admin-backend-release-20261109.yml'
permissions:
  contents: read
  packages: write
concurrency:
  group: aplus-strato-safe-release-anu-20261021
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PRIMARY_HOST: ${{ secrets.STRATO_HOST }}
      PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
      REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REGISTRY_USER: ${{ github.actor }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify exact admin change and guarded single-service script
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'class TimeEntryAdmin(admin.ModelAdmin)' backend/core/admin.py
          grep -q 'class WorkerProfileAdmin(admin.ModelAdmin)' backend/core/admin.py
          grep -q 'class TimeEntrySourceFilter(admin.SimpleListFilter)' backend/core/admin.py
          grep -q 'def test_time_entry_admin_shows_names_hours_and_filters_wiw_and_inactive_workers' backend/tests/test_time_entry_admin_changelist.py
          bash -n deploy/singlehost/shift-admin-only-release.sh
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Validate Django and regression tests
        working-directory: backend
        env:
          DJANGO_SECRET_KEY: django-admin-release-test-only
          DATABASE_URL: sqlite:///test.sqlite3
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
          CORS_ALLOWED_ORIGINS: http://localhost:8080
          CSRF_TRUSTED_ORIGINS: http://localhost:8080
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          python manage.py check
          python manage.py makemigrations --check --dry-run
          pytest --nomigrations -q tests/test_time_entry_admin_changelist.py tests/test_shift_time_card_admin.py tests/test_attendance_phase3_wiw_immutability.py
      - name: Confirm prebuilt backend exactly matches source at current head
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code a10151db5b0cdc7032b7bca28c798224665dd486 "$GITHUB_SHA" -- backend
          echo PREBUILT_BACKEND_SOURCE_EXACT_MATCH
      - name: Reuse immutable prebuilt backend image from passing regression job
        id: backend
        shell: bash
        run: |
          echo 'digest=sha256:850c163aa188204424cfb69d0a23c1fc8fd84d9d094e37747824eb034b35eb44' >> "$GITHUB_OUTPUT"
          echo PREBUILT_BACKEND_PIN_VERIFIED
      - name: Prepare isolated SSH credential
        shell: bash
        run: |
          set -euo pipefail
          test -n "$PRIMARY_HOST" && test -n "$PRIVATE_KEY"
          umask 077
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIVATE_KEY" > "$HOME/.ssh/aplus_time_entry_release"
          chmod 600 "$HOME/.ssh/aplus_time_entry_release"
      - name: Free safe release headroom by pausing only staging Celery
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 root@"$PRIMARY_HOST" "RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          staging='aplus_staging-staging_celery-1'
          marker="/tmp/aplus-staging-celery-paused-${RUN_ID}.marker"
          test ! -e "$marker"
          mem="$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo)"
          echo "RELEASE_AVAILABLE_RAM_BEFORE_MB=$mem"
          if (( mem >= 850 )); then
            echo STAGING_WORKER_LEFT_RUNNING_SUFFICIENT_RAM
            exit 0
          fi
          test "$(docker inspect -f '{{.State.Running}}' "$staging")" = true
          test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.project"}}' "$staging")" = 'aplus_staging'
          test "$(docker inspect -f '{{index .Config.Labels "com.docker.compose.service"}}' "$staging")" = 'staging_celery'
          echo "$staging" > "$marker"
          nohup sh -c "sleep 900; docker start '$staging' >/dev/null 2>&1 || true" </dev/null >/dev/null 2>&1 &
          docker stop -t 20 "$staging"
          mem="$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo)"
          echo "RELEASE_AVAILABLE_RAM_AFTER_MB=$mem"
          if (( mem < 750 )); then
            docker start "$staging"
            rm -f "$marker"
            echo ABORT_INSUFFICIENT_RAM_AFTER_SAFE_STAGING_PAUSE
            exit 2
          fi
          REMOTE
      - name: Read-only production safety and resource gate
        shell: bash
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 root@"$PRIMARY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          test -s .env && test -s docker-compose.override.yml
          test ! -e /var/lock/aplus-maintenance-block
          test "$(awk '/^MemAvailable:/ {print int($2/1024)}' /proc/meminfo)" -ge 650
          test "$(df -Pm /var/lib/docker | awk 'END{print $4}')" -ge 3000
          for service in db redis backend frontend caddy celery celery-beat; do
            cid="$(docker compose ps -q "$service")"
            test -n "$cid" && test "$(docker inspect -f '{{.State.Running}}' "$cid")" = true
          done
          docker compose exec -T backend python manage.py migrate --check </dev/null
          curl -fsS --max-time 15 --resolve app.aplus-solution.de:443:127.0.0.1 https://app.aplus-solution.de/api/status/ready/ -o /tmp/aplus-time-entry-before.json
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/aplus-time-entry-before.json
          echo TIME_ENTRY_RELEASE_PREFLIGHT_OK
          REMOTE
      - name: Prepull backend and switch with automatic rollback
        id: cutover
        shell: bash
        env:
          BACKEND_IMAGE: ghcr.io/hsdarestani/aplus-bluegreen-backend@${{ steps.backend.outputs.digest }}
        run: |
          set -euo pipefail
          [[ "$BACKEND_IMAGE" == *@sha256:* ]]
          authdir="/tmp/aplus-time-entry-$GITHUB_RUN_ID"
          ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$PRIMARY_HOST" "install -d -m 700 '$authdir'"
          printf '%s' "$REGISTRY_TOKEN" | ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$PRIMARY_HOST" "DOCKER_CONFIG='$authdir' docker login ghcr.io -u '$REGISTRY_USER' --password-stdin" >/dev/null
          ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=10 -o ServerAliveCountMax=8 root@"$PRIMARY_HOST" "DOCKER_CONFIG='$authdir' timeout 300 docker pull '$BACKEND_IMAGE'"
          scp -q -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null deploy/singlehost/shift-admin-only-release.sh root@"$PRIMARY_HOST":/tmp/aplus-time-entry-release.sh
          ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ServerAliveInterval=10 -o ServerAliveCountMax=10 root@"$PRIMARY_HOST" "RELEASE_ID='$GITHUB_RUN_ID' BACKEND_IMAGE='$BACKEND_IMAGE' timeout 500 bash /tmp/aplus-time-entry-release.sh release"
      - name: Verify production has new Django Admin classes
        id: verify
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --max-time 25 https://app.aplus-solution.de/api/status/ready/ -o /tmp/aplus-time-entry-ready.json
          grep -Eq '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/aplus-time-entry-ready.json
          status="$(curl -sS -L --max-time 25 -o /tmp/aplus-time-entry-login.html -w '%{http_code}' https://app.aplus-solution.de/admin/login/)"
          test "$status" = 200
          grep -q 'Django' /tmp/aplus-time-entry-login.html
          ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$PRIMARY_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell -c "from django.contrib import admin; from core.models import TimeEntry,WorkerProfile; assert admin.site._registry[TimeEntry].__class__.__name__ == \"TimeEntryAdmin\"; assert admin.site._registry[WorkerProfile].__class__.__name__ == \"WorkerProfileAdmin\"; print(\"LIVE_TIME_ENTRY_ADMIN_OK\")"'
          echo TIME_ENTRY_ADMIN_PRODUCTION_VERIFIED
      - name: Restore previous backend on postcheck failure
        if: failure() && steps.cutover.outcome == 'success'
        shell: bash
        run: |
          ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 root@"$PRIMARY_HOST" "cd /opt/aplussolution && test -f /opt/aplus-release-$GITHUB_RUN_ID/old-production-override.yml && install -m 600 /opt/aplus-release-$GITHUB_RUN_ID/old-production-override.yml docker-compose.override.yml && timeout 200 docker compose -f docker-compose.yml -f /opt/aplus-release-$GITHUB_RUN_ID/old-production-override.yml -f /opt/aplus-release-$GITHUB_RUN_ID/rollback.yml up -d --no-deps --no-build --pull never backend"
      - name: Restore staging Celery regardless of release outcome
        if: always()
        shell: bash
        run: |
          if test -s "$HOME/.ssh/aplus_time_entry_release"; then
            ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=12 root@"$PRIMARY_HOST" "RUN_ID='$GITHUB_RUN_ID' bash -s" <<'REMOTE'
          set -euo pipefail
          marker="/tmp/aplus-staging-celery-paused-${RUN_ID}.marker"
          if test -f "$marker"; then
            name="$(cat "$marker")"
            test "$name" = 'aplus_staging-staging_celery-1'
            docker start "$name" >/dev/null
            test "$(docker inspect -f '{{.State.Running}}' "$name")" = true
            rm -f "$marker"
            echo STAGING_CELERY_RESTORED
          else
            echo STAGING_CELERY_NEVER_PAUSED
          fi
          REMOTE
          fi
      - name: Remove temporary credentials and release script
        if: always()
        shell: bash
        run: |
          if test -s "$HOME/.ssh/aplus_time_entry_release"; then
            ssh -i "$HOME/.ssh/aplus_time_entry_release" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=8 root@"$PRIMARY_HOST" "rm -f /tmp/aplus-time-entry-release.sh '/tmp/aplus-time-entry-$GITHUB_RUN_ID/config.json'; rmdir '/tmp/aplus-time-entry-$GITHUB_RUN_ID' 2>/dev/null || true" || true
          fi
          rm -f "$HOME/.ssh/aplus_time_entry_release"
