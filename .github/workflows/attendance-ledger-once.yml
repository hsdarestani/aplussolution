name: One-time A+ attendance ledger verification

on:
  push:
    branches: [main]
    paths: ['.github/workflows/attendance-ledger-once.yml']

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STRATO_HOST }}
      KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Secure SSH
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/one_time"
          chmod 600 "$HOME/.ssh/one_time"
      - name: Inspect 2026 reconciliation state
        run: |
          set -euo pipefail
          timeout 240 ssh -i "$HOME/.ssh/one_time" -o IdentitiesOnly=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          echo "=== current ledger command ==="
          timeout 35 docker compose exec -T backend python manage.py reconcile_attendance_accounts --help </dev/null >/dev/null
          echo "=== read-only ledger audit 2026 ==="
          timeout 150 docker compose exec -T backend python manage.py reconcile_attendance_accounts --year 2026 </dev/null
          echo "=== read-only ledger audit 2025 ==="
          timeout 60 docker compose exec -T backend python manage.py reconcile_attendance_accounts --year 2025 </dev/null
          echo "=== backup primary database before 2026 reconciliation ==="
          umask 077
          mkdir -p /var/backups/aplussolution/attendance-ledger
          backup="/var/backups/aplussolution/attendance-ledger/pre-reconcile-2026-$(date -u +%Y%m%dT%H%M%SZ).sql.gz"
          docker compose exec -T db sh -c 'exec pg_dump -U "$POSTGRES_USER" "$POSTGRES_DB"' </dev/null | gzip > "$backup"
          test -s "$backup"
          echo "ATTENDANCE_BACKUP_CREATED"
          echo "=== apply targeted 2026 attendance account reconciliation ==="
          timeout 180 docker compose exec -T backend python manage.py reconcile_attendance_accounts --year 2026 --apply </dev/null
          echo "=== verify 2026 reconciliation is fully clean ==="
          timeout 90 docker compose exec -T backend python manage.py reconcile_attendance_accounts --year 2026 </dev/null
          REMOTE
      - name: Cleanup
        if: always()
        run: rm -f "$HOME/.ssh/one_time"
