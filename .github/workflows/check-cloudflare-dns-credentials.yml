name: Check Cloudflare DNS credentials

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/check-cloudflare-dns-credentials.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
    steps:
      - name: Check DNS control readiness
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          CLOUDFLARE_TOKEN: ${{ secrets.CLOUDFLARE_TOKEN }}
          CF_TOKEN: ${{ secrets.CF_TOKEN }}
          CLOUDFLARE_API_KEY: ${{ secrets.CLOUDFLARE_API_KEY }}
          CLOUDFLARE_EMAIL: ${{ secrets.CLOUDFLARE_EMAIL }}
        shell: bash
        run: |
          set -euo pipefail
          for name in CLOUDFLARE_API_TOKEN CF_API_TOKEN CLOUDFLARE_TOKEN CF_TOKEN CLOUDFLARE_API_KEY CLOUDFLARE_EMAIL; do
            if [ -n "${!name:-}" ]; then
              echo "$name=true"
            else
              echo "$name=false"
            fi
          done

          DNS_IPS="$(getent ahostsv4 app.aplus-solution.de | awk '{print $1}' | sort -u || true)"
          STRATO_IP="$(getent ahostsv4 "$STRATO_HOST" | awk 'NR==1 {print $1}' || true)"
          BACKUP_IP="$(getent ahostsv4 "$BACKUP_HOST" | awk 'NR==1 {print $1}' || true)"
          if printf '%s\n' "$DNS_IPS" | grep -qxF "$STRATO_IP"; then echo DNS_POINTS_STRATO=true; else echo DNS_POINTS_STRATO=false; fi
          if printf '%s\n' "$DNS_IPS" | grep -qxF "$BACKUP_IP"; then echo DNS_POINTS_BACKUP=true; else echo DNS_POINTS_BACKUP=false; fi
