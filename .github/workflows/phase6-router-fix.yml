name: Phase 6 router fix

on:
  push:
    branches:
      - feature/phase6-confirmations-mitteilungen

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase6-confirmations-mitteilungen
      - name: Add stable router queryset to generated Announcement API
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_phase6.py')
          text = p.read_text(encoding='utf-8')
          old = "class AnnouncementViewSet(viewsets.ModelViewSet):\\n    serializer_class = AnnouncementSerializer"
          new = "class AnnouncementViewSet(viewsets.ModelViewSet):\\n    queryset = Announcement.objects.none()\\n    serializer_class = AnnouncementSerializer"
          if text.count(old) != 1:
              raise SystemExit(f'expected one AnnouncementViewSet marker, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase6-router-fix.yml
          git add scripts/apply_phase6.py
          git commit -m 'Fix Announcement router basename inference'
          git push origin HEAD:feature/phase6-confirmations-mitteilungen
