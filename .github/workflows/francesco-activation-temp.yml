name: Prepare Francesco activation envelope

on:
  push:
    branches: ['ops/francesco-activation-temp']
    paths:
      - '.github/workflows/francesco-activation-temp.yml'

permissions:
  contents: read

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ENVELOPE_KEY: ${{ secrets.PASS }}
    steps:
      - name: Generate one-time encrypted envelope
        shell: bash
        run: |
          set -euo pipefail
          test -n "$ENVELOPE_KEY"
          umask 077
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out private.pem >/dev/null 2>&1
          openssl pkey -in private.pem -pubout -out public.pem >/dev/null 2>&1
          openssl enc -aes-256-cbc -pbkdf2 -salt -in private.pem -out private.enc -pass env:ENVELOPE_KEY
          printf 'public_key_b64='
          base64 -w0 public.pem
          printf '\nencrypted_private_key_b64='
          base64 -w0 private.enc
          printf '\n'
          rm -f private.pem public.pem private.enc
