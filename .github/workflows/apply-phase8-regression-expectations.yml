name: Apply Phase 8 regression expectations

on:
  push:
    branches:
      - feature/phase8-signatures-wiw-mobile
    paths:
      - .github/workflows/apply-phase8-regression-expectations.yml
      - scripts/phase8_regression_expectations_patch.py

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase8-signatures-wiw-mobile
      - run: python scripts/phase8_regression_expectations_patch.py
      - name: Commit and retire helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm scripts/phase8_regression_expectations_patch.py .github/workflows/apply-phase8-regression-expectations.yml
          git add frontend/e2e/app-shell.spec.ts frontend/e2e/worker-portal-deep.spec.ts frontend/e2e/admin-priority-navigation.spec.ts
          git commit -m 'Align mobile regressions with Phase 8 navigation'
          git push origin HEAD:feature/phase8-signatures-wiw-mobile
