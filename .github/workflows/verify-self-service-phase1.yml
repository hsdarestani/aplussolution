name: Verify Phase 1 self-service production
on:
  pull_request:
    branches: [main]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Wait for release and run transactional production smoke test
        env:
          HOST: ${{ secrets.HOST }}
          SSHPASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" "grep -q 'class ShiftSlot' /opt/aplussolution/backend/core/shift_slots.py && grep -q 'ScheduleV2' /opt/aplussolution/frontend/src/App.tsx"; then
              break
            fi
            test "$attempt" != 30
            sleep 20
          done
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose ps
          docker compose exec -T backend python manage.py migrate --noinput </dev/null
          docker compose exec -T backend python manage.py check </dev/null
          docker compose exec -T backend python manage.py showmigrations core </dev/null | grep -q '\[X\] 0003_shiftassignment'
          docker compose exec -T frontend sh -c "grep -R -q 'Personalbedarf & Schichten' /usr/share/nginx/html/assets" </dev/null
          docker compose exec -T backend python manage.py shell <<'PY' </dev/null
          from datetime import timedelta
          from django.db import transaction
          from django.utils import timezone
          from rest_framework.test import APIClient
          from core.models import ClientCompany, Location, Position, Shift, User, WorkerProfile, TimeEntry
          from core.shift_slots import ShiftSlot

          with transaction.atomic():
              client = ClientCompany.objects.create(name='VERIFY PHASE1', customer_number='VERIFY-PHASE1')
              location = Location.objects.create(client=client, name='VERIFY LOCATION', address='Frankfurt', latitude=50.1101, longitude=8.6801, geofence_radius_m=250)
              position = Position.objects.create(name='VERIFY POSITION')
              workers=[]
              for i in range(3):
                  user=User.objects.create_user(email=f'verify.phase1.{i}@example.invalid', password='Temporary-Only-123!', first_name=f'Verify{i}', role='worker', is_onboarded=True)
                  workers.append(WorkerProfile.objects.create(user=user, employee_number=f'VERIFY-{i}'))
              start=timezone.now()-timedelta(minutes=10)
              shift=Shift.objects.create(client=client, location=location, position=position, starts_at=start, ends_at=start+timedelta(hours=4), status='published', is_open=True, required_count=2)
              assert ShiftSlot.objects.filter(shift=shift, status='open').count() == 2
              for worker in workers[:2]:
                  api=APIClient(); api.force_authenticate(worker.user)
                  response=api.post(f'/api/shifts/{shift.id}/claim/', {}, format='json')
                  assert response.status_code == 200, response.data
              third=APIClient(); third.force_authenticate(workers[2].user)
              response=third.post(f'/api/shifts/{shift.id}/claim/', {}, format='json')
              assert response.status_code == 400, response.data
              shift.refresh_from_db()
              assert shift.worker_id is None
              attendance=APIClient(); attendance.force_authenticate(workers[1].user)
              response=attendance.post('/api/time-entries/clock_in/', {'shift': str(shift.id), 'lat': 50.1101, 'lng': 8.6801}, format='json')
              assert response.status_code == 201, response.data
              assert TimeEntry.objects.filter(worker=workers[1], shift=shift, clock_out__isnull=True).exists()
              releaser=APIClient(); releaser.force_authenticate(workers[0].user)
              response=releaser.post(f'/api/shifts/{shift.id}/release/', {}, format='json')
              assert response.status_code == 200, response.data
              assert ShiftSlot.objects.filter(shift=shift, status='open').count() == 1
              transaction.set_rollback(True)
          print('PHASE1_TRANSACTIONAL_SMOKE_OK')
          PY
          curl -kfsS --resolve solution.smarbiz.sbs:443:127.0.0.1 https://solution.smarbiz.sbs/health/ >/dev/null
          REMOTE
      - name: Verify public HTTPS
        run: curl -fsS --retry 10 --retry-delay 10 --retry-all-errors https://solution.smarbiz.sbs/health/ >/dev/null
