name: Patch admin push and shift UX v2

on:
  push:
    branches:
      - fix/admin-push-shift-ux-20260830
    paths:
      - .github/workflows/patch-admin-push-shift-ux-v2.yml

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/admin-push-shift-ux-20260830
          fetch-depth: 0

      - name: Reuse requested-change patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          source = Path('.github/workflows/patch-admin-push-shift-ux.yml').read_text().splitlines()
          start = source.index('      - name: Apply requested changes')
          run_line = next(i for i in range(start + 1, len(source)) if source[i] == '        run: |')
          end = next(i for i in range(run_line + 1, len(source)) if source[i].startswith('      - name:'))
          body = []
          for line in source[run_line + 1:end]:
              body.append(line[10:] if line.startswith('          ') else line)
          Path('/tmp/apply-requested-changes.sh').write_text('\n'.join(body) + '\n')
          PY
          bash /tmp/apply-requested-changes.sh

      - name: Validate frontend build
        working-directory: frontend
        run: |
          npm install --no-package-lock --no-audit --no-fund
          npm run build

      - name: Validate backend syntax
        run: python -m compileall -q backend/core

      - name: Commit patch
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/core frontend/src
          git commit -m "Improve admin push verification and shift mobile UX"
          git push origin HEAD:fix/admin-push-shift-ux-20260830
