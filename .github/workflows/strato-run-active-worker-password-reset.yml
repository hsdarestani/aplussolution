name: Run active worker password reset on production

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-run-active-worker-password-reset.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: strato-run-active-worker-password-reset
  cancel-in-progress: false

jobs:
  reset:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Configure Strato SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Reset active worker passwords and create encrypted batch
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py reset_active_worker_passwords | tee /tmp/active-worker-password-reset-status.txt
          grep -q 'ACTIVE_WORKER_PASSWORD_RESET_OK' /tmp/active-worker-password-reset-status.txt
          docker compose exec -T backend python - <<'PY'
          import os
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          import django
          django.setup()
          from core.credential_reset import PASSWORD_RESET_BATCH_KEY, _redis_client, active_real_workers
          client = _redis_client()
          ttl = client.ttl(PASSWORD_RESET_BATCH_KEY)
          count = active_real_workers().count()
          if count < 1:
              raise RuntimeError('No active real workers were found; refusing to report reset as complete.')
          if ttl <= 0:
              raise RuntimeError('Encrypted temporary credential batch was not stored.')
          print(f'ACTIVE_WORKER_PASSWORD_RESET_VERIFIED active_workers={count} encrypted_batch_ttl_seconds={ttl}')
          PY
          rm -f /tmp/active-worker-password-reset-status.txt
          REMOTE

      - name: Cleanup SSH key
        if: always()
        run: rm -f "$HOME/.ssh/strato_ed25519"
