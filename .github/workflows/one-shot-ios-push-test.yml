name: Dienstplan follow-up UX

on:
  push:
    branches:
      - ops/android-push-test-20260830
    paths:
      - '.github/workflows/one-shot-ios-push-test.yml'
      - '.github/scripts/schedule_followup_20260830.py'

permissions:
  contents: write

jobs:
  patch-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout current production source
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          path: repo

      - name: Checkout patch tooling
        uses: actions/checkout@v4
        with:
          ref: ops/android-push-test-20260830
          path: tools

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply follow-up changes
        run: |
          set -euo pipefail
          cd repo
          python ../tools/.github/scripts/schedule_followup_20260830.py
          git diff --check
          git status --short

      - name: Build and test web frontend
        working-directory: repo/frontend
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run build
          npm test -- --passWithNoTests

      - name: Commit tested web changes to main
        working-directory: repo
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/WiwScheduleMobile.tsx frontend/src/wiw-schedule-mobile.css
          git diff --cached --check
          git commit -m 'Refine mobile Dienstplan grouping and week navigation'
          git push origin HEAD:main
