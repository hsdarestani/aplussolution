name: Preserve manual location customer links

on:
  push:
    branches:
      - ops/android-push-test-20260830
    paths:
      - '.github/workflows/one-shot-ios-push-test.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch WIW sync ownership rule
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('backend/core/wiw_sync.py')
          text = path.read_text(encoding='utf-8')
          old = "                obj.client = client\n                obj.name = name"
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'Expected 2 client overwrite sites, found {count}')
          new = "                # Existing A+ location/customer links are locally managed.\n                # WIW may seed the client only when the Location is first created;\n                # subsequent syncs must never overwrite a manual assignment.\n                obj.name = name"
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY
          git diff --check
          git diff -- backend/core/wiw_sync.py

      - name: Commit fix to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/wiw_sync.py
          git commit -m 'Preserve manual location client assignments during WIW sync'
          git push origin HEAD:main

      - name: Prepare SSH authentication
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PASSWORD"
          cat > /tmp/aplus-askpass.sh <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          ASKPASS
          chmod 700 /tmp/aplus-askpass.sh

      - name: Apply production hotfix and repair Spenerhaus mapping
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          SSH_ASKPASS: /tmp/aplus-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
        run: |
          set -euo pipefail
          export DEPLOY_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          tar -czf /tmp/wiw-location-link-fix.tgz backend/core/wiw_sync.py
          setsid -w scp -q -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 /tmp/wiw-location-link-fix.tgz root@"$HOST":/tmp/wiw-location-link-fix.tgz
          setsid -w ssh -qT -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=15 root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          tar -xzf /tmp/wiw-location-link-fix.tgz -C /opt/aplussolution
          rm -f /tmp/wiw-location-link-fix.tgz
          docker compose up -d --build backend celery celery-beat
          ready=0
          for i in $(seq 1 45); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 2
          done
          test "$ready" -eq 1
          docker compose exec -T backend python manage.py check

          docker compose exec -T backend python manage.py shell <<'PY'
          from django.db import transaction
          from core.models import ClientCompany, Location
          from core.wiw_sync import WhenIWorkSynchronizer

          target = ClientCompany.objects.filter(name__iexact='Hotel Spenerhaus', active=True).first()
          legacy = ClientCompany.objects.filter(name__icontains='Spenerhaus').exclude(pk=getattr(target, 'pk', None)).first()
          assert target, 'active Hotel Spenerhaus client missing'
          locations = list(Location.objects.filter(active=True, client=legacy)) if legacy else []
          repaired = []
          for loc in locations:
              if 'spener' in loc.name.lower():
                  loc.client = target
                  loc.save(update_fields=['client', 'updated_at'])
                  repaired.append(str(loc.id))
          linked = Location.objects.filter(active=True, client=target).order_by('name').first()
          assert linked, 'Hotel Spenerhaus has no active linked location after repair'
          print('REPAIRED_SPENER_LOCATION_IDS', repaired)
          print('SPENER_ACTIVE_LINK', linked.id, linked.name, linked.client_id)

          payload = dict(linked.wiw_payload or {})
          if linked.wiw_site_id and payload:
              original_client = linked.client_id
              with transaction.atomic():
                  WhenIWorkSynchronizer(client=object()).sync_sites([payload])
                  linked.refresh_from_db()
                  print('POST_SYNC_CLIENT', linked.client_id)
                  assert linked.client_id == original_client, 'WIW sync overwrote manual client link'
                  transaction.set_rollback(True)
              linked.refresh_from_db()
              assert linked.client_id == original_client
              print('MANUAL_LINK_PRESERVED_AFTER_SYNC=True')
          PY

          curl -fsS --max-time 20 https://solution.smarbiz.sbs/health/ >/dev/null
          REMOTE
