name: Diagnose mobile shift location selection

on:
  push:
    branches:
      - ops/android-push-test-20260830
    paths:
      - '.github/workflows/one-shot-ios-push-test.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH authentication
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PASSWORD"
          cat > /tmp/aplus-askpass.sh <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          ASKPASS
          chmod 700 /tmp/aplus-askpass.sh

      - name: Inspect production client/location data and mobile CRUD
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          SSH_ASKPASS: /tmp/aplus-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
        run: |
          set -euo pipefail
          export DEPLOY_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from core.models import ClientCompany, Location
          from core.serializers import LocationSerializer

          clients = list(ClientCompany.objects.filter(name__icontains='Spener').values('id','name','active'))
          print('SPENER_CLIENTS', clients)
          if clients:
              cid = clients[0]['id']
              linked = Location.objects.filter(client_id=cid).order_by('name')
              print('SPENER_LOCATION_DB', list(linked.values('id','name','client_id','active','address')))
              print('SPENER_LOCATION_API', LocationSerializer(linked, many=True).data)
          print('ACTIVE_LOCATION_CLIENT_SAMPLE', list(Location.objects.filter(active=True).values('id','name','client_id')[:20]))
          PY
          docker compose exec -T backend python manage.py diagnose_mobile_shift_crud
          REMOTE
