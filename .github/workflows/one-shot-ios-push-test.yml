name: One-shot iOS push test

on:
  push:
    branches:
      - ops/android-push-test-20260830
    paths:
      - '.github/workflows/one-shot-ios-push-test.yml'

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Prepare SSH authentication
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PASSWORD"
          cat > /tmp/aplus-askpass.sh <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          ASKPASS
          chmod 700 /tmp/aplus-askpass.sh

      - name: Persist correct APNs key id and send final test
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          SSH_ASKPASS: /tmp/aplus-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
        run: |
          set -euo pipefail
          export DEPLOY_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          python3 - <<'PY'
          from pathlib import Path
          path = Path('.env')
          lines = path.read_text(encoding='utf-8').splitlines()
          key = 'APNS_KEY_ID'
          value = '7ZH6Y6V744'
          out = []
          replaced = False
          for line in lines:
              if line.startswith(key + '='):
                  out.append(f'{key}={value}')
                  replaced = True
              else:
                  out.append(line)
          if not replaced:
              out.append(f'{key}={value}')
          path.write_text('\n'.join(out) + '\n', encoding='utf-8')
          PY

          docker compose up -d --force-recreate backend
          for i in $(seq 1 30); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done

          docker compose exec -T backend python manage.py shell <<'PY'
          import uuid
          from types import SimpleNamespace
          from core.push_models import PushDevice
          import core.push_notifications as push

          team_id, key_id, private_key, bundle_id, sandbox = push._apns_values()
          print(f"production_key_id_ok={key_id == '7ZH6Y6V744'}")
          print(f"production_team_id_ok={team_id == '884MVA2MD5'}")
          print(f"production_bundle_id_ok={bundle_id == 'de.aplussolution.workforce'}")
          print(f"production_sandbox={sandbox}")
          print(f"production_private_key_present={bool(private_key)}")

          device = PushDevice.objects.filter(
              active=True,
              platform=PushDevice.Platform.IOS,
              user__role='admin',
          ).order_by('-last_seen_at').first()
          if not device:
              raise SystemExit('No active iOS admin device')

          notification = SimpleNamespace(
              id=uuid.uuid4(),
              kind='general',
              action_url='',
              title='A+ Solution Test',
              body='iPhone Push funktioniert jetzt korrekt.',
          )
          ok, error, invalid = push._send_ios(device, notification)
          print(f"final_apns_send_ok={ok}")
          print(f"final_invalid_token={invalid}")
          print(f"final_error={'none' if not error else error[:120]}")
          raise SystemExit(0 if ok else 1)
          PY
          REMOTE

# persisted production APNs key id from Apple Developer portal: 2026-08-30
