name: Wire remaining operational push events

on:
  push:
    branches:
      - ops/android-push-test-20260830
    paths:
      - '.github/workflows/one-shot-ios-push-test.yml'

permissions:
  contents: write

jobs:
  patch-test-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Patch missing OpenShift notification wiring
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: Path, old: str, new: str):
              text = path.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}')
              path.write_text(text.replace(old, new, 1), encoding='utf-8')

          shift_views = Path('backend/core/shift_views.py')
          replace_once(
              shift_views,
              "            audit(self.request, 'staffing_demand.created', obj, {'required_count': obj.required_count})\n\n    def perform_update(self, serializer):\n        previous_confirmation_required = bool(serializer.instance.confirmation_required)\n",
              "            audit(self.request, 'staffing_demand.created', obj, {'required_count': obj.required_count})\n        if obj.status == Shift.Status.PUBLISHED:\n            notify_open_shift_available(obj, 'created')\n\n    def perform_update(self, serializer):\n        previous_status = serializer.instance.status\n        previous_confirmation_required = bool(serializer.instance.confirmation_required)\n",
          )
          replace_once(
              shift_views,
              "            notify_claimed_workers_shift_changed(obj)\n\n    def perform_destroy(self, instance):\n",
              "            notify_claimed_workers_shift_changed(obj)\n        if previous_status != Shift.Status.PUBLISHED and obj.status == Shift.Status.PUBLISHED:\n            notify_open_shift_available(obj, 'updated-published')\n\n    def perform_destroy(self, instance):\n",
          )
          replace_once(
              shift_views,
              "    def publish(self, request, pk=None):\n        shift = self.get_object()\n        with transaction.atomic():\n",
              "    def publish(self, request, pk=None):\n        shift = self.get_object()\n        was_published = shift.status == Shift.Status.PUBLISHED\n        with transaction.atomic():\n",
          )
          replace_once(
              shift_views,
              "        audit(request, 'staffing_demand.published', shift)\n        return Response(self.get_serializer(self.base_queryset().get(pk=shift.pk)).data)\n",
              "        audit(request, 'staffing_demand.published', shift)\n        if not was_published:\n            notify_open_shift_available(shift, 'publish')\n        return Response(self.get_serializer(self.base_queryset().get(pk=shift.pk)).data)\n",
          )

          native_ops = Path('backend/core/native_operations.py')
          replace_once(
              native_ops,
              "from .models import Notification, Shift\nfrom .services import audit\n",
              "from .models import Notification, Shift\nfrom .operational_notifications import notify_open_shift_available\nfrom .services import audit\n",
          )
          replace_once(
              native_ops,
              "            for shift in shifts:\n                if shift.status in {Shift.Status.CANCELLED, Shift.Status.COMPLETED}:\n",
              "            for shift in shifts:\n                was_published = shift.status == Shift.Status.PUBLISHED\n                if shift.status in {Shift.Status.CANCELLED, Shift.Status.COMPLETED}:\n",
          )
          replace_once(
              native_ops,
              "                refresh_shift_state(shift)\n\n                for worker in _assigned_workers(shift):\n",
              "                refresh_shift_state(shift)\n                if not was_published:\n                    notify_open_shift_available(shift, 'bulk-publish')\n\n                for worker in _assigned_workers(shift):\n",
          )

          # Keep future production integration syncs paired with the proven APNs private key.
          # Apple Key IDs are public identifiers, not secret material.
          integrations = Path('.github/workflows/configure-production-integrations.yml')
          text = integrations.read_text(encoding='utf-8')
          old = 'APNS_KEY_ID: $' + '{{ secrets.APNS_KEY_ID }}'
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'{integrations}: expected two APNS_KEY_ID secret mappings, found {count}')
          integrations.write_text(text.replace(old, "APNS_KEY_ID: '7ZH6Y6V744'"), encoding='utf-8')

          test_text = r'''from datetime import timedelta
          from unittest.mock import patch

          import pytest
          from django.utils import timezone

          from core.models import Shift


          def _future_shift(company, location, position, status=Shift.Status.DRAFT):
              start = timezone.now() + timedelta(days=2)
              return Shift.objects.create(
                  client=company,
                  location=location,
                  position=position,
                  starts_at=start,
                  ends_at=start + timedelta(hours=6),
                  status=status,
                  required_count=1,
              )


          @pytest.mark.django_db
          def test_direct_publish_notifies_eligible_open_shift_workers(auth_admin, company, location, position):
              shift = _future_shift(company, location, position)
              with patch('core.shift_views.notify_open_shift_available') as notify:
                  response = auth_admin.post(f'/api/shifts/{shift.id}/publish/', {}, format='json')
              assert response.status_code == 200
              notify.assert_called_once()
              called_shift, reason = notify.call_args.args
              assert called_shift.id == shift.id
              assert reason == 'publish'


          @pytest.mark.django_db
          def test_create_as_published_notifies_eligible_open_shift_workers(auth_admin, company, location, position):
              start = timezone.now() + timedelta(days=3)
              payload = {
                  'client': str(company.id),
                  'location': str(location.id),
                  'position': str(position.id),
                  'starts_at': start.isoformat(),
                  'ends_at': (start + timedelta(hours=5)).isoformat(),
                  'status': Shift.Status.PUBLISHED,
                  'required_count': 1,
              }
              with patch('core.shift_views.notify_open_shift_available') as notify:
                  response = auth_admin.post('/api/shifts/', payload, format='json')
              assert response.status_code == 201
              notify.assert_called_once()
              assert notify.call_args.args[1] == 'created'


          @pytest.mark.django_db
          def test_bulk_publish_notifies_open_capacity_from_copied_drafts(auth_admin, company, location, position):
              shift = _future_shift(company, location, position)
              with patch('core.native_operations.notify_open_shift_available') as notify:
                  response = auth_admin.post(
                      '/api/operations/bulk-publish/',
                      {'ids': [str(shift.id)]},
                      format='json',
                  )
              assert response.status_code == 200
              notify.assert_called_once()
              called_shift, reason = notify.call_args.args
              assert called_shift.id == shift.id
              assert reason == 'bulk-publish'
          '''
          Path('backend/tests/test_operational_push_wiring.py').write_text(
              test_text.replace('\n          ', '\n').lstrip(),
              encoding='utf-8',
          )
          PY

      - name: Install backend dependencies
        run: pip install -r backend/requirements.txt

      - name: Validate backend and notification wiring
        env:
          DEBUG: '1'
          DJANGO_SECRET_KEY: ci-secret
          ALLOWED_HOSTS: localhost,127.0.0.1,testserver
        run: |
          set -euo pipefail
          cd backend
          python manage.py check
          pytest -q tests/test_operational_push_wiring.py tests/test_push_notifications.py

      - name: Commit and publish to main
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/shift_views.py backend/core/native_operations.py backend/tests/test_operational_push_wiring.py .github/workflows/configure-production-integrations.yml
          git diff --cached --check
          git commit -m 'Complete operational push event wiring'
          git push origin HEAD:main
