name: One-shot iOS push test

on:
  push:
    branches:
      - ops/android-push-test-20260830
    paths:
      - '.github/workflows/one-shot-ios-push-test.yml'

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH authentication
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PASSWORD"
          cat > /tmp/aplus-askpass.sh <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          ASKPASS
          chmod 700 /tmp/aplus-askpass.sh

      - name: Diagnose APNs credentials and retry with app team
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          SSH_ASKPASS: /tmp/aplus-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
        run: |
          set -euo pipefail
          export DEPLOY_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          import os
          import uuid
          from types import SimpleNamespace
          from core.push_models import PushDevice
          import core.push_notifications as push

          expected_team = '884MVA2MD5'
          current_team, key_id, private_key, bundle_id, sandbox = push._apns_values()
          apple_team = os.getenv('APPLE_TEAM_ID', '').strip()
          apple_key_id = os.getenv('APPLE_KEY_ID', '').strip()
          apple_private = push._multiline(os.getenv('APPLE_PRIVATE_KEY', ''))

          print(f"ios_provider_ready={push.push_provider_status().get('ios', False)}")
          print(f"apns_team_matches_app_team={current_team == expected_team}")
          print(f"apple_team_matches_app_team={apple_team == expected_team}")
          print(f"apns_key_matches_signin_key_id={bool(key_id and apple_key_id and key_id == apple_key_id)}")
          print(f"apns_private_matches_signin_private={bool(private_key and apple_private and private_key == apple_private)}")
          print(f"apns_bundle_id_ok={bundle_id == 'de.aplussolution.workforce'}")
          print(f"apns_uses_sandbox={sandbox}")

          devices = PushDevice.objects.filter(
              active=True,
              platform=PushDevice.Platform.IOS,
              user__role='admin',
          ).order_by('-last_seen_at')
          device = devices.first()
          print(f"active_admin_ios_devices={devices.count()}")
          print(f"selected_device_last_seen={device.last_seen_at.isoformat() if device else 'none'}")
          if not device:
              raise SystemExit('No active iOS push device is registered for an admin account.')

          notification = SimpleNamespace(
              id=uuid.uuid4(),
              kind='general',
              action_url='',
              title='A+ Solution Test',
              body='Push-Test erfolgreich – iPhone-Benachrichtigungen funktionieren.',
          )

          # A fresh process guarantees no stale provider JWT cache.
          ok, error, invalid = push._send_ios(device, notification)
          print(f"current_apns_send_ok={ok}")
          print(f"current_invalid_token={invalid}")
          print(f"current_error_kind={'InvalidProviderToken' if 'InvalidProviderToken' in (error or '') else 'other' if error else 'none'}")
          if ok:
              raise SystemExit(0)

          if current_team != expected_team:
              os.environ['APNS_TEAM_ID'] = expected_team
              push._APNS_CACHE.update(token='', expires_at=0.0, key_id='', team_id='')
              ok2, error2, invalid2 = push._send_ios(device, notification)
              print(f"app_team_retry_ok={ok2}")
              print(f"app_team_retry_invalid_token={invalid2}")
              print(f"app_team_retry_error_kind={'InvalidProviderToken' if 'InvalidProviderToken' in (error2 or '') else 'other' if error2 else 'none'}")
              if ok2:
                  raise SystemExit(0)
          raise SystemExit(1)
          PY
          REMOTE

# credential diagnostic after iOS login: 2026-08-30T12:18Z
