name: One-shot iOS push test

on:
  push:
    branches:
      - ops/android-push-test-20260830
    paths:
      - '.github/workflows/one-shot-ios-push-test.yml'

permissions:
  contents: read

jobs:
  send-test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Prepare SSH authentication
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$DEPLOY_PASSWORD"
          cat > /tmp/aplus-askpass.sh <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$DEPLOY_PASSWORD"
          ASKPASS
          chmod 700 /tmp/aplus-askpass.sh

      - name: Test portal APNs key id with current private key
        env:
          DEPLOY_PASSWORD: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          SSH_ASKPASS: /tmp/aplus-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
        run: |
          set -euo pipefail
          export DEPLOY_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=15 \
            root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          import os
          import uuid
          from types import SimpleNamespace
          from core.push_models import PushDevice
          import core.push_notifications as push

          expected_push_key_id = '7ZH6Y6V744'
          current_team, current_key_id, private_key, bundle_id, sandbox = push._apns_values()
          print(f"current_key_is_portal_key={current_key_id == expected_push_key_id}")
          print(f"private_key_present={bool(private_key)}")

          devices = PushDevice.objects.filter(
              active=True,
              platform=PushDevice.Platform.IOS,
              user__role='admin',
          ).order_by('-last_seen_at')
          device = devices.first()
          print(f"active_admin_ios_devices={devices.count()}")
          if not device:
              raise SystemExit('No active iOS push device is registered for an admin account.')

          notification = SimpleNamespace(
              id=uuid.uuid4(),
              kind='general',
              action_url='',
              title='A+ Solution Test',
              body='Push-Test erfolgreich – iPhone-Benachrichtigungen funktionieren.',
          )

          os.environ['APNS_KEY_ID'] = expected_push_key_id
          push._APNS_CACHE.update(token='', expires_at=0.0, key_id='', team_id='')
          ok, error, invalid = push._send_ios(device, notification)
          print(f"portal_key_id_retry_ok={ok}")
          print(f"portal_key_id_retry_invalid_token={invalid}")
          print(f"portal_key_id_retry_error_kind={'InvalidProviderToken' if 'InvalidProviderToken' in (error or '') else 'other' if error else 'none'}")
          raise SystemExit(0 if ok else 1)
          PY
          REMOTE

# test portal key id against current private key: 2026-08-30
