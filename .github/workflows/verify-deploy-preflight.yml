name: Verify deploy preflight
on:
  pull_request:
    branches: [main]
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Run production preflight without uploading
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
          WIW_DEV_KEY: ${{ secrets.WIW_DEV_KEY }}
          WIW_EMAIL: ${{ secrets.WIW_EMAIL }}
          WIW_PASSWORD: ${{ secrets.WIW_PASSWORD }}
          WIW_USER_ID: ${{ secrets.WIW_USER_ID }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          if [ -n "$WIW_DEV_KEY" ] && [ -n "$WIW_EMAIL" ] && [ -n "$WIW_PASSWORD" ] && [ -n "$WIW_USER_ID" ]; then
            echo 'preflight_source=github_actions'
            exit 0
          fi
          if sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          test -f /opt/aplussolution/.env
          cd /opt/aplussolution
          for key in WIW_DEV_KEY WIW_EMAIL WIW_PASSWORD WIW_USER_ID; do
            grep -q "^${key}=." .env || exit 1
          done
          REMOTE
          then
            echo 'preflight_source=production_env'
          else
            echo 'preflight_source=missing' >&2
            exit 1
          fi
