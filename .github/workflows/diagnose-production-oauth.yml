name: Diagnose production OAuth

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/diagnose-production-oauth.yml'
  workflow_run:
    workflows: ['Configure production integrations']
    types: [completed]

permissions:
  contents: read
  issues: write

jobs:
  diagnose:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Read safe production OAuth status and origin response
        env:
          HOST: ${{ secrets.HOST }}
          PASS: ${{ secrets.PASS }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$PASS"
          OUTPUT="$(SSHPASS="$PASS" sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell <<'PY'
          from urllib.parse import urlparse, parse_qs
          from django.conf import settings
          from core import oauth

          google_url = oauth.start('google', 'https://solution.smarbiz.sbs/auth/callback') if settings.GOOGLE_OAUTH_CLIENT_ID else ''
          parsed = urlparse(google_url) if google_url else None
          query = parse_qs(parsed.query) if parsed else {}

          print('google_client_configured=', bool(settings.GOOGLE_OAUTH_CLIENT_ID and settings.GOOGLE_OAUTH_CLIENT_SECRET))
          print('google_redirect_configured=', settings.GOOGLE_OAUTH_REDIRECT_URI == 'https://solution.smarbiz.sbs/api/auth/oauth/google/callback/')
          print('google_start_host_ok=', bool(parsed and parsed.netloc == 'accounts.google.com'))
          print('google_start_client_id_present=', bool(query.get('client_id', [''])[0]))
          print('google_start_redirect_ok=', query.get('redirect_uri', [''])[0] == settings.GOOGLE_OAUTH_REDIRECT_URI)
          print('app_url_ok=', settings.APP_URL == 'https://solution.smarbiz.sbs')
          print('smtp_configured=', bool(settings.EMAIL_HOST and settings.EMAIL_HOST_USER and settings.EMAIL_HOST_PASSWORD))
          print('openai_configured=', bool(settings.OPENAI_API_KEY))

          apple_private_key_present = bool(settings.APPLE_PRIVATE_KEY or settings.APPLE_PRIVATE_KEY_PATH)
          print('apple_service_id_configured=', bool(settings.APPLE_SERVICE_ID))
          print('apple_team_id_configured=', bool(settings.APPLE_TEAM_ID))
          print('apple_key_id_configured=', bool(settings.APPLE_KEY_ID))
          print('apple_private_key_configured=', apple_private_key_present)
          print('apple_redirect_configured=', settings.APPLE_OAUTH_REDIRECT_URI == 'https://solution.smarbiz.sbs/api/auth/oauth/apple/callback/')
          print('apple_server_configured=', bool(settings.APPLE_SERVICE_ID and settings.APPLE_TEAM_ID and settings.APPLE_KEY_ID and apple_private_key_present))

          apple_url = oauth.start('apple', 'https://solution.smarbiz.sbs/auth/callback') if settings.APPLE_SERVICE_ID else ''
          apple_parsed = urlparse(apple_url) if apple_url else None
          apple_query = parse_qs(apple_parsed.query) if apple_parsed else {}
          print('apple_start_host_ok=', bool(apple_parsed and apple_parsed.netloc == 'appleid.apple.com'))
          print('apple_start_client_id_present=', bool(apple_query.get('client_id', [''])[0]))
          print('apple_start_redirect_ok=', apple_query.get('redirect_uri', [''])[0] == settings.APPLE_OAUTH_REDIRECT_URI)

          if settings.APPLE_SERVICE_ID and settings.APPLE_TEAM_ID and settings.APPLE_KEY_ID and apple_private_key_present:
              try:
                  secret = oauth.apple_client_secret()
                  print('apple_client_secret_generation_ok=', bool(secret))
              except Exception as exc:
                  print('apple_client_secret_generation_ok=', False)
                  print('apple_client_secret_error_type=', type(exc).__name__)
          else:
              print('apple_client_secret_generation_ok=', False)
          PY

          for PROVIDER in google apple; do
            ORIGIN_HEADERS=$(mktemp)
            ORIGIN_STATUS=$(curl -ksS --resolve solution.smarbiz.sbs:443:127.0.0.1 -o /dev/null -D "$ORIGIN_HEADERS" -w '%{http_code}' --max-time 20 "https://solution.smarbiz.sbs/api/auth/oauth/$PROVIDER/start/" || true)
            ORIGIN_LOCATION=$(awk 'BEGIN{IGNORECASE=1} /^Location:/{print $2}' "$ORIGIN_HEADERS" | tr -d '\r' | tail -1)
            echo "origin_${PROVIDER}_without_target_status=$ORIGIN_STATUS"
            case "$PROVIDER:$ORIGIN_LOCATION" in
              google:https://accounts.google.com/*) echo 'origin_google_location_host_ok=True' ;;
              apple:https://appleid.apple.com/*) echo 'origin_apple_location_host_ok=True' ;;
              google:*) echo 'origin_google_location_host_ok=False' ;;
              apple:*) echo 'origin_apple_location_host_ok=False' ;;
            esac
            rm -f "$ORIGIN_HEADERS"
          done
          REMOTE
          )"
          printf '%s\n' "$OUTPUT" | tee /tmp/oauth-status.txt

      - name: Compare public OAuth start responses
        run: |
          python - <<'PY' | tee -a /tmp/oauth-status.txt
          import re
          import urllib.error
          import urllib.request
          from urllib.parse import urlparse

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect)

          def check(label, url, expected_host):
              req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0 OAuthHealthCheck/1.0'})
              try:
                  response = opener.open(req, timeout=20)
                  print(f'{label}_status={response.status}')
                  print(f'{label}_location_host_ok=False')
                  print(f'{label}_server={response.headers.get("Server", "")[:80]}')
              except urllib.error.HTTPError as exc:
                  location = exc.headers.get('Location', '')
                  body = exc.read(500).decode('utf-8', 'replace')
                  title = re.search(r'<title[^>]*>(.*?)</title>', body, re.I | re.S)
                  safe_title = re.sub(r'\s+', ' ', title.group(1)).strip()[:120] if title else ''
                  print(f'{label}_status={exc.code}')
                  print(f'{label}_location_host_ok={urlparse(location).netloc == expected_host}')
                  print(f'{label}_server={exc.headers.get("Server", "")[:80]}')
                  print(f'{label}_cf_ray_present={bool(exc.headers.get("CF-RAY"))}')
                  print(f'{label}_body_title={safe_title}')

          check('public_google_with_target', 'https://solution.smarbiz.sbs/api/auth/oauth/google/start/?target=https%3A%2F%2Fsolution.smarbiz.sbs%2Fauth%2Fcallback', 'accounts.google.com')
          check('public_google_without_target', 'https://solution.smarbiz.sbs/api/auth/oauth/google/start/', 'accounts.google.com')
          check('public_apple_without_target', 'https://solution.smarbiz.sbs/api/auth/oauth/apple/start/', 'appleid.apple.com')
          PY

      - name: Publish safe diagnostic
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const output = fs.readFileSync('/tmp/oauth-status.txt', 'utf8').trim();
            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: 80,
              state: 'closed',
              title: 'Production integrations status',
              body: [
                'Automated safe production OAuth/integration diagnostic.',
                '',
                '```text', output, '```',
                '',
                'No client secret, API key, password, private key, token, certificate, or full OAuth client ID is included.',
                '',
                `Workflow run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              ].join('\n')
            });
