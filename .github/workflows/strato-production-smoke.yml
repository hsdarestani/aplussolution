name: A+ Strato production smoke

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-production-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
      OLD_HOST: ${{ secrets.HOST }}
      OLD_PASS: ${{ secrets.PASS }}
    steps:
      - name: Configure SSH
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          if ! command -v sshpass >/dev/null 2>&1; then
            sudo -n apt-get update -qq
            sudo -n apt-get install -y -qq sshpass >/dev/null
          fi

      - name: Public web API CORS and OAuth smoke
        shell: bash
        run: |
          set -euo pipefail

          for domain in app.aplus-solution.de solution.smarbiz.sbs; do
            curl -fsS --retry 4 --retry-delay 2 --max-time 20 "https://${domain}/health/" | tee /tmp/health
            grep -q '"status"[[:space:]]*:[[:space:]]*"ok"' /tmp/health
            echo "public_health_${domain}=ok"
          done

          curl -fsS --max-time 20 -o /tmp/home.html https://app.aplus-solution.de/
          test -s /tmp/home.html
          asset=$(grep -oE '(src|href)="/[^"]+\.(js|css)' /tmp/home.html | head -n1 | cut -d'"' -f2 || true)
          if [ -n "$asset" ]; then
            curl -fsS --max-time 20 -o /dev/null "https://app.aplus-solution.de${asset}"
            echo "frontend_asset=ok"
          else
            echo "frontend_html=ok"
          fi

          for origin in https://localhost capacitor://localhost http://localhost; do
            curl -sS -D /tmp/cors-headers -o /dev/null -X OPTIONS \
              https://app.aplus-solution.de/api/auth/login/ \
              -H "Origin: ${origin}" \
              -H 'Access-Control-Request-Method: POST' \
              -H 'Access-Control-Request-Headers: content-type,authorization'
            grep -Fqi "access-control-allow-origin: ${origin}" /tmp/cors-headers
            echo "cors_${origin}=ok"
          done

          curl -sS -D /tmp/google-headers -o /dev/null --max-time 20 \
            'https://app.aplus-solution.de/api/auth/oauth/google/start/'
          google_location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub("\r",""); print}' /tmp/google-headers | tail -n1)
          echo "$google_location" | grep -Fq 'accounts.google.com'
          echo "$google_location" | grep -Fq 'redirect_uri=https%3A%2F%2Fapp.aplus-solution.de%2Fapi%2Fauth%2Foauth%2Fgoogle%2Fcallback%2F'
          google_code=$(curl -sS -o /tmp/google-provider -w '%{http_code}' --max-time 20 "$google_location" || true)
          test "$google_code" != "000"
          test "$google_code" -lt 500
          echo "google_oauth_start=ok provider_http=${google_code}"

          curl -sS -D /tmp/apple-headers -o /dev/null --max-time 20 \
            'https://app.aplus-solution.de/api/auth/oauth/apple/start/'
          apple_location=$(awk 'BEGIN{IGNORECASE=1} /^location:/ {sub(/^[^:]+:[[:space:]]*/,""); gsub("\r",""); print}' /tmp/apple-headers | tail -n1)
          echo "$apple_location" | grep -Fq 'appleid.apple.com'
          echo "$apple_location" | grep -Fq 'redirect_uri=https%3A%2F%2Fapp.aplus-solution.de%2Fapi%2Fauth%2Foauth%2Fapple%2Fcallback%2F'
          apple_code=$(curl -sS -o /tmp/apple-provider -w '%{http_code}' --max-time 20 "$apple_location" || true)
          test "$apple_code" != "000"
          test "$apple_code" -lt 500
          echo "apple_oauth_start=ok provider_http=${apple_code}"

      - name: New Strato server full application smoke
        shell: bash
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$STRATO_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          echo '=== service health ==='
          for service in backend frontend caddy celery celery-beat db redis; do
            cid=$(docker compose ps -q "$service")
            test -n "$cid"
            test "$(docker inspect -f '{{.State.Running}}' "$cid")" = 'true'
            echo "service_${service}=running"
          done
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py migrate --check
          test "$(docker compose exec -T redis redis-cli ping | tr -d '\r')" = 'PONG'
          echo 'redis=ok'

          echo '=== safe production configuration ==='
          docker compose exec -T backend python manage.py shell <<'PY'
          import os
          from django.conf import settings
          from core.push_notifications import push_provider_status

          expected = {
              'APP_URL': 'https://app.aplus-solution.de',
              'GOOGLE_OAUTH_REDIRECT_URI': 'https://app.aplus-solution.de/api/auth/oauth/google/callback/',
              'APPLE_OAUTH_REDIRECT_URI': 'https://app.aplus-solution.de/api/auth/oauth/apple/callback/',
          }
          for name, value in expected.items():
              actual = getattr(settings, name)
              assert actual == value, (name, actual)
              print(f'{name}=ok')

          required = {
              'email': bool(settings.EMAIL_HOST and settings.EMAIL_HOST_USER and settings.EMAIL_HOST_PASSWORD),
              'google_oauth': bool(settings.GOOGLE_OAUTH_CLIENT_ID and settings.GOOGLE_OAUTH_CLIENT_SECRET),
              'apple_signin': bool(settings.APPLE_TEAM_ID and settings.APPLE_KEY_ID and (settings.APPLE_PRIVATE_KEY or settings.APPLE_PRIVATE_KEY_PATH)),
              'openai': bool(settings.OPENAI_API_KEY),
              'wiw_credentials': bool(settings.WIW_DEV_KEY and settings.WIW_EMAIL and settings.WIW_PASSWORD),
          }
          required.update({f'push_{k}': v for k, v in push_provider_status().items()})
          for name, value in required.items():
              assert value, f'{name} is not configured'
              print(f'{name}=configured')
          print(f'WORKER_EMAILS_ENABLED={settings.WORKER_EMAILS_ENABLED}')
          print(f'WIW_SYNC_ENABLED={settings.WIW_SYNC_ENABLED}')
          print(f'WIW_READ_ONLY={settings.WIW_READ_ONLY}')
          PY

          echo '=== database and media write/read/rollback ==='
          docker compose exec -T backend python manage.py shell <<'PY'
          import uuid
          from pathlib import Path
          from django.conf import settings
          from django.db import transaction
          from core.models import User

          email = f'smoke-rollback-{uuid.uuid4().hex}@sync.invalid'
          try:
              with transaction.atomic():
                  user = User.objects.create_user(email=email, password='SmokeOnly-2026-Temporary!', role=User.Role.ADMIN, is_onboarded=True)
                  assert User.objects.filter(pk=user.pk, email=email).exists()
                  user.phone = 'smoke'
                  user.save(update_fields=['phone'])
                  assert User.objects.get(pk=user.pk).phone == 'smoke'
                  transaction.set_rollback(True)
              assert not User.objects.filter(email=email).exists()
          finally:
              User.objects.filter(email=email).delete()

          media = Path(settings.MEDIA_ROOT)
          media.mkdir(parents=True, exist_ok=True)
          marker = media / f'.smoke-{uuid.uuid4().hex}'
          marker.write_text('strato-media-ok', encoding='utf-8')
          assert marker.read_text(encoding='utf-8') == 'strato-media-ok'
          marker.unlink()
          print('database_transaction=ok')
          print('media_volume_rw=ok')
          PY

          echo '=== SMTP OAuth and push provider authentication ==='
          docker compose exec -T backend python manage.py shell <<'PY'
          import httpx
          import requests
          from django.conf import settings
          from django.core.mail import get_connection
          from core.oauth import apple_client_secret
          from core.push_notifications import _apns_provider_token, _apns_values, _fcm_access_token, firebase_project_id

          connection = get_connection()
          opened = connection.open()
          assert opened is not False
          connection.close()
          print('smtp_auth=ok')

          apple_secret = apple_client_secret()
          assert isinstance(apple_secret, str) and apple_secret.count('.') == 2
          print('apple_client_secret=ok')

          google = requests.post(
              'https://oauth2.googleapis.com/token',
              timeout=15,
              data={
                  'code': 'A_PLUS_SMOKE_INVALID_CODE',
                  'client_id': settings.GOOGLE_OAUTH_CLIENT_ID,
                  'client_secret': settings.GOOGLE_OAUTH_CLIENT_SECRET,
                  'redirect_uri': settings.GOOGLE_OAUTH_REDIRECT_URI,
                  'grant_type': 'authorization_code',
              },
          )
          google_error = ''
          try:
              google_error = str(google.json().get('error') or '')
          except Exception:
              pass
          assert google.status_code < 500
          assert google.status_code not in (401, 403)
          assert google_error not in {'invalid_client', 'unauthorized_client'}, google_error
          print(f'google_token_endpoint=ok expected_error={google_error or google.status_code}')

          apple = requests.post(
              'https://appleid.apple.com/auth/token',
              timeout=15,
              data={
                  'code': 'A_PLUS_SMOKE_INVALID_CODE',
                  'client_id': settings.APPLE_SERVICE_ID,
                  'client_secret': apple_secret,
                  'redirect_uri': settings.APPLE_OAUTH_REDIRECT_URI,
                  'grant_type': 'authorization_code',
              },
          )
          apple_error = ''
          try:
              apple_error = str(apple.json().get('error') or '')
          except Exception:
              pass
          assert apple.status_code < 500
          assert apple.status_code not in (401, 403)
          assert apple_error not in {'invalid_client', 'unauthorized_client'}, apple_error
          print(f'apple_token_endpoint=ok expected_error={apple_error or apple.status_code}')

          fcm_token = _fcm_access_token()
          assert len(fcm_token) > 20
          fcm = httpx.post(
              f'https://fcm.googleapis.com/v1/projects/{firebase_project_id()}/messages:send',
              headers={'Authorization': f'Bearer {fcm_token}'},
              json={'message': {'token': 'A_PLUS_SMOKE_NOT_A_REAL_DEVICE_TOKEN', 'notification': {'title': 'Smoke', 'body': 'Smoke'}}},
              timeout=15.0,
          )
          assert fcm.status_code not in (401, 403), fcm.text[:500]
          assert fcm.status_code < 500, fcm.text[:500]
          print(f'fcm_auth=ok expected_invalid_device_http={fcm.status_code}')

          team_id, key_id, _private_key, bundle_id, sandbox = _apns_values()
          apns_token = _apns_provider_token()
          assert len(apns_token) > 20
          apns_host = 'https://api.sandbox.push.apple.com' if sandbox else 'https://api.push.apple.com'
          with httpx.Client(http2=True, timeout=15.0) as client:
              apns = client.post(
                  f'{apns_host}/3/device/' + ('0' * 64),
                  headers={
                      'authorization': f'bearer {apns_token}',
                      'apns-topic': bundle_id,
                      'apns-push-type': 'alert',
                      'apns-priority': '10',
                  },
                  json={'aps': {'alert': {'title': 'Smoke', 'body': 'Smoke'}}},
              )
          reason = ''
          try:
              reason = str(apns.json().get('reason') or '')
          except Exception:
              pass
          assert apns.status_code not in (401, 403), f'{apns.status_code} {reason}'
          assert apns.status_code < 500, f'{apns.status_code} {reason}'
          print(f'apns_auth=ok expected_invalid_device_http={apns.status_code} reason={reason}')
          PY

          echo '=== Celery broker/worker execution ==='
          docker compose exec -T backend python manage.py shell <<'PY'
          from config.celery import app
          result = app.send_task('celery.ping')
          value = result.get(timeout=30)
          assert value == 'pong', value
          print('celery_worker_task=ok')
          PY

          echo '=== PDF engine binary ==='
          docker compose exec -T backend sh -c "set -e; printf 'A+ Solution smoke test\n' >/tmp/aplus-smoke.txt; libreoffice --headless --convert-to pdf --outdir /tmp /tmp/aplus-smoke.txt >/tmp/lo.out 2>&1; test -s /tmp/aplus-smoke.pdf; rm -f /tmp/aplus-smoke.txt /tmp/aplus-smoke.pdf /tmp/lo.out; echo libreoffice_pdf=ok"

          echo '=== public authenticated API smoke using disposable admin ==='
          docker compose exec -T backend python manage.py shell <<'PY'
          import secrets
          import uuid
          import requests
          from core.models import AuditLog, Notification, User

          base = 'https://app.aplus-solution.de/api'
          email = f'smoke-api-{uuid.uuid4().hex}@sync.invalid'
          password = 'Sm0ke-' + secrets.token_urlsafe(18)
          new_password = 'Sm0ke-New-' + secrets.token_urlsafe(18)
          user = User.objects.create_user(email=email, password=password, role=User.Role.ADMIN, is_onboarded=True)
          uid = str(user.id)
          try:
              login = requests.post(base + '/auth/login/', json={'email': email, 'password': password}, timeout=20)
              assert login.status_code == 200, (login.status_code, login.text[:300])
              access = login.json()['access']
              headers = {'Authorization': f'Bearer {access}'}

              checks = [
                  '/auth/me/',
                  '/dashboard/',
                  '/clients/',
                  '/workers/',
                  '/locations/',
                  '/positions/',
                  '/orders/',
                  '/shifts/',
                  '/time-entries/',
                  '/time-off/',
                  '/contracts/',
                  '/documents/',
                  '/payroll/',
                  '/notifications/',
                  '/announcements/',
                  '/conversations/',
                  '/operations/',
                  '/admin/mobile-dashboard/',
                  '/admin/mobile-schedule/',
                  '/push/status/',
                  '/integrations/wiw/status/',
                  '/working-time/settings/',
              ]
              for path in checks:
                  response = requests.get(base + path, headers=headers, timeout=30)
                  assert response.status_code == 200, (path, response.status_code, response.text[:300])
                  print(f'api_get_{path}=ok')

              changed = requests.post(
                  base + '/auth/change-password/',
                  headers=headers,
                  json={'current_password': password, 'new_password': new_password},
                  timeout=20,
              )
              assert changed.status_code == 200, (changed.status_code, changed.text[:300])
              relogin = requests.post(base + '/auth/login/', json={'email': email, 'password': new_password}, timeout=20)
              assert relogin.status_code == 200, (relogin.status_code, relogin.text[:300])
              print('api_authenticated_write_and_relogin=ok')
          finally:
              Notification.objects.filter(user_id=user.id).delete()
              AuditLog.objects.filter(object_type='User', object_id=uid).delete()
              User.objects.filter(pk=user.id).delete()
          PY

          echo '=== WIW connectivity without enabling synchronization ==='
          docker compose exec -T backend python manage.py shell <<'PY'
          from django.conf import settings
          from core.wiw import WhenIWorkClient

          print(f'wiw_sync_enabled={settings.WIW_SYNC_ENABLED}')
          print(f'wiw_read_only={settings.WIW_READ_ONLY}')
          client = WhenIWorkClient()
          token = client.login(force=True)
          assert token
          context = client.resolve_user_context(token, force=True)
          assert context
          print('wiw_login=ok')
          print('wiw_user_context=ok')
          results = client.discover()
          supported = sorted(name for name, result in results.items() if result.get('supported'))
          unsupported = sorted(name for name, result in results.items() if not result.get('supported'))
          print('wiw_read_resources_supported=' + ','.join(supported))
          print('wiw_read_resources_unsupported=' + ','.join(unsupported))
          assert supported, results
          PY
          REMOTE

      - name: Verify legacy server writers remain stopped and compare safe flags
        shell: bash
        run: |
          set -euo pipefail
          test -n "$OLD_HOST"
          test -n "$OLD_PASS"
          timeout 180s env SSHPASS="$OLD_PASS" sshpass -e ssh \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$OLD_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          for service in backend celery celery-beat; do
            cid=$(docker compose ps -q "$service" || true)
            if [ -n "$cid" ] && [ "$(docker inspect -f '{{.State.Running}}' "$cid" 2>/dev/null || true)" = 'true' ]; then
              echo "legacy_${service}=UNEXPECTED_RUNNING" >&2
              exit 1
            fi
            echo "legacy_${service}=stopped"
          done
          python3 - <<'PY'
          from pathlib import Path
          values = {}
          for line in Path('.env').read_text(encoding='utf-8').splitlines():
              if '=' in line and not line.lstrip().startswith('#'):
                  k, v = line.split('=', 1)
                  if k in {'WORKER_EMAILS_ENABLED','WIW_SYNC_ENABLED','WIW_READ_ONLY'}:
                      values[k] = v
          for key in ('WORKER_EMAILS_ENABLED','WIW_SYNC_ENABLED','WIW_READ_ONLY'):
              print(f'legacy_{key}={values.get(key, "<default>")}')
          PY
          REMOTE

      - name: Cleanup
        if: always()
        shell: bash
        run: |
          rm -f "$HOME/.ssh/strato_ed25519" /tmp/health /tmp/home.html /tmp/cors-headers /tmp/google-headers /tmp/apple-headers /tmp/google-provider /tmp/apple-provider
