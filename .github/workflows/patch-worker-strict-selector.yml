name: Patch worker strict selector
on:
  push:
    branches: [qa/worker-portal-deep]
    paths: ['.github/workflows/patch-worker-strict-selector.yml']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/worker-portal-deep
      - name: Narrow signed-state selector
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('frontend/e2e/worker-portal-deep.spec.ts')
          s=p.read_text()
          old="    await expect(page.getByText('Unterzeichnet')).toBeVisible();"
          new="    await expect(page.locator('ion-badge').filter({ hasText: 'Unterzeichnet' })).toBeVisible();"
          if old not in s: raise SystemExit('selector marker missing')
          p.write_text(s.replace(old,new,1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/e2e/worker-portal-deep.spec.ts
          git commit -m 'test: narrow worker signed-state selector'
          git push origin HEAD:qa/worker-portal-deep
