name: Agent apply routing and bundle split patch

on:
  push:
    branches:
      - agent/routing-code-splitting
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Apply scoped patch
        run: |
          git apply --check .agent/routing-code-splitting.patch
          git apply .agent/routing-code-splitting.patch

      - name: Commit patched frontend
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx frontend/e2e/app-shell.spec.ts frontend/vite.config.ts
          git commit -m "Add URL routing and split frontend bundles"
          git push origin HEAD:${TARGET_BRANCH}
