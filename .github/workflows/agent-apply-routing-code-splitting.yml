name: Agent apply routing and bundle split patch

on:
  pull_request:
    branches:
      - agent/routing-code-splitting

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    env:
      TARGET_BRANCH: ${{ github.head_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.head_ref }}

      - name: Apply scoped App patch
        run: |
          git apply --check .agent/routing-code-splitting.patch
          git apply .agent/routing-code-splitting.patch

      - name: Commit patched App
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/src/App.tsx
          git commit -m "Add URL routing and lazy feature loading"
          git push origin HEAD:${TARGET_BRANCH}
