name: Apply Android notification branding

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-android-notification-branding.yml'
  workflow_dispatch:

permissions:
  contents: write

env:
  VITE_API_URL: https://app.aplus-solution.de/api

jobs:
  apply-build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Signature Motif and apply Android push branding
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import math
          import struct
          import wave

          def replace_once(path, old, new, marker=None):
              path = Path(path)
              text = path.read_text()
              if marker and marker in text:
                  return
              if old not in text:
                  raise SystemExit(f'Patch anchor not found in {path}: {old[:80]!r}')
              path.write_text(text.replace(old, new, 1))

          # Backend: Android gets the custom sound/channel/icon. APNs stays on default.
          replace_once(
              'backend/core/push_notifications.py',
              "DEFAULT_BUNDLE_ID = 'de.aplussolution.workforce'\n",
              "DEFAULT_BUNDLE_ID = 'de.aplussolution.workforce'\nANDROID_NOTIFICATION_CHANNEL_ID = 'aplus_updates_signature_v1'\nANDROID_NOTIFICATION_SOUND = 'solution_signature'\nANDROID_NOTIFICATION_ICON = 'ic_stat_aplus'\n",
              marker="ANDROID_NOTIFICATION_CHANNEL_ID = 'aplus_updates_signature_v1'",
          )
          replace_once(
              'backend/core/push_notifications.py',
              "                    'sound': 'default',\n                    'channel_id': 'aplus_updates',\n",
              "                    'sound': ANDROID_NOTIFICATION_SOUND,\n                    'channel_id': ANDROID_NOTIFICATION_CHANNEL_ID,\n                    'icon': ANDROID_NOTIFICATION_ICON,\n",
              marker="'channel_id': ANDROID_NOTIFICATION_CHANNEL_ID",
          )

          # Capacitor runtime: use a fresh channel because Android persists channel sound settings.
          replace_once(
              'frontend/src/NativePushRegistration.tsx',
              "const APP_ID = 'de.aplussolution.workforce';\n",
              "const APP_ID = 'de.aplussolution.workforce';\nconst ANDROID_PUSH_CHANNEL_ID = 'aplus_updates_signature_v1';\nconst ANDROID_PUSH_SOUND = 'solution_signature.wav';\nconst ANDROID_PUSH_ICON = 'ic_stat_aplus';\n",
              marker="const ANDROID_PUSH_CHANNEL_ID = 'aplus_updates_signature_v1';",
          )
          replace_once(
              'frontend/src/NativePushRegistration.tsx',
              "        channelId: Capacitor.getPlatform() === 'android' ? 'aplus_updates' : undefined,\n        extra: notification.data || {},",
              "        channelId: Capacitor.getPlatform() === 'android' ? ANDROID_PUSH_CHANNEL_ID : undefined,\n        sound: Capacitor.getPlatform() === 'android' ? ANDROID_PUSH_SOUND : undefined,\n        smallIcon: Capacitor.getPlatform() === 'android' ? ANDROID_PUSH_ICON : undefined,\n        extra: notification.data || {},",
              marker="smallIcon: Capacitor.getPlatform() === 'android' ? ANDROID_PUSH_ICON : undefined",
          )
          replace_once(
              'frontend/src/NativePushRegistration.tsx',
              "          await PushNotifications.createChannel({\n            id: 'aplus_updates',\n            name: 'A+ Solution Updates',\n            description: 'Schichten, Verträge, Nachrichten und wichtige Änderungen',\n            importance: 5,\n            visibility: 1,\n            sound: 'default',\n            vibration: true,\n          });",
              "          await PushNotifications.createChannel({\n            id: ANDROID_PUSH_CHANNEL_ID,\n            name: 'A+ Solution Updates',\n            description: 'Schichten, Verträge, Nachrichten und wichtige Änderungen',\n            importance: 5,\n            visibility: 1,\n            sound: ANDROID_PUSH_SOUND,\n            vibration: true,\n          });",
              marker="id: ANDROID_PUSH_CHANNEL_ID,",
          )
          replace_once(
              'frontend/src/NativePushRegistration.tsx',
              "            await LocalNotifications.createChannel({\n              id: 'aplus_updates',\n              name: 'A+ Solution Updates',\n              description: 'Schichten, Verträge, Nachrichten und wichtige Änderungen',\n              importance: 5,\n              visibility: 1,\n              sound: 'default',\n              vibration: true,\n            });",
              "            await LocalNotifications.createChannel({\n              id: ANDROID_PUSH_CHANNEL_ID,\n              name: 'A+ Solution Updates',\n              description: 'Schichten, Verträge, Nachrichten und wichtige Änderungen',\n              importance: 5,\n              visibility: 1,\n              sound: ANDROID_PUSH_SOUND,\n              vibration: true,\n            });",
              marker="await LocalNotifications.createChannel({\n              id: ANDROID_PUSH_CHANNEL_ID,",
          )

          # Source assets consumed by prepare-native.mjs after each clean `cap add android`.
          assets = Path('frontend/native-assets/android')
          assets.mkdir(parents=True, exist_ok=True)

          icon = '''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android"
              android:width="24dp"
              android:height="24dp"
              android:viewportWidth="24"
              android:viewportHeight="24">
              <!-- Monochrome Android status-bar treatment derived from root notif-icon.svg. -->
              <path
                  android:fillColor="#FFFFFFFF"
                  android:pathData="M10,3.5h4v6.5h6.5v4H14v6.5h-4V14H3.5v-4H10z" />
          </vector>
          '''
          (assets / 'ic_stat_aplus.xml').write_text(icon)

          # Reproduce the selected 0.616s Signature Motif as mono 44.1 kHz PCM WAV.
          SR = 44100
          def soft_note(freq, dur, amp, attack, release, decay):
              n = int(SR * dur)
              out = []
              attack_n = max(1, int(SR * attack))
              release_n = max(1, int(SR * release))
              for i in range(n):
                  t = i / SR
                  env = 1.0
                  if i < attack_n:
                      env *= i / attack_n
                  if i >= n - release_n:
                      env *= max(0.0, (n - 1 - i) / release_n)
                  env *= math.exp(-decay * t)
                  out.append(amp * math.sin(2 * math.pi * freq * t) * env)
              return out
          def gap(dur):
              return [0.0] * int(SR * dur)
          samples = (
              soft_note(440, .17, .48, .012, .09, 2.0)
              + gap(.018)
              + soft_note(550, .17, .44, .012, .09, 2.0)
              + gap(.018)
              + soft_note(660, .24, .40, .014, .14, 1.8)
          )
          peak = max(abs(v) for v in samples) or 1.0
          samples = [max(-1.0, min(1.0, v / peak * .58)) for v in samples]
          with wave.open(str(assets / 'solution_signature.wav'), 'wb') as wav:
              wav.setnchannels(1)
              wav.setsampwidth(2)
              wav.setframerate(SR)
              wav.writeframes(b''.join(struct.pack('<h', int(v * 32767)) for v in samples))

          # Make the generated Capacitor Android project receive the assets every time.
          prepare = Path('frontend/scripts/prepare-native.mjs')
          text = prepare.read_text()
          if 'function installAndroidNotificationBranding(manifestPath)' not in text:
              anchor = 'function patchAndroid() {'
              if anchor not in text:
                  raise SystemExit('prepare-native Android patch anchor missing')
              fn = r'''function installAndroidNotificationBranding(manifestPath) {
            const assetsDir = path.join(cwd, 'native-assets', 'android');
            const soundSource = path.join(assetsDir, 'solution_signature.wav');
            const iconSource = path.join(assetsDir, 'ic_stat_aplus.xml');
            if (!fs.existsSync(soundSource)) throw new Error(`Android notification sound source not found: ${soundSource}`);
            if (!fs.existsSync(iconSource)) throw new Error(`Android notification icon source not found: ${iconSource}`);

            const resDir = path.join(cwd, 'android', 'app', 'src', 'main', 'res');
            const rawDir = path.join(resDir, 'raw');
            const drawableDir = path.join(resDir, 'drawable');
            fs.mkdirSync(rawDir, { recursive: true });
            fs.mkdirSync(drawableDir, { recursive: true });
            fs.copyFileSync(soundSource, path.join(rawDir, 'solution_signature.wav'));
            fs.copyFileSync(iconSource, path.join(drawableDir, 'ic_stat_aplus.xml'));

            let xml = fs.readFileSync(manifestPath, 'utf8');
            const iconMeta = '        <meta-data android:name="com.google.firebase.messaging.default_notification_icon" android:resource="@drawable/ic_stat_aplus" />';
            const channelMeta = '        <meta-data android:name="com.google.firebase.messaging.default_notification_channel_id" android:value="aplus_updates_signature_v1" />';
            if (!xml.includes('com.google.firebase.messaging.default_notification_icon')) {
              xml = xml.replace(/<application\\b[^>]*>/, (match) => `${match}\\n${iconMeta}`);
            }
            if (!xml.includes('com.google.firebase.messaging.default_notification_channel_id')) {
              xml = xml.replace(/<application\\b[^>]*>/, (match) => `${match}\\n${channelMeta}`);
            }
            fs.writeFileSync(manifestPath, xml);
            console.log('Installed Android A+ notification icon and Signature Motif sound.');
          }

          '''
              text = text.replace(anchor, fn + anchor, 1)
          old_call = "  installAndroidLauncherArtwork(manifestPath);\n  console.log('Prepared Android API 36, foreground location and native push permissions.');"
          new_call = "  installAndroidLauncherArtwork(manifestPath);\n  installAndroidNotificationBranding(manifestPath);\n  console.log('Prepared Android API 36, foreground location, native push permissions and notification branding.');"
          if 'installAndroidNotificationBranding(manifestPath);' not in text:
              if old_call not in text:
                  raise SystemExit('prepare-native branding call anchor missing')
              text = text.replace(old_call, new_call, 1)
          prepare.write_text(text)

          # Sanity: the supplied source exists and the iOS APNs sound remains untouched.
          svg = Path('notif-icon.svg')
          if not svg.exists() or '+' not in svg.read_text():
              raise SystemExit('notif-icon.svg is missing or does not contain the supplied + mark')
          push_text = Path('backend/core/push_notifications.py').read_text()
          ios_section = push_text.split('def _send_ios(', 1)[1]
          if "'sound': 'default'" not in ios_section:
              raise SystemExit('iOS APNs sound was changed unexpectedly')
          PY

      - name: Validate patched sources
        run: |
          python3 -m py_compile backend/core/push_notifications.py
          node --check frontend/scripts/prepare-native.mjs
          test -s frontend/native-assets/android/solution_signature.wav
          test -s frontend/native-assets/android/ic_stat_aplus.xml

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Require Android signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/aplus-release.jks

      - name: Build branded Android project
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          rm -rf android
          npx cap add android
          npx cap sync android
          node scripts/prepare-native.mjs android
          test -s android/app/src/main/res/raw/solution_signature.wav
          test -s android/app/src/main/res/drawable/ic_stat_aplus.xml
          grep -q 'default_notification_icon' android/app/src/main/AndroidManifest.xml
          grep -q 'aplus_updates_signature_v1' android/app/src/main/AndroidManifest.xml
          cp /tmp/aplus-release.jks android/app/aplus-release.jks

      - name: Configure Gradle release signing
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('frontend/android/app/build.gradle')
          text = path.read_text()
          if 'signingConfigs {' not in text:
              text = text.replace('android {', '''android {
              signingConfigs {
                  release {
                      storeFile file("aplus-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          ''', 1)
          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace('release {', '''release {
                      signingConfig signingConfigs.release''', 1)
          path.write_text(text)
          PY

      - name: Build signed Android App Bundle
        working-directory: frontend/android
        run: ./gradlew bundleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: aplus-android-signature-notification-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

      - name: Commit branding only after successful build
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            backend/core/push_notifications.py \
            frontend/src/NativePushRegistration.tsx \
            frontend/scripts/prepare-native.mjs \
            frontend/native-assets/android/solution_signature.wav \
            frontend/native-assets/android/ic_stat_aplus.xml
          if git diff --cached --quiet; then
            echo 'Android notification branding is already applied.'
            exit 0
          fi
          git commit -m 'Brand Android push with A+ icon and Signature Motif'
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Cleanup signing material
        if: always()
        run: rm -f /tmp/aplus-release.jks frontend/android/app/aplus-release.jks
