name: Phase 6 shared send icon fix

on:
  push:
    branches:
      - feature/phase6-confirmations-mitteilungen

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase6-confirmations-mitteilungen
      - name: Keep sendOutline import used outside legacy Chat
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('scripts/apply_phase6.py')
          text = p.read_text(encoding='utf-8')
          line = "replace_once('frontend/src/App.tsx', '  sendOutline,\\n', '')\\n"
          if text.count(line) != 1:
              raise SystemExit(f'expected one sendOutline removal, found {text.count(line)}')
          p.write_text(text.replace(line, '', 1), encoding='utf-8')
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase6-send-icon-fix.yml
          git add scripts/apply_phase6.py
          git commit -m 'Preserve shared send icon outside Mitteilungen'
          git push origin HEAD:feature/phase6-confirmations-mitteilungen
