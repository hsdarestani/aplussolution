name: Phase 5 prepare-build idempotency fix

on:
  push:
    branches:
      - feature/phase5-calendar-navigation

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase5-calendar-navigation
      - name: Make client location build patch idempotent
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/scripts/prepare-build.mjs')
          text = path.read_text(encoding='utf-8')
          old = '''if (appNext.includes(managerOnlyOrderMasterData)) {
            appNext = appNext.replace(managerOnlyOrderMasterData, scopedOrderMasterData);
          } else if (!appNext.includes("else if (user.role === 'client') {\\n      const locationData = await api('locations/');")) {
            throw new Error('Client order location loading marker changed; update prepare-build.mjs.');
          }'''
          new = '''if (appNext.includes(scopedOrderMasterData)) {
            // Already scoped in source; keep prepare:build idempotent.
          } else if (appNext.includes(managerOnlyOrderMasterData)) {
            appNext = appNext.replace(managerOnlyOrderMasterData, scopedOrderMasterData);
          } else {
            throw new Error('Client order location loading marker changed; update prepare-build.mjs.');
          }'''
          if text.count(old) != 1:
              raise SystemExit(f'expected one prepare-build order patch, found {text.count(old)}')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
      - name: Commit source fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/phase5-prepare-build-fix.yml
          git add frontend/scripts/prepare-build.mjs
          git commit -m 'Make client order prepare-build patch idempotent'
          git push origin HEAD:feature/phase5-calendar-navigation
