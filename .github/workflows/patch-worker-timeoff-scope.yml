name: Harden worker time-off requests

on:
  push:
    branches: [qa/worker-portal-deep]
    paths:
      - '.github/workflows/patch-worker-timeoff-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/worker-portal-deep
      - name: Enforce pending status and valid date range
        run: |
          python - <<'PY'
          from pathlib import Path

          serializers = Path('backend/core/serializers.py')
          text = serializers.read_text()
          old = "class TimeOffRequestSerializer(serializers.ModelSerializer):\n    worker_name = serializers.CharField(source='worker.user.get_full_name', read_only=True)\n\n    class Meta:\n        model = TimeOffRequest\n        fields = '__all__'\n        read_only_fields = ['decided_by']\n        extra_kwargs = {'worker': {'required': False}}"
          new = "class TimeOffRequestSerializer(serializers.ModelSerializer):\n    worker_name = serializers.CharField(source='worker.user.get_full_name', read_only=True)\n\n    class Meta:\n        model = TimeOffRequest\n        fields = '__all__'\n        read_only_fields = ['decided_by']\n        extra_kwargs = {'worker': {'required': False}}\n\n    def validate(self, attrs):\n        starts_on = attrs.get('starts_on', getattr(self.instance, 'starts_on', None))\n        ends_on = attrs.get('ends_on', getattr(self.instance, 'ends_on', None))\n        if starts_on and ends_on and ends_on < starts_on:\n            raise serializers.ValidationError({'ends_on': 'Ende muss am oder nach dem Beginn liegen.'})\n        return attrs"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('TimeOff serializer marker missing.')
          serializers.write_text(text)

          views = Path('backend/core/views.py')
          text = views.read_text()
          old = "    def perform_create(self, serializer):\n        values = {}\n        if self.request.user.role == 'worker':\n            values['worker'] = self.request.user.worker_profile\n        obj = serializer.save(**values)\n        audit(self.request, 'timeoff.created', obj)"
          new = "    def perform_create(self, serializer):\n        values = {}\n        if self.request.user.role == 'worker':\n            values['worker'] = self.request.user.worker_profile\n            values['status'] = TimeOffRequest.Status.PENDING\n        obj = serializer.save(**values)\n        audit(self.request, 'timeoff.created', obj)"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('TimeOff perform_create marker missing.')
          views.write_text(text)
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/serializers.py backend/core/views.py
          git commit -m 'fix: prevent worker self-approval of time off'
          git push origin HEAD:qa/worker-portal-deep
