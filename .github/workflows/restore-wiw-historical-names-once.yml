          counts = {'source_ids':len(mapping),'updated':0,'already_named':0,'not_present':0,'existing_name_conflict':0,'not_archival':0,'active_guard':0}
          with transaction.atomic():
              before = [Shift.objects.count(),TimeEntry.objects.count(),WorkingTimeAccountRecord.objects.count(),PayrollStatement.objects.count()]
              profiles = {str(w.wiw_user_id):w for w in WorkerProfile.objects.select_for_update().select_related('user').filter(wiw_user_id__in=mapping.keys())}
              for wid, names in mapping.items():
                  worker = profiles.get(wid)
                  if worker is None:
                      counts['not_present'] += 1
                      continue
                  user = worker.user
                  if not (worker.employee_number == 'WIW-HIST-' + wid and str(user.wiw_id or '') == wid and str(user.email or '').lower() == 'wiw-' + wid + '@sync.invalid'):
                      counts['not_archival'] += 1
                      continue
                  if user.is_active or worker.active or user.is_staff or user.is_superuser or user.is_onboarded:
                      counts['active_guard'] += 1
                      continue
                  existing = [(user.first_name or '').strip(),(user.last_name or '').strip()]
                  if existing == names:
                      counts['already_named'] += 1
                      continue
                  if any(existing):
                      counts['existing_name_conflict'] += 1
                      continue
                  user.first_name, user.last_name = names
                  user.save(update_fields=['first_name','last_name'])
                  counts['updated'] += 1
              after = [Shift.objects.count(),TimeEntry.objects.count(),WorkingTimeAccountRecord.objects.count(),PayrollStatement.objects.count()]
              assert before == after, 'Unexpected shift/attendance/payroll count change'
              assert counts['updated'] + counts['already_named'] >= 20, 'Too few names matched: transaction rolled back'
              # Verify no formerly inactive worker was activated during restoration.
              assert not WorkerProfile.objects.filter(wiw_user_id__in=mapping.keys(), employee_number__startswith='WIW-HIST-', active=True).exists()
              print(json.dumps({'result':'success','counts':counts,'historical_shift_time_payroll_counts_unchanged':True}, ensure_ascii=False))
          
          PY
