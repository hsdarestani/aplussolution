name: Restore historical WIW employee names once
on:
  push:
    branches: [audit/full-worktime-2026-10-14]
    paths: ['.github/workflows/restore-wiw-historical-names-once.yml']
permissions:
  contents: read
jobs:
  restore-names:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Safely update only inactive archived profile display names on Strato
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/wiw_restore_key"
          chmod 600 "$HOME/.ssh/wiw_restore_key"
          ssh -i "$HOME/.ssh/wiw_restore_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$STRATO_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python -' <<'PY'
          import os, django, json
          from django.db import transaction
          from django.utils import timezone
          os.environ.setdefault('DJANGO_SETTINGS_MODULE', 'config.settings')
          django.setup()
          from core.models import User, WorkerProfile, Shift, TimeEntry, WorkingTimeAccountRecord, PayrollStatement
          mapping = {
