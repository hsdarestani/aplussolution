name: One-time Strato cutover

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-cutover.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-strato-cutover
  cancel-in-progress: false

env:
  NEW_DOMAIN: app.aplus-solution.de

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Configure old and new SSH authentication
        env:
          OLD_PASSWORD: ${{ secrets.PASS }}
          NEW_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          test -n "$OLD_PASSWORD"
          test -n "$NEW_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"
          printf '%s\n' "$NEW_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"
          cat > /tmp/aplus-old-askpass.sh <<'ASKPASS'
          #!/bin/sh
          printf '%s\n' "$OLD_PASSWORD"
          ASKPASS
          chmod 700 /tmp/aplus-old-askpass.sh

      - name: Preflight both servers
        env:
          OLD_HOST: ${{ secrets.HOST }}
          OLD_PASSWORD: ${{ secrets.PASS }}
          NEW_HOST: ${{ secrets.STRATO_HOST }}
          SSH_ASKPASS: /tmp/aplus-old-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
        run: |
          set -euo pipefail
          test -n "$OLD_HOST" && test -n "$OLD_PASSWORD" && test -n "$NEW_HOST"
          export OLD_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$OLD_HOST" \
            'test -f /opt/aplussolution/.env && cd /opt/aplussolution && docker compose ps >/dev/null'
          ssh -qT \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            root@"$NEW_HOST" \
            'mkdir -p /opt/aplussolution && test -d /opt/aplussolution'

      - name: Export live production database, media and environment
        env:
          OLD_HOST: ${{ secrets.HOST }}
          OLD_PASSWORD: ${{ secrets.PASS }}
          SSH_ASKPASS: /tmp/aplus-old-askpass.sh
          SSH_ASKPASS_REQUIRE: force
          DISPLAY: :0
        run: |
          set -euo pipefail
          export OLD_PASSWORD SSH_ASKPASS SSH_ASKPASS_REQUIRE DISPLAY
          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@"$OLD_HOST" \
            'cat /opt/aplussolution/.env' > /tmp/aplussolution.env
          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@"$OLD_HOST" \
            "cd /opt/aplussolution && docker compose exec -T db sh -c 'pg_dump -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" --clean --if-exists --no-owner --no-privileges'" \
            > /tmp/aplussolution.sql
          setsid -w ssh -qT \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            root@"$OLD_HOST" \
            'cd /opt/aplussolution && docker compose exec -T backend tar -C /app/media -czf - .' \
            > /tmp/aplussolution-media.tgz
          test -s /tmp/aplussolution.env
          test -s /tmp/aplussolution.sql
          test -s /tmp/aplussolution-media.tgz
          echo "Database dump: $(du -h /tmp/aplussolution.sql | cut -f1)"
          echo "Media archive: $(du -h /tmp/aplussolution-media.tgz | cut -f1)"

      - name: Package release source
        run: |
          set -euo pipefail
          tar \
            --exclude='.git' \
            --exclude='.env' \
            --exclude='frontend/node_modules' \
            -czf /tmp/aplussolution-release.tgz .

      - name: Upload migration bundle to Strato
        env:
          NEW_HOST: ${{ secrets.STRATO_HOST }}
        run: |
          set -euo pipefail
          scp -q \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            /tmp/aplussolution-release.tgz \
            /tmp/aplussolution.env \
            /tmp/aplussolution.sql \
            /tmp/aplussolution-media.tgz \
            root@"$NEW_HOST":/tmp/

      - name: Restore and start A+ Solution on Strato
        env:
          NEW_HOST: ${{ secrets.STRATO_HOST }}
        run: |
          set -euo pipefail
          ssh \
            -i "$HOME/.ssh/strato_ed25519" \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null \
            -o ConnectTimeout=20 \
            -o ServerAliveInterval=20 \
            -o ServerAliveCountMax=15 \
            root@"$NEW_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          apt-get update
          apt-get install -y ca-certificates curl openssl
          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sh
          fi
          systemctl enable --now docker

          mkdir -p /opt/aplussolution
          cd /opt/aplussolution
          if [ -f docker-compose.yml ]; then
            docker compose stop backend celery celery-beat frontend caddy >/dev/null 2>&1 || true
          fi
          find /opt/aplussolution -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          tar -xzf /tmp/aplussolution-release.tgz -C /opt/aplussolution
          cp /tmp/aplussolution.env /opt/aplussolution/.env
          chmod 600 /opt/aplussolution/.env

          set_env() {
            key="$1"
            value="$2"
            if grep -q "^${key}=" .env; then
              sed -i "s#^${key}=.*#${key}=${value}#" .env
            else
              printf '%s=%s\n' "$key" "$value" >> .env
            fi
          }

          set_env DEBUG 0
          set_env ALLOWED_HOSTS 'app.aplus-solution.de,localhost,127.0.0.1'
          set_env CSRF_TRUSTED_ORIGINS 'https://app.aplus-solution.de,https://localhost'
          set_env CORS_ALLOWED_ORIGINS 'https://app.aplus-solution.de,https://localhost,capacitor://localhost,http://localhost'
          set_env APP_URL 'https://app.aplus-solution.de'
          set_env API_URL 'https://app.aplus-solution.de/api'
          set_env APP_DOMAIN 'app.aplus-solution.de'
          set_env GOOGLE_OAUTH_REDIRECT_URI 'https://app.aplus-solution.de/api/auth/oauth/google/callback/'
          set_env APPLE_OAUTH_REDIRECT_URI 'https://app.aplus-solution.de/api/auth/oauth/apple/callback/'
          set_env SAML_SP_ENTITY_ID 'https://app.aplus-solution.de/api/auth/saml/metadata/'
          set_env SAML_SP_ACS_URL 'https://app.aplus-solution.de/api/auth/saml/acs/'
          set_env SAML_SP_SLS_URL 'https://app.aplus-solution.de/api/auth/saml/logout/'

          docker compose pull db redis caddy || true
          docker compose up -d db redis
          for i in $(seq 1 60); do
            if docker compose exec -T db sh -c 'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"' >/dev/null 2>&1; then
              break
            fi
            if [ "$i" -eq 60 ]; then
              docker compose logs --no-color --tail=150 db >&2 || true
              exit 1
            fi
            sleep 2
          done

          cat /tmp/aplussolution.sql | docker compose exec -T db sh -c 'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB"'

          docker compose build backend
          cat /tmp/aplussolution-media.tgz | docker compose run --rm --no-deps -T backend sh -c 'find /app/media -mindepth 1 -maxdepth 1 -exec rm -rf {} +; tar -C /app/media -xzf -'

          docker compose up -d --build --remove-orphans

          backend_ready=0
          for i in $(seq 1 60); do
            if docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              backend_ready=1
              break
            fi
            sleep 5
          done
          if [ "$backend_ready" -ne 1 ]; then
            docker compose logs --no-color --tail=250 backend >&2 || true
            exit 1
          fi

          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py migrate --check
          docker compose exec -T backend python manage.py shell -c "from core.models import User, Shift; print('Sanity counts:', {'users': User.objects.count(), 'shifts': Shift.objects.count()})"
          docker compose ps
          rm -f /tmp/aplussolution-release.tgz /tmp/aplussolution.env /tmp/aplussolution.sql /tmp/aplussolution-media.tgz
          REMOTE

      - name: Verify public HTTPS endpoint
        run: |
          set -euo pipefail
          for i in $(seq 1 30); do
            if curl -fsS --max-time 20 "https://${NEW_DOMAIN}/health/" >/dev/null; then
              echo "A+ Solution is healthy at https://${NEW_DOMAIN}"
              exit 0
            fi
            sleep 10
          done
          echo "Public health check failed for https://${NEW_DOMAIN}/health/" >&2
          exit 1

      - name: Remove migration files from runner
        if: always()
        run: |
          rm -f /tmp/aplussolution.env /tmp/aplussolution.sql /tmp/aplussolution-media.tgz /tmp/aplussolution-release.tgz /tmp/aplus-old-askpass.sh
          rm -f "$HOME/.ssh/strato_ed25519"
