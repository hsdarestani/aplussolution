name: Hot deploy frontend only

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/strato-frontend-hotdeploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-frontend-hotdeploy
  cancel-in-progress: true

env:
  PRODUCTION_DOMAIN: app.aplus-solution.de

jobs:
  deploy-frontend:
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[frontend-only]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIMARY_HOST: ${{ secrets.STRATO_HOST }}
      PRIMARY_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Confirm current primary and configure SSH
        run: |
          set -euo pipefail
          curl -fsS --max-time 20 -D /tmp/primary-headers -o /dev/null "https://$PRODUCTION_DOMAIN/?deploy_preflight=$GITHUB_RUN_ID"
          grep -qi '^x-aplus-origin: strato-primary' /tmp/primary-headers
          test -n "$PRIMARY_HOST"
          test -n "$PRIMARY_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$PRIMARY_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Build frontend on GitHub runner
        working-directory: frontend
        env:
          VITE_API_URL: https://app.aplus-solution.de/api
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          test -f dist/index.html

      - name: Package frontend dist
        run: |
          set -euo pipefail
          tar -C frontend/dist -czf /tmp/aplus-frontend-dist.tgz .

      - name: Upload frontend bundle to current STRATO primary
        run: |
          set -euo pipefail
          scp -q -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             /tmp/aplus-frontend-dist.tgz root@"$PRIMARY_HOST":/tmp/aplus-frontend-dist.tgz

      - name: Replace live frontend files on current STRATO primary
        run: |
          set -euo pipefail
          ssh -i "$HOME/.ssh/strato_ed25519" -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             -o ServerAliveInterval=10             -o ServerAliveCountMax=6             root@"$PRIMARY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          cid=$(docker compose ps -q frontend)
          test -n "$cid"
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = "true"

          rm -rf /tmp/aplus-frontend-dist
          mkdir -p /tmp/aplus-frontend-dist
          tar -xzf /tmp/aplus-frontend-dist.tgz -C /tmp/aplus-frontend-dist
          rm -f /tmp/aplus-frontend-dist.tgz

          # Preserve hashed assets still referenced by open browser sessions.
          docker exec "$cid" nginx -t
          docker cp /tmp/aplus-frontend-dist/. "$cid":/usr/share/nginx/html/
          docker exec "$cid" nginx -t
          docker exec "$cid" nginx -s reload

          rm -rf /tmp/aplus-frontend-dist
          REMOTE

      - name: Verify public production
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            rm -f /tmp/headers /tmp/home.html
            if curl -fsS --max-time 12 -D /tmp/headers -o /tmp/home.html               "https://$PRODUCTION_DOMAIN/?primary_check=${GITHUB_RUN_ID}-$i"               && grep -q '<div id="root"' /tmp/home.html               && grep -qi '^x-aplus-origin: strato-primary' /tmp/headers               && cmp -s frontend/dist/index.html /tmp/home.html; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" -eq 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/aplus-frontend-dist.tgz /tmp/home.html /tmp/headers /tmp/primary-headers "$HOME/.ssh/strato_ed25519"
