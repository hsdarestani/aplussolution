name: Hot deploy frontend only

on:
  push:
    branches: [main]
    paths:
      - 'frontend/**'
      - '.github/workflows/strato-frontend-hotdeploy.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-frontend-hotdeploy
  cancel-in-progress: true

env:
  PRODUCTION_DOMAIN: app.aplus-solution.de

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PRIMARY_HOST: ${{ secrets.BACKUP_HOST }}
      PRIMARY_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install SSH helper
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass

      - name: Build frontend on GitHub runner
        working-directory: frontend
        env:
          VITE_API_URL: https://app.aplus-solution.de/api
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund --package-lock=false
          npm run build
          test -f dist/index.html

      - name: Package frontend dist
        run: |
          set -euo pipefail
          tar -C frontend/dist -czf /tmp/aplus-frontend-dist.tgz .

      - name: Upload frontend bundle to temporary primary
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e scp -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             /tmp/aplus-frontend-dist.tgz root@"$PRIMARY_HOST":/tmp/aplus-frontend-dist.tgz

      - name: Replace live frontend files on temporary primary
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             -o ServerAliveInterval=10             -o ServerAliveCountMax=6             root@"$PRIMARY_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution

          cid=$(docker compose ps -q frontend)
          test -n "$cid"
          test "$(docker inspect -f '{{.State.Running}}' "$cid")" = "true"

          rm -rf /tmp/aplus-frontend-dist
          mkdir -p /tmp/aplus-frontend-dist
          tar -xzf /tmp/aplus-frontend-dist.tgz -C /tmp/aplus-frontend-dist
          rm -f /tmp/aplus-frontend-dist.tgz

          docker exec "$cid" sh -lc 'rm -rf /usr/share/nginx/html/*'
          docker cp /tmp/aplus-frontend-dist/. "$cid":/usr/share/nginx/html/
          docker exec "$cid" nginx -t
          docker exec "$cid" nginx -s reload

          rm -rf /tmp/aplus-frontend-dist
          REMOTE

      - name: Verify public production
        run: |
          set -euo pipefail
          ok=0
          for i in $(seq 1 18); do
            rm -f /tmp/headers /tmp/home.html
            if curl -fsS --max-time 12 -D /tmp/headers -o /tmp/home.html               "https://$PRODUCTION_DOMAIN/?primary_check=${GITHUB_RUN_ID}-$i"               && grep -q '<div id="root"' /tmp/home.html               && grep -qi '^x-aplus-origin: backup-primary' /tmp/headers; then
              ok=1
              break
            fi
            sleep 8
          done
          test "$ok" -eq 1

      - name: Cleanup
        if: always()
        run: rm -f /tmp/aplus-frontend-dist.tgz /tmp/home.html /tmp/headers
