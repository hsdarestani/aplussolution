name: Apply worker document scope patch

on:
  push:
    branches: [qa/worker-portal-deep]
    paths:
      - '.github/workflows/patch-worker-document-scope.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/worker-portal-deep
      - name: Enforce document ownership and align UI
        run: |
          python - <<'PY'
          from pathlib import Path

          views = Path('backend/core/views.py')
          text = views.read_text()
          old = "    def perform_create(self, serializer):\n        values = {'uploaded_by': self.request.user}\n        if self.request.user.role == 'worker':\n            values['worker'] = self.request.user.worker_profile\n        if self.request.user.role == 'client':\n            values['client'] = self.request.user.client_companies.first()\n        obj = serializer.save(**values)\n        audit(self.request, 'document.uploaded', obj)"
          new = "    def perform_create(self, serializer):\n        values = {'uploaded_by': self.request.user}\n        if self.request.user.role == 'worker':\n            values.update(\n                worker=self.request.user.worker_profile,\n                client=None,\n                visibility=Document.Visibility.WORKER,\n            )\n        elif self.request.user.role == 'client':\n            values.update(\n                worker=None,\n                client=self.request.user.client_companies.first(),\n                visibility=Document.Visibility.CLIENT,\n            )\n        obj = serializer.save(**values)\n        audit(self.request, 'document.uploaded', obj)"
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit('Document perform_create marker missing.')
          views.write_text(text)

          app = Path('frontend/src/App.tsx')
          text = app.read_text()
          old_init = "const [form, setForm] = useState<any>({ folder: 'general', visibility: 'shared' });"
          new_init = "const [form, setForm] = useState<any>({ folder: 'general', visibility: isManager(user) ? 'shared' : user.role === 'worker' ? 'worker' : 'client' });"
          if old_init in text:
              text = text.replace(old_init, new_init, 1)
          elif new_init not in text:
              raise SystemExit('Document form initial state marker missing.')

          old_reset = "setForm({ folder: 'general', visibility: 'shared' });"
          new_reset = "setForm({ folder: 'general', visibility: isManager(user) ? 'shared' : user.role === 'worker' ? 'worker' : 'client' });"
          if old_reset in text:
              text = text.replace(old_reset, new_reset, 1)
          elif new_reset not in text:
              raise SystemExit('Document form reset marker missing.')

          visibility_marker = "        <IonSelect\n          fill=\"outline\"\n          label=\"Sichtbarkeit\"\n          labelPlacement=\"floating\"\n          value={form.visibility}"
          visibility_replacement = "        <IonSelect\n          fill=\"outline\"\n          label=\"Sichtbarkeit\"\n          labelPlacement=\"floating\"\n          disabled={!isManager(user)}\n          value={form.visibility}"
          if visibility_marker in text:
              text = text.replace(visibility_marker, visibility_replacement, 1)
          elif visibility_replacement not in text:
              raise SystemExit('Document visibility select marker missing.')
          app.write_text(text)
          PY
      - name: Commit patch
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add backend/core/views.py frontend/src/App.tsx
          git commit -m 'fix: enforce portal document ownership and visibility'
          git push origin HEAD:qa/worker-portal-deep
