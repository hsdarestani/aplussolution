name: Materialize source

on:
  push:
    branches: [main]
    paths:
      - '.source.part*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and extract source archive
        run: |
          cat .source.part* | base64 --decode > /tmp/aplus-src.tar.gz
          echo '7cc851e56dfded9e3712ab7f8ed5a8248af40d77805b100bb6b0bdb631f1e60f  /tmp/aplus-src.tar.gz' | sha256sum -c -
          tar -xzf /tmp/aplus-src.tar.gz
          rm -f .source.part*
          rm -f .github/workflows/materialize.yml
      - name: Commit generated source tree
        run: |
          git config user.name 'A+ Solution Automation'
          git config user.email 'automation@aplus-solution.de'
          git add -A
          git commit -m 'Materialize A+ Solution workforce platform'
          git push origin main
