name: Browser E2E and mobile QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aplus-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E and responsive QA
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  production-time-diagnostic:
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Diagnose missing WIW time entries without PII
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e ssh -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py shell -c "from collections import Counter; from core.wiw_migration import fetch_complete_wiw_snapshot; from core.wiw import WhenIWorkClient; from core.models import TimeEntry, WorkerProfile; from core.wiw_sync import first, as_id, as_datetime; snap,errs=fetch_complete_wiw_snapshot(WhenIWorkClient()); local=set(TimeEntry.objects.exclude(wiw_time_id__isnull=True).exclude(wiw_time_id='').values_list('wiw_time_id',flat=True)); missing=[i for i in snap['times'] if str(as_id(first(i,'id','time_id')) or '') not in local]; print('remote_times='+str(len(snap['times']))); print('missing_times='+str(len(missing))); print('missing_key_shapes='+str(Counter(tuple(sorted(i.keys())) for i in missing).most_common(10))); print('missing_without_snake_user='+str(sum(1 for i in missing if not as_id(first(i,'user_id','user'))))); print('missing_with_userId='+str(sum(1 for i in missing if i.get('userId') not in (None,'')))); print('missing_without_snake_start='+str(sum(1 for i in missing if not as_datetime(first(i,'start_time','clock_in','start'))))); print('missing_with_startTime='+str(sum(1 for i in missing if i.get('startTime') not in (None,'')))); print('candidate_key_presence='+str({k:sum(1 for i in missing if i.get(k) not in (None,'')) for k in ['user_id','user','userId','userid','employee_id','employeeId','start_time','startTime','clock_in','clockin_time','clock_in_time','start','time_in','end_time','endTime','clock_out','shift_id','shiftId']})); print('sample_value_types='+str([{k:type(v).__name__ for k,v in i.items()} for i in missing[:3]]))" </dev/null
          REMOTE
