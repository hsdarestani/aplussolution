name: Browser E2E and mobile QA
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: aplus-e2e-${{ github.ref }}
  cancel-in-progress: true
jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm install --no-audit --no-fund --package-lock=false
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Run browser E2E and responsive QA
        working-directory: frontend
        run: npm run test:e2e
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: frontend/playwright-report
          retention-days: 7

  production-verify:
    if: github.event_name == 'pull_request' && github.head_ref == 'verify/routing-production'
    runs-on: ubuntu-latest
    steps:
      - name: Install SSH tooling
        run: sudo apt-get update && sudo apt-get install -y sshpass
      - name: Diagnose current production rollout
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          test -n "$HOST" && test -n "$SSHPASS"
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          routing_source=no
          split_source=no
          schedule_chunk=no
          attendance_chunk=no
          operations_chunk=no
          main_size=0
          grep -q 'export function useViewRouting' frontend/src/viewRouting.ts && routing_source=yes || true
          grep -q 'app-shell-transforms' frontend/vite.config.ts && split_source=yes || true
          if docker compose ps --status running frontend --quiet | grep -q .; then
            docker compose exec -T frontend sh -lc '
              set -eu
              set -- /usr/share/nginx/html/assets/ScheduleV2-*.js; test -f "$1" && echo schedule_chunk=yes || echo schedule_chunk=no
              set -- /usr/share/nginx/html/assets/AttendanceV3-*.js; test -f "$1" && echo attendance_chunk=yes || echo attendance_chunk=no
              set -- /usr/share/nginx/html/assets/Operations-*.js; test -f "$1" && echo operations_chunk=yes || echo operations_chunk=no
              main="$(ls /usr/share/nginx/html/assets/index-*.js 2>/dev/null | head -n1 || true)"
              if [ -n "$main" ]; then echo "main_size=$(wc -c < "$main")"; else echo main_size=0; fi
            ' > /tmp/frontend-rollout-status
            cat /tmp/frontend-rollout-status
            grep -q '^schedule_chunk=yes$' /tmp/frontend-rollout-status && schedule_chunk=yes || true
            grep -q '^attendance_chunk=yes$' /tmp/frontend-rollout-status && attendance_chunk=yes || true
            grep -q '^operations_chunk=yes$' /tmp/frontend-rollout-status && operations_chunk=yes || true
            main_size="$(sed -n 's/^main_size=//p' /tmp/frontend-rollout-status | tail -n1)"
          fi
          echo "routing_source=$routing_source"
          echo "split_source=$split_source"
          echo "schedule_chunk=$schedule_chunk"
          echo "attendance_chunk=$attendance_chunk"
          echo "operations_chunk=$operations_chunk"
          echo "production_main_bundle_bytes=$main_size"
          test "$routing_source" = yes
          test "$split_source" = yes
          test "$schedule_chunk" = yes
          test "$attendance_chunk" = yes
          test "$operations_chunk" = yes
          test "$main_size" -gt 0
          test "$main_size" -lt 100000
          REMOTE
      - name: Verify production runtime and integrations
        env:
          SSHPASS: ${{ secrets.PASS }}
          HOST: ${{ secrets.HOST }}
        run: |
          set -euo pipefail
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker compose exec -T backend python manage.py check
          docker compose exec -T backend python manage.py shell -c "from core.wiw import WhenIWorkClient; client=WhenIWorkClient(); client.login(force=True); client.collection('shifts', params={'limit': 1}); client.collection('times', params={'limit': 1}); print('WIW authentication and resource access OK')"
          docker compose exec -T backend curl -fsS --retry 5 --retry-delay 2 http://127.0.0.1:8000/health/ >/dev/null
          curl -fsS --retry 5 --retry-delay 2 https://solution.smarbiz.sbs/health/ >/dev/null
          echo 'Production runtime, WIW and HTTPS checks passed.'
          REMOTE
