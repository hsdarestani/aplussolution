name: Install production document templates

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  install:
    if: github.head_ref == 'ops/fix-production-state'
    runs-on: ubuntu-latest
    env:
      HOST: ${{ secrets.HOST }}
      SSHPASS: ${{ secrets.PASS }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install SSH tooling
        run: sudo apt-get update -qq && sudo apt-get install -y -qq sshpass
      - name: Prepare corrected private template builder
        run: |
          set -euo pipefail
          git show 153f828b27c9251850d3acc3de776ac5ef9dd22f:.ops-template-payload/build_private_templates.py > /tmp/build_private_templates.py
          sed -i 's/c\.acroform/c.acroForm/g' /tmp/build_private_templates.py
          python -m py_compile /tmp/build_private_templates.py
          test -s /tmp/build_private_templates.py
      - name: Install and verify all eight templates
        shell: bash
        run: |
          set -euo pipefail
          set +x
          test -n "$HOST"
          test -n "$SSHPASS"
          sshpass -e scp -q -o StrictHostKeyChecking=no /tmp/build_private_templates.py root@"$HOST":/root/build_private_templates.py
          sshpass -e ssh -qT -o StrictHostKeyChecking=no root@"$HOST" 'bash -s' <<'REMOTE' > production-template-result.txt 2>&1
          set -euo pipefail
          cd /opt/aplussolution
          BACKEND_ID=$(docker compose ps -q backend)
          FRONTEND_ID=$(docker compose ps -q frontend)
          test -n "$BACKEND_ID"
          test -n "$FRONTEND_ID"

          docker cp /root/build_private_templates.py "$BACKEND_ID":/tmp/build_private_templates.py
          docker compose exec -T backend env TEMPLATE_BUNDLE_OUTPUT=/tmp/aplus-document-templates.zip python /tmp/build_private_templates.py
          docker compose exec -T backend python manage.py import_document_bundle /tmp/aplus-document-templates.zip

          docker compose exec -T backend python manage.py shell <<'PY'
          from django.db.models import Q
          from core.document_catalog import CATALOG_BY_SLUG
          from core.document_engine import seed_document_catalog
          from core.models import ClientCompany, ClientOrder, ContractTemplate, WorkerProfile
          seed_document_catalog()
          ContractTemplate.objects.filter(slug__isnull=True).update(required_document=False, active=False)
          expected = set(CATALOG_BY_SLUG)
          templates = list(ContractTemplate.objects.filter(slug__in=expected).order_by('slug'))
          installed = [item for item in templates if item.source_file and item.source_file.storage.exists(item.source_file.name) and item.source_checksum]
          demo = {
              'workers': WorkerProfile.objects.filter(Q(employee_number__startswith='DEMO-') | Q(user__email__startswith='demo.worker')).count(),
              'clients': ClientCompany.objects.filter(Q(customer_number='KD-DEMO') | Q(name='A+ Demo Kunde')).count(),
              'orders': ClientOrder.objects.filter(title='Sommerempfang Frankfurt').count(),
          }
          print('TEMPLATE_EXPECTED', len(expected))
          print('TEMPLATE_INSTALLED', len(installed))
          print('DEMO_COUNTS', demo)
          for item in templates:
              print('TEMPLATE_OK', item.slug, item.source_format, item.source_checksum[:12])
          assert len(expected) == 8
          assert len(templates) == 8
          assert len(installed) == 8
          assert demo == {'workers': 0, 'clients': 0, 'orders': 0}
          PY

          docker compose exec -T backend rm -f /tmp/build_private_templates.py /tmp/aplus-document-templates.zip
          rm -f /root/build_private_templates.py

          docker exec "$FRONTEND_ID" sh -c "grep -R -q 'Woche kopieren' /usr/share/nginx/html"
          docker exec "$FRONTEND_ID" sh -c "grep -R -q 'Zeiterfassung' /usr/share/nginx/html"

          TOKEN=$(docker compose exec -T backend python manage.py shell -c "from rest_framework_simplejwt.tokens import RefreshToken; from core.models import User; u=User.objects.filter(role='admin',is_active=True).order_by('date_joined').first(); print(str(RefreshToken.for_user(u).access_token))" | tail -n 1 | tr -d '\r')
          test -n "$TOKEN"
          curl -fsS https://solution.smarbiz.sbs/api/document-catalog/ -H "Authorization: Bearer $TOKEN" -o /tmp/catalog.json
          curl -fsS https://solution.smarbiz.sbs/api/operations/folders/ -H "Authorization: Bearer $TOKEN" -o /tmp/folders.json
          python3 - <<'PY'
          import json
          catalog=json.load(open('/tmp/catalog.json'))
          folders=json.load(open('/tmp/folders.json'))
          installed=sum(1 for item in catalog.get('documents', []) if item.get('source_installed'))
          assert catalog.get('count') == 8
          assert catalog.get('complete') is True
          assert installed == 8
          raw=json.dumps(folders, ensure_ascii=False)
          for forbidden in ('DEMO-001','DEMO-002','DEMO-003','A+ Demo Kunde','Anna Becker','Lukas Schmidt','Mia Wagner'):
              assert forbidden not in raw, forbidden
          print('API_TEMPLATE_COMPLETE', catalog.get('complete'))
          print('API_TEMPLATE_INSTALLED', installed)
          print('API_DEMO_FREE', True)
          PY
          rm -f /tmp/catalog.json /tmp/folders.json
          docker compose exec -T backend python manage.py check
          curl -fsS https://solution.smarbiz.sbs/health/ >/dev/null
          HTTP_CODE=$(curl -sS -o /tmp/login-smoke.json -w '%{http_code}' -X POST https://solution.smarbiz.sbs/api/auth/login/ -H 'Content-Type: application/json' --data '{"email":"invalid@example.com","password":"invalid"}')
          test "$HTTP_CODE" != '502'
          test "$HTTP_CODE" != '503'
          echo "PUBLIC_LOGIN_ENDPOINT_HTTP=$HTTP_CODE"
          echo 'PRODUCTION_TEMPLATE_INSTALL_COMPLETE=1'
          REMOTE
          cat production-template-result.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: production-template-install-result
          path: production-template-result.txt
          retention-days: 1
      - name: Remove local builder
        if: always()
        run: rm -f /tmp/build_private_templates.py
