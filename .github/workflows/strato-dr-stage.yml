name: Stage STRATO as streaming standby

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/strato-dr-stage.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: aplus-strato-ha-stage
  cancel-in-progress: false

jobs:
  stage:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BACKUP_HOST: ${{ secrets.BACKUP_HOST }}
      BACKUP_PASSWORD: ${{ secrets.BACKUP_PASSWORD }}
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}

    steps:
      - uses: actions/checkout@v4

      - name: Install SSH helpers
        run: |
          set -euo pipefail
          test -n "$BACKUP_HOST"
          test -n "$BACKUP_PASSWORD"
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          sudo apt-get update -qq
          sudo apt-get install -y -qq sshpass
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/strato_ed25519"
          chmod 600 "$HOME/.ssh/strato_ed25519"

      - name: Verify current production is still backup primary
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          curl -fsS --retry 4 --retry-delay 3 --max-time 20 -D /tmp/prod.headers -o /tmp/prod.health https://app.aplus-solution.de/health/
          grep -q '"status"' /tmp/prod.health
          grep -qi '^x-aplus-origin: backup-primary' /tmp/prod.headers

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             root@"$BACKUP_HOST" '
              set -e
              cd /opt/aplussolution
              test -f .env
              docker compose exec -T db sh -c '"'"'pg_isready -U "$POSTGRES_USER" -d "$POSTGRES_DB"'"'"'
              docker compose exec -T backend curl -fsS http://127.0.0.1:8000/health/ >/dev/null
            '

          ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             root@"$STRATO_HOST" 'echo STRATO_REACHABLE'

      - name: Package release and securely copy live environment to STRATO
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          tar             --exclude='.git'             --exclude='.env'             --exclude='frontend/node_modules'             -czf /tmp/aplussolution-release.tgz .

          sshpass -e scp             -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST":/opt/aplussolution/.env /tmp/aplussolution.env
          chmod 600 /tmp/aplussolution.env

          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplussolution-release.tgz             /tmp/aplussolution.env             root@"$STRATO_HOST":/tmp/

      - name: Prepare replication role and loopback-only PostgreSQL bridge on backup primary
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             root@"$BACKUP_HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive
          cd /opt/aplussolution

          if [ ! -s /root/aplus-replication.secret ]; then
            umask 077
            openssl rand -hex 32 > /root/aplus-replication.secret
          fi
          REPL_PASS="$(cat /root/aplus-replication.secret)"

          docker compose exec -T db sh -lc             'psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = '"'"'replicator'"'"') THEN CREATE ROLE replicator WITH LOGIN REPLICATION; END IF; END \$\$;"'
          docker compose exec -T db sh -lc             "psql -v ON_ERROR_STOP=1 -U \"\$POSTGRES_USER\" -d \"\$POSTGRES_DB\" -c \"ALTER ROLE replicator WITH LOGIN REPLICATION PASSWORD '$REPL_PASS';\""

          docker compose exec -T db sh -lc '
            grep -q "^host[[:space:]]\+replication[[:space:]]\+replicator[[:space:]]" "$PGDATA/pg_hba.conf" ||
              printf "\nhost replication replicator 0.0.0.0/0 scram-sha-256\n" >> "$PGDATA/pg_hba.conf"
            psql -v ON_ERROR_STOP=1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" -c "SELECT pg_reload_conf();"
          '

          if ! command -v socat >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq socat
          fi

          DB_CID="$(docker compose ps -q db)"
          test -n "$DB_CID"
          DB_IP="$(docker inspect -f '{{range .NetworkSettings.Networks}}{{.IPAddress}}{{end}}' "$DB_CID")"
          test -n "$DB_IP"

          cat > /etc/systemd/system/aplus-postgres-loopback.service <<EOF
          [Unit]
          Description=A+ Solution loopback bridge to Docker PostgreSQL
          After=docker.service
          Requires=docker.service

          [Service]
          Type=simple
          ExecStart=/usr/bin/socat TCP-LISTEN:5432,bind=127.0.0.1,reuseaddr,fork TCP:${DB_IP}:5432
          Restart=always
          RestartSec=2

          [Install]
          WantedBy=multi-user.target
          EOF

          systemctl daemon-reload
          systemctl enable --now aplus-postgres-loopback.service
          systemctl restart aplus-postgres-loopback.service
          ss -ltn | grep -q '127.0.0.1:5432'
          echo BACKUP_REPLICATION_SOURCE_READY
          REMOTE

      - name: Create dedicated STRATO to backup replication SSH path
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          STRATO_REPL_PUB="$(
            ssh               -i "$HOME/.ssh/strato_ed25519"               -o IdentitiesOnly=yes               -o StrictHostKeyChecking=no               -o UserKnownHostsFile=/dev/null               root@"$STRATO_HOST" '
                set -e
                mkdir -p /root/.ssh
                chmod 700 /root/.ssh
                if [ ! -s /root/.ssh/aplus_repl_from_backup ]; then
                  ssh-keygen -q -t ed25519 -N "" -f /root/.ssh/aplus_repl_from_backup
                fi
                cat /root/.ssh/aplus_repl_from_backup.pub
              '
          )"
          test -n "$STRATO_REPL_PUB"

          printf '%s\n' "$STRATO_REPL_PUB" > /tmp/strato-repl.pub
          sshpass -e scp             -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/strato-repl.pub root@"$BACKUP_HOST":/tmp/strato-repl.pub

          sshpass -e ssh             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST" '
              set -e
              mkdir -p /root/.ssh
              chmod 700 /root/.ssh
              touch /root/.ssh/authorized_keys
              chmod 600 /root/.ssh/authorized_keys
              PUB="$(cat /tmp/strato-repl.pub)"
              grep -qxF "$PUB" /root/.ssh/authorized_keys || printf "%s\n" "$PUB" >> /root/.ssh/authorized_keys
              rm -f /tmp/strato-repl.pub
            '

      - name: Copy replication credential to STRATO without logging it
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          sshpass -e scp             -q             -o PubkeyAuthentication=no             -o PreferredAuthentications=password             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST":/root/aplus-replication.secret /tmp/aplus-replication.secret
          scp -q             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             /tmp/aplus-replication.secret root@"$STRATO_HOST":/root/aplus-replication.secret

      - name: Build STRATO standby from live backup primary
        run: |
          set -euo pipefail
          ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             -o ConnectTimeout=20             -o ServerAliveInterval=15             -o ServerAliveCountMax=12             root@"$STRATO_HOST" "BACKUP_HOST='$BACKUP_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          export DEBIAN_FRONTEND=noninteractive

          if ! command -v docker >/dev/null 2>&1; then
            curl -fsSL https://get.docker.com | sh
          fi
          if ! command -v autossh >/dev/null 2>&1; then
            apt-get update -qq
            apt-get install -y -qq autossh
          fi

          mkdir -p /opt/aplussolution
          cd /opt/aplussolution

          if [ -f docker-compose.yml ]; then
            docker compose stop backend frontend caddy celery celery-beat db redis >/dev/null 2>&1 || true
          fi

          find /opt/aplussolution -mindepth 1 -maxdepth 1 ! -name '.env' -exec rm -rf {} +
          tar -xzf /tmp/aplussolution-release.tgz -C /opt/aplussolution
          install -m 600 /tmp/aplussolution.env /opt/aplussolution/.env
          rm -f /tmp/aplussolution-release.tgz /tmp/aplussolution.env

          docker compose pull db redis caddy || true
          docker compose create db >/dev/null
          docker volume create aplussolution_media_data >/dev/null

          NET_NAME="aplussolution_default"
          docker network inspect "$NET_NAME" >/dev/null
          GW="$(docker network inspect -f '{{(index .IPAM.Config 0).Gateway}}' "$NET_NAME")"
          test -n "$GW"

          cat > /etc/systemd/system/aplus-repl-from-backup.service <<EOF
          [Unit]
          Description=A+ Solution PostgreSQL replication tunnel from backup primary
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          Environment=AUTOSSH_GATETIME=0
          ExecStart=/usr/bin/autossh -M 0 -N -o ExitOnForwardFailure=yes -o ServerAliveInterval=15 -o ServerAliveCountMax=3 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -i /root/.ssh/aplus_repl_from_backup -L ${GW}:55432:127.0.0.1:5432 root@${BACKUP_HOST}
          Restart=always
          RestartSec=3

          [Install]
          WantedBy=multi-user.target
          EOF
          systemctl daemon-reload
          systemctl enable --now aplus-repl-from-backup.service
          systemctl restart aplus-repl-from-backup.service

          for i in $(seq 1 30); do
            if timeout 2 bash -c "</dev/tcp/${GW}/55432" >/dev/null 2>&1; then
              break
            fi
            sleep 2
          done
          timeout 2 bash -c "</dev/tcp/${GW}/55432" >/dev/null 2>&1

          DB_CID="$(docker compose ps -aq db)"
          test -n "$DB_CID"
          DB_VOL="$(docker inspect -f '{{range .Mounts}}{{if eq .Destination "/var/lib/postgresql/data"}}{{.Name}}{{end}}{{end}}' "$DB_CID")"
          test -n "$DB_VOL"

          docker compose rm -sf db >/dev/null 2>&1 || true
          REPL_PASS="$(cat /root/aplus-replication.secret)"
          test -n "$REPL_PASS"

          docker run --rm             --network "$NET_NAME"             -e PGPASSWORD="$REPL_PASS"             -e REPL_HOST="$GW"             -v "$DB_VOL":/var/lib/postgresql/data             postgres:16-alpine             sh -ceu '
              rm -rf /var/lib/postgresql/data/*
              pg_basebackup                 -h "$REPL_HOST"                 -p 55432                 -U replicator                 -D /var/lib/postgresql/data                 -Fp -Xs -P -R
            '

          docker run --rm             -e REPL_HOST="$GW"             -e REPL_PASS="$REPL_PASS"             -v "$DB_VOL":/var/lib/postgresql/data             postgres:16-alpine             sh -ceu '
              printf "\nprimary_conninfo = '\''host=%s port=55432 user=replicator password=%s application_name=strato_stage connect_timeout=5'\''\n" "$REPL_HOST" "$REPL_PASS" >> /var/lib/postgresql/data/postgresql.auto.conf
              touch /var/lib/postgresql/data/standby.signal
              chown -R postgres:postgres /var/lib/postgresql/data
            '

          docker compose up -d db
          recovery=0
          for i in $(seq 1 60); do
            if [ "$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"' 2>/dev/null | tr -d '[:space:]')" = "t" ]; then
              recovery=1
              break
            fi
            sleep 2
          done
          test "$recovery" -eq 1

          receive_lsn="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select coalesce(pg_last_wal_receive_lsn()::text, '"'"''"'"')"' | tr -d '[:space:]')"
          replay_lsn="$(docker compose exec -T db sh -lc 'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select coalesce(pg_last_wal_replay_lsn()::text, '"'"''"'"')"' | tr -d '[:space:]')"
          test -n "$receive_lsn"
          test -n "$replay_lsn"

          echo "STRATO_STANDBY_READY"
          echo "receive_lsn=$receive_lsn"
          echo "replay_lsn=$replay_lsn"
          REMOTE

      - name: Seed STRATO media while backup remains live
        run: |
          set -euo pipefail
          ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" "BACKUP_HOST='$BACKUP_HOST' bash -s" <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          docker volume create aplussolution_media_data >/dev/null

          ssh             -i /root/.ssh/aplus_repl_from_backup             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$BACKUP_HOST"             'cd /opt/aplussolution && docker compose exec -T backend tar -C /app/media -cf - .'             | docker run --rm -i                 -v aplussolution_media_data:/data                 alpine:3.20                 sh -c 'find /data -mindepth 1 -maxdepth 1 -exec rm -rf {} +; tar -xf - -C /data'

          echo STRATO_MEDIA_SEEDED
          REMOTE

      - name: Final non disruptive replication check
        env:
          SSHPASS: ${{ secrets.BACKUP_PASSWORD }}
        run: |
          set -euo pipefail

          curl -fsS --retry 4 --retry-delay 3 --max-time 20 -D /tmp/final.headers -o /tmp/final.health https://app.aplus-solution.de/health/
          grep -qi '^x-aplus-origin: backup-primary' /tmp/final.headers

          ssh             -i "$HOME/.ssh/strato_ed25519"             -o IdentitiesOnly=yes             -o StrictHostKeyChecking=no             -o UserKnownHostsFile=/dev/null             root@"$STRATO_HOST" '
              set -e
              cd /opt/aplussolution
              test "$(docker compose exec -T db sh -lc '"'"'psql -U "$POSTGRES_USER" -d "$POSTGRES_DB" -tAc "select pg_is_in_recovery()"'"'"' | tr -d "[:space:]")" = "t"
              test -z "$(docker compose ps -q backend --status running)"
              test -z "$(docker compose ps -q celery --status running)"
              test -z "$(docker compose ps -q celery-beat --status running)"
              echo STRATO_SAFE_STANDBY_CONFIRMED
            '

      - name: Cleanup runner secrets
        if: always()
        run: |
          rm -f             "$HOME/.ssh/strato_ed25519"             /tmp/aplussolution-release.tgz             /tmp/aplussolution.env             /tmp/aplus-replication.secret             /tmp/strato-repl.pub             /tmp/prod.headers             /tmp/prod.health             /tmp/final.headers             /tmp/final.health
