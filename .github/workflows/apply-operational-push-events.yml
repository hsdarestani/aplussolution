name: Apply operational push notification events
on:
  push:
    paths: ['.github/workflows/apply-operational-push-events.yml']
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Patch operational event sources
        run: |
          python - <<'PY'
          from pathlib import Path
          def r(path, old, new, n=1):
              p=Path(path); t=p.read_text(); c=t.count(old)
              assert c==n, f'{path}: expected {n}, found {c}'
              p.write_text(t.replace(old,new,n))

          r('backend/core/shift_views.py',
            'from .permissions import IsAdminOrManager\n',
            'from .permissions import IsAdminOrManager\nfrom .operational_notifications import notify_claimed_workers_shift_changed, notify_open_shift_available, notify_worker_shift_event\n')
          r('backend/core/shift_views.py',
            "            audit(self.request, 'staffing_demand.updated', obj, {\n                'required_count': obj.required_count,\n                'confirmation_required': obj.confirmation_required,\n            })\n\n    def _list_response(self, qs):\n",
            "            audit(self.request, 'staffing_demand.updated', obj, {\n                'required_count': obj.required_count,\n                'confirmation_required': obj.confirmation_required,\n            })\n            notify_claimed_workers_shift_changed(obj)\n\n    def perform_destroy(self, instance):\n        notify_claimed_workers_shift_changed(instance, title='Schicht entfernt', reason='deleted')\n        audit(self.request, 'staffing_demand.deleted', instance)\n        instance.delete()\n\n    def _list_response(self, qs):\n")
          r('backend/core/shift_views.py',
            "            for slot in current_slots:\n                if str(slot.worker_id) not in desired_ids:\n                    slot.worker = None\n",
            "            for slot in current_slots:\n                if str(slot.worker_id) not in desired_ids:\n                    released_user = slot.worker.user if slot.worker_id else None\n                    if released_user:\n                        notify_worker_shift_event(released_user, shift, 'Schicht aus deinem Dienstplan entfernt', 'admin-release')\n                    slot.worker = None\n")
          r('backend/core/shift_views.py',
            "            audit(request, 'shift.admin_assigned', shift, {\n                'workers': requested_ids,\n                'publish_remaining': publish_remaining,\n            })\n\n        return Response(self.get_serializer(self.base_queryset().get(pk=shift.pk)).data)\n",
            "            audit(request, 'shift.admin_assigned', shift, {\n                'workers': requested_ids,\n                'publish_remaining': publish_remaining,\n            })\n            if free_count > 0 and shift.status == Shift.Status.PUBLISHED:\n                notify_open_shift_available(shift, 'assignment')\n\n        return Response(self.get_serializer(self.base_queryset().get(pk=shift.pk)).data)\n")

          r('backend/core/shift_service.py',
            'from .models import Shift, WorkerProfile\n',
            'from .models import Shift, WorkerProfile\nfrom .operational_notifications import notify_open_shift_available\n')
          r('backend/core/shift_service.py',
            "    if shift.status not in {Shift.Status.CANCELLED, Shift.Status.COMPLETED}:\n        shift.status = Shift.Status.PUBLISHED\n        shift.published_at = shift.published_at or timezone.now()\n        shift.save(update_fields=['status', 'published_at', 'updated_at'])\n    refresh_shift_state(shift)\n    return slot\n",
            "    if shift.status not in {Shift.Status.CANCELLED, Shift.Status.COMPLETED}:\n        shift.status = Shift.Status.PUBLISHED\n        shift.published_at = shift.published_at or timezone.now()\n        shift.save(update_fields=['status', 'published_at', 'updated_at'])\n    refresh_shift_state(shift)\n    notify_open_shift_available(shift, 'release')\n    return slot\n")

          r('backend/core/native_workforce.py',
            'from .order_automation import (\n',
            'from .operational_notifications import notify_open_shift_available\nfrom .order_automation import (\n')
          r('backend/core/native_workforce.py',
            "    return {\n        'status': 'ok',\n        'source': 'aplus',\n        'action': 'created' if created else 'updated',\n",
            "    for item in created_shifts:\n        created_shift = Shift.objects.filter(pk=item['local_shift_id']).first()\n        if created_shift:\n            notify_open_shift_available(created_shift, 'ai-order')\n\n    return {\n        'status': 'ok',\n        'source': 'aplus',\n        'action': 'created' if created else 'updated',\n")

          r('backend/core/shift_slot_actions.py',
            'from .permissions import IsAdminOrManager\n',
            'from .permissions import IsAdminOrManager\nfrom .operational_notifications import notify_claimed_workers_shift_changed, notify_open_shift_available\n')
          r('backend/core/shift_slot_actions.py',
            'from .shift_service import ensure_slots, refresh_shift_state\n',
            'from .shift_service import ensure_slots, open_slots, refresh_shift_state\n')
          r('backend/core/shift_slot_actions.py',
            "            result = ShiftApiSerializer(\n                _shift_with_counts(edited.id), context={'request': request}\n            ).data\n            return Response({'shift': result, 'split': False, 'apply_all': apply_all})\n",
            "            if edited.status == Shift.Status.PUBLISHED and open_slots(edited).exists():\n                notify_open_shift_available(edited, 'card-update')\n            else:\n                notify_claimed_workers_shift_changed(edited)\n            result = ShiftApiSerializer(\n                _shift_with_counts(edited.id), context={'request': request}\n            ).data\n            return Response({'shift': result, 'split': False, 'apply_all': apply_all})\n")
          r('backend/core/shift_slot_actions.py',
            "        audit(request, 'shift.card_split_updated', clone, {\n            'from_shift': str(shift.id),\n            'from_slot': str(slot.id),\n            'worker': str(selected['worker_id'] or ''),\n        })\n\n        return Response({\n",
            "        audit(request, 'shift.card_split_updated', clone, {\n            'from_shift': str(shift.id),\n            'from_slot': str(slot.id),\n            'worker': str(selected['worker_id'] or ''),\n        })\n        if clone.status == Shift.Status.PUBLISHED and open_slots(clone).exists():\n            notify_open_shift_available(clone, 'card-update')\n        else:\n            notify_claimed_workers_shift_changed(clone)\n\n        return Response({\n")

          r('backend/core/shift_card_admin.py',
            'from .permissions import IsAdminOrManager\n',
            'from .permissions import IsAdminOrManager\nfrom .operational_notifications import notify_worker_shift_event\n')
          r('backend/core/shift_card_admin.py',
            "        if active_count <= 1 or int(shift.required_count or 1) <= 1:\n            audit(request, 'shift.card_deleted', shift, {'slot': str(slot.id), 'whole_shift': True})\n",
            "        if slot.worker_id:\n            slot = ShiftSlot.objects.select_related('worker__user').get(pk=slot.pk)\n            notify_worker_shift_event(slot.worker.user, shift, 'Schicht aus deinem Dienstplan entfernt', 'card-delete')\n\n        if active_count <= 1 or int(shift.required_count or 1) <= 1:\n            audit(request, 'shift.card_deleted', shift, {'slot': str(slot.id), 'whole_shift': True})\n")

          Path('.github/workflows/apply-operational-push-events.yml').unlink()
          PY
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Wire push notifications to workforce events'
          git push origin HEAD:main
