name: Emergency restore A+ Solution containers from local images
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/restore-aplus-local-images.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      HOST: ${{ secrets.STRATO_HOST }}
      SSH_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Restore existing Docker images without pulls or rebuilds
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$SSH_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$SSH_KEY" > "$HOME/.ssh/restore_key"
          chmod 600 "$HOME/.ssh/restore_key"
          ssh -i "$HOME/.ssh/restore_key" \
            -o IdentitiesOnly=yes -o StrictHostKeyChecking=no \
            -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 \
            root@"$HOST" 'bash -s' <<'REMOTE'
          set -euo pipefail
          cd /opt/aplussolution
          test -f .env
          echo "Available application images:"
          docker images --format '{{.Repository}}:{{.Tag}}' | grep -E 'aplussolution|postgres|redis|caddy' | head -n 30 || true
          # No builds or pulls: recover the prior proven application images.
          docker compose up -d --no-build --pull never db redis backend frontend caddy celery celery-beat
          docker compose ps
          for attempt in $(seq 1 45); do
            if docker compose exec -T backend curl -fsS --max-time 5 http://127.0.0.1:8000/health/ >/dev/null 2>&1; then
              echo "BACKEND_RESTORED"
              exit 0
            fi
            sleep 4
          done
          docker compose ps -a
          docker compose logs --no-color --tail=60 backend
          exit 1
          REMOTE
      - name: Verify public domain
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 15 https://app.aplus-solution.de/health/ | grep -q '"ok"'; then
              echo "PRODUCTION_HEALTH_RESTORED"
              exit 0
            fi
            sleep 4
          done
          echo "::error::Public production health failed"
          exit 1
      - name: Remove temporary key
        if: always()
        run: rm -f "$HOME/.ssh/restore_key"
