name: Apply phase 1 workforce cleanup

on:
  push:
    branches: [feature/phase1-workforce-cleanup]
    paths:
      - scripts/apply_phase1_cleanup.py
      - .github/workflows/phase1-apply.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/phase1-workforce-cleanup
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply deterministic patch
        run: python scripts/apply_phase1_cleanup.py
      - name: Verify temporary patch files are removed from final branch
        run: |
          rm scripts/apply_phase1_cleanup.py
          rm .github/workflows/phase1-apply.yml
      - name: Commit phase 1 implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Implement phase 1 workforce structure cleanup'
          git push origin HEAD:feature/phase1-workforce-cleanup
