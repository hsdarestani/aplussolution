name: One-time schedule screen integrator
on:
  push:
    branches: [feature/wiw-self-service-phase1-ci]
permissions:
  contents: write
jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/wiw-self-service-phase1-ci
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Switch schedule screen
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/src/App.tsx')
          text = path.read_text(encoding='utf-8')
          if "import ScheduleV2 from './ScheduleV2';" not in text:
              text = text.replace("import Operations from './Operations';", "import Operations from './Operations';\nimport ScheduleV2 from './ScheduleV2';", 1)
          old = "if (view === 'schedule') content = <Schedule user={user} />;"
          new = "if (view === 'schedule') content = <ScheduleV2 user={user} />;"
          if old not in text and new not in text:
              raise SystemExit('Schedule route marker not found')
          text = text.replace(old, new, 1)
          path.write_text(text, encoding='utf-8')
          PY
          rm .github/workflows/phase1-app-integrator.yml
      - name: Commit permanent change and remove integrator
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add frontend/src/App.tsx .github/workflows/phase1-app-integrator.yml
          git commit -m 'Use focused self-service schedule screen'
          git push origin HEAD:feature/wiw-self-service-phase1-ci
