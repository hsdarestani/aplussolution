name: Read only live calendar response diagnostics
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/calendar-live-feed-readonly.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      HOST: ${{ secrets.STRATO_HOST }}
      KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Check a real signed calendar feed without disclosing URL or user data
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOST"
          test -n "$KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$KEY" > "$HOME/.ssh/calkey"
          chmod 600 "$HOME/.ssh/calkey"
          ssh -i "$HOME/.ssh/calkey" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null root@"$HOST" 'cd /opt/aplussolution && docker compose exec -T backend python manage.py shell' <<'PY'
          from core.models import WorkerProfile, Shift
          from core.calendar_sync import _calendar_token
          from django.utils import timezone
          from datetime import timedelta
          import requests
          today = timezone.now()
          original = WorkerProfile.objects.filter(active=True).order_by('pk').first()
          staffed_shift = Shift.objects.filter(
              worker__active=True,
              starts_at__gte=today - timedelta(days=90),
              starts_at__lte=today + timedelta(days=540)
          ).exclude(status__in=[Shift.Status.DRAFT, Shift.Status.CANCELLED]).select_related('worker').first()
          print('AVAILABLE_POPULATED_SAMPLE',bool(staffed_shift))
          for label, worker in [('first', original), ('staffed', staffed_shift.worker if staffed_shift else None)]:
              if worker is None:
                  continue
              url = 'https://app.aplus-solution.de/api/calendar/feed/' + _calendar_token(worker) + '.ics'
              for ua in ['curl/8.0','CalendarAgent/1.0 (iPhone; iOS 26)']:
                  resp = requests.get(url,timeout=25,headers={'User-Agent':ua})
                  body = resp.content
                  print('CHECK',label,ua.split('/')[0],'status',resp.status_code,'mime_calendar',resp.headers.get('content-type','').startswith('text/calendar'),'bytes',len(body),'events',body.count(b'BEGIN:VEVENT'),'crlf',body.startswith(b'BEGIN:VCALENDAR\r\n') and body.endswith(b'END:VCALENDAR\r\n'),'html',b'<html' in body[:300].lower())
          PY
      - name: Delete temporary SSH key
        if: always()
        run: rm -f "$HOME/.ssh/calkey"
