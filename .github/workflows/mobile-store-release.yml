name: Signed mobile store release

on:
  workflow_dispatch:
    inputs:
      platform:
        description: Store build target
        required: true
        type: choice
        options: [android, ios]

jobs:
  android:
    if: inputs.platform == 'android'
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://solution.smarbiz.sbs/api
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Require Android signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/aplus-release.jks
      - name: Create native Android project
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx cap sync android
          cp /tmp/aplus-release.jks android/app/aplus-release.jks
      - name: Configure Gradle release signing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/android/app/build.gradle')
          text = path.read_text()
          if 'signingConfigs {' not in text:
              text = text.replace('android {', '''android {
              signingConfigs {
                  release {
                      storeFile file("aplus-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          ''', 1)
          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace('release {', '''release {
                      signingConfig signingConfigs.release''', 1)
          path.write_text(text)
          PY
      - name: Build signed Android App Bundle
        working-directory: frontend/android
        run: ./gradlew bundleRelease
      - uses: actions/upload-artifact@v4
        with:
          name: aplus-workforce-android-signed-aab
          path: frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error

  ios:
    if: inputs.platform == 'ios'
    runs-on: macos-latest
    env:
      VITE_API_URL: https://solution.smarbiz.sbs/api
      IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
      IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
      IOS_KEYCHAIN_PASSWORD: ${{ secrets.IOS_KEYCHAIN_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - name: Require iOS signing credentials
        env:
          IOS_CERTIFICATE_BASE64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          IOS_PROVISIONING_PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$IOS_CERTIFICATE_BASE64"
          test -n "$IOS_PROVISIONING_PROFILE_BASE64"
          test -n "$IOS_CERTIFICATE_PASSWORD"
          test -n "$IOS_TEAM_ID"
          echo "$IOS_CERTIFICATE_BASE64" | base64 --decode > /tmp/distribution.p12
          echo "$IOS_PROVISIONING_PROFILE_BASE64" | base64 --decode > /tmp/profile.mobileprovision
      - name: Create native iOS project
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add ios
          npx cap sync ios
      - name: Install signing identity and profile
        id: signing
        run: |
          KEYCHAIN_PASSWORD="${IOS_KEYCHAIN_PASSWORD:-aplus-temporary-keychain}"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 21600 build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security import /tmp/distribution.p12 -P "$IOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k build.keychain
          security list-keychain -d user -s build.keychain login.keychain-db
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" build.keychain
          security cms -D -i /tmp/profile.mobileprovision > /tmp/profile.plist
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' /tmp/profile.plist)
          PROFILE_NAME=$(/usr/libexec/PlistBuddy -c 'Print Name' /tmp/profile.plist)
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp /tmp/profile.mobileprovision "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"
          echo "profile_name=$PROFILE_NAME" >> "$GITHUB_OUTPUT"
      - name: Archive and export signed IPA
        working-directory: frontend/ios
        env:
          PROFILE_NAME: ${{ steps.signing.outputs.profile_name }}
        run: |
          xcodebuild -workspace App/App.xcworkspace -scheme App -configuration Release -destination 'generic/platform=iOS' -archivePath build/APlusWorkforce.xcarchive DEVELOPMENT_TEAM="$IOS_TEAM_ID" PRODUCT_BUNDLE_IDENTIFIER=de.aplussolution.workforce CODE_SIGN_STYLE=Manual PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" archive
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
          <key>method</key><string>app-store-connect</string>
          <key>signingStyle</key><string>manual</string>
          <key>teamID</key><string>$IOS_TEAM_ID</string>
          <key>provisioningProfiles</key><dict><key>de.aplussolution.workforce</key><string>$PROFILE_NAME</string></dict>
          </dict></plist>
          PLIST
          xcodebuild -exportArchive -archivePath build/APlusWorkforce.xcarchive -exportPath build/export -exportOptionsPlist ExportOptions.plist
      - uses: actions/upload-artifact@v4
        with:
          name: aplus-workforce-ios-signed-ipa
          path: frontend/ios/build/export/*.ipa
          if-no-files-found: error
      - name: Remove temporary keychain
        if: always()
        run: security delete-keychain build.keychain || true
