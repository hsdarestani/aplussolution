name: Read-only complete attendance audit (2026-10-14)
on:
  push:
    branches: [audit/full-worktime-2026-10-14]
    paths: ['.github/workflows/audit-full-worktime-20261014.yml']
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      STRATO_HOST: ${{ secrets.STRATO_HOST }}
      STRATO_SSH_PRIVATE_KEY: ${{ secrets.STRATO_SSH_PRIVATE_KEY }}
    steps:
      - name: Read attendance, shifts and ledger without modifying production
        shell: bash
        run: |
          set -euo pipefail
          test -n "$STRATO_HOST"
          test -n "$STRATO_SSH_PRIVATE_KEY"
          mkdir -p "$HOME/.ssh"
          printf '%s\n' "$STRATO_SSH_PRIVATE_KEY" > "$HOME/.ssh/audit_strato_key"
          chmod 600 "$HOME/.ssh/audit_strato_key"
