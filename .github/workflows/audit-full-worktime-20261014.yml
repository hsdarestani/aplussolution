          k3aujL8f0t1tvPhl+oFVzgAyata1rp/Clg==
          -----END CERTIFICATE-----
          CERT
          ssh -i "$HOME/.ssh/audit_strato_key" -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null -o ConnectTimeout=20 root@"$STRATO_HOST" 'cd /opt/aplussolution && docker compose exec -T backend python -' <<'PY' > "$RUNNER_TEMP/attendance-audit.json"
          import os, django, json
          os.environ.setdefault('DJANGO_SETTINGS_MODULE','config.settings')
          django.setup()
          from collections import defaultdict, Counter
          from datetime import datetime, timedelta
          from django.db import connection, transaction
          from django.utils import timezone
          from core.models import Shift, TimeEntry
          from core.shift_slots import ShiftSlot
          now=timezone.now()
          def strid(v):
              if isinstance(v,dict):v=v.get('id')
              return str(v or '').strip()
          def interval_ratio(a,b,c,d):
              if not b or not c or not d or b<=a or d<=c:return 0.0
              intersect=max(0,(min(b,d)-max(a,c)).total_seconds())
              short=min((b-a).total_seconds(),(d-c).total_seconds())
              return intersect/short if short else 0.0
          with transaction.atomic():
              with connection.cursor() as cursor:cursor.execute('SET TRANSACTION READ ONLY')
              shifts={str(s.id):s for s in Shift.objects.filter(ends_at__lt=now).select_related('worker__user').iterator()}
              shiftworkers=defaultdict(set)
              for sid,s in shifts.items():
                  if s.worker_id:shiftworkers[sid].add(str(s.worker_id))
              for slot in ShiftSlot.objects.filter(status='claimed',worker__isnull=False,shift_id__in=list(shifts.keys())).only('shift_id','worker_id').iterator():
                  shiftworkers[str(slot.shift_id)].add(str(slot.worker_id))
              all_times=list(TimeEntry.objects.select_related('worker__user').all().iterator())
              by_link=defaultdict(list)
              by_wiw=defaultdict(list)
              by_worker=defaultdict(list)
              for e in all_times:
                  wid=str(e.worker_id)
                  by_worker[wid].append(e)
                  if e.shift_id:by_link[(str(e.shift_id),wid)].append(e)
                  remote=strid((e.wiw_payload or {}).get('shift_id') or (e.wiw_payload or {}).get('shift'))
                  if remote:by_wiw[remote].append(e)
              missing=[]
              summary=Counter()
              group_stats=defaultdict(Counter)
              candidates=[]
              consumed=set()
              for sid,s in shifts.items():
                  if s.status in ('draft','cancelled'):continue
                  for wid in sorted(shiftworkers.get(sid,set())):
                      if by_link.get((sid,wid)):continue
                      is_wiw=bool(s.wiw_shift_id)
                      worker=(s.worker if s.worker_id and str(s.worker_id)==wid else None)
                      if worker is None and wid in by_worker and by_worker[wid]:worker=by_worker[wid][0].worker
                      if worker is None:
                          from core.models import WorkerProfile
                          worker=WorkerProfile.objects.select_related('user').filter(pk=wid).first()
                      synthetic=bool(worker and worker.user.email.lower().endswith('@sync.invalid'))
                      remote=by_wiw.get(str(s.wiw_shift_id),[]) if is_wiw else []
                      exact_same=[e for e in remote if str(e.worker_id)==wid]
                      exact_other=[e for e in remote if str(e.worker_id)!=wid]
                      overlap_unlinked=[e for e in by_worker.get(wid,[]) if e.shift_id is None and e.clock_out and interval_ratio(e.clock_in,e.clock_out,s.starts_at,s.ends_at)>=0.7]
                      overlap_other=[e for e in by_worker.get(wid,[]) if e.shift_id is not None and str(e.shift_id)!=sid and e.clock_out and interval_ratio(e.clock_in,e.clock_out,s.starts_at,s.ends_at)>=0.7]
                      year=s.starts_at.date().year
                      group=('WIW' if is_wiw else 'A+')+('_historical_stub' if synthetic else '_person')
                      rec={'shift_id':sid,'employee_number':worker.employee_number if worker else '',
                           'employee_name':worker.user.get_full_name() if worker else '',
                           'date':timezone.localtime(s.starts_at).date().isoformat(),
                           'source':'WIW' if is_wiw else 'A+','historical_stub':synthetic,
                           'worker_active':bool(worker and worker.active),'shift_wiw_id':str(s.wiw_shift_id or ''),
                           'external_time_same_worker_ids':[str(e.id) for e in exact_same],
                           'external_time_other_worker_ids':[str(e.id) for e in exact_other],
                           'overlap_unlinked_ids':[str(e.id) for e in overlap_unlinked],
                           'overlap_other_shift_ids':[str(e.id) for e in overlap_other]}
                      if exact_same:
                          rec['classification']='external_id_matching_attendance'
                      elif exact_other:
                          rec['classification']='external_id_worker_mismatch'
                      elif overlap_unlinked:
                          rec['classification']='time_overlap_unlinked_candidate'
                      elif overlap_other:
                          rec['classification']='time_overlap_linked_elsewhere'
                      elif synthetic:
                          rec['classification']='wiw_archival_unverified'
                      elif is_wiw:
                          rec['classification']='wiw_import_no_matched_attendance'
                      else:
                          rec['classification']='aplus_unreported_needs_review'
                      summary[rec['classification']]+=1
                      group_stats[group][rec['classification']]+=1
                      missing.append(rec)
              # Out-of-band source evidence: unlinked WIW times with matching remote shift identity
              unlinked=[e for e in all_times if e.shift_id is None and e.wiw_time_id]
              unlinked_external=Counter()
              for e in unlinked:
                  remote=strid((e.wiw_payload or {}).get('shift_id') or (e.wiw_payload or {}).get('shift'))
                  if not remote:unlinked_external['source_missing_shift_reference']+=1;continue
                  target=[s for s in shifts.values() if str(s.wiw_shift_id or '')==remote]
                  if target:unlinked_external['shift_wiw_id_exists']+=1
                  else:unlinked_external['shift_wiw_id_not_in_past_shifts']+=1
              out={'as_of':now.isoformat(),'missing_total':len(missing),
                   'classifications':dict(summary),
                   'by_group':{key:dict(counter) for key,counter in group_stats.items()},
                   'historical_unlinked_wiw_times':len(unlinked),
                   'unlinked_external_reference':dict(unlinked_external),
                   'rows':missing}
              print(json.dumps(out,default=str,separators=(',',':')))
          PY
          python3 -m json.tool "$RUNNER_TEMP/attendance-audit.json" >/dev/null
          gzip -n -c "$RUNNER_TEMP/attendance-audit.json" > "$RUNNER_TEMP/attendance-audit.json.gz"
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/attendance-audit.json.gz" -out "$RUNNER_TEMP/attendance-audit.cms" -outform DER "$RUNNER_TEMP/audit-recipient.pem"
          echo 'AUDIT_ENCRYPTED_BEGIN'
          base64 -w0 "$RUNNER_TEMP/attendance-audit.cms" | fold -w 160
          echo 'AUDIT_ENCRYPTED_END'
          rm -f "$RUNNER_TEMP/attendance-audit.json" "$RUNNER_TEMP/attendance-audit.json.gz" "$RUNNER_TEMP/audit-recipient.pem" "$HOME/.ssh/audit_strato_key"
      - name: Retain only encrypted audit artifact
        uses: actions/upload-artifact@v4
        with:
          name: encrypted-full-worktime-audit
          path: ${{ runner.temp }}/attendance-audit.cms
          retention-days: 1
