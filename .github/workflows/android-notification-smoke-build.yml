name: Android notification smoke build

on:
  push:
    branches: [main]
    paths:
      - '.android-notification-smoke-trigger'
      - '.github/workflows/android-notification-smoke-build.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    env:
      VITE_API_URL: https://app.aplus-solution.de/api
      REQUIRE_NATIVE_PUSH: '1'
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require Android signing credentials
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > /tmp/aplus-release.jks
      - name: Create native Android project with push branding
        working-directory: frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
          npx cap add android
          npx cap sync android
          node scripts/prepare-native.mjs android
          cp /tmp/aplus-release.jks android/app/aplus-release.jks
          test -f android/app/src/main/res/drawable/ic_stat_aplus.xml
          test -f android/app/src/main/res/raw/solution_signature.wav
          grep -q 'M2.2,20 L6.6,4' android/app/src/main/res/drawable/ic_stat_aplus.xml
          grep -q 'com.google.firebase.messaging.default_notification_icon' android/app/src/main/AndroidManifest.xml
          grep -q 'aplus_updates_signature_v1' android/app/src/main/AndroidManifest.xml
      - name: Configure Gradle release signing
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('frontend/android/app/build.gradle')
          text = path.read_text()
          if 'signingConfigs {' not in text:
              text = text.replace('android {', '''android {
              signingConfigs {
                  release {
                      storeFile file("aplus-release.jks")
                      storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                      keyAlias System.getenv("ANDROID_KEY_ALIAS")
                      keyPassword System.getenv("ANDROID_KEY_PASSWORD")
                  }
              }
          ''', 1)
          if 'signingConfig signingConfigs.release' not in text:
              text = text.replace('release {', '''release {
                      signingConfig signingConfigs.release''', 1)
          path.write_text(text)
          PY
      - name: Build signed Android APK and AAB
        working-directory: frontend/android
        run: ./gradlew assembleRelease bundleRelease
      - name: Verify packaged sound and A+ resource
        working-directory: frontend/android
        run: |
          APK=$(find app/build/outputs/apk/release -name '*.apk' | head -n1)
          test -n "$APK"
          unzip -l "$APK" | grep -q 'res/raw/solution_signature.wav'
          $ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n1)/aapt dump resources "$APK" | grep -q 'ic_stat_aplus'
          echo "Verified packaged A+ notification icon resource and Signature Motif sound."
      - uses: actions/upload-artifact@v4
        with:
          name: aplus-android-notification-smoke
          path: |
            frontend/android/app/build/outputs/apk/release/*.apk
            frontend/android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: error
