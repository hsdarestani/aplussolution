# The green services share ONLY the existing Docker network and media volume.
# This file is NEVER used by the legacy production compose command.
# No db, redis, Caddy, Celery, migration, bootstrap or host ports.
# WARNING: staging probes are read-only; database operations are not disabled
# after cutover. Shared media must remain writable for authenticated uploads.
# Never run migrations, bootstrap or Celery while preparing green.
services:
  backend-green:
    image: ${BACKEND_IMAGE:?Set an immutable, externally built backend image}
    restart: unless-stopped
    env_file:
      - /opt/aplussolution/.env
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    # IMPORTANT: bypass the normal entrypoint.sh, which mutates production
    # (migrate/bootstrap/collectstatic). New backend only serves HTTP.
    command:
      - gunicorn
      - config.wsgi:application
      - --bind
      - 0.0.0.0:8000
      - --workers
      - "2"
      - --timeout
      - "120"
    init: true
    read_only: true
    tmpfs:
      - /tmp:size=64m,noexec,nosuid
    volumes:
      - type: volume
        source: media_data
        target: /app/media
        read_only: false
    mem_limit: 1024m
    pids_limit: 160
    cpus: 1.5
    networks:
      production:
        aliases:
          - aplus-green-backend
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 http://127.0.0.1:8000/api/status/ready/ >/dev/null"]
      interval: 15s
      timeout: 7s
      start_period: 30s
      retries: 4

  frontend-green:
    image: ${FRONTEND_IMAGE:?Set an immutable, externally built frontend image}
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx:size=32m
      - /var/run:size=8m
      - /tmp:size=16m
    mem_limit: 192m
    pids_limit: 70
    cpus: 0.5
    networks:
      production:
        aliases:
          - aplus-green-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -q -T 5 -O /dev/null http://127.0.0.1:80/"]
      interval: 15s
      timeout: 7s
      start_period: 10s
      retries: 3

volumes:
  media_data:
    external: true
    name: aplussolution_media_data

networks:
  production:
    external: true
    name: aplussolution_default
